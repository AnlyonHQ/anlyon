name: anlyon

services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:484e838076e04939d27d3e176e91c86eea96236126023be8d3059761122e579f
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-anlyon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-anlyon}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.12-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ../..
      dockerfile: server/Dockerfile
    image: anlyon-server:local
    restart: unless-stopped
    stop_grace_period: 60s
    env_file:
      - path: .env
        required: true
    environment:
      NODE_ENV: production
      EDITION: ${EDITION:-community}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-anlyon}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-anlyon}}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      POSTGRES_USER: ${POSTGRES_USER:-anlyon}
      POSTGRES_DB: ${POSTGRES_DB:-anlyon}
      STORAGE_LOCAL_DIR: /app/data/storage
    volumes:
      - anlyon_data:/app/data
    command:
      - sh
      - -c
      - >-
        until pg_isready -h postgres -p 5432 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"; do sleep 2; done &&
        node dist/scripts/setup-pgvector.js &&
        node dist/db/migrate.js &&
        node dist/scripts/setup-log-partitions.js &&
        exec node dist/index.js
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  dashboard:
    build:
      context: ../..
      dockerfile: dashboard/Dockerfile
    image: anlyon-dashboard:local
    restart: unless-stopped
    environment:
      ANLYON_API_URL: ""
      ANLYON_EDITION: ${EDITION:-community}

  caddy:
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${ANLYON_BIND:-0.0.0.0}:${ANLYON_PORT:-8080}:80"
      - "${ANLYON_BIND:-0.0.0.0}:${ANLYON_HTTPS_PORT:-8443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server
      - dashboard

volumes:
  anlyon_data:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
