      summary: Update integration event types
      operationId: updateIntegrationEventTypes
      x-anlyon-audience: public
      x-anlyon-scopes: [integrations:write]
      x-anlyon-idempotency: unsupported
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateIntegrationEventTypesRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/IntegrationEventTypesUpdated' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '429': { $ref: '#/components/responses/RateLimitExceeded' } }

  /api/v2/slack-approvals:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    get:
      tags: [Integrations]
      summary: Read Slack approvals settings
      description: >-
        Whether this deployment can take decisions from Slack, the Interactivity Request URL to set in
        the Slack app, the workspace's Slack connections, the channel each environment posts approval
        requests to, and the caller's own linked Slack accounts (empty for an API key).
      operationId: getSlackApprovalsSettings
      x-anlyon-audience: dashboard
      x-anlyon-scopes: [integrations:read]
      responses: { '200': { $ref: '#/components/responses/SlackApprovalsSettings' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '429': { $ref: '#/components/responses/RateLimitExceeded' } }

  /api/v2/slack-approvals/routes/{environmentId}:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/EnvironmentId' }]
    put:
      tags: [Integrations]
      summary: Post an environment's approval requests to a Slack channel
      description: >-
        One channel per environment. The bot joins a public channel itself; a private channel needs it
        invited (`isPrivate`). A console session needs the admin role. An API key or an app changes
        the channel of its own environment only.
      operationId: setSlackApprovalRoute
      x-anlyon-audience: dashboard
      x-anlyon-scopes: [integrations:write]
      x-anlyon-idempotency: unsupported
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SetSlackApprovalRouteRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/SlackApprovalRouteSet' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '429': { $ref: '#/components/responses/RateLimitExceeded' }, '404': { $ref: '#/components/responses/NotFound' } }
    delete:
      tags: [Integrations]
      summary: Stop posting an environment's approval requests to Slack
      description: Also stops accepting decisions from Slack for that environment, on messages already posted too. A console session needs the admin role. An API key or an app removes the channel of its own environment only.
      operationId: removeSlackApprovalRoute
      x-anlyon-audience: dashboard
      x-anlyon-scopes: [integrations:write]
      x-anlyon-idempotency: unsupported
      responses: { '200': { $ref: '#/components/responses/SlackApprovalRemoved' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '429': { $ref: '#/components/responses/RateLimitExceeded' }, '404': { $ref: '#/components/responses/NotFound' } }

  /api/v2/slack-approvals/identity/start:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    post:
      tags: [Integrations]
      summary: Start linking your Slack account
      description: >-
        Returns a Sign in with Slack URL. Once the member signs in, decisions they make in Slack are
        recorded as theirs. Needs a signed-in member; an API key has no Slack account.
      operationId: startSlackIdentityLink
      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-scopes: []
      x-anlyon-idempotency: unsupported
      responses: { '200': { $ref: '#/components/responses/SlackAuthorizationUrl' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '429': { $ref: '#/components/responses/RateLimitExceeded' } }

  /api/v2/slack-approvals/identity:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    delete:
      tags: [Integrations]
      summary: Unlink your Slack account
      operationId: unlinkSlackIdentity
      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-scopes: []
      x-anlyon-idempotency: unsupported
      responses: { '200': { $ref: '#/components/responses/SlackApprovalRemoved' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '429': { $ref: '#/components/responses/RateLimitExceeded' } }

  /api/v2/events/topics:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [Events]
      summary: List event topics
      description: List workspace topics, including the reserved `anlyon` platform topic after it has been created.
      operationId: listEventTopics
      x-anlyon-audience: public
      x-anlyon-scopes: [events:read]
      responses:
        '200': { $ref: '#/components/responses/EventTopicList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }
    post:
      tags: [Events]
      summary: Create an event topic
      description: Create a named workspace topic. The name `anlyon` is reserved for platform lifecycle events.
      operationId: createEventTopic
      x-anlyon-audience: public
      x-anlyon-scopes: [events:write]
      x-anlyon-idempotency: supported
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateEventTopicRequest' }
      responses:
        '201': { $ref: '#/components/responses/EventTopicCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/QuotaExceeded' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/events/topics/{ref}:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - name: ref
        in: path
        required: true
        description: Public topic ID (`top_...`) or topic name.
        schema: { type: string, minLength: 1, maxLength: 100 }
    get:
      tags: [Events]
      summary: Get an event topic
      operationId: getEventTopic
      x-anlyon-audience: public
      x-anlyon-scopes: [events:read]
      responses:
        '200': { $ref: '#/components/responses/EventTopic' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }
    patch:
      tags: [Events]
      summary: Update an event topic
      description: Rename a topic or change its description. The reserved platform topic can only be re-described.
      operationId: updateEventTopic
      x-anlyon-audience: public
      x-anlyon-scopes: [events:write]
      x-anlyon-idempotency: supported
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateEventTopicRequest' }
      responses:
        '200': { $ref: '#/components/responses/EventTopic' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }
    delete:
      tags: [Events]
      summary: Delete an event topic
      description: Delete a topic and its subscriptions and events. The reserved platform topic cannot be deleted.
      operationId: deleteEventTopic
      x-anlyon-audience: public
      x-anlyon-scopes: [events:write]
      x-anlyon-idempotency: supported
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/events/topics/{ref}/subscriptions:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - name: ref
        in: path
        required: true
        description: Public topic ID (`top_...`) or topic name. Using `anlyon` on create lazily creates the reserved topic.
        schema: { type: string, minLength: 1, maxLength: 100 }
    get:
      tags: [Events]
      summary: List topic subscriptions
      operationId: listEventSubscriptions
      x-anlyon-audience: public
      x-anlyon-scopes: [events:read]
      responses:
        '200': { $ref: '#/components/responses/EventSubscriptionList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }
    post:
      tags: [Events]
      summary: Create a webhook subscription
      description: >-
        Subscribe a URL to matching event types. With `generateSecret`, the plaintext signing
        secret is returned exactly once. A `{{secret:NAME}}` reference in a header requires
        `secrets:read`; credential headers are redacted when the subscription is returned.
      operationId: createEventSubscription
      x-anlyon-audience: public
      x-anlyon-scopes: [events:write]
      x-anlyon-idempotency: supported
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateEventSubscriptionRequest' }
      responses:
        '201': { $ref: '#/components/responses/EventSubscriptionCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/QuotaExceeded' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/events/subscriptions/{subscriptionId}:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - name: subscriptionId
        in: path
        required: true
        description: Public event subscription identifier.
        schema: { type: string, pattern: '^sub_' }
    patch:
      tags: [Events]
      summary: Update a webhook subscription
      description: >-
        A `{{secret:NAME}}` reference in a header requires `secrets:read`, as on create.
        Credential headers are redacted in the response.
      operationId: updateEventSubscription
      x-anlyon-audience: public
      x-anlyon-scopes: [events:write]
      x-anlyon-idempotency: supported
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateEventSubscriptionRequest' }
      responses:
        '200': { $ref: '#/components/responses/EventSubscription' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }
    delete:
      tags: [Events]
      summary: Delete a webhook subscription
      operationId: deleteEventSubscription
      x-anlyon-audience: public
      x-anlyon-scopes: [events:write]
      x-anlyon-idempotency: supported
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/events/subscriptions/{subscriptionId}/rotate-secret:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - name: subscriptionId
        in: path
        required: true
        description: Public event subscription identifier.
        schema: { type: string, pattern: '^sub_' }
    post:
      tags: [Events]
      summary: Rotate a subscription signing secret
      description: Replace the signing secret and return the new plaintext value exactly once.
      operationId: rotateEventSubscriptionSecret
      x-anlyon-audience: public
      x-anlyon-scopes: [events:write]
      x-anlyon-idempotency: supported
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { $ref: '#/components/responses/EventSubscriptionSecret' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/events:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [Events]
      summary: Publish an event
      description: |
        Accept an event for asynchronous fan-out. Publishing to the reserved `anlyon` topic is blocked.
        `idempotencyKey` provides durable topic-scoped deduplication; `Idempotency-Key` protects an HTTP retry.
      operationId: publishEvent
      x-anlyon-audience: public
      x-anlyon-scopes: [events:write]
      x-anlyon-idempotency: supported
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublishEventRequest' }
      responses:
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '409': { $ref: '#/components/responses/Conflict' }
        '200':
          $ref: '#/components/responses/EventPublishDeduplicated'
        '202':
          $ref: '#/components/responses/EventPublishAccepted'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/QuotaExceeded' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }
    get:
      tags: [Events]
      summary: List published events
      operationId: listEvents
      x-anlyon-audience: public
      x-anlyon-scopes: [events:read]
      parameters:
        - name: topic
          in: query
          schema: { type: string, minLength: 1, maxLength: 100 }
          description: Public topic ID or name.
        - name: type
          in: query
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200': { $ref: '#/components/responses/EventList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/events/{eventId}:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - name: eventId
        in: path
        required: true
        description: Public event identifier.
        schema: { type: string, pattern: '^evt_' }
    get:
      tags: [Events]
      summary: Get an event and its deliveries
      operationId: getEvent
      x-anlyon-audience: public
      x-anlyon-scopes: [events:read]
      responses:
        '200': { $ref: '#/components/responses/EventWithDeliveries' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/secrets:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [Secrets]
      summary: List secret metadata
      description: List names and metadata only. Secret values are never returned.
      operationId: listSecrets
      x-anlyon-audience: public
      x-anlyon-scopes: [secrets:read]
      responses:
        '200': { $ref: '#/components/responses/SecretList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/secrets/{name}:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - name: name
        in: path
        required: true
        description: Uppercase secret name referenced by action templates.
        schema: { type: string, minLength: 1, maxLength: 100, pattern: '^[A-Z0-9_]+$' }
    get:
      tags: [Secrets]
      summary: Get secret metadata
      description: Return metadata only; the stored value is never returned.
      operationId: getSecret
      x-anlyon-audience: public
      x-anlyon-scopes: [secrets:read]
      responses:
        '200': { $ref: '#/components/responses/Secret' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }
    put:
      tags: [Secrets]
      summary: Create or rotate a secret
      description: >-
        Store a new encrypted value or replace the existing value. The response contains metadata
        only. A connected account cannot be given a stored value: the request answers 409
        `SECRET_KIND_MISMATCH`; delete the secret first.

        Enterprise: send `external` instead of `value` to create or repoint a secret whose value is
        read from one of the environment's secret stores at dispatch. The value is read once and
        dropped, to record whether the store can produce it. If it cannot, the secret is still saved,
        with `health.status: unreachable` and the reason, and the response carries a `warning`
        (`EXTERNAL_SECRET_UNREADABLE`); calls that use it fail before anything is sent until the store
        can produce it. A reference that is wrong in itself (no such store, a path outside the store's
        `allowedPaths`, a malformed Vault path) answers 400. An edition without secret stores answers
        501 `SECRET_STORES_UNAVAILABLE`. A reference chooses which of the store's secrets Anlyon reads
        with the store's credential and where its value may be sent, so `external` also needs
        `secret-stores:write` on a key, and the workspace admin role for a person; without it the
        request answers 403.
      operationId: putSecret
      x-anlyon-audience: public
      x-anlyon-scopes: [secrets:write]
      x-anlyon-idempotency: unsupported
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PutSecretRequest' }
      responses:
        '200': { $ref: '#/components/responses/PutSecret' }
        '202': { $ref: '#/components/responses/SignOffRequired' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/QuotaExceeded' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'The secret exists with another kind (SECRET_KIND_MISMATCH).', headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }
        '501': { description: 'This edition does not include secret stores (SECRET_STORES_UNAVAILABLE).', headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      tags: [Secrets]
      summary: Delete a secret
      description: >-
        Delete a secret. For a connected account the access is revoked first; if revoking fails the
        secret is kept and the request answers 502 `CONNECTION_REVOKE_FAILED`, so access is never
        reported gone while it is still live.
      operationId: deleteSecret
      x-anlyon-audience: public
      x-anlyon-scopes: [secrets:write]
      x-anlyon-idempotency: unsupported
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/secrets/{name}/check:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - name: name
        in: path
        required: true
        description: The external secret's name.
        schema: { type: string, minLength: 1, maxLength: 100, pattern: '^[A-Z0-9_]+$' }
    post:
      tags: [Secret stores]
      summary: Check an external secret
      description: >-
        Enterprise. Read an external secret once from its store, drop the value, and record whether
        it could be read on the secret's `health`. The value is never returned. A store that refuses
        or has nothing there is an answer, not an error: `200` with `health.status: unreachable` and
        a `reason`. Anlyon also runs this check on its own, once a day per external secret, and
        records the answer whenever a dispatch reads one. A secret that is not external answers 400.
      operationId: checkExternalSecret
      x-anlyon-audience: public
      x-anlyon-scopes: [secrets:write]
      x-anlyon-idempotency: unsupported
      responses:
        '200': { $ref: '#/components/responses/Secret' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }
        '501': { description: 'This edition does not include secret stores (SECRET_STORES_UNAVAILABLE).', headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/v2/secret-stores:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [Secret stores]
      summary: List secret stores
      description: >-
        Enterprise. The environment's secret stores, with their settings and health. A store's
        credential is never returned. An edition without secret stores has no such endpoint (404).
      operationId: listSecretStores
      x-anlyon-audience: public
      x-anlyon-scopes: [secret-stores:read]
      responses:
        '200': { $ref: '#/components/responses/SecretStoreList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }
    post:
      tags: [Secret stores]
      summary: Add a secret store
      description: >-
        Enterprise. Add an AWS Secrets Manager or HashiCorp Vault (KV version 2) store to the
        environment. Anlyon authenticates to it first, without reading any secret (STS
        GetCallerIdentity, or Vault `auth/token/lookup-self`); if that fails nothing is saved and the
        request answers `SECRET_STORE_CHECK_FAILED`. The credential is encrypted and never returned.
        Requests to the store go through the same address checks as action dispatch, so a store on a
        private address is refused, unless a workspace admin allowed it in the secret store settings
        on a self-hosted edition.
      operationId: createSecretStore
      x-anlyon-audience: public
      x-anlyon-scopes: [secret-stores:write]
      x-anlyon-idempotency: unsupported
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSecretStoreRequest' }
      responses:
        '201': { $ref: '#/components/responses/SecretStore' }
        '202': { $ref: '#/components/responses/SignOffRequired' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: 'The store refused the credential (SECRET_STORE_CHECK_FAILED). Nothing was saved.', headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }
        '502': { description: 'The store did not answer (SECRET_STORE_CHECK_FAILED). Nothing was saved.', headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/v2/secret-stores/{name}:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - name: name
        in: path
        required: true
        description: The store's name, unique in its environment.
        schema: { type: string, minLength: 1, maxLength: 63, pattern: '^[a-z0-9][a-z0-9-]{0,62}$' }
    get:
      tags: [Secret stores]
      summary: Get a secret store
      description: Enterprise. One store's settings and health. The credential is never returned.
      operationId: getSecretStore
      x-anlyon-audience: public
      x-anlyon-scopes: [secret-stores:read]
      responses:
        '200': { $ref: '#/components/responses/SecretStore' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }
    patch:
      tags: [Secret stores]
      summary: Change a secret store
      description: >-
        Enterprise. Change a store's settings, credential, allowed paths, cache TTL or description.
        A store's name and type do not change. `config` fields replace the ones they name. New
        settings or a new credential are checked against the store before they apply, and values
        cached under the old ones are dropped. Changing where the credential is sent (a Vault store's
        `address`, `namespace`, `mount`, `auth` or `authMount`; an AWS store's `region`, `auth`,
        `roleArn` or `externalId`) needs `credential` in the same request, or answers 400: a stored
        credential is never sent anywhere it was not given for. In a protected environment, changing
        settings, the credential or the allowed paths needs `confirmProtected=true`.
      operationId: updateSecretStore
      x-anlyon-audience: public
      x-anlyon-scopes: [secret-stores:write]
      x-anlyon-idempotency: unsupported
      parameters:
        - name: confirmProtected
          in: query
          required: false
          description: Required to change a store in a protected environment.
          schema: { type: string, enum: ['true'] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateSecretStoreRequest' }
      responses:
        '200': { $ref: '#/components/responses/SecretStore' }
        '202': { $ref: '#/components/responses/SignOffRequired' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: 'The store refused the new settings or credential (SECRET_STORE_CHECK_FAILED). Nothing was changed.', headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }
        '502': { description: 'The store did not answer (SECRET_STORE_CHECK_FAILED). Nothing was changed.', headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      tags: [Secret stores]
      summary: Delete a secret store
      description: >-
        Enterprise. Delete a store. Refused with 409 `SECRET_STORE_IN_USE`, naming the secrets,
        while any secret points at it. In a protected environment it needs `confirmProtected=true`.
      operationId: deleteSecretStore
      x-anlyon-audience: public
      x-anlyon-scopes: [secret-stores:write]
      x-anlyon-idempotency: unsupported
      parameters:
        - name: confirmProtected
          in: query
          required: false
          description: Required to delete a store in a protected environment.
          schema: { type: string, enum: ['true'] }
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Secrets still point at the store (SECRET_STORE_IN_USE).', headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/secret-stores/{name}/check:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - name: name
        in: path
        required: true
        description: The store's name, unique in its environment.
        schema: { type: string, minLength: 1, maxLength: 63, pattern: '^[a-z0-9][a-z0-9-]{0,62}$' }
    post:
      tags: [Secret stores]
      summary: Check a secret store
      description: >-
        Enterprise. Authenticate to the store without reading any secret, and record the answer on
        the store's `health`. A store that refuses or does not answer is an answer, not an error:
        `200` with `health.status: unreachable` and a `reason`.
      operationId: checkSecretStore
      x-anlyon-audience: public
      x-anlyon-scopes: [secret-stores:write]
      x-anlyon-idempotency: unsupported
      responses:
        '200': { $ref: '#/components/responses/SecretStore' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/secret-store-settings:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [Secret stores]
      summary: Get the workspace's secret store settings
      description: >-
        Enterprise. The workspace admin's settings for its secret stores. `allowPrivateNetwork` lets
        requests to the workspace's stores reach private addresses, such as a Vault on the
        deployment's own network. It is available, and takes effect, only on a self-hosted edition
        whose instance admins leave private network destinations to the workspaces (the instance
        setting `network.private_destinations`, `workspace` by default): `available` and `effective`
        say whether it does here.
      operationId: getSecretStoreSettings
      x-anlyon-audience: dashboard
      x-anlyon-scopes: [secret-stores:read]
      responses:
        '200': { $ref: '#/components/responses/SecretStoreSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }
    put:
      tags: [Secret stores]
      summary: Change the workspace's secret store settings
      description: >-
        Enterprise, self-hosted editions only. Change the workspace's secret store settings. A
        console session or an OAuth connection also needs the admin role. On Anlyon's hosted service
        the setting does not exist and the request answers 400. Turning it on also answers 400 on a
        self-hosted install whose instance admins set `network.private_destinations` to `off`;
        turning it off is always accepted there.
      operationId: updateSecretStoreSettings
      x-anlyon-audience: dashboard
      x-anlyon-scopes: [secret-stores:write]
      x-anlyon-idempotency: unsupported
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [allowPrivateNetwork]
              additionalProperties: false
              properties:
                allowPrivateNetwork: { type: boolean }
      responses:
        '200': { $ref: '#/components/responses/SecretStoreSettings' }
        '202': { $ref: '#/components/responses/SignOffRequired' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/connections:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [Connected accounts]
      summary: List connected accounts
      description: >-
        The connected accounts in the calling environment: every secret connected for an
        integration, whether by signing in at the provider (`kind: connection`) or with an API key
        (`kind: static` with `integrationId` set). Metadata only. Answers 404 while connected
        accounts are not available on this deployment.
      operationId: listConnections
      x-anlyon-audience: public
      x-anlyon-scopes: [secrets:read]
      responses:
        '200': { $ref: '#/components/responses/SecretList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/connections/integrations:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [Connected accounts]
      summary: List connectable integrations
      description: >-
        The integrations an account can be connected for, with how each is connected (`auth`), the
        API hosts its credential may be sent to, and for a sign-in integration the scopes Anlyon
        requests at the provider's consent page.
      operationId: listConnectionIntegrations
      x-anlyon-audience: public
      x-anlyon-scopes: [secrets:read]
      responses:
        '200': { description: Integrations returned., headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectionIntegrationListResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/connections/integrations/find:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [Connected accounts]
      summary: Find the best way to act in an app
      description: >-
        What to do when your agent should act in an app: `route` is the best way there, with why
        and the next step, and `alternatives` are the others, best first. The order is a catalogue
        integration, the vendor's own MCP server when its publisher is verified as the vendor, an
        OpenAPI import, then a custom action. It works for any name and only suggests: nothing is
        registered, adopted or connected. Any credential may ask, since it reads nothing of the
        workspace's. `query` and any name in the text come from the caller: show them as text.
      operationId: findIntegrationRoute
      x-anlyon-audience: public
      x-anlyon-scopes: []
      parameters:
        - { in: query, name: name, required: true, description: The app's name, for example stripe., schema: { type: string, minLength: 1, maxLength: 200 } }
      responses:
        '200': { description: The best route and the others., headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/IntegrationRouteResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/connections/overview:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [Connected accounts]
      summary: Overview of integrations
      description: >-
        Every integration the caller's environment can use: how it connects, whose OAuth app signs
        people in (`signIn.app`), and how many accounts are connected to it, the workspace's own
        (`workspace`) and its end users' (`endUsers`). The console's Integrations area.
      operationId: getConnectionsOverview
      x-anlyon-audience: dashboard
      x-anlyon-scopes: [secrets:read]
      responses:
        '200': { description: The overview., headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectionsOverviewResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/end-users:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    get:
      tags: [End users]
      summary: List end users
      description: >-
        End users with a connected account or any recorded activity in the caller's environment, in
        id order, with how many accounts, invocations and pending approvals each has. Erased end users
        are never listed. Pass `pagination.nextCursor` as `cursor` for the next page. A key created
        with `endUserRequired` must name one end user in `Anlyon-End-User` (`400 END_USER_REQUIRED`
        otherwise), as on every other list, and sees only that end user.
      operationId: listEndUsers
      x-anlyon-audience: dashboard
      x-anlyon-scopes: [end-users:read]
      parameters:
        - { name: cursor, in: query, description: The last end-user id of the previous page., schema: { type: string, maxLength: 128 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: prefix, in: query, description: Only ids that start with this., schema: { type: string, minLength: 1, maxLength: 128 } }
        - { name: integration, in: query, description: Only end users with a connected account for this integration., schema: { type: string, minLength: 1, maxLength: 64 } }
      responses:
        '200': { description: A page of end users., headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/EndUserListResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/end-users/{endUserId}:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/EndUserIdPath'
    delete:
      tags: [End users]
      summary: Erase an end user
      description: >-
        Forget the end user: every connected account is revoked at the provider where it supports
        that and deleted, their per-end-user limit counters are cleared, and their pending approvals
        are cancelled (the parked calls are never sent). Invocations, receipts, approvals and audit
        records are kept for the audit trail with the id replaced by a keyed one-way hash, returned
        as `erasedAs`. Recorded as `end_user.erased`.
      operationId: eraseEndUser
      x-anlyon-audience: public
      x-anlyon-scopes: [end-users:write]
      x-anlyon-idempotency: unsupported
      parameters:
        - $ref: '#/components/parameters/EndUserHeader'
      responses:
        '200': { description: The end user was erased., headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/EndUserErasureResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/end-users/{endUserId}/connections:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/EndUserIdPath'
    get:
      tags: [End users]
      summary: List an end user's connections
      description: >-
        The end user's connected accounts: integration, how it was connected, status, granted scopes
        and timestamps. Never a token. A grant still waiting for confirmation is not listed.
      operationId: listEndUserConnections
      x-anlyon-audience: public
      x-anlyon-scopes: [end-users:read]
      parameters:
        - $ref: '#/components/parameters/EndUserHeader'
      responses:
        '200': { description: The end user's connections., headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/EndUserConnectionListResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/end-users/{endUserId}/connect-links:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/EndUserIdPath'
    post:
      tags: [End users]
      summary: Create a connect link
      description: >-
        A hosted link that connects one integration for the end user. Send them to `url`: a page that
        names your workspace, then the provider's consent for an OAuth integration, or a form where
        they paste their own key for an API-key integration (checked with the provider and stored
        encrypted; you never see it). Afterwards the browser goes to
        `redirectUrl` with `anlyon_status` (`pending_confirmation`, `connected`, `declined` or
        `error`), `integration`, and, while the grant waits for confirmation, `anlyon_flow`. The
        end-user id is never in that URL. Confirm the flow from your server with
        `POST /api/v2/end-users/{endUserId}/connections/confirm`.


        A redirect is required: `redirectUrl` must fall under one of the environment's allowed
        redirect URLs (exact origin and path prefix), or the environment's default redirect URL is
        used; with neither, the answer is `400 REDIRECT_URL_REQUIRED`. Only an environment with
        confirmation off may leave it out: the end user then sees Anlyon's own page, and the account
        is theirs at once. The link works once, for 10 minutes; a key link takes up to 5 refused keys
        before it is used up. At most 10 links per minute per end user, and 300 per environment.


        An OAuth integration Anlyon does not offer through its own app, or whose app this deployment
        does not have, is connected through the environment's own app: add it with
        `PUT /api/v2/environments/{environmentId}/oauth-apps/{integration}`. Until then the answer
        is `400 OWN_OAUTH_APP_REQUIRED`.
      operationId: createEndUserConnectLink
      x-anlyon-audience: public
      x-anlyon-scopes: [end-users:write]
      x-anlyon-idempotency: unsupported
      parameters:
        - $ref: '#/components/parameters/EndUserHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateEndUserConnectLinkRequest' }
      responses:
        '201': { description: The link., headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/EndUserConnectLinkResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }
        '501': { description: 'Connected accounts are not set up on this deployment (CONNECTIONS_UNAVAILABLE). A missing OAuth app is a 400 OWN_OAUTH_APP_REQUIRED instead.', headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/v2/end-users/{endUserId}/connections/confirm:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/EndUserIdPath'
    post:
      tags: [End users]
      summary: Confirm a connection
      description: >-
        Your server confirms that the consent which came back to your redirect with `anlyon_flow`
        belongs to the end user signed in to your app. This is the defence against cross-app account
        takeover: anyone holding a link can finish its consent, so the grant stays unusable until
        you confirm it for the end user the link was created for. Confirmed for anyone else, it is
        refused with `403 END_USER_MISMATCH`, revoked at the provider and deleted. Single use; a
        flow nobody confirms is deleted after 10 minutes. A replayed, expired or unknown flow
        answers `404 CONNECT_FLOW_NOT_FOUND`. The confirmed account replaces the end user's previous
        one for the integration.
      operationId: confirmEndUserConnection
      x-anlyon-audience: public
      x-anlyon-scopes: [end-users:write]
      x-anlyon-idempotency: unsupported
      parameters:
        - $ref: '#/components/parameters/EndUserHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmEndUserConnectionRequest' }
      responses:
        '200': { description: The account is active., headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ConfirmEndUserConnectionResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'Missing scope, or the flow was created for another end user (END_USER_MISMATCH). Nothing was stored.', headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/end-users/{endUserId}/connections/{integration}:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/EndUserIdPath'
      - $ref: '#/components/parameters/IntegrationPath'
    put:
      tags: [End users]
      summary: Store an end user's API key
      description: >-
        For an integration whose `auth.kind` is `api_key`: store the end user's own key. It is checked
        first with the provider's own read-only check when the catalogue has one; a key the provider
        refuses is not stored (`CONNECTION_KEY_REJECTED`). `integration` may also be the `mcp-<id>` key of
        an MCP server registered with `endUserKey` (the `integration` of its 409): send the key as `token`,
        and it is checked by listing that server's tools with it. It is encrypted like a connected account's
        token, replaces the end user's previous key for the integration, and is never returned. No
        confirmation step: your server supplies the key. At most 10 keys per minute per end user.
      operationId: setEndUserConnection
      x-anlyon-audience: public
      x-anlyon-scopes: [end-users:write]
      x-anlyon-idempotency: unsupported
      parameters:
        - $ref: '#/components/parameters/EndUserHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetEndUserConnectionRequest' }
      responses:
        '200': { description: The stored connection, without the key., headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/EndUserConnectionResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: 'The provider did not accept the key (CONNECTION_KEY_REJECTED). Nothing was stored.', headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
