      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnalyzeFunctionSourceRequest' }
      responses:
        '200': { description: The findings., headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/FunctionSourceFindingsResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/functions/{name}/versions:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - { name: name, in: path, required: true, description: The function's name or id (fn_...)., schema: { type: string, minLength: 1, maxLength: 100 } }
    get:
      tags: [Functions]
      summary: List a function's versions
      description: >-
        Every published version, newest first (at most 100), without sources. `current` marks the
        version runs use. Read one with its source with `GET /functions/{name}/versions/{version}`.
      operationId: listFunctionVersions
      x-anlyon-audience: public
      x-anlyon-scopes: [functions:read]
      responses:
        '200': { description: The versions., headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/FunctionVersionListResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }
    post:
      tags: [Functions]
      summary: Publish a function version
      description: >-
        Publish source code as the function's new current version. A version never changes:
        publishing again appends one. `allowedActions` lists the actions the function may call, by
        name; each must exist in this environment and be enabled (`400 ALLOWED_ACTION_UNAVAILABLE`).
        A call to any other action is refused in the runner and again by the API. Budgets default to
        50 action calls, 1,000 ms of CPU, 100 binding calls and 30,000 ms per run. `straightThrough`
        lets a run skip the plan for writes to some of those actions, up to a number of writes per
        run; without it a straight-through run reads and does not write.


        JavaScript: an ES module whose default export is `async function run(input, anlyon)`.
        Python: a module that defines `run(input, anlyon)`. `anlyon.invoke(action, input)` and
        `anlyon.read(action, input)` call actions; `anlyon.log(message)` adds a line to the run. The
        function has no network, no environment variables and no secrets. A call answers
        `{ ok: true, result }` or `{ ok: false, error }`. `result` is the action invocation: the
        provider's reply as text in `result.body`, and parsed in `result.json` (null when it is not
        JSON).
      operationId: publishFunctionVersion
      x-anlyon-audience: public
      x-anlyon-scopes: [functions:write]
      x-anlyon-idempotency: unsupported
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublishFunctionVersionRequest' }
      responses:
        '201': { description: The function and its new current version., headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/FunctionVersionPublishedResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/functions/{name}/versions/{version}:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - { name: name, in: path, required: true, description: The function's name or id (fn_...)., schema: { type: string, minLength: 1, maxLength: 100 } }
      - { name: version, in: path, required: true, description: 'The version number, or `current`.', schema: { type: string, pattern: '^(current|[1-9][0-9]{0,8})$', example: current } }
    get:
      tags: [Functions]
      summary: Get a function version
      description: >-
        One version with the source it runs. `current` is the version runs use. `404
        FUNCTION_VERSION_NOT_FOUND` when there is no such version, or nothing is published yet.
      operationId: getFunctionVersion
      x-anlyon-audience: public
      x-anlyon-scopes: [functions:read]
      responses:
        '200': { description: The version and its source., headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/FunctionVersionDetailResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/functions/{name}/runs:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - { name: name, in: path, required: true, description: The function's name or id (fn_...)., schema: { type: string, minLength: 1, maxLength: 100 } }
    get:
      tags: [Functions]
      summary: List a function's runs
      description: >-
        The function's runs, newest first, without their calls (read one with
        `GET /function-runs/{id}`). `endUserId` narrows to one end user's runs; a key created with
        `endUserRequired` sees only its own end user's.
      operationId: listFunctionRuns
      x-anlyon-audience: public
      x-anlyon-scopes: [functions:read]
      parameters:
        - $ref: '#/components/parameters/EndUserHeader'
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: endUserId, in: query, required: false, schema: { type: string, maxLength: 255 } }
      responses:
        '200': { description: The runs., headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/FunctionRunListResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }
    post:
      tags: [Functions]
      summary: Run a function
      description: >-
        Run the function once and answer when it ends. Every call it makes acts for the end user in
        `Anlyon-End-User`: impact limits, approvals, the end user's connections, the halt switch and
        receipts apply as for any action call. Needs `actions:invoke` as well as `functions:run`.


        `mode` says what happens to writes (a call to an action that is not a GET):


        - `plan` (the default): reads run for real; each write is recorded and answered with
        `{ planned: true }`, and nothing is sent. The run ends `planned` when it made no writes. With
        writes it ends `awaiting_approval`, and `plan` lists them with one approval of kind
        `function_plan` bound to the plan's digest. The team decides it, or the end user when every
        write's approval policy says `decidedBy: end_user`.

        - `apply`, with `planRunId`: carries out an approved plan, once, with the plan's version,
        input and end user. Each write must equal the plan's next write: same action, same input,
        same order. A matching write is sent as its own action invocation with its own receipt. A
        write that does not match ends the run `diverged` before it is sent, and nothing further is
        sent; plan again for a new approval. Reads may differ.

        - `straight_through`: every call is sent as it is made. A write must be to an action in the
        version's `straightThrough` policy, within its `maxWrites`; any other write is refused with
        `PLAN_REQUIRED` and nothing is sent.


        A run can also end `failed`, or `budget_exceeded` with `budget` naming the budget that ran
        out. `409` when an apply's plan is not approved (`PLAN_NOT_APPROVED`), has no writes
        (`PLAN_HAS_NO_WRITES`), was already applied (`PLAN_ALREADY_APPLIED`), was made with other
        input (`PLAN_INPUT_MISMATCH`) or was approved more than 24 hours ago (`PLAN_EXPIRED`).


        `503 FUNCTION_RUNNER_UNAVAILABLE` when the function runner is not configured or cannot be
        reached. Nothing ran, and the run is not counted.


        Runs are held to the workspace's plan (`GET /api/v2/billing/plans`, `planCatalogue[].functionRuns`).
        `402 PAYMENT_REQUIRED` when the workspace has no plan. `429 FUNCTION_RUN_CONCURRENCY_LIMIT`
        when the plan's runs at once are all going (retry when one ends), `429 FUNCTION_RUN_RATE_LIMITED`
        past the plan's run starts a minute, and `429 QUOTA_EXCEEDED` past the plan's runs a month
        (they come back on the 1st, UTC). In each case nothing ran and nothing was counted. A run's
        own action calls count as governed actions, as any action call does.
      operationId: runFunction
      x-anlyon-audience: public
      x-anlyon-scopes: [functions:run, actions:invoke]
      x-anlyon-idempotency: unsupported
      parameters:
        - $ref: '#/components/parameters/EndUserHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunFunctionRequest' }
      responses:
        '200': { description: The finished run., headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/FunctionRunResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/QuotaExceeded' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimitOrQuotaExceeded' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v2/function-runs/{id}:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - { name: id, in: path, required: true, description: The run's id (frn_...)., schema: { type: string, minLength: 1, maxLength: 100 } }
    get:
      tags: [Functions]
      summary: Get a function run
      description: >-
        A run with its input and output, every call it made in order (refused ones included) and
        its receipt. A plan run carries its plan and the plan's approval; an apply run names the plan
        run it carried out. A key created with `endUserRequired` reads its own end user's runs and no others.
      operationId: getFunctionRun
      x-anlyon-audience: public
      x-anlyon-scopes: [functions:read]
      parameters:
        - $ref: '#/components/parameters/EndUserHeader'
      responses:
        '200': { description: The run., headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/FunctionRunResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/environments/{environmentId}/oauth-apps:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - { name: environmentId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [End users]
      summary: List an environment's OAuth apps
      description: Every OAuth integration, with the environment's own app when one is set and the redirect URI to register with the provider. Never a client secret. An API key reaches only its own environment.
      operationId: listEnvironmentOAuthApps
      x-anlyon-audience: dashboard
      x-anlyon-scopes: [secrets:read]
      responses:
        '200': { description: The environment's OAuth apps., headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/EnvironmentOAuthAppListResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/environments/{environmentId}/oauth-apps/{integration}:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - { name: environmentId, in: path, required: true, schema: { type: string, format: uuid } }
      - $ref: '#/components/parameters/IntegrationPath'
    get:
      tags: [End users]
      summary: Get an environment's OAuth app
      description: The client id when the environment has its own app for the integration, and the redirect URI to register with the provider. Never the client secret.
      operationId: getEnvironmentOAuthApp
      x-anlyon-audience: dashboard
      x-anlyon-scopes: [secrets:read]
      responses:
        '200': { description: The app., headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/EnvironmentOAuthAppResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }
    put:
      tags: [End users]
      summary: Set an environment's OAuth app
      description: >-
        Use your own OAuth client for this integration in this environment: consent then shows your
        app, and tokens are issued to it. Required for Google in production, whose verification
        belongs to the app's owner. The secret is encrypted and never returned. Accounts connected
        with a previous app keep refreshing with it until it is replaced or removed, then need a
        reconnect. A console session or an OAuth connection also needs the admin role in the
        environment, where a per-environment grant applies.
      operationId: setEnvironmentOAuthApp
      x-anlyon-audience: dashboard
      x-anlyon-scopes: [secrets:write]
      x-anlyon-idempotency: unsupported
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetEnvironmentOAuthAppRequest' }
      responses:
        '200': { description: The app, without the secret., headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/EnvironmentOAuthAppResponse' } } } }
        '202': { $ref: '#/components/responses/SignOffRequired' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }
        '501': { description: 'Connected accounts are not set up on this deployment (CONNECTIONS_UNAVAILABLE).', headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      tags: [End users]
      summary: Remove an environment's OAuth app
      description: Back to the deployment's app. Accounts the removed app issued can no longer be refreshed and need a reconnect; `affectedConnections` counts them. A console session or an OAuth connection also needs the admin role in the environment, where a per-environment grant applies.
      operationId: deleteEnvironmentOAuthApp
      x-anlyon-audience: dashboard
      x-anlyon-scopes: [secrets:write]
      x-anlyon-idempotency: unsupported
      responses:
        '200': { description: Whether an app was removed., headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/EnvironmentOAuthAppDeletedResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/connections/keys:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [Connected accounts]
      summary: Connect an integration with an API key
      description: >-
        Connect an integration whose `auth.kind` is `api_key`. Anlyon first checks the key with the
        provider, with one read-only request to the integration's own host. A key the provider
        accepts is stored as a secret of kind `static` with `integrationId` set, bound to the
        integration's hosts and to request headers; those come from the integration and cannot be
        set here. A key the provider refuses is not stored (`CONNECTION_KEY_REJECTED`), and neither
        is one that could not be checked (`CONNECTION_KEY_CHECK_FAILED`). The key is never returned
        by any endpoint. The secret name must not exist yet in this environment. Counts toward the
        same limit of 10 per minute per workspace as connect sessions.
      operationId: connectWithApiKey
      x-anlyon-audience: public
      x-anlyon-scopes: [secrets:write]
      x-anlyon-idempotency: unsupported
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConnectWithApiKeyRequest' }
      responses:
        '201': { $ref: '#/components/responses/Secret' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/QuotaExceeded' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { description: 'The provider did not accept the key (CONNECTION_KEY_REJECTED). Nothing was stored.', headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }
        '502': { description: 'The key could not be checked with the provider (CONNECTION_KEY_CHECK_FAILED). Nothing was stored.', headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/v2/connections/sessions:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [Connected accounts]
      summary: Start a connect session
      description: >-
        Start the consent flow for one integration whose `auth.kind` is `oauth`. An `api_key`
        integration is refused here; send its key to `POST /api/v2/connections/keys`. Open
        `connectUrl` in a browser, or hand the
        `consent` values to the console's consent window. The session expires after 15 minutes. At
        most 10 sessions may be started per minute per workspace. The secret name must not exist yet
        in this environment. Where neither the environment's own OAuth app nor Anlyon's app on this
        deployment can sign in to the integration (the list marks it `ownOAuthAppRequired`), the
        answer is `400 OWN_OAUTH_APP_REQUIRED`: add the environment's own app with
        `PUT /api/v2/environments/{environmentId}/oauth-apps/{integration}`.
      operationId: createConnectSession
      x-anlyon-audience: public
      x-anlyon-scopes: [secrets:write]
      x-anlyon-idempotency: unsupported
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateConnectSessionRequest' }
      responses:
        '201': { description: Session started., headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectSessionResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/QuotaExceeded' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }
        '501': { description: 'Connected accounts are not configured on this deployment (CONNECTIONS_UNAVAILABLE).', headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '502': { description: 'The connected-account service did not answer (CONNECTION_PROVIDER_ERROR). Nothing was created.', headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/v2/connections/sessions/{sessionId}/complete:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - name: sessionId
        in: path
        required: true
        description: The session id returned when the session was started.
        schema: { type: string, pattern: '^csn_[A-Za-z0-9]{8,64}$' }
    post:
      tags: [Connected accounts]
      summary: Complete a connect session
      description: >-
        The connected account once consent has finished, as a secret of kind `connection` bound to
        the integration's hosts. Open `connectUrl` in a browser, then poll this with an empty body:
        it answers `status: pending` until the provider has redirected the person back to Anlyon,
        then `completed`. A consent the person declined, or one that could not be recorded, answers
        400 with the reason. Idempotent: completing twice returns the same secret.
      operationId: completeConnectSession
      x-anlyon-audience: public
      x-anlyon-scopes: [secrets:write]
      x-anlyon-idempotency: unsupported
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompleteConnectSessionRequest' }
      responses:
        '200': { description: The session's state, and the secret once completed., headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectSessionCompletionResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/QuotaExceeded' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { description: 'The session expired, or belongs to another workspace or environment (CONNECTION_SESSION_EXPIRED). Start a new one.', headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }
        '501': { description: 'Connected accounts are not configured on this deployment (CONNECTIONS_UNAVAILABLE).', headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '502': { description: 'The connected-account service did not answer (CONNECTION_PROVIDER_ERROR).', headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/v2/connections/{secretName}/check:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - name: secretName
        in: path
        required: true
        description: The connected account, by its secret name.
        schema: { type: string, minLength: 1, maxLength: 100, pattern: '^[A-Z0-9_]+$' }
    post:
      tags: [Connected accounts]
      summary: Check a connected account
      description: >-
        Ask the provider whether a connected account still works, and record the answer on the
        secret's `health`. The same call for both kinds: an API key is sent once, in the
        integration's own header, to its one read-only check URL; a signed-in account is asked for
        from the connector service with a forced refresh, so the provider itself says whether the
        grant is still honoured. The credential is never returned. An account that does not work is
        an answer, not an error: the call answers `200` with `health.status: needs_reauth` and a
        `reason`, and the next dispatch that uses it fails before anything is sent. Only a check that
        could not be made is an error (`CONNECTION_KEY_CHECK_FAILED` or `CONNECTION_PROVIDER_ERROR`),
        and it leaves `health` unchanged. A secret you stored directly cannot be checked (`400`).
        Counts toward the same limit of 10 per minute per workspace as connect sessions. Anlyon also
        runs this check on its own, once a day per account and after a dispatch the provider answers
        401.
      operationId: checkConnection
      x-anlyon-audience: public
      x-anlyon-scopes: [secrets:write]
      x-anlyon-idempotency: unsupported
      responses:
        '200': { $ref: '#/components/responses/Secret' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }
        '501': { description: 'The account is signed in and connected accounts are not configured on this deployment (CONNECTIONS_UNAVAILABLE).', headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '502': { description: 'The check could not be made (CONNECTION_KEY_CHECK_FAILED for a key, CONNECTION_PROVIDER_ERROR for a signed-in account). The status is unchanged.', headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/v2/connections/{secretName}/reconnect:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - name: secretName
        in: path
        required: true
        description: The connected account, by its secret name.
        schema: { type: string, minLength: 1, maxLength: 100, pattern: '^[A-Z0-9_]+$' }
    post:
      tags: [Connected accounts]
      summary: Reconnect a connected account
      description: >-
        Make a connected account work again, the way it was connected. The secret keeps its name, its
        hosts and its placement, so nothing that references `{{secret:NAME}}` changes. For an API-key
        integration, send the new key as `apiKey`: Anlyon checks it with the provider the way it
        checked the first one, replaces the stored value, and answers `status: completed` with the
        secret. A key the provider refuses changes nothing (`CONNECTION_KEY_REJECTED`). For a sign-in
        integration, send an empty body: Anlyon starts a consent session for the account's existing
        connection and answers `status: pending` with the `session`. Open its `connectUrl` or hand
        its `consent` values to the console's window, then call `POST
        /api/v2/connections/sessions/{sessionId}/complete` as for a first connect; completing marks
        the account working again. Sending a key for a sign-in account, or none for a key account, is
        `400`. Counts toward the same limit of 10 per minute per workspace as connect sessions. A
        sign-in account that neither the environment's own OAuth app nor Anlyon's app on this
        deployment can sign in to answers `400 OWN_OAUTH_APP_REQUIRED`.
      operationId: reconnectConnection
      x-anlyon-audience: public
      x-anlyon-scopes: [secrets:write]
      x-anlyon-idempotency: unsupported
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReconnectConnectionRequest' }
      responses:
        '200': { description: The new key was accepted and stored (`completed`), or a consent session was started (`pending`)., headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectionReconnectResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: 'The provider did not accept the new key (CONNECTION_KEY_REJECTED). Nothing changed.', headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }
        '501': { description: 'The account is signed in and connected accounts are not configured on this deployment (CONNECTIONS_UNAVAILABLE).', headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '502': { description: 'The new key could not be checked (CONNECTION_KEY_CHECK_FAILED), or the connected-account service did not answer (CONNECTION_PROVIDER_ERROR). Nothing changed.', headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/v2/connection-consent/start:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    get:
      tags: [Connected accounts]
      summary: Open a consent link
      description: >-
        The `connectUrl` of a connect session. A person's browser opens it, never a client with a key;
        it redirects to the provider's sign-in page for the session's integration. The token is the
        session's own and works for 15 minutes, until the consent finishes. Opening it again gives the
        same redirect and uses nothing up. A deployment with its own connect pages host serves the same
        route there at `/start`; use the URL the API returns.
      operationId: startConnectionConsent
      security: []
      x-anlyon-audience: oauth-callback
      x-anlyon-response-envelope: html-page
      x-anlyon-scopes: []
      parameters:
        - { name: token, in: query, required: true, schema: { type: string } }
      responses:
        '302':
          description: Redirect to the provider's sign-in page.
          headers:
            Location: { description: The provider's authorize URL., schema: { type: string, format: uri } }
        '404': { description: Connected accounts are unavailable in this build., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '410': { description: The link has expired or was already used. A page saying so., content: { text/html: { schema: { type: string } } } }
        '501': { description: Signing in is not set up on this deployment. A page saying so., content: { text/html: { schema: { type: string } } } }
        '502': { description: The sign-in could not start. A page saying so., content: { text/html: { schema: { type: string } } } }

  /api/v2/connection-consent/link:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    get:
      tags: [End users]
      summary: Open an end user's connect link
      description: >-
        The `url` of an end user's connect link. A person's browser opens it. When the environment has
        its own OAuth app for the integration, it redirects straight to the provider's consent screen,
        which names that app. With Anlyon's shared app, it shows a page that names your workspace and
        the integration, says the provider's screen will show Anlyon, and links on to the provider's
        consent or back to your redirect URL with `anlyon_status=declined`. Opening it changes nothing,
        so a link preview cannot use it up. The link works once, for 10 minutes. A deployment with its
        own connect pages host serves the same route there at `/link`; use the URL the API returns.
      operationId: openEndUserConnectLink
      security: []
      x-anlyon-audience: oauth-callback
      x-anlyon-response-envelope: html-page
      x-anlyon-scopes: []
      parameters:
        - { name: token, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: "With Anlyon's shared app, the page naming the workspace, with a link to continue.", content: { text/html: { schema: { type: string } } } }
        '302':
          description: With the environment's own OAuth app, a redirect straight to the provider's consent screen.
          headers:
            Location: { description: The provider's authorize URL., schema: { type: string, format: uri } }
        '404': { description: Connected accounts are unavailable in this build., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '410': { description: The link has expired or was already used. A page saying so., content: { text/html: { schema: { type: string } } } }
        '501': { description: Signing in is not set up on this deployment. A page saying so., content: { text/html: { schema: { type: string } } } }
        '502': { description: "With the environment's own OAuth app, the sign-in could not start. A page saying so.", content: { text/html: { schema: { type: string } } } }

  /api/v2/connection-consent/key:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    get:
      tags: [End users]
      summary: Open an end user's key link
      description: >-
        The `url` of an end user's connect link for an API-key integration. A person's browser opens
        it. It names your workspace and the integration and asks for the end user's own key (or the
        integration's fields). Opening it changes nothing.
      operationId: openEndUserKeyLink
      security: []
      x-anlyon-audience: oauth-callback
      x-anlyon-response-envelope: html-page
      x-anlyon-scopes: []
      parameters:
        - { name: token, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: The page with the key form., content: { text/html: { schema: { type: string } } } }
        '404': { description: Connected accounts are unavailable in this build., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '410': { description: The link has expired or was already used. A page saying so., content: { text/html: { schema: { type: string } } } }
    post:
      tags: [End users]
      summary: Submit an end user's key
      description: >-
        The key form's post. The key is checked with the provider and stored encrypted, pending your
        server's confirmation where the environment requires it; the browser is then sent to the
        link's redirect with `anlyon_status` and `anlyon_flow`, as after a sign-in. A refused key
        shows the form again with the reason and stores nothing. The page posts it as a form:
        `token`, then the key as `f_apiKey` or each of the integration's fields as `f_<name>`.
      operationId: submitEndUserKeyLink
      security: []
      x-anlyon-audience: oauth-callback
      x-anlyon-response-envelope: html-page
      x-anlyon-scopes: []
      x-anlyon-idempotency: unsupported
      responses:
        '200': { description: The account is connected and there is no redirect. A page saying so., content: { text/html: { schema: { type: string } } } }
        '302':
          description: The key was accepted. Redirect to the link's redirect URL with the outcome.
          headers:
            Location: { description: The redirect URL with `anlyon_status`., schema: { type: string, format: uri } }
        '400': { description: The key was refused. The form again, with the reason., content: { text/html: { schema: { type: string } } } }
        '404': { description: Connected accounts are unavailable in this build., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '410': { description: The link has expired or was already used. A page saying so., content: { text/html: { schema: { type: string } } } }

  /api/v2/connection-consent/mcp-client.json:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    get:
      tags: [Connected accounts]
      summary: This deployment's OAuth client metadata document
      description: >-
        Served only where the `mcp-upstreams` feature is enabled: a deployment with it off
        answers 404. The client id Anlyon presents to an authorization
        server that accepts Client ID Metadata Documents, when an OAuth upstream MCP server is
        registered without a client id of its own. The server fetches it: a public client
        (authorization code with PKCE, no secret) that redirects only to this deployment's consent
        callback. Nothing in it is secret.
      operationId: getOAuthClientMetadataDocument
      security: []
      x-anlyon-audience: oauth-callback
      x-anlyon-response-envelope: raw-export
      x-anlyon-scopes: []
      responses:
        '200':
          description: The client metadata document.
          content:
            application/json:
              schema:
                type: object
                required: [client_id, client_name, redirect_uris, grant_types, response_types, token_endpoint_auth_method]
                properties:
                  client_id: { type: string, format: uri }
                  client_name: { type: string }
                  redirect_uris: { type: array, items: { type: string, format: uri } }
                  grant_types: { type: array, items: { type: string } }
                  response_types: { type: array, items: { type: string } }
                  token_endpoint_auth_method: { type: string, enum: [none] }
        '404': { description: The feature is not enabled on this deployment, or connected accounts are unavailable., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/v2/connection-consent/callback:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    get:
      tags: [Connected accounts]
      summary: Finish a consent at the provider's redirect
      description: >-
        The redirect URI registered in each OAuth app (on a deployment with its own connect pages host,
        `<that origin>/callback` instead). Validates a single-use expiring state, exchanges
        the code, stores the encrypted tokens and records the connected account, then shows a page
        saying how it went. The client that started the session learns the result from
        `POST /api/v2/connections/sessions/{sessionId}/complete`.
      operationId: completeConnectionConsent
      security: []
      x-anlyon-audience: oauth-callback
      x-anlyon-response-envelope: html-page
      x-anlyon-scopes: []
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        '200': { description: The account was connected, or the person declined at the provider. A page saying which., content: { text/html: { schema: { type: string } } } }
        '400': { description: The consent finished but could not be recorded. A page saying so; `complete` says why., content: { text/html: { schema: { type: string } } } }
        '404': { description: Connected accounts are unavailable in this build., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '410': { description: No live consent matches the redirect (expired, or already used). A page saying so., content: { text/html: { schema: { type: string } } } }
        '501': { description: Signing in is not set up on this deployment. A page saying so., content: { text/html: { schema: { type: string } } } }
        '502': { description: The provider did not complete the sign-in. A page saying so., content: { text/html: { schema: { type: string } } } }

  /api/v2/actions:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [Actions]
      summary: List actions
      description: List every hosted tool available in the workspace.
      operationId: listActions
      x-anlyon-audience: public
      x-anlyon-scopes: [actions:read]
      responses:
        '200': { $ref: '#/components/responses/ActionList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }
    post:
      tags: [Actions]
      summary: Create an action
      description: Define a secret-backed, SSRF-protected hosted HTTP tool.
      operationId: createAction
      x-anlyon-audience: public
      x-anlyon-scopes: [actions:write]
      x-anlyon-idempotency: supported
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateActionRequest' }
      responses:
        '201': { $ref: '#/components/responses/ActionCreated' }
        '202': { $ref: '#/components/responses/SignOffRequired' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/QuotaExceeded' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/mcp-upstreams:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [Actions]
      summary: List upstream MCP servers
      description: >-
        Answers 404 where the `mcp-upstreams` feature is off. The environment's registered MCP servers, each with its last listing of tools (their text is
        the server's, untrusted) and the tools adopted from it, with whether each adopted definition is
        still the one the server lists.
      operationId: listMcpUpstreams
      x-anlyon-audience: public
      x-anlyon-scopes: [actions:read]
      responses:
        '200':
          description: The environment's upstream MCP servers.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data: { type: array, items: { $ref: '#/components/schemas/McpUpstream' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

    post:
      tags: [Actions]
      summary: Register an upstream MCP server
      description: >-
        Answers 404 where the `mcp-upstreams` feature is off. Registers a remote MCP server (Streamable HTTP, https) and lists its tools: `initialize` and
        `tools/list`, reads only. Each tool is classified and hashed by the risk engine Anlyon Radar runs.
        Nothing is adopted, so no agent can call anything yet. Headers carry credentials only as `{{secret:NAME}}` references, checked
        against the secret's allowed hosts and placements, and naming one needs `secrets:read`. A server whose tools cannot be listed is not
        registered (400), and one that asks for an OAuth sign-in without OAuth settings is refused with that reason. From a credential it applies at once, except that a
        stored secret, or a server that signs people in with OAuth, answers 202 and waits for a person's sign-off.
      operationId: registerMcpUpstream
      x-anlyon-audience: public
      x-anlyon-scopes: [actions:write]
      x-anlyon-idempotency: unsupported
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/McpUpstreamRegistration' }
      responses:
        '201':
          description: Registered, with its tools listed.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/McpUpstream' }
        '202': { $ref: '#/components/responses/SignOffRequired' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v2/mcp-upstreams/inspect:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [Actions]
      summary: Inspect an MCP server before registering it
      description: >-
        Answers 404 where the `mcp-upstreams` feature is off. A read: it stores nothing, adopts nothing and sends no credential. Says what the server
        is, through the transport and discovery registration uses: `open` (lists its tools without a sign-in), `oauth` (signs people in with OAuth), `credential` (asks for a sign-in and names no OAuth metadata), `refused` (the reason Anlyon will not sign in to it) or `unreachable`. What the server answers is a 200 with
        one of those; an endpoint registration would refuse is a 400. Its text is the server's, untrusted.
      operationId: inspectMcpUpstream
      x-anlyon-audience: public
      x-anlyon-scopes: [actions:write]
      x-anlyon-idempotency: unsupported
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/McpUpstreamInspectRequest' }
      responses:
        '200':
          description: What the server is.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/McpUpstreamInspection' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/mcp-upstreams/{id}:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - name: id
        in: path
        required: true
        description: The upstream's id (mcpu_...).
        schema: { type: string, pattern: '^mcpu_[A-Za-z0-9_-]+$' }
    get:
      tags: [Actions]
      summary: Get an upstream MCP server
      description: >-
        Answers 404 where the `mcp-upstreams` feature is off. One registered server, with its last listing of tools (their text is
        the server's and untrusted), what was adopted from it and how each adopted definition compares with the listing.
      operationId: getMcpUpstream
      x-anlyon-audience: public
      x-anlyon-scopes: [actions:read]
      responses:
        '200':
          description: The upstream.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/McpUpstream' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/mcp-upstreams/{id}/refresh:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - name: id
        in: path
        required: true
        description: The upstream's id (mcpu_...).
        schema: { type: string, pattern: '^mcpu_[A-Za-z0-9_-]+$' }
    post:
      tags: [Actions]
      summary: List an upstream's tools again
      description: >-
        Answers 404 where the `mcp-upstreams` feature is off. Lists the server's tools again. Adopted tools are never changed here: one whose definition
        changed shows `state: changed` and is refused at dispatch until it is re-adopted. A listing that
        fails keeps the last good one and sets `lastError`.
      operationId: refreshMcpUpstream
      x-anlyon-audience: public
      x-anlyon-scopes: [actions:write]
      x-anlyon-idempotency: unsupported
      responses:
        '200':
          description: The upstream, with its new listing.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/McpUpstream' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/mcp-upstreams/{id}/adopt:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - name: id
        in: path
        required: true
        description: The upstream's id (mcpu_...).
        schema: { type: string, pattern: '^mcpu_[A-Za-z0-9_-]+$' }
    post:
      tags: [Actions]
      summary: Adopt tools as governed actions
      description: >-
        Answers 404 where the `mcp-upstreams` feature is off. Adopts tools from the last listing. Each becomes a governed action named
        `<upstream>-<tool>` whose version pins the tool's definition hash; a tool adopted before whose
        definition changed is re-adopted as a new version. The suggested class is never applied by
        itself: approval and impact are what the request chooses. A tool that cannot be
        adopted is reported in `skipped` without stopping the others. From an API key, a CLI login or an MCP session this answers 202 with a sign-off link, for a first adoption and a re-adoption alike: only a workspace admin, as a person, can approve it. If the named tools' definitions change before they decide, the request fails as `SIGN_OFF_STALE` and nothing is adopted.
      operationId: adoptMcpTools
      x-anlyon-audience: public
      x-anlyon-scopes: [actions:write]
      x-anlyon-idempotency: unsupported
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/McpToolAdoption' }
      responses:
        '201':
          description: At least one tool was adopted as a new action.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/McpAdoptResult' }
        '200':
          description: Only re-adoptions, or nothing adopted.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/McpAdoptResult' }
        '202': { $ref: '#/components/responses/SignOffRequired' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/mcp-upstreams/{id}/archive:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - name: id
        in: path
        required: true
        description: The upstream's id (mcpu_...).
        schema: { type: string, pattern: '^mcpu_[A-Za-z0-9_-]+$' }
    post:
      tags: [Actions]
      summary: Archive an upstream MCP server
      description: >-
        Answers 404 where the `mcp-upstreams` feature is off. Archives the server and every action adopted from it, as deleting an action does: they
        leave the actions list and their names are free again. Their versions and call history stay. Archiving an archived upstream changes nothing.
      operationId: archiveMcpUpstream
      x-anlyon-audience: public
      x-anlyon-scopes: [actions:write]
      x-anlyon-idempotency: unsupported
      responses:
        '200':
          description: The archived upstream, and how many actions were archived with it.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    allOf:
                      - $ref: '#/components/schemas/McpUpstream'
                      - type: object
                        required: [archivedActions]
                        properties:
                          archivedActions: { type: integer, minimum: 0, example: 2, description: 'The actions adopted from this server that were archived with it. 0 when it was already archived.' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/mcp-upstreams/{id}/connect:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - name: id
        in: path
        required: true
        description: The upstream's id (mcpu_...).
        schema: { type: string, pattern: '^mcpu_[A-Za-z0-9_-]+$' }
    post:
      tags: [Actions]
      summary: Connect the operator's own account to an OAuth upstream
      description: >-
        A person's consent, so a console session only: an API key, a CLI login or an MCP session is refused with 403, with `error.fix`. Answers 404 where the `mcp-upstreams` feature is off. Starts the operator's own sign-in to an upstream that signs people in with OAuth (ADR
        0026), on the client registered for it. Open `url` in a browser; when the sign-in finishes the
        tools are listed with it, and adopted tools called for no end user use it. `redirectUri` is the
        one the client must list at the vendor.
      operationId: connectMcpUpstream
      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-scopes: []
      x-anlyon-idempotency: unsupported
      responses:
        '200':
          description: Where to sign in.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [url, expiresAt, redirectUri]
                    properties:
                      url: { type: string, format: uri }
                      expiresAt: { type: string, format: date-time }
                      redirectUri: { type: string, format: uri }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/mcp-upstreams/{id}/connect-links:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - name: id
        in: path
        required: true
        description: The upstream's id (mcpu_...).
        schema: { type: string, pattern: '^mcpu_[A-Za-z0-9_-]+$' }
    post:
      tags: [Actions]
      summary: Create a connect link for an end user to an MCP server
      description: >-
        Answers 404 where the `mcp-upstreams` feature is off. Held by the developer's server: the key needs `end-users:write`, which is not in the default set, and the end user consents themselves. A link one end user opens to sign in to an OAuth upstream with their own
        account: the same consent, confirmation and limits as an integration's connect link. Their
        grant is used only for calls made for them. For an upstream registered with `endUserKey`, the
        link opens a form for the end user's own key instead: it is checked with the server (a read
        only), stored encrypted, held to the same confirmation, and used only for calls made for them.
        An upstream that is neither is refused with 400.
      operationId: createMcpUpstreamConnectLink
      x-anlyon-audience: public
      x-anlyon-scopes: [end-users:write]
      x-anlyon-idempotency: unsupported
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endUserId]
              additionalProperties: false
              properties:
                endUserId: { type: string, minLength: 1, maxLength: 256 }
                redirectUrl: { type: string, format: uri, nullable: true, maxLength: 2048 }
      responses:
        '201':
          description: The link.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [url, expiresAt]
                    properties:
                      url: { type: string, format: uri }
                      expiresAt: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/actions/import:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [Actions]
      summary: Import actions from OpenAPI
      description: >-
        Translate supported OpenAPI 3.x operations into hosted actions, reporting every skipped
        operation and translation warning. A dry run creates nothing. Every operation that is not a
        `GET` is imported governed, declaring one exact resource mutation, so its invocations are
        previewed, counted against impact limits and given a receipt. Money is never inferred from
        the spec. Where the spec has a `GET` that reads back what a write changes, the result
        carries a `proposedVerify` rule for that action; it is not applied, and you add it with
        `PATCH /api/v2/actions/{ref}` once you have checked it. Pass `governed: false` to import
        plain template actions instead. Every imported operation also carries a `suggestion`: a
        risk class (`read`, `write`, `irreversible` or `destructive`), whether to require approval,
        and an impact declaration, read deterministically from the method, the path, the
        operation's words, the request fields and vendor extensions. A suggestion is never
        applied by itself: name the operation in `operations` to set its approval or impact, for
        example with the suggestion a dry run returned. `suggestedAllowedHosts` lists the hosts
        the credential could be limited to, from the spec's servers; set them on the secret to
        apply them.
      operationId: importActions
      x-anlyon-audience: public
      x-anlyon-scopes: [actions:write]
      x-anlyon-idempotency: supported
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportActionsRequest' }
      responses:
        '200': { $ref: '#/components/responses/ActionImport' }
        '201': { $ref: '#/components/responses/ActionImport' }
        '202': { $ref: '#/components/responses/SignOffRequired' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/QuotaExceeded' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/actions/invocations:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [Actions]
      summary: List action invocations
      operationId: listActionInvocations
      x-anlyon-audience: public
      x-anlyon-scopes: [actions:read]
      parameters:
        - { name: action, in: query, description: Action name or public action ID., schema: { type: string, minLength: 1, maxLength: 100 } }
        - { name: status, in: query, description: 'Filter by status. `unknown` lists calls waiting for an operator to confirm their outcome.', schema: { type: string, enum: [pending_approval, running, succeeded, failed, unknown, denied, expired] } }
        - { name: endUserId, in: query, description: 'Only calls made for this end user. A key created with endUserRequired always sees only its own end user''s.', schema: { type: string, pattern: '^[A-Za-z0-9._:@-]{1,128}$' } }
        - { name: actingFor, in: query, description: '`workspace`: only calls with your workspace''s own accounts (no end user). `end_users`: only calls made for an end user. Absent: both. It only narrows: a key created with endUserRequired still sees only its own end user''s.', schema: { type: string, enum: [workspace, end_users] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200': { $ref: '#/components/responses/InvocationList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/actions/invocations/{id}:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - name: id
        in: path
        required: true
        description: Public invocation identifier.
        schema: { type: string, minLength: 1, maxLength: 100 }
    get:
      tags: [Actions]
      summary: Get an action invocation
      operationId: getActionInvocation
      x-anlyon-audience: public
      x-anlyon-scopes: [actions:read]
      responses:
        '200': { $ref: '#/components/responses/Invocation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/actions/{ref}:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - name: ref
        in: path
        required: true
        description: Action name or public action identifier.
        schema: { type: string, minLength: 1, maxLength: 100 }
    get:
      tags: [Actions]
      summary: Get an action
      operationId: getAction
      x-anlyon-audience: public
      x-anlyon-scopes: [actions:read]
      responses:
        '200': { $ref: '#/components/responses/Action' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }
    patch:
      tags: [Actions]
      summary: Update an action
      operationId: updateAction
      x-anlyon-audience: public
      x-anlyon-scopes: [actions:write]
      x-anlyon-idempotency: supported
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateActionRequest' }
      responses:
        '200': { $ref: '#/components/responses/Action' }
        '202': { $ref: '#/components/responses/SignOffRequired' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }
    delete:
      tags: [Actions]
      summary: Delete an action
      description: >-
        Archive an action. It stops resolving and its name becomes free to reuse, while its
        immutable versions and its invocation history are retained -- an agent version may pin
        one of those versions, and destroying them would dismantle rollback and erase the audit
        trail in the same call. Archiving an action that currently requires approval
        additionally needs `actions:govern`, because removing a gate is removing a gate
        whichever verb gets you there.
      operationId: deleteAction
      x-anlyon-audience: public
      x-anlyon-scopes: [actions:write]
      x-anlyon-idempotency: supported
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/actions/{ref}/invoke:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - name: ref
        in: path
        required: true
        description: Action name or public action identifier.
        schema: { type: string, minLength: 1, maxLength: 100 }
    post:
      tags: [Actions]
      summary: Invoke an action
      description: >-
        Execute an enabled action inline, or park it behind a human approval when the action is
        gated.

        Which definition runs depends on how the call is attributed. Passing a `runId` whose run
        names an agent runs the action version that agent's published version pins, if it pins
        one -- this is the path a rollback restores. Without a `runId`, or when the agent pins
        nothing for this action, the action's current definition runs. The response reports the
        version that actually executed as `actionVersionId`.

        With an `Idempotency-Key`, the key is also recorded on the invocation and kept for its
        whole life, including after it fails. A retry with the same key after the 24-hour replay
        window (or after the replay store loses the key) is answered from the invocation's current
        state with `X-Idempotent-Replay: current-state` and `200`, or `202` while it still waits for
        approval. It is never executed, admitted or charged again. The same key from a different
        credential or with a different body returns `409 idempotency_key_reuse`. A request refused
        before the invocation is recorded (for example invalid input) leaves the key unused. To run
        the action again deliberately, use a new key.

        A workspace with no plan answers 402 `PAYMENT_REQUIRED` here, before anything is recorded, as
        does an approval that would resume a parked call. Past the plan's monthly action allowance plus
        a 10% buffer (and any action packs) the answer is 429 `QUOTA_EXCEEDED`.
      operationId: invokeAction
      x-anlyon-audience: public
      x-anlyon-scopes: [actions:invoke]
      x-anlyon-idempotency: supported
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/EndUserHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvokeActionRequest' }
      responses:
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '200': { $ref: '#/components/responses/ActionInvocation' }
        '202': { $ref: '#/components/responses/ActionInvocation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/QuotaExceeded' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/EndUserConflict' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/actions/{ref}/versions:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - name: ref
        in: path
        required: true
        description: Action name or public action identifier.
        schema: { type: string, minLength: 1, maxLength: 100 }
    get:
      tags: [Actions]
      summary: List one action's immutable versions
      description: >-
        Every definition this action has had, oldest first. Editing an action appends a version;
        nothing updates one. An agent version pins a version id in its `config.actions`, which is
        what makes rolling an agent back restore the tool definitions it was published with rather
        than whatever those tools have since been edited to.
      operationId: listActionVersions
      x-anlyon-audience: public
      x-anlyon-scopes: [actions:read]
      responses:
        '200': { $ref: '#/components/responses/ActionVersionList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v2/actions/effects:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [Actions]
      summary: List governed effects
      description: >-
        Effects are the business operations governed actions perform: one per operation,
        however many attempts it took. A governed action is one with an adapter or one that
        carries a declaration. Each effect carries its execution `stage`, its business `outcome`
        (`pending`, `succeeded`, `failed`, `unknown`), whether a failure may have had partial
        impact, who established the outcome (`verification`: the provider's evidence, an
        operator's manual resolution, or nobody yet), and its receipt `grade`. Filter by
        `unresolved=true` for everything still holding impact-limit capacity, or by `grade`.
      operationId: listActionEffects
      x-anlyon-audience: public
      x-anlyon-scopes: [actions:read]
      parameters:
        - { name: action, in: query, description: Filter by action name., schema: { type: string, minLength: 1, maxLength: 100 } }
        - { name: outcome, in: query, schema: { type: string, enum: [not_dispatched, pending, succeeded, failed, unknown] } }
        - { name: stage, in: query, schema: { type: string, enum: [awaiting_approval, ready, dispatching, reconciling, settled, rejected] } }
        - { name: grade, in: query, description: Filter by receipt grade., schema: { type: string, enum: [confirmed, acknowledged, unknown, failed, refused, denied, pending] } }
        - { name: unresolved, in: query, description: 'Only effects that are pending, unknown, or possibly partial.', schema: { type: string, enum: ['true', 'false'] } }
        - { name: endUserId, in: query, description: 'Only effects of calls made for this end user. A key created with endUserRequired always sees only its own end user''s.', schema: { type: string, pattern: '^[A-Za-z0-9._:@-]{1,128}$' } }
        - { name: actingFor, in: query, description: '`workspace`: only effects sent with your workspace''s own accounts. `end_users`: only effects sent with an end user''s account. Absent: both. It only narrows: a key created with endUserRequired still sees only its own end user''s.', schema: { type: string, enum: [workspace, end_users] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200': { $ref: '#/components/responses/EffectList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/actions/effects/{id}:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - { name: id, in: path, required: true, description: Public effect identifier (eff_...)., schema: { type: string, minLength: 1, maxLength: 100 } }
    get:
      tags: [Actions]
      summary: Get an effect with its evidence
      description: >-
        The effect with every attempt, the append-only evidence history (source, observation time,
        provider identifiers, redacted details, actor), its impact reservations, and the preview
        its approval was bound to. Scoped to the caller's environment: another environment's
        effect id is not found.
      operationId: getActionEffect
      x-anlyon-audience: public
      x-anlyon-scopes: [actions:read]
      responses:
        '200': { $ref: '#/components/responses/EffectDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/actions/effects/{id}/reconcile:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - { name: id, in: path, required: true, description: Public effect identifier., schema: { type: string, minLength: 1, maxLength: 100 } }
    post:
      tags: [Actions]
      summary: Reconcile an effect now
      description: >-
        Ask the provider, read-only, what happened to a `pending` or `unknown` effect, and record
        the answer as evidence. Never writes to the provider. For a declared action this repeats
        the declared read-back. A read-back that finds nothing leaves the effect `unknown`.
        Available while the environment is
        halted. `409` when the effect is already final or another worker is reconciling or writing it.
      operationId: reconcileActionEffect
      x-anlyon-audience: public
      x-anlyon-scopes: [actions:invoke]
      x-anlyon-idempotency: unsupported
      responses:
        '200': { $ref: '#/components/responses/EffectDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/actions/effects/{id}/notes:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - { name: id, in: path, required: true, description: Public effect identifier., schema: { type: string, minLength: 1, maxLength: 100 } }
    post:
      tags: [Actions]
      summary: Add an investigation note
      description: Append an operator's note to the effect's evidence history. Changes no outcome. Needs `actions:resolve` or a workspace admin.
      operationId: addActionEffectNote
      x-anlyon-audience: public
      x-anlyon-scopes: [actions:resolve]
      x-anlyon-idempotency: unsupported
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [note]
              properties:
                note: { type: string, minLength: 3, maxLength: 2000 }
      responses:
        '201': { $ref: '#/components/responses/EffectDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/actions/effects/{id}/resolve:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - { name: id, in: path, required: true, description: Public effect identifier., schema: { type: string, minLength: 1, maxLength: 100 } }
    post:
      tags: [Actions]
      summary: Record a manual resolution
      description: >-
        Record an operator's reasoned conclusion for a `pending` or `unknown` effect, or settle a
        failed effect's possible partial impact. The result is labelled `verification: manual`
        and is never presented as provider verification. Settles impact limits: `succeeded`
        consumes the declared (or `actualImpact`) quantity; `failed` with no partial impact
        releases it. A confirmed partial must state `actualImpact`. A confirmed outcome is never
        rewritten (`409`). The key that requested the effect cannot resolve it.
      operationId: resolveActionEffect
      x-anlyon-audience: public
      x-anlyon-scopes: [actions:resolve]
      x-anlyon-idempotency: unsupported
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResolveEffectRequest' }
      responses:
        '200': { $ref: '#/components/responses/EffectDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/actions/effects/{id}/replay:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - { name: id, in: path, required: true, description: Public effect identifier., schema: { type: string, minLength: 1, maxLength: 100 } }
    post:
      tags: [Actions]
      summary: Replay a lost write under the same identity
      description: >-
        Repeat the write of an `unknown` effect under the same provider identity, for adapters that
        declare `sameKeyReplay` backed by a provider idempotency key (`stripe.refund` and
        `resend.email_send`, each within its 24-hour window). `github.file_update` does not offer replay: GitHub has no idempotency key, and the
        blob-SHA precondition cannot tell a restored file from an unwritten one. A declared action
        never offers replay either, because it sends no provider idempotency key. A replay is a write
        and passes every control a first dispatch passes: the reviewed binding and preview expiry,
        the approval, the action version that would run now, the halt switch, the requesting
        credential's authority, current policy and dependencies. Every refusal has one shape:
        `409` with code `REPLAY_REFUSED` and a message that starts `Replay refused (<reason>):`,
        where the reason is `replay_unsupported`, `not_unknown`, `replay_window_passed`,
        `credential_unavailable`, `allowance_released`, `write_in_flight`, or the dispatch control
        that failed, such as `policy_denies` or `preview_expired`. The production API does not
        return `error.details`, so read the reason from the message, or from the refusal's evidence
        entry (`details.reason`) on `GET /api/v2/actions/effects/{id}`, which also gives the
        effect's current outcome. A refusal is recorded in the effect's evidence, sends nothing and
        changes nothing else. An admitted
        replay that fails (never sent, or refused by the provider) describes that attempt, not the
        original write: the effect stays `unknown` with its allowance held. Only the provider's own
        record of the operation in a failed state settles it `failed`. It never creates a second
        effect.
      operationId: replayActionEffect
      x-anlyon-audience: public
      x-anlyon-scopes: [actions:resolve]
      x-anlyon-idempotency: unsupported
      responses:
        '200': { $ref: '#/components/responses/EffectDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/actions/previews/{id}:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - { name: id, in: path, required: true, description: Public preview identifier (prv_...)., schema: { type: string, minLength: 1, maxLength: 100 } }
    get:
      tags: [Actions]
      summary: Get a preview
      operationId: getActionPreview
      x-anlyon-audience: public
      x-anlyon-scopes: [actions:read]
      responses:
        '200': { $ref: '#/components/responses/Preview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/actions/previews/{id}/refresh:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - { name: id, in: path, required: true, description: Public preview identifier., schema: { type: string, minLength: 1, maxLength: 100 } }
    post:
      tags: [Actions]
      summary: Refresh a preview's evidence
      description: >-
        Re-read the provider for the same input and the same action version this preview reviewed,
        and return a NEW preview that `supersedes` this one. Its binding differs, so an approval of
        the old preview never carries over; an effect already bound to the old one still executes
        only as reviewed. A refresh never moves the review to a newer action version: if the action
        changed since, invoking with the refreshed preview is refused with PREVIEW_MISMATCH and a
        new preview is needed.
      operationId: refreshActionPreview
      x-anlyon-audience: public
      x-anlyon-scopes: [actions:invoke]
      x-anlyon-idempotency: unsupported
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                ttlSeconds: { type: integer, minimum: 60, maximum: 604800 }
      responses:
        '201': { $ref: '#/components/responses/Preview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/actions/{ref}/previews:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - name: ref
        in: path
        required: true
        description: Action name or public action identifier.
        schema: { type: string, minLength: 1, maxLength: 100 }
    post:
      tags: [Actions]
      summary: Preview a governed invocation
      description: >-
        Normalize the input, resolve the exact target, read the provider (never write), and return
        a typed, execution-bound preview: environment and target, the exact change (field
        summaries and text diffs), expected impact against current impact limits, material
        preconditions with the time they were observed, expiry, and the adapter's guarantees and
        limitations. Pass its id as `previewId` when invoking; any material difference is refused.
        For a declared action the preview is the normalized request itself, with every secret
        still a `{{secret:NAME}}` reference. Anlyon does not read an API it has no adapter for
        before the write, and the preview lists what a declared action does not guarantee.
      operationId: createActionPreview
      x-anlyon-audience: public
      x-anlyon-scopes: [actions:invoke]
      x-anlyon-idempotency: unsupported
      parameters:
        - $ref: '#/components/parameters/EndUserHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePreviewRequest' }
      responses:
        '201': { $ref: '#/components/responses/Preview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/EndUserConflict' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/impact-limits:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [Impact Limits]
      summary: List impact limits
      description: >-
        Business-impact limits in the caller's environment, each with its limit, `consumed` in the
        current period, `reserved` (everything held and unresolved, across periods),
        `unknownExposure` (the part of `reserved` whose outcome is unknown or possibly partial,
        never an additional amount), and `available`.
      operationId: listImpactLimits
      x-anlyon-audience: public
      x-anlyon-scopes: [impact-limits:read]
      parameters:
        - { name: includeArchived, in: query, schema: { type: string, enum: ['true', 'false'] } }
        - { name: endUserId, in: query, description: For an end-user limit, show this end user's figures., schema: { type: string, pattern: '^[A-Za-z0-9._:@-]{1,128}$' } }
      responses:
        '200': { $ref: '#/components/responses/ImpactLimitList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }
    post:
      tags: [Impact Limits]
      summary: Create an impact limit
      description: >-
        Cap `money` (one currency, integer minor units), `resource_mutations`, or a
        workspace-declared unit such as `emails` for the whole
        environment, optionally narrowed to one action and/or a resource prefix, per `day`,
        `month` or `total`. Shared by every agent, session and key: none of them is part of a
        limit's identity. A limit in a declared unit applies to actions that declare an `impact`
        in that unit. A declared action's resource key is `http:<host><path>`, so `resourcePrefix`
        can scope a limit to a path prefix. Needs `impact-limits:write`, which no key receives by default.
        A console session or an OAuth connection also needs the admin role in the limit's environment,
        where a per-environment grant applies.
      operationId: createImpactLimit
      x-anlyon-audience: public
      x-anlyon-scopes: [impact-limits:write]
      x-anlyon-idempotency: unsupported
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateImpactLimitRequest' }
      responses:
        '201': { $ref: '#/components/responses/ImpactLimit' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/impact-limits/{id}:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - { name: id, in: path, required: true, description: Public limit identifier (lim_...)., schema: { type: string, minLength: 1, maxLength: 100 } }
    get:
      tags: [Impact Limits]
      summary: Get an impact limit
      operationId: getImpactLimit
      x-anlyon-audience: public
      x-anlyon-scopes: [impact-limits:read]
      parameters:
        - { name: endUserId, in: query, description: For an end-user limit, show this end user's figures., schema: { type: string, pattern: '^[A-Za-z0-9._:@-]{1,128}$' } }
      responses:
        '200': { $ref: '#/components/responses/ImpactLimit' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }
    patch:
      tags: [Impact Limits]
      summary: Update an impact limit
      description: >-
        Rename a limit or change its amount. Scope, dimension and period are fixed. Lowering the
        amount never releases existing exposure; it blocks new reservations until availability
        recovers. Needs `impact-limits:write`, which no key receives by default. A console session or
        an OAuth connection also needs the admin role in the limit's environment, where a
        per-environment grant applies.
      operationId: updateImpactLimit
      x-anlyon-audience: public
      x-anlyon-scopes: [impact-limits:write]
      x-anlyon-idempotency: unsupported
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateImpactLimitRequest' }
      responses:
        '200': { $ref: '#/components/responses/ImpactLimit' }
        '202': { $ref: '#/components/responses/SignOffRequired' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }
    delete:
      tags: [Impact Limits]
      summary: Archive an impact limit
      description: >-
        The limit stops applying to new effects. Its existing reservations still settle and release.
        Needs `impact-limits:write`, which no key receives by default. A console session or an OAuth
        connection also needs the admin role in the limit's environment, where a per-environment
        grant applies.
      operationId: archiveImpactLimit
      x-anlyon-audience: public
      x-anlyon-scopes: [impact-limits:write]
      x-anlyon-idempotency: unsupported
      responses:
        '200': { $ref: '#/components/responses/ImpactLimit' }
        '202': { $ref: '#/components/responses/SignOffRequired' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/actions/invocations/{id}/resolve:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - name: id
        in: path
        required: true
        description: Public invocation identifier.
        schema: { type: string, minLength: 1, maxLength: 100 }
    post:
      tags: [Actions]
      summary: Resolve an unknown invocation
      description: >-
        Record what the destination confirms happened to an invocation whose status is `unknown`.
        Nothing is sent to the destination. Resolved `succeeded` is billed; resolved `failed`
        releases the reserved usage and refunds the key's budget reservation. The resolution,
        with its evidence, operator and time, is kept permanently and returned as `resolution`.
        Only one resolution can win: an invocation that is no longer `unknown` returns `409`.
        Needs `actions:resolve` (never granted by default) or a workspace admin in the console.
        The key that requested the invocation can never resolve it. The Idempotency-Key of the
        original stays taken; to run the action again, invoke with a new key and `retryOf`. An
        invocation governed by an effect (`effectId` set) is refused with `409`
        `EFFECT_RESOLUTION_REQUIRED` and the effect in `details.effectId`: resolve the effect at
        `POST /api/v2/actions/effects/{id}/resolve`, which settles its business allowance too.
      operationId: resolveActionInvocation
      x-anlyon-audience: public
      x-anlyon-scopes: [actions:resolve]
      x-anlyon-idempotency: unsupported
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [outcome, evidence]
              properties:
                outcome: { type: string, enum: [succeeded, failed] }
                evidence: { type: string, minLength: 10, maxLength: 2000, description: What you checked at the destination. }
                externalReference: { type: string, nullable: true, minLength: 1, maxLength: 200, description: 'The destination''s own reference, such as a charge or ticket id.' }
      responses:
        '200': { $ref: '#/components/responses/Invocation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/actions/{ref}/invocations:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - name: ref
        in: path
        required: true
        description: Action name or public action identifier.
        schema: { type: string, minLength: 1, maxLength: 100 }
    get:
      tags: [Actions]
      summary: List one action's invocations
      operationId: listInvocationsForAction
      x-anlyon-audience: public
      x-anlyon-scopes: [actions:read]
      parameters:
        - { name: status, in: query, description: 'Filter by status. `unknown` lists calls waiting for an operator to confirm their outcome.', schema: { type: string, enum: [pending_approval, running, succeeded, failed, unknown, denied, expired] } }
        - { name: actingFor, in: query, description: '`workspace`: only calls with your workspace''s own accounts (no end user). `end_users`: only calls made for an end user. Absent: both. It only narrows: a key created with endUserRequired still sees only its own end user''s.', schema: { type: string, enum: [workspace, end_users] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200': { $ref: '#/components/responses/InvocationList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/approvals:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [Approvals]
      summary: Request an approval
      operationId: createApproval
      x-anlyon-audience: public
      x-anlyon-scopes: [approvals:write]
      x-anlyon-idempotency: supported
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateApprovalRequest' }
      responses:
        '201': { $ref: '#/components/responses/ApprovalCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/QuotaExceeded' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }
    get:
      tags: [Approvals]
      summary: List approvals
      operationId: listApprovals
      x-anlyon-audience: public
      x-anlyon-scopes: [approvals:read]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, approved, denied, expired] } }
        - name: decisionOrigin
          in: query
          description: Filter by who decided. `automated` is policy, system or assistant, so an inbox can show people the decisions that need them and keep machine-made ones as an audit trail.
          schema: { type: string, enum: [human, policy, system, unknown, assistant, automated] }
        - { name: endUserId, in: query, description: 'Only approvals of calls made for this end user. A key created with endUserRequired always sees only its own end user''s.', schema: { type: string, pattern: '^[A-Za-z0-9._:@-]{1,128}$' } }
        - { name: actingFor, in: query, description: '`workspace`: only approvals of calls with your workspace''s own accounts. `end_users`: only approvals of calls made for an end user. Absent: both.', schema: { type: string, enum: [workspace, end_users] } }
        - name: decider
          in: query
          description: '`team` (the default): the team''s inbox, decided with /api/v2/approvals/{id}/approve and /deny. `end_user`: the approvals end users decide in your app, listed read-only here; they are decided through /api/v2/end-users/{endUserId}/approvals/{approvalId}/decide. An API key needs the `end-users:approvals` scope as well for `end_user`, the same scope /api/v2/end-users/{endUserId}/approvals takes; without it the request answers 403.'
          schema: { type: string, enum: [team, end_user], default: team }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200': { $ref: '#/components/responses/ApprovalList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/approval-policies/evaluate:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    post:
      tags: [Approval Policies]
      summary: Evaluate current policies without executing
      description: Read-only evaluation against the credential's environment. Uses production matcher ordering and fail-closed behavior. Attribution is hypothetical. The result is policy-only, not an authorization or a final invocation decision; action version pins, approval floor, schema validation, budgets, halt state and runtime authority are not evaluated. Amount is derived from payload.amount, custom tags from payload.tags. Action contexts require an existing action name.
      operationId: evaluateApprovalPolicies
      security: [{ BearerAuth: [] }, { SessionAuth: [] }]
      x-anlyon-audience: public
      x-anlyon-scopes: [policies:read]
      x-anlyon-idempotency: unsupported
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EvaluateApprovalPoliciesRequest' }
      responses:
        '200':
          description: Policy-only evaluation; no dispatch or policy mutation.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, enum: [true] }
                  data: { $ref: '#/components/schemas/PolicyEvaluation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/approval-policies:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [Approval Policies]
      summary: List approval policies
      description: >-
        Policies in the credential's own environment, in evaluation order. Needs `policies:read`, or a
        console session. With `?actionName=` only the policies that could govern that action are returned:
        the ones naming it plus the broad ones that also catch it. A credential is bound to one environment;
        an `environmentId` query that disagrees with it is refused.
      operationId: listEnvironmentApprovalPolicies
      x-anlyon-audience: public
      x-anlyon-scopes: [policies:read]
      parameters:
        - { name: actionName, in: query, schema: { type: string, maxLength: 200 } }
      responses:
        '200': { $ref: '#/components/responses/ApprovalPolicyList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }
    post:
      tags: [Approval Policies]
      summary: Create an approval policy
      description: >-
        Needs `policies:write`. Targeting is required: send `matchKind`, and `matchActionName` to target one
        action. The environment is the credential's, never the request's. This scope is privileged and never in
        the default set: the agent a policy governs must not be able to rewrite it.
      operationId: createEnvironmentApprovalPolicy
      x-anlyon-audience: public
      x-anlyon-scopes: [policies:write]
      x-anlyon-idempotency: unsupported
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateEnvironmentApprovalPolicyRequest' } } } }
      responses:
        '201': { $ref: '#/components/responses/ApprovalPolicyCreated' }
        '202': { $ref: '#/components/responses/SignOffRequired' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimitOrQuotaExceeded' }

  /api/v2/approval-policies/files/plan:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    post:
      tags: [Approval Policies]
      summary: Plan a policy file
      description: >-
        Read-only. Parses a policy file (YAML or JSON, at most 256 KiB, no duplicate keys or aliases),
        checks every policy (targets, CEL conditions against the action's input schema, name clashes,
        broad denies, the plan's policy allowance) and returns what applying it would create, update
        and delete. Only policies owned by this file are ever changed; console-made and other files'
        policies are never taken over. `errors` lists everything that prevents applying. `digest`
        identifies the reviewed state: pass it to apply, which refuses if anything changed since.
        The file must declare the credential's environment.
      operationId: planApprovalPolicyFile
      x-anlyon-audience: public
      x-anlyon-scopes: [policies:read]
      x-anlyon-idempotency: unsupported
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PolicyFilePlanRequest' }
      responses:
        '200':
          description: The plan.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, enum: [true] }
                  data: { $ref: '#/components/schemas/PolicyFilePlan' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/approval-policies/files/apply:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    post:
      tags: [Approval Policies]
      summary: Apply a policy file
      description: >-
        Applies exactly the reviewed plan in one transaction: every change and its history entry
        commit together or not at all. Refuses with `409 STALE_PLAN` when the file, the
        environment's policies or the referenced actions changed since the plan, and with
        `400 POLICY_FILE_INVALID` when the plan has errors. The digest is a staleness check, not
        an authorization. The credential is recorded as the actor on each version.
      operationId: applyApprovalPolicyFile
      x-anlyon-audience: public
      x-anlyon-scopes: [policies:write]
      x-anlyon-idempotency: unsupported
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PolicyFileApplyRequest' }
      responses:
        '200':
          description: The applied plan.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    allOf:
                      - $ref: '#/components/schemas/PolicyFilePlan'
                      - type: object
                        required: [applied]
                        properties:
                          applied: { type: boolean, enum: [true] }
        '202': { $ref: '#/components/responses/SignOffRequired' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/approval-policies/files/test:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    post:
      tags: [Approval Policies]
      summary: Test a policy file against fixture requests
      description: >-
        Decides each fixture request against the environment as it would be after applying the
        file (every enabled policy the file does not own, plus the file's policies), using the
        production decision function. Writes nothing and dispatches nothing. Policy decision only:
        an action's own approval floor is not applied.
      operationId: testApprovalPolicyFile
      x-anlyon-audience: public
      x-anlyon-scopes: [policies:read]
      x-anlyon-idempotency: unsupported
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PolicyFileTestRequest' }
      responses:
        '200':
          description: Per-case results.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, enum: [true] }
                  data: { $ref: '#/components/schemas/PolicyFileTestResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/approval-policies/{policyId}/versions:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/PolicyId' }]
    get:
      tags: [Approval Policies]
      summary: Read immutable policy history
      description: Returns retained snapshots newest first, a page at a time, including the deletion tombstone after a policy is removed. Page with `before` set to `pagination.nextBefore`; the cursor is stable while new versions are added. `pagination.earliestVersion` is the oldest retained version, so a decision citing an older one predates retained history. Older overwritten versions are not reconstructed; baseline entries mark migration-time evidence. Scoped to the credential environment. Tenant or environment erasure removes its retained history.
      operationId: listApprovalPolicyVersions
      x-anlyon-audience: public
      x-anlyon-scopes: [policies:read]
      parameters:
        - { name: limit, in: query, description: 'Versions per page, newest first. Default 50.', schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: before, in: query, description: 'Version cursor: return versions older than this. Use `pagination.nextBefore` from the previous page.', schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: One page of retained versions, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalPolicyVersionPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/approval-policies/{policyId}/versions/{version}:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/PolicyId'
      - { name: version, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      tags: [Approval Policies]
      summary: Read one policy version
      description: One retained version, for example the exact version an approval or invocation decision recorded. Readable after the policy is deleted. Scoped to the credential environment.
      operationId: getApprovalPolicyVersion
      x-anlyon-audience: public
      x-anlyon-scopes: [policies:read]
      responses:
        '200':
          description: The retained version.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, enum: [true] }
                  data: { $ref: '#/components/schemas/ApprovalPolicyVersion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/approval-policies/{policyId}:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/PolicyId'
    get:
      tags: [Approval Policies]
      summary: Get an approval policy
      description: Needs `policies:read`. A policy in another environment is reported as not found.
      operationId: getEnvironmentApprovalPolicy
      x-anlyon-audience: public
      x-anlyon-scopes: [policies:read]
      responses:
        '200': { $ref: '#/components/responses/ApprovalPolicyResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }
    patch:
      tags: [Approval Policies]
      summary: Update an approval policy
      description: >-
        Needs `policies:write`. Omitted fields are unchanged; an explicit `null` clears a nullable matcher.
        Enabling or disabling a policy is a patch of `enabled`. Bumps the version. Decisions already recorded
        on invocations keep the explanation they were made with.
      operationId: updateEnvironmentApprovalPolicy
      x-anlyon-audience: public
      x-anlyon-scopes: [policies:write]
      x-anlyon-idempotency: unsupported
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateEnvironmentApprovalPolicyRequest' } } } }
      responses:
        '200': { $ref: '#/components/responses/ApprovalPolicyResult' }
        '202': { $ref: '#/components/responses/SignOffRequired' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }
    delete:
      tags: [Approval Policies]
      summary: Delete an approval policy
      description: Needs `policies:write`. Recorded invocation decisions keep their explanation.
      operationId: deleteEnvironmentApprovalPolicy
      x-anlyon-audience: public
      x-anlyon-scopes: [policies:write]
      x-anlyon-idempotency: unsupported
      responses:
        '200': { $ref: '#/components/responses/MessageResult' }
        '202': { $ref: '#/components/responses/SignOffRequired' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/auth/identity:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [Authentication]
      summary: Inspect the current credential
      description: >-
        Returns only the caller's own credential: its type, API key id (API keys only), workspace and
        environment, effective scopes and expiry. Needs no scope beyond being authenticated. Use it at startup
        to check the application holds the scopes it needs and none it should not. Holding a scope is not proof
        a call will run: policies, budgets, environment halt and quotas still apply at request time. Never
        cached.
      operationId: getCredentialIdentity
      x-anlyon-audience: public
      x-anlyon-scopes: []
      responses:
        '200': { $ref: '#/components/responses/CredentialIdentity' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/approvals/{id}:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - name: id
        in: path
        required: true
        description: Public approval identifier.
        schema: { type: string, minLength: 1, maxLength: 100 }
    get:
      tags: [Approvals]
      summary: Get or wait for an approval
      description: Return immediately, or wait up to 55 seconds for the approval to leave pending state.
      operationId: getApproval
      x-anlyon-audience: public
      x-anlyon-scopes: [approvals:read]
      parameters:
        - { name: waitSeconds, in: query, description: Values are clamped to 0–55 seconds., schema: { type: integer, minimum: 0, maximum: 55 } }
      responses:
        '200': { $ref: '#/components/responses/Approval' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/approvals/{id}/approve:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - name: id
        in: path
        required: true
        description: Public approval identifier.
        schema: { type: string, minLength: 1, maxLength: 100 }
    post:
      tags: [Approvals]
      summary: Approve a request
      description: Decide a pending request. For an action approval, this executes and returns the parked invocation. A credential cannot decide an approval it requested, whether it is the requesting API key or the requesting OAuth app acting for the same user. A person cannot decide one requested by an app acting for them or by an API key they created, from any surface (403 `SELF_APPROVAL_NOT_ALLOWED`); a second approver or a separate approver key must decide. A person also needs a role that may decide in the approval's environment.
      operationId: approveApproval
      x-anlyon-audience: public
      x-anlyon-scopes: [approvals:decide]
      x-anlyon-idempotency: supported
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecideApprovalRequest' }
      responses:
        '200': { $ref: '#/components/responses/ApprovalDecision' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/approvals/{id}/deny:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - name: id
        in: path
        required: true
        description: Public approval identifier.
        schema: { type: string, minLength: 1, maxLength: 100 }
    post:
      tags: [Approvals]
      summary: Deny a request
      description: Deny a pending request. A credential cannot decide an approval it requested, whether it is the requesting API key or the requesting OAuth app acting for the same user. A person cannot decide one requested by an app acting for them or by an API key they created, from any surface (403 `SELF_APPROVAL_NOT_ALLOWED`); a second approver or a separate approver key must decide. A person also needs a role that may decide in the approval's environment.
      operationId: denyApproval
      x-anlyon-audience: public
      x-anlyon-scopes: [approvals:decide]
      x-anlyon-idempotency: supported
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecideApprovalRequest' }
      responses:
        '200': { $ref: '#/components/responses/ApprovalDecision' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/api-keys:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [Authentication]
      summary: Create the agent key for this login's environment
      description: >-
        A person's OAuth login (`anlyon init`) creates an API key for the environment it is bound to,
        without the console. Needs the `anlyon:keys` consent group (sensitive, off unless the person
        allows "Create API keys") and the `keys.manage` role permission. The key holds the standard agent
        scopes (the scopes of the default consent groups: actions, events, observability), cut down to the
        scopes this login holds, so it never holds a privileged scope. The body takes only a name: the
        environment is the login's and the scopes are fixed. An API key or a session is refused with 403;
        a session creates keys with `POST /api/v2/workspaces/{workspaceId}/api-keys`. The full key is in
        this response once and is never cached.
      operationId: createAgentApiKey
      x-anlyon-audience: cli
      x-anlyon-scopes: []
      x-anlyon-idempotency: unsupported
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 100, description: 'A name that says where the key lives, for example `anlyon init: my-app`.' }
            example: { name: 'anlyon init: my-app' }
      responses:
        '201': { $ref: '#/components/responses/ApiKeyCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/budgets:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [Budgets]
      summary: List API-key budgets
      description: >-
        List configured key budgets with current-month usage and estimated spend.
        An API-key or OAuth caller sees only keys in its own environment; a
        dashboard session sees the whole workspace.
      operationId: listBudgets
      x-anlyon-audience: public
      x-anlyon-scopes: [budgets:read]
      responses:
        '200': { $ref: '#/components/responses/BudgetList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/budgets/{apiKeyId}:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - name: apiKeyId
        in: path
        required: true
        description: >-
          Internal API-key identifier returned by workspace key management APIs.
          A key outside the caller's environment is not found.
        schema: { type: string, format: uuid }
    get:
      tags: [Budgets]
      summary: Get an API-key budget
      operationId: getBudget
      x-anlyon-audience: public
      x-anlyon-scopes: [budgets:read]
      responses:
        '200': { $ref: '#/components/responses/Budget' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }
    put:
      tags: [Budgets]
      summary: Create or replace an API-key budget
      operationId: putBudget
      x-anlyon-audience: public
      x-anlyon-scopes: [budgets:write]
      x-anlyon-idempotency: unsupported
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PutBudgetRequest' }
      responses:
        '200': { $ref: '#/components/responses/Budget' }
        '202': { $ref: '#/components/responses/SignOffRequired' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }
    delete:
      tags: [Budgets]
      summary: Delete an API-key budget
      description: Remove the cap; the API key becomes unbudgeted.
      operationId: deleteBudget
      x-anlyon-audience: public
      x-anlyon-scopes: [budgets:write]
      x-anlyon-idempotency: unsupported
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
        '202': { $ref: '#/components/responses/SignOffRequired' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/stream:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    get:
      tags: [Stream]
      summary: Subscribe to the realtime event stream
      description: >-
        An authenticated, resumable Server-Sent Events feed of workspace state
        changes (runs, spans, approvals, budgets, notifications and more), scoped to the API key's workspace and
        environment (only events attributed to that environment). Resume after a disconnect by sending the last id you saw as
        the `Last-Event-ID` header (or `?cursor=`); events after that id are
        replayed from a bounded window, so a reconnect has no silent gap.
      operationId: streamEvents
      x-anlyon-audience: public
      x-anlyon-scopes: [events:read]
      x-anlyon-response-envelope: raw-export
      parameters:
        - { name: cursor, in: query, required: false, schema: { type: string }, description: 'Resume after this event id (alternative to the Last-Event-ID header).' }
      responses: { '200': { $ref: '#/components/responses/EventStream' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '429': { $ref: '#/components/responses/RateLimitExceeded' } }

  /api/v2/runs:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    post:
      tags: [Runs]
      summary: Start a run
      description: A run is an agent execution  a tree of spans. The environment is taken from the API key.
      operationId: startRun
      x-anlyon-audience: public
      x-anlyon-scopes: [runs:write]
      x-anlyon-idempotency: supported
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: false, content: { application/json: { schema: { $ref: '#/components/schemas/StartRunRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/RunStarted' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
    get:
      tags: [Runs]
      summary: List runs
      description: Newest first. Search run ID, name, or application; filter by status, agent, user, and time range.
      operationId: listRuns
      x-anlyon-audience: public
      x-anlyon-scopes: [runs:read]
      parameters:
        - { name: search, in: query, required: false, schema: { type: string, minLength: 1, maxLength: 200 }, description: 'Case-insensitive substring search across run ID, name, and application.' }
        - { name: status, in: query, required: false, schema: { type: string, enum: [running, succeeded, failed, cancelled] } }
        - { name: agentId, in: query, required: false, schema: { type: string } }
        - { name: userId, in: query, required: false, schema: { type: string } }
        - { name: environmentId, in: query, required: false, schema: { type: string, format: uuid }, description: 'Filter to one environment. API keys are already environment-scoped; this is for the session-authed dashboard viewing across environments.' }
        - { name: startedAfter, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: startedBefore, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
      responses: { '200': { $ref: '#/components/responses/RunList' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }

  /api/v2/runs/import:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    post:
      tags: [Runs]
      summary: Import an OTLP/JSON trace
      description: >-
        Imports one bounded OTLP/JSON trace as a new run. The destination
        environment is always taken from the API key; source workspace and
        environment attributes are ignored.
      operationId: importRun
      x-anlyon-audience: public
      x-anlyon-scopes: [runs:write]
      x-anlyon-idempotency: supported
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ImportOtlpTraceRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/RunImported' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }

  /api/v2/runs/{runId}:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/RunId' }]
    get:
      tags: [Runs]
      summary: Get a run with its span tree
      operationId: getRun
      x-anlyon-audience: public
      x-anlyon-scopes: [runs:read]
      responses: { '200': { $ref: '#/components/responses/RunWithSpansResult' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
    patch:
      tags: [Runs]
      summary: End or update a run
      operationId: endRun
      x-anlyon-audience: public
      x-anlyon-scopes: [runs:write]
      x-anlyon-idempotency: supported
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EndRunRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/RunResult' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }

  /api/v2/runs/{runId}/export:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/RunId' }]
    get:
      tags: [Runs]
      summary: Export a run as OTLP/JSON
      description: Exports a redacted trace in OpenTelemetry Protocol JSON shape.
      operationId: exportRun
      x-anlyon-audience: public
      x-anlyon-scopes: [runs:read]
      responses: { '200': { $ref: '#/components/responses/TraceExport' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }

  /api/v2/runs/{runId}/feedback:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/RunId' }]
    post:
      tags: [Runs]
      summary: Attach feedback to a run
      description: Explicit or implicit feedback on a run, or a specific span within it  the start of the learning loop from production behaviour.
      operationId: addRunFeedback
      x-anlyon-audience: public
      x-anlyon-scopes: [runs:write]
      x-anlyon-idempotency: supported
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: false, content: { application/json: { schema: { $ref: '#/components/schemas/AddFeedbackRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/RunFeedbackCreated' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
    get:
      tags: [Runs]
      summary: List feedback for a run
      operationId: listRunFeedback
      x-anlyon-audience: public
      x-anlyon-scopes: [runs:read]
      responses: { '200': { $ref: '#/components/responses/RunFeedbackList' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }

  /api/v2/runs/{runId}/spans:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/RunId' }]
    post:
      tags: [Runs]
      summary: Ingest spans
      description: 'Batch-ingest spans for a run. Idempotent: a span carrying an `id` is upserted, so a retried batch never duplicates.'
      operationId: ingestSpans
      x-anlyon-audience: public
      x-anlyon-scopes: [runs:write]
      x-anlyon-idempotency: supported
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/IngestSpansRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/SpansIngested' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }

  /api/v2/workspaces:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    get:
      tags: [Workspaces]
      summary: List the current user's workspaces
      operationId: listWorkspacesForUser
      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-scopes: []
      responses: { '200': { $ref: '#/components/responses/WorkspaceMembershipList' }, '401': { $ref: '#/components/responses/Unauthorized' } }
    post:
      tags: [Workspaces]
      summary: Create a workspace
      description: Creates the user's single supported workspace and attempts to issue default API-key and delivery-signing credentials. One-time credentials may be null if their independent provisioning fails.
      operationId: createWorkspace
      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-scopes: []
      x-anlyon-idempotency: unsupported
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateWorkspaceRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/WorkspaceCreated' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '409': { $ref: '#/components/responses/Conflict' } }

  /api/v2/workspaces/{workspaceId}:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/WorkspaceId' }]
    get:
      tags: [Workspaces]
      summary: Get a workspace and the current user's role
      operationId: getWorkspace
      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-scopes: []
      responses: { '200': { $ref: '#/components/responses/WorkspaceDetail' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
    patch:
      tags: [Workspaces]
      summary: Update a workspace
      description: Requires the admin role or higher.
      operationId: updateWorkspace
      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-scopes: []
      x-anlyon-idempotency: unsupported
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateWorkspaceRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Workspace' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
    delete:
      tags: [Workspaces]
      summary: Delete a workspace
      description: Requires the admin role and cascades deletion to workspace resources.
      operationId: deleteWorkspace
      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-scopes: []
      x-anlyon-idempotency: unsupported
      responses: { '200': { $ref: '#/components/responses/MessageResult' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }

  /api/v2/workspaces/{workspaceId}/defaults:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/WorkspaceId' }]
    get:
      tags: [Workspaces]
      summary: Get workspace defaults
      description: >-
        The workspace-wide answers to what happens when no policy decides: who a call made for a user goes to,
        how long a request waits, and whether setup was finished. They apply to every environment. A null answer
        means the recommended one is in force; `effective` shows what is used.
      operationId: getWorkspaceDefaults
      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-scopes: []
      responses: { '200': { $ref: '#/components/responses/WorkspaceDefaults' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
    patch:
      tags: [Workspaces]
      summary: Update workspace defaults
      description: >-
        Requires the admin role. Send null to go back to the recommended answer. Fields left out are kept. A change
        is recorded as a `workspace.defaults_updated` audit event with each changed answer before and after.
      operationId: updateWorkspaceDefaults
      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-scopes: []
      x-anlyon-idempotency: unsupported
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateWorkspaceDefaultsRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/WorkspaceDefaults' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }

  /api/v2/workspaces/{workspaceId}/environments:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/WorkspaceId' }]
    get:
      tags: [Environments]
      summary: List environments
      description: Environments isolate dev, preview, staging, and production within a workspace.
      operationId: listWorkspaceEnvironments
      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-scopes: []
      responses: { '200': { $ref: '#/components/responses/EnvironmentList' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
    post:
      tags: [Environments]
      summary: Create an environment
      description: Requires the admin role or higher.
      operationId: createWorkspaceEnvironment
      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-scopes: []
      x-anlyon-idempotency: unsupported
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateEnvironmentRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/EnvironmentCreated' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }

  /api/v2/workspaces/{workspaceId}/environments/{environmentId}:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/EnvironmentId' }]
    get:
      tags: [Environments]
      summary: Get an environment
      operationId: getWorkspaceEnvironment
      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-scopes: []
      responses: { '200': { $ref: '#/components/responses/Environment' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
    patch:
      tags: [Environments]
      summary: Update an environment
      description: Update name, kind, protection, or transfer the default. Slug is immutable. A kind change never counts against the plan, which allows a total number of environments. Protected reclassification requires confirmProtected. Requires admin or higher.
      operationId: updateWorkspaceEnvironment
      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-scopes: []
      x-anlyon-idempotency: unsupported
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateEnvironmentRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Environment' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }

    delete:
      tags: [Environments]
      summary: Delete an empty environment
      description: Admins only. Requires a halted, unprotected, non-default environment with no referenced resources or retained history. No customer data is cascaded. Confirm by submitting its exact slug.
      operationId: deleteWorkspaceEnvironment
      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-scopes: []
      x-anlyon-idempotency: unsupported
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmSlug]
              properties:
                confirmSlug: { type: string, minLength: 2, maxLength: 40, example: staging }
      responses:
        '200':
          description: Empty environment deleted.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: object
                    required: [deleted]
                    properties:
                      deleted: { type: boolean, enum: [true] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v2/workspaces/{workspaceId}/environments/{environmentId}/halt:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/EnvironmentId' }]
    post:
      tags: [Environments]
      summary: Halt an environment (kill switch)
      description: >-
        Stops all side effects in the environment: message deliveries defer
        and action invocations are blocked (including approval-gated ones).
        Writes are still accepted  publishes queue and
        approvals can be decided  so nothing is lost while halted. Resuming
        releases the deferred work. Halting needs the admin or member role in this environment
        (approver and viewer cannot halt); resuming needs the admin role.
      operationId: haltWorkspaceEnvironment
      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-scopes: []
      x-anlyon-idempotency: unsupported
      requestBody: { required: false, content: { application/json: { schema: { $ref: '#/components/schemas/HaltEnvironmentRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Environment' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }

  /api/v2/workspaces/{workspaceId}/environments/{environmentId}/resume:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/EnvironmentId' }]
    post:
      tags: [Environments]
      summary: Resume a halted environment
      description: Clears the halt switch; deferred deliveries proceed. Requires the admin role in this environment, although the member role can halt.
      operationId: resumeWorkspaceEnvironment
      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-scopes: []
      x-anlyon-idempotency: unsupported
      responses: { '200': { $ref: '#/components/responses/Environment' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }

  /api/v2/workspaces/{workspaceId}/approval-policies:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/WorkspaceId' }]
    get:
      tags: [Approval Policies]
      summary: List approval policies
      description: 'Deterministic, environment-scoped rules that gate approvals. Optionally filter by environment with `?environmentId=`.'
      operationId: listApprovalPolicies
      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-scopes: []
      responses: { '200': { $ref: '#/components/responses/ApprovalPolicyList' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
    post:
      tags: [Approval Policies]
      summary: Create an approval policy
      description: Requires the admin role or higher in the environment named by `environmentId`, where a per-environment grant applies.
      operationId: createApprovalPolicy
      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-scopes: []
      x-anlyon-idempotency: unsupported
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateApprovalPolicyRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/ApprovalPolicyCreated' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '429': { $ref: '#/components/responses/RateLimitOrQuotaExceeded' } }

  /api/v2/workspaces/{workspaceId}/approval-policies/{policyId}:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/PolicyId' }]
    get:
      tags: [Approval Policies]
      summary: Get an approval policy
      operationId: getApprovalPolicy
      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-scopes: []
      responses: { '200': { $ref: '#/components/responses/ApprovalPolicyResult' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
    patch:
      tags: [Approval Policies]
      summary: Update an approval policy
      description: Bumps the policy version. Requires the admin role or higher in the policy's environment, where a per-environment grant applies.
      operationId: updateApprovalPolicy
      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-scopes: []
      x-anlyon-idempotency: unsupported
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateApprovalPolicyRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/ApprovalPolicyResult' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
    delete:
      tags: [Approval Policies]
      summary: Delete an approval policy
      description: Requires the admin role or higher in the policy's environment, where a per-environment grant applies.
      operationId: deleteApprovalPolicy
      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-scopes: []
      x-anlyon-idempotency: unsupported
      responses: { '200': { $ref: '#/components/responses/MessageResult' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }

  /api/v2/workspaces/{workspaceId}/approval-policies/condition-draft:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/WorkspaceId' }]
    post:
      tags: [Approval Policies]
      summary: Draft a policy condition from a sentence
      description: 'Proposes a CEL condition from plain English for review in the console editor; saves nothing. Complimentary during the beta and limited per plan (`maxMonthlyConditionDrafts` per workspace per UTC month); a draft the provider fails to produce is not counted. Sent to the model: the sentence and the target action''s input field names, types and descriptions only. The returned condition is checked with the same checker saving uses. Requires the admin role.'
      operationId: draftApprovalPolicyCondition
      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-scopes: []
      x-anlyon-idempotency: unsupported
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [environmentId, matchKind, request]
              properties:
                environmentId: { type: string, format: uuid }
                matchKind: { type: string, enum: [any, action, custom] }
                matchActionName: { type: string, nullable: true, minLength: 1, maxLength: 200 }
                request: { type: string, minLength: 5, maxLength: 500, description: The rule in your own words. }
      responses:
        '200':
          description: The proposed condition, its check result and this month's draft usage.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: object
                    required: [condition, check, usage]
                    properties:
                      condition: { type: string, nullable: true, description: Null when the sentence cannot be expressed with the facts a condition can read. }
                      check: { type: object, nullable: true, additionalProperties: true }
                      usage:
                        type: object
                        required: [used, limit]
                        properties:
                          used: { type: integer, minimum: 0 }
                          limit: { type: integer, minimum: 0 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitOrQuotaExceeded' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v2/workspaces/{workspaceId}/approval-policies/condition-assist:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/WorkspaceId' }]
    post:
      tags: [Approval Policies]
      summary: Assist with a policy condition
      description: 'Read-only support for the console condition editor. Checks a draft CEL condition against the target action''s input schema, lists that action''s input fields, evaluates the draft against an optional sample input (never dispatched), and, given `policyId`, returns that policy''s legacy `minAmount`/`conditions` rewritten as one condition.'
      operationId: assistApprovalPolicyCondition
      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-scopes: []
      x-anlyon-idempotency: unsupported
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [environmentId, matchKind]
              properties:
                environmentId: { type: string, format: uuid }
                matchKind: { type: string, enum: [any, action, custom] }
                matchActionName: { type: string, nullable: true, minLength: 1, maxLength: 200 }
                condition: { type: string, nullable: true, maxLength: 2000 }
                sampleInput: { type: object, additionalProperties: true }
                agentId: { type: string, nullable: true, maxLength: 60 }
                userId: { type: string, nullable: true, maxLength: 200 }
                tags: { type: array, maxItems: 50, items: { type: string, maxLength: 60 } }
                policyId: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '200':
          description: Check result, fields, sample outcome and legacy conversion.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: object
                    required: [check, sample, inputFields, facts, legacyCondition]
                    properties:
                      check: { type: object, nullable: true, additionalProperties: true, description: '{ valid: true } or { valid: false, message }. Null when no condition was sent.' }
                      sample: { type: object, nullable: true, additionalProperties: true, description: '{ result: boolean } or { error: string }. Null without a valid condition and sample input.' }
                      inputFields:
                        type: array
                        items:
                          type: object
                          required: [path, type, optional, description]
                          properties:
                            path: { type: string }
                            type: { type: string }
                            optional: { type: boolean }
                            description: { type: string, nullable: true }
                      facts:
                        type: array
                        items:
                          type: object
                          required: [name, type, description]
                          properties:
                            name: { type: string }
                            type: { type: string }
                            description: { type: string }
                      legacyCondition: { type: string, nullable: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v2/workspaces/{workspaceId}/approval-policies/{policyId}/versions:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/PolicyId' }]
    get:
      tags: [Approval Policies]
      summary: Read immutable policy history
      description: 'Retained snapshots newest first, a page at a time, including the deletion tombstone after a policy is removed. Page with `before` set to `pagination.nextBefore`. Optionally narrow to one environment with `?environmentId=`.'
      operationId: listWorkspaceApprovalPolicyVersions
      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-scopes: []
      parameters:
        - { name: limit, in: query, description: 'Versions per page, newest first. Default 50.', schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: before, in: query, description: 'Version cursor: return versions older than this. Use `pagination.nextBefore` from the previous page.', schema: { type: integer, minimum: 1 } }
        - { name: environmentId, in: query, description: Narrow to one of the workspace's environments., schema: { type: string, format: uuid } }
      responses:
        '200':
          description: One page of retained versions, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalPolicyVersionPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v2/workspaces/{workspaceId}/approval-policies/{policyId}/versions/{version}:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/PolicyId'
      - { name: version, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      tags: [Approval Policies]
      summary: Read one policy version
      description: One retained version, the target of a decision's link to the exact rule that governed it. Readable after the policy is deleted.
      operationId: getWorkspaceApprovalPolicyVersion
      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-scopes: []
      parameters:
        - { name: environmentId, in: query, description: Narrow to one of the workspace's environments., schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The retained version.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, enum: [true] }
                  data: { $ref: '#/components/schemas/ApprovalPolicyVersion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v2/workspaces/{workspaceId}/assistant:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/WorkspaceId' }]
    get:
      tags: [Anlyon Vigil]
      summary: Get Anlyon Vigil settings
      description: Opt-in state, consent, auto-approve limits, and this plan's usage against its hard caps. Beta.
      operationId: getAssistantSettings
      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-scopes: []
      responses: { '200': { $ref: '#/components/responses/AssistantSettings' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
    put:
      tags: [Anlyon Vigil]
      summary: Update Anlyon Vigil settings
      description: >-
        Turn Anlyon Vigil on or off, set excluded fields, and configure bounded
        auto-approve. Turning it on requires `consentVersion` equal to the
        current version, recorded with the admin who consented. Turning it off
        also turns auto-approve off. Requires the admin role or higher.
      operationId: updateAssistantSettings
      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-scopes: []
      x-anlyon-idempotency: unsupported
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateAssistantSettingsRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/AssistantSettings' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }

  /api/v2/workspaces/{workspaceId}/assistant/policy-suggestions:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/WorkspaceId' }]
    get:
      tags: [Anlyon Vigil]
      summary: List suggested approval policies
      description: >-
        Deterministic policies mined from the last 30 days of decisions: a group
        of the same action (and agent) in one environment with at least 20
        human approvals and no denials. No model is called to produce them, and
        an accepted suggestion is an ordinary policy. Beta.
      operationId: listPolicySuggestions
      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-scopes: []
      responses: { '200': { $ref: '#/components/responses/PolicySuggestionList' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }

  /api/v2/workspaces/{workspaceId}/assistant/policy-suggestions/{key}/accept:
    parameters:
      - { $ref: '#/components/parameters/RequestId' }
      - { $ref: '#/components/parameters/WorkspaceId' }
      - { name: key, in: path, required: true, description: The suggestion key from the list., schema: { type: string, minLength: 1, maxLength: 64 } }
    post:
      tags: [Anlyon Vigil]
      summary: Accept a suggested policy
      description: Creates the suggestion's policies through the ordinary policy service, the cap first. Requires the admin role or higher.
      operationId: acceptPolicySuggestion
      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-scopes: []
      x-anlyon-idempotency: unsupported
      responses: { '201': { $ref: '#/components/responses/PolicySuggestionAccepted' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }

  /api/v2/workspaces/{workspaceId}/assistant/audit-queue:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/WorkspaceId' }]
    get:
      tags: [Anlyon Vigil]
      summary: List Vigil approvals waiting for audit
      description: >-
        Approvals Anlyon Vigil made that were picked for a person to check
        (the workspace's audit sample rate) and have no verdict yet, most recent
        first, with Vigil's advice attached. Record a verdict with
        `POST .../approvals/{approvalId}/advice/audit`. Beta.
      operationId: listAssistantAuditQueue
      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-scopes: []
      responses: { '200': { $ref: '#/components/responses/AssistantAuditQueue' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }

  /api/v2/workspaces/{workspaceId}/approvals/{approvalId}/advice/audit:
    parameters:
      - { $ref: '#/components/parameters/RequestId' }
      - { $ref: '#/components/parameters/WorkspaceId' }
      - { name: approvalId, in: path, required: true, description: Public approval id (apr_xxx)., schema: { type: string } }
    post:
      tags: [Anlyon Vigil]
      summary: Record an audit verdict on Vigil advice
      description: 'A workspace admin''s agree or disagree on a Vigil decision that was sampled for audit (the audit queue). Requires the admin role or higher. A verdict is recorded once: 409 when the decision was not sampled for audit or already has a verdict.'
      operationId: auditAssistantAdvice
      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-scopes: []
      x-anlyon-idempotency: unsupported
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdviceAuditRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/AssistantAdviceResult' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }

  /api/v2/workspaces/{workspaceId}/agents:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/WorkspaceId' }]
    get:
      tags: [Agents]
      summary: List agents
      description: 'A configuration and observability boundary. Optionally filter by environment with `?environmentId=`.'
      operationId: listWorkspaceAgents
      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-scopes: []
      responses: { '200': { $ref: '#/components/responses/AgentList' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
    post:
      tags: [Agents]
      summary: Create an agent
      description: Creates the agent and its immutable v1. Requires the admin role or higher.
      operationId: createWorkspaceAgent
      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-scopes: []
      x-anlyon-idempotency: unsupported
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateAgentRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/AgentCreated' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' } }

  /api/v2/workspaces/{workspaceId}/agents/{agentId}:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/AgentId' }]
    get:
      tags: [Agents]
      summary: Get an agent
      operationId: getWorkspaceAgent
      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-scopes: []
      responses: { '200': { $ref: '#/components/responses/Agent' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
    patch:
      tags: [Agents]
      summary: Update an agent
      description: Update name, description, published version, or archive state. Versions themselves are immutable. Requires the admin role or higher.
      operationId: updateWorkspaceAgent
      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-scopes: []
      x-anlyon-idempotency: unsupported
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateAgentRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Agent' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }

  /api/v2/workspaces/{workspaceId}/agents/{agentId}/promote:
