    put:
      tags: [Members]
      summary: Give or remove a member's emergency access
      description: >-
        Emergency access lets an admin sign in with a password (and two-factor) when the workspace requires single
        sign-on, and puts them out of SCIM's reach: directory sync cannot deactivate, delete or re-role them. Only an
        admin who holds emergency access can give or remove it, and only to an admin (409 otherwise). At most two
        admins hold it (409 `EMERGENCY_ACCESS_LIMIT`), and the last cannot give it up (409
        `LAST_EMERGENCY_ACCESS_ADMIN`). Whoever creates a workspace holds it.
      operationId: setWorkspaceMemberEmergencyAccess
      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-scopes: []
      x-anlyon-idempotency: unsupported
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SetEmergencyAccessRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/WorkspaceMember' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }

