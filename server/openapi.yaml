    post:
      tags: [Functions]
      summary: Read a function's source
      description: >-
        What publishing reads from a source: its literal action calls (the allow-list it proposes),
        computed action names, risky APIs and writes in a loop. Stores nothing. For the console's
        editor.
      operationId: analyzeFunctionSource
      x-anlyon-audience: dashboard
      x-anlyon-scopes: [functions:write]
