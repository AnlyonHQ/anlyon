openapi: 3.0.3
info:
  title: Anlyon API
  description: |
    Anlyon is the production execution runtime for AI agents. An agent invokes a named
    action; Anlyon resolves the action and its version, checks the caller's scopes,
    evaluates policy, requests human approval when required, resolves credentials at
    dispatch, makes the production call itself, and records the outcome.

    These guarantees cover actions routed through the hosted executor. A tool the
    caller's own code invokes directly, with a credential that process holds, is not
    routed through Anlyon and is not governed by it.

    ## Authentication

    Developer API endpoints use a workspace API key as a bearer token:

    ```
    Authorization: Bearer anlyon_your_api_key
    ```

    ## API-key budget admission

    Budgets reserve supported logical operations in Postgres with integer sub-cent
    cost accounting. They cover action invocations and event publishes; external
    provider bills and session callers are outside these caps. UTC calendar months
    own the reservations.
    Approval-pending actions reserve one invocation admission even before dispatch.
    These conservative admission estimates are distinct from invoice metering.

    429 BUDGET_EXCEEDED refuses the whole admission. 503
    BUDGET_RECONCILIATION_REQUIRED pauses keys whose legacy usage is unknown.
    A cached Idempotency-Key success replays normally. If that cache is lost or
    expires but a durable budget reservation exists, 409
    BUDGET_EFFECT_ALREADY_RESERVED prevents executing the effect again. Investigate
    the original outcome before choosing a new key; a new key can duplicate work.
    Errors after admission keep their reservations until an operator proves no
    work occurred. Disabling or deleting a budget does not erase recorded usage.

    ## Delivery signature environment attribution

    Configured message and event-subscription signers emit legacy v1 plus signed
    env/v2 attribution. v2 is HMAC-SHA256 over the exact UTF-8 string
    `anlyon-delivery-v2.${timestamp}.${environmentId}.${rawBody}`. Receivers must
    configure the expected environment independently; v1 alone provides no
    environment boundary. Signing keys remain workspace-wide unless a subscription
    uses its own secret. X-Anlyon-Environment-Id is reserved and informational,
    not authority. Legacy queued work without recorded scope has no v2 claim.
    See /verification for coverage, raw-body verification and staged migration.

    ## Rate Limiting

    Rate limits are per workspace, by plan, in one-minute windows and UTC clock hours:
    - **No plan and Early Beta Access**: 300 requests/minute, 10,000 requests/hour
    - **Starter and Pro**: 1,000 requests/minute, 30,000 requests/hour
    - **Team**: 1,000 requests/minute, 45,000 requests/hour
    - **Enterprise**: Custom

    ## Error Handling

    All errors follow a consistent format:

    ```json
    {
      "success": false,
      "error": {
        "code": "ERROR_CODE",
        "message": "Human-readable error message",
        "details": {}
      }
    }
    ```

    Common error codes:
    - `AUTHENTICATION_ERROR` - Invalid or missing API key
    - `RATE_LIMIT_EXCEEDED` - Too many requests: the workspace's per-minute or per-hour API request limit (429, with `Retry-After`)
    - `QUOTA_EXCEEDED` - Usage quota exceeded
    - `VALIDATION_ERROR` - Invalid request data
    - `NOT_FOUND` - Resource not found
    - `FEATURE_NOT_AVAILABLE` - Feature not available on your plan
    - `PAYMENT_REQUIRED` - The workspace has no plan, so actions are not run (402)
    - `PLAN_FEATURE_REQUIRED` - Creating or changing this needs the Team plan (403)
    - `PAID_PLANS_UNAVAILABLE` - Paid plans cannot be bought right now (403)
    - `FUNCTION_RUN_CONCURRENCY_LIMIT` - The plan's hosted function runs at once are all going (429)
    - `FUNCTION_RUN_RATE_LIMITED` - The plan's hosted function run starts a minute are used (429)
  version: 2.0.0
  contact:
    name: Anlyon Support
    url: https://anlyon.com/support
    email: support@anlyon.com
  license:
    name: Proprietary
    url: https://anlyon.com/terms

servers:
  - url: https://api.anlyon.com
    description: Production server
  - url: http://localhost:4000
    description: Local development server

tags:
  - name: Environments
    description: Read an environment, halt it and resume it
  - name: Runs
    description: Record what an agent did as a run with spans, and export it
  - name: Stream
    description: Subscribe to the realtime event stream
  - name: Analytics
    description: View analytics and usage statistics
  - name: Billing
    description: Manage billing, plans, and usage
  - name: Notifications
    description: Manage notifications and preferences
  - name: Actions
    description: Define and invoke secret-backed hosted tools
  - name: Impact Limits
    description: Shared business-impact limits (money, resource mutations) that governed effects reserve before dispatch. Separate from Budgets, which cap Anlyon usage.
  - name: Approval Policies
    description: Configure the environment-scoped rules that decide whether a request needs approval, is auto-approved, or is auto-denied. Operator credentials only.
  - name: Authentication
    description: Inspect the credential making the request
  - name: Sign-offs
    description: Changes an agent asked for that loosen a guardrail, waiting for a workspace admin. An agent may never loosen its own guardrails.
  - name: Approvals
    description: Create and decide human-in-the-loop safety gates
  - name: Anlyon Vigil
    description: Anlyon Vigil, opt-in review suggestions for approvals (Beta). Deterministic policies always decide first; Vigil advises on what they route to a person and, only inside limits an admin sets, approves. Dashboard sessions only.
  - name: Audit
    description: Audit streaming and the evidence export (Enterprise). Stored audit records in one versioned shape, streamed to a signed webhook, an S3-compatible bucket, Datadog or Splunk, with per-workspace retention.
  - name: Budgets
    description: Control per-API-key usage and estimated spend
  - name: Secrets
    description: Store write-only credentials used by hosted actions
  - name: Secret stores
    description: >-
      Enterprise. Your own AWS Secrets Manager or HashiCorp Vault, per environment. A secret of kind
      `external` points into one and is read at dispatch, never stored by Anlyon. Managing stores
      needs `secret-stores:read` or `secret-stores:write`, privileged scopes no key receives by
      default; secrets that point into a store use `secrets:*` like any other.
  - name: Connected accounts
    description: Connect an account at a provider through its own consent page. The result is a secret whose access token is fetched at dispatch and never returned.
  - name: End users
    description: >-
      Act for your users. Each of your end users connects their own accounts; every action your
      agent takes in them is limited, approved and receipted per end user. Your server names the
      end user in the `Anlyon-End-User` header; the model never does.
  - name: Functions
    description: >-
      Your own code, run with no network and no secrets. Its one way to change anything is to call
      your actions, and each call is limited, approved and receipted like any action call.
  - name: Events
    description: Publish typed events and deliver them to filtered webhook subscriptions
  - name: DLQ
    description: Inspect, retry, and permanently remove event-webhook deliveries that exhausted their retries
  - name: Integrations
    description: Connect Slack and Discord notification destinations without exposing stored credentials
  - name: Invitations
    description: Invite users to workspaces and manage token-based acceptance
  - name: Logs
    description: Query, inspect, and export the redacted delivery history of event-webhook messages
  - name: Workspaces
    description: Manage dashboard workspaces without exposing payment-provider identifiers
  - name: Edition
    description: Which edition this server runs and, for its admins, the state of its licence
  - name: Instance
    description: A self-hosted install's first run, its own settings and its instance admins. Absent on Anlyon's hosted service
  - name: API Keys
    description: Create scoped credentials and safely rotate or roll back one-time key material
  - name: Members
    description: Manage workspace membership, roles and emergency access
  - name: Single sign-on
    description: Per-workspace OIDC or SAML identity provider, verified email domains and required single sign-on (Enterprise)
  - name: SCIM
    description: SCIM 2.0 provisioning of members and groups from an identity directory (Enterprise)

security:
  - BearerAuth: []
  - SessionAuth: []

paths:
  /api/v2/analytics/overview:
    get:
      tags: [Analytics]
      summary: Get cross-product analytics overview
      description: Returns reliability, usage, and attention signals across the workspace's products.
      operationId: getAnalyticsOverview
      x-anlyon-audience: public
      x-anlyon-scopes: [analytics:read]
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - { name: granularity, in: query, schema: { type: string, enum: [hour, day, week, month], default: day } }
        - { name: environmentId, in: query, description: Optional environment scope for session-authenticated requests., schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 10 } }
      responses:
        '200': { $ref: '#/components/responses/AnalyticsOverview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/analytics/agents:
    get:
      tags: [Analytics]
      summary: Get agent analytics
      description: Returns agent run volume, outcomes, duration, tokens, costs, and top agents.
      operationId: getAgentAnalytics
      x-anlyon-audience: public
      x-anlyon-scopes: [analytics:read]
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - { name: granularity, in: query, schema: { type: string, enum: [hour, day, week, month], default: day } }
        - { name: environmentId, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 10 } }
      responses:
        '200': { $ref: '#/components/responses/AgentAnalytics' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/analytics/trust-control:
    get:
      tags: [Analytics]
      summary: Get trust and control analytics
      description: Returns action invocation and approval decision outcomes, latency, and top entities.
      operationId: getTrustControlAnalytics
      x-anlyon-audience: public
      x-anlyon-scopes: [analytics:read]
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - { name: granularity, in: query, schema: { type: string, enum: [hour, day, week, month], default: day } }
        - { name: environmentId, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 10 } }
      responses:
        '200': { $ref: '#/components/responses/TrustControlAnalytics' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/analytics/delivery:
    get:
      tags: [Analytics]
      summary: Get delivery analytics
      description: Returns message, destination, bandwidth, and error analytics. The messages are event-webhook deliveries.
      operationId: getDeliveryAnalytics
      x-anlyon-audience: public
      x-anlyon-scopes: [analytics:read]
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - { name: granularity, in: query, schema: { type: string, enum: [hour, day, week, month], default: day } }
        - { name: environmentId, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 10 } }
      responses:
        '200': { $ref: '#/components/responses/DeliveryAnalytics' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/analytics/messages:
    get:
      tags:
        - Analytics
      summary: Get message analytics
      description: Retrieve aggregated message statistics for a date range
      operationId: getMessageAnalytics
      x-anlyon-audience: public
      x-anlyon-scopes: [analytics:read]
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
      responses:
        '200': { $ref: '#/components/responses/MessageAnalytics' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403': { $ref: '#/components/responses/Forbidden' }
        '429':
          $ref: '#/components/responses/RateLimitExceeded'

  /api/v2/analytics/time-series:
    get:
      tags:
        - Analytics
      summary: Get message time series data
      description: Retrieve message counts over time with configurable granularity
      operationId: getMessageTimeSeries
      x-anlyon-audience: public
      x-anlyon-scopes: [analytics:read]
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - name: granularity
          in: query
          description: Time granularity for data points
          schema:
            type: string
            enum: [hour, day, week, month]
            default: day
      responses:
        '200': { $ref: '#/components/responses/MessageTimeSeries' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403': { $ref: '#/components/responses/Forbidden' }
        '429':
          $ref: '#/components/responses/RateLimitExceeded'

  /api/v2/analytics/top-urls:
    get:
      tags:
        - Analytics
      summary: Get top destination URLs
      description: Retrieve the most frequently used destination URLs
      operationId: getTopUrls
      x-anlyon-audience: public
      x-anlyon-scopes: [analytics:read]
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - name: limit
          in: query
          description: Number of URLs to return
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200': { $ref: '#/components/responses/TopUrls' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403': { $ref: '#/components/responses/Forbidden' }
        '429':
          $ref: '#/components/responses/RateLimitExceeded'

  /api/v2/analytics/usage/current:
    get:
      tags:
        - Analytics
      summary: Get current usage
      description: Retrieve current day usage statistics
      operationId: getCurrentUsage
      x-anlyon-audience: public
      x-anlyon-scopes: [analytics:read]
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200': { $ref: '#/components/responses/CurrentAnalyticsUsage' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403': { $ref: '#/components/responses/Forbidden' }
        '429':
          $ref: '#/components/responses/RateLimitExceeded'

  /api/v2/analytics/usage/history:
    get:
      tags:
        - Analytics
      summary: Get usage history
      description: Retrieve historical usage data
      operationId: getUsageHistory
      x-anlyon-audience: public
      x-anlyon-scopes: [analytics:read]
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
      responses:
        '200': { $ref: '#/components/responses/AnalyticsUsageHistory' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403': { $ref: '#/components/responses/Forbidden' }
        '429':
          $ref: '#/components/responses/RateLimitExceeded'

  /api/v2/analytics/errors:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [Analytics]
      summary: Get failed-message error distribution
      description: Return the most frequent error messages in a date range, plus chart-ready data.
      operationId: getErrorDistribution
      x-anlyon-audience: public
      x-anlyon-scopes: [analytics:read]
      parameters:
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
      responses:
        '200': { $ref: '#/components/responses/ErrorDistribution' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/analytics/onboarding:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [Analytics]
      summary: Get workspace onboarding progress
      description: Report setup milestones and the first-message activation state, plus chart-ready progress data.
      operationId: getOnboardingStatus
      x-anlyon-audience: public
      x-anlyon-scopes: [analytics:read]
      responses:
        '200': { $ref: '#/components/responses/OnboardingStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/billing/plan:
    get:
      tags:
        - Billing
      summary: Get current plan details
      description: Retrieve details about your current pricing plan
      operationId: getCurrentPlan
      x-anlyon-audience: public
      x-anlyon-scopes: [billing:read]
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200': { $ref: '#/components/responses/BillingPlanDetails' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429':
          $ref: '#/components/responses/RateLimitExceeded'

  /api/v2/billing/usage/current:
    get:
      tags:
        - Billing
      summary: Get current billing period usage
      description: Retrieve usage statistics for the current billing period
      operationId: getCurrentBillingUsage
      x-anlyon-audience: public
      x-anlyon-scopes: [billing:read]
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200': { $ref: '#/components/responses/BillingCurrentUsage' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429':
          $ref: '#/components/responses/RateLimitExceeded'

  /api/v2/mcp-vendors:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [Integrations]
      summary: List vendors' official MCP servers
      description: >-
        Unauthenticated and read-only. The hand-checked list of vendors whose own remote MCP server
        Anlyon may name: for each, the domains and GitHub organisations it controls, the server's
        MCP Registry name and its endpoint. Every entry's registry namespace and endpoint host are
        on the vendor's own domains; an entry that fails that check is left out. `proven` is true
        only once the vendor's server has passed Anlyon's live proof. Served from memory and
        cacheable for five minutes; the list changes only with a deploy. Rate limited by IP.
      operationId: listMcpVendors
      security: []
      x-anlyon-audience: public-link
      x-anlyon-scopes: []
      responses:
        '200': { $ref: '#/components/responses/McpVendorList' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/billing/quota:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [Billing]
      summary: Get current quota utilization
      operationId: getBillingQuota
      x-anlyon-audience: public
      x-anlyon-scopes: [billing:read]
      responses:
        '200': { $ref: '#/components/responses/BillingQuota' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/notifications:
    get:
      tags:
        - Notifications
      summary: List notifications
      description: Retrieve notifications for your workspace. For a caller with a user (a console session or an OAuth connection), types that user muted in their own preferences are left out of the list and the unread count.
      operationId: listNotifications
      x-anlyon-audience: public
      x-anlyon-scopes: [notifications:read]
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: unreadOnly
          in: query
          description: Filter to only unread notifications
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          description: Number of notifications to return
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Notifications retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      notifications:
                        type: array
                        items:
                          $ref: '#/components/schemas/Notification'
                      unreadCount:
                        type: integer
                        example: 3
                      total:
                        type: integer
                        example: 10
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'

  /api/v2/notifications/{id}/read:
    patch:
      tags:
        - Notifications
      summary: Mark notification as read
      description: Mark a specific notification as read. Read state is shared by the whole workspace. Needs `notifications:write`.
      operationId: markNotificationAsRead
      x-anlyon-audience: public
      x-anlyon-scopes: [notifications:write]
      x-anlyon-idempotency: unsupported
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: id
          in: path
          required: true
          description: The notification ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Notification marked as read
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: Notification marked as read
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'

  /api/v2/notifications/read-all:
    patch:
      tags:
        - Notifications
      summary: Mark all notifications as read
      description: Mark all notifications for your workspace as read. Read state is shared by the whole workspace. Needs `notifications:write`.
      operationId: markAllNotificationsAsRead
      x-anlyon-audience: public
      x-anlyon-scopes: [notifications:write]
      x-anlyon-idempotency: unsupported
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: All notifications marked as read
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: All notifications marked as read
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'

  /api/v2/notifications/preferences:
    get:
      tags:
        - Notifications
      summary: Get notification preferences
      description: Retrieve notification preferences for your workspace
      operationId: getNotificationPreferences
      x-anlyon-audience: public
      x-anlyon-scopes: [notifications:read]
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Preferences retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/NotificationPreferences'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'

    patch:
      tags:
        - Notifications
      summary: Update notification preferences
      description: Update notification settings for your workspace, including which channels and alert types are on and who receives alerts by email and webhook. Needs `notifications:manage`, which no key receives by default. A console session or an OAuth connection also needs the admin role.
      operationId: updateNotificationPreferences
      x-anlyon-audience: public
      x-anlyon-scopes: [notifications:manage]
      x-anlyon-idempotency: unsupported
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNotificationPreferencesRequest'
      responses:
        '200':
          description: Preferences updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/NotificationPreferences'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'

  /api/v2/notifications/unread-count:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    get:
      tags: [Notifications]
      summary: Get unread notification count
      operationId: getUnreadNotificationCount
      x-anlyon-audience: public
      x-anlyon-scopes: [notifications:read]
      responses: { '200': { $ref: '#/components/responses/UnreadNotificationCount' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '429': { $ref: '#/components/responses/RateLimitExceeded' } }

  /api/v2/notifications/{id}:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - { name: id, in: path, required: true, description: Notification UUID., schema: { type: string, format: uuid } }
    delete:
      tags: [Notifications]
      summary: Dismiss a notification
      description: Delete a notification for the whole workspace. Needs `notifications:write`.
      operationId: deleteNotification
      x-anlyon-audience: public
      x-anlyon-scopes: [notifications:write]
      x-anlyon-idempotency: unsupported
      responses: { '200': { $ref: '#/components/responses/MessageResult' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '429': { $ref: '#/components/responses/RateLimitExceeded' } }

  /api/v2/notifications/preferences/me:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    get:
      tags: [Notifications]
      summary: Get your own notification preferences
      description: Returns the calling member's own preferences in this workspace. Needs a user, so a console session or an OAuth connection. An API key has no user and answers `403` `USER_IDENTITY_REQUIRED`.
      operationId: getMyNotificationPreferences
      x-anlyon-audience: public
      x-anlyon-scopes: [notifications:read]
      responses: { '200': { $ref: '#/components/responses/MyNotificationPreferences' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '429': { $ref: '#/components/responses/RateLimitExceeded' } }
    patch:
      tags: [Notifications]
      summary: Update your own notification preferences
      description: Replaces the notification types the calling member muted. A muted type is left out of that member's own list and unread count. It is still raised, still delivered to email, Slack, Discord and the webhook, and still shown to every other member. Needs `notifications:write` and a user. No role is needed. An API key has no user and answers `403` `USER_IDENTITY_REQUIRED`.
      operationId: updateMyNotificationPreferences
      x-anlyon-audience: public
      x-anlyon-scopes: [notifications:write]
      x-anlyon-idempotency: unsupported
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateMyNotificationPreferencesRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/MyNotificationPreferences' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '429': { $ref: '#/components/responses/RateLimitExceeded' } }

  /api/v2/notifications/preferences/test-webhook:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    post:
      tags: [Notifications]
      summary: Send a test notification webhook
      description: Send a synthetic signed notification through the SSRF-protected outbound client. The optional secret is never stored or returned. Needs `notifications:manage`, which no key receives by default. A console session or an OAuth connection also needs the admin role.
      operationId: testNotificationWebhook
      x-anlyon-audience: public
      x-anlyon-scopes: [notifications:manage]
      x-anlyon-idempotency: unsupported
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TestNotificationWebhookRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/MessageResult' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '429': { $ref: '#/components/responses/RateLimitExceeded' } }

  /api/v2/logs:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    get:
      tags: [Logs]
      summary: Query unified execution logs
      description: Returns message (event-webhook delivery) logs in one redacted, page-paginated timeline within the calling credential’s environment. Logs without a surviving environment-owned parent are omitted.
      operationId: listExecutionLogs
      x-anlyon-audience: public
      x-anlyon-scopes: [logs:read]
      parameters:
        - { name: type, in: query, schema: { type: string, enum: [message, all], default: all } }
        - { name: status, in: query, description: Comma-separated status names., schema: { type: string, maxLength: 500 } }
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - { name: httpStatus, in: query, description: Comma-separated three-digit HTTP statuses., schema: { type: string, pattern: '^\\d{3}(,\\s*\\d{3})*$' } }
        - { name: minDuration, in: query, schema: { type: integer, minimum: 0 } }
        - { name: maxDuration, in: query, schema: { type: integer, minimum: 0 } }
        - { name: url, in: query, schema: { type: string, maxLength: 2048 } }
        - { name: messageId, in: query, schema: { type: string, maxLength: 200 } }
        - { name: errorCode, in: query, schema: { type: string, maxLength: 200 } }
        - { name: search, in: query, schema: { type: string, maxLength: 1000 } }
        - { name: sortBy, in: query, schema: { type: string, enum: [timestamp, duration, status, httpStatus], default: timestamp } }
        - { name: sortOrder, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses: { '200': { $ref: '#/components/responses/UnifiedLogList' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '429': { $ref: '#/components/responses/RateLimitExceeded' } }

  /api/v2/logs/stats:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    get:
      tags: [Logs]
      summary: Get detailed execution-log statistics
      description: Aggregates only logs whose parent belongs to the calling credential’s environment.
      operationId: getExecutionLogStats
      x-anlyon-audience: public
      x-anlyon-scopes: [logs:read]
      parameters:
        - { name: type, in: query, schema: { type: string, enum: [message, all], default: all } }
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
      responses: { '200': { $ref: '#/components/responses/ExecutionLogStats' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '429': { $ref: '#/components/responses/RateLimitExceeded' } }

  /api/v2/logs/export:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    get:
      tags: [Logs]
      summary: Export up to 10,000 execution logs
      description: Exports only logs whose parent belongs to the calling credential’s environment.
      operationId: exportExecutionLogs
      x-anlyon-audience: public
      x-anlyon-scopes: [logs:read]
      x-anlyon-response-envelope: raw-export
      parameters:
        - { name: format, in: query, schema: { type: string, enum: [csv, json], default: csv } }
        - { name: type, in: query, schema: { type: string, enum: [message, all], default: all } }
        - { name: status, in: query, schema: { type: string, maxLength: 500 } }
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - { name: httpStatus, in: query, schema: { type: string, pattern: '^\\d{3}(,\\s*\\d{3})*$' } }
        - { name: minDuration, in: query, schema: { type: integer, minimum: 0 } }
        - { name: maxDuration, in: query, schema: { type: integer, minimum: 0 } }
        - { name: url, in: query, schema: { type: string, maxLength: 2048 } }
        - { name: messageId, in: query, schema: { type: string, maxLength: 200 } }
      responses: { '200': { $ref: '#/components/responses/ExecutionLogExport' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '429': { $ref: '#/components/responses/RateLimitExceeded' } }

  /api/v2/workspaces/{workspaceId}/invitations:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/WorkspaceId' }]
    get:
      tags: [Invitations]
      summary: List workspace invitations
      operationId: listWorkspaceInvitations
      security: [{ SessionAuth: [] }]
