      responses: { '200': { $ref: '#/components/responses/WorkspaceMember' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
    delete:
      tags: [Members]
      summary: Remove a workspace member
      description: Requires the admin role. The last admin cannot be removed (409 `LAST_ADMIN`), nor an admin with emergency access until it is removed. Access ends at once, the same way a SCIM deactivation ends it - the membership, the API keys the member created in this workspace (revoked, not deleted) and their apps' OAuth grants to it. Their account and other workspaces are untouched.
