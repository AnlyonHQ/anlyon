      type: object
      required: [state, message, tier, org, seats, seatsUsed, overSeats, features, expiresAt, graceEndsAt]
      properties:
        state: { type: string, enum: [valid, grace, invalid], description: '`grace`: expired, features still on until `graceEndsAt`.' }
        reason:
          type: string
          enum: [missing, malformed, unknown_key, bad_signature, not_yet_valid, expired, no_public_key]
          description: Why the licence is not valid. Absent when it is.
        message: { type: string, description: What the state means and what to do, for an admin. }
        tier: { type: string, enum: [team, enterprise], nullable: true }
        org: { type: string, nullable: true }
        seats: { type: integer, nullable: true, description: Seats the licence covers. }
        seatsUsed: { type: integer, description: People who belong to at least one workspace on this install. }
        overSeats: { type: boolean, description: More seats in use than licensed. Nothing is blocked. }
        features:
          type: array
          items: { type: string, enum: [sso, scim, byo_vault, kms, audit_streaming, env_permissions, evidence_export] }
        expiresAt: { type: string, format: date-time, nullable: true }
        graceEndsAt: { type: string, format: date-time, nullable: true }

