    post:
      tags: [Invitations]
      summary: Create and email a workspace invitation
      description: Workspace admins can invite an email address with any role. Sending `owner` answers 400 `OWNER_ROLE_RETIRED`. Links expire after seven days. A workspace sends at most 20 invitation emails an hour, new invitations and resends together; past that, 429 `RATE_LIMIT_EXCEEDED`.
