      headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

    EndUserConflict:
      description: >-
        A conflict with current state, or, for a call made for an end user, `END_USER_NOT_CONNECTED`
        (they have not connected the integration) or `END_USER_RECONNECT_REQUIRED` (the provider
        refused their grant, or it could not be refreshed). Nothing was sent. Those two carry
        `integration`, `displayName`, `endUserId` and, when the environment has a default redirect URL
        and the integration signs in with OAuth, a fresh `connectUrl` with its `expiresAt`. A tool
        adopted from an MCP server that signs people in answers the same, with the server's `mcp-<id>`
        key as `integration` and its name as `displayName`.
      headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/EndUserConnectionError' } } }

    Gone:
      description: This way of making the request has been withdrawn; the error message names the replacement.
      headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

    Deleted:
      description: Resource deleted.
      headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/DeletedResponse' } } }

    Forbidden:
      description: Authenticated credential lacks the required scope or workspace access.
      headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

    ServiceUnavailable:
      description: A required provider or platform dependency is not configured or available.
      headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

    Success:
      description: Successful operation
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            type: object
            required: [success, data]
            properties:
              success: { type: boolean, enum: [true] }
              data: {}

    BadRequest:
      description: Bad Request - Invalid input data
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error:
              code: VALIDATION_ERROR
              message: Invalid request data
              details:
                url: Invalid URL format

    Unauthorized:
      description: Unauthorized - Invalid or missing API key
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error:
              code: AUTHENTICATION_ERROR
              message: Invalid or missing API key

    NotFound:
      description: Not Found - Resource does not exist
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error:
              code: NOT_FOUND
              message: Resource not found

    RateLimitExceeded:
      description: >-
        Too Many Requests - Rate limit exceeded. A workspace's API requests are limited per minute
        and per UTC clock hour by plan; `Retry-After` says when to try again, and an hourly refusal
        names the limit and when the count resets. Successful responses carry the same limits in
        `X-RateLimit-Limit`, `X-RateLimit-Remaining`, `X-RateLimit-Reset` (the minute) and
        `X-RateLimit-Limit-Hour`, `X-RateLimit-Remaining-Hour`, `X-RateLimit-Reset-Hour` (the hour).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        Retry-After:
          description: Seconds until the window that refused the request resets.
          schema: { type: integer, minimum: 1 }
        X-RateLimit-Limit-Hour:
          description: The workspace's API requests per hour, when the hourly limit refused the request.
          schema: { type: integer, minimum: 0 }
        X-RateLimit-Remaining-Hour:
          description: Requests left this hour; 0 when the hourly limit refused the request.
          schema: { type: integer, minimum: 0 }
        X-RateLimit-Reset-Hour:
          description: When the hourly count resets, in milliseconds since the Unix epoch.
          schema: { type: integer, minimum: 0 }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error:
              code: RATE_LIMIT_EXCEEDED
              message: Rate limit exceeded. Please try again later.

    RateLimitOrQuotaExceeded:
      description: >-
        Too Many Requests - either the request rate limit, or the plan's cap on
        how many of this resource may exist. The `code` distinguishes them:
        `RATE_LIMIT_EXCEEDED` clears on its own, `QUOTA_EXCEEDED` does not until
        you remove one or upgrade.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error:
              code: QUOTA_EXCEEDED
              message: Free plan allows up to 5 actions. You have 5. Upgrade for more.

    QuotaExceeded:
      description: Payment Required - Usage quota exceeded
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error:
              code: QUOTA_EXCEEDED
              message: Daily message quota exceeded. Upgrade your plan to continue.

