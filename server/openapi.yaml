        controlledPromotion: { type: boolean }
        customHeaders: { type: boolean }
        webhooks: { type: boolean }
        events: { type: boolean }
        actions: { type: boolean }
        approvals: { type: boolean }
        budgets: { type: boolean }
        analytics: { type: boolean }
        prioritySupport: { type: boolean }
        sla: { type: boolean }
        dedicatedSupport: { type: boolean }
        teamFeatures: { type: boolean, description: 'SSO, SCIM directory sync, audit streaming, secret stores and roles per environment: Team and Enterprise.' }

    BillingRawPricing:
      type: object
      description: Machine-readable pricing values in cents unless the field says otherwise.
      required: [monthlyFee, perMessageCost, includedMessages, bandwidthOverageCost, perEventPublishCost, perActionInvokeCost]
      properties:
        monthlyFee: { type: number, minimum: 0 }
        yearlyFee: { type: number, minimum: 0, description: A year paid up front, in cents. 0 where the plan has no yearly price. }
        perMessageCost: { type: number, minimum: 0 }
        includedMessages: { type: integer, minimum: 0 }
        bandwidthOverageCost: { type: number, minimum: 0 }
        perEventPublishCost: { type: number, minimum: 0 }
        perActionInvokeCost: { type: number, minimum: 0 }

    BillingUsagePolicy:
      oneOf:
        - type: object
          required: [kind, capUnits]
          properties:
            kind: { type: string, enum: [hard-cap] }
            capUnits: { type: integer, minimum: 0 }
        - type: object
          description: Governed actions on a paid plan. Refused at graceCapUnits, the allowance plus 10%; action packs add to it. Never billed per unit.
          required: [kind, includedUnits, graceCapUnits]
          properties:
            kind: { type: string, enum: [included-with-grace] }
            includedUnits: { type: integer, minimum: 0 }
            graceCapUnits: { type: integer, minimum: 0 }
        - type: object
          description: No plan. Actions answer 402 PAYMENT_REQUIRED.
          required: [kind]
          properties:
            kind: { type: string, enum: [payment-required] }
        - type: object
          required: [kind]
          properties:
            kind: { type: string, enum: [unlimited] }
    BillingUsagePolicies:
      type: object
      properties:
        actionInvokes: { $ref: '#/components/schemas/BillingUsagePolicy' }
        messages: { $ref: '#/components/schemas/BillingUsagePolicy' }
        storage: { $ref: '#/components/schemas/BillingUsagePolicy' }
        bandwidth: { $ref: '#/components/schemas/BillingUsagePolicy' }
    BillingUsageAllowance:
      type: object
      properties:
        includedUnits: { type: integer, nullable: true, minimum: 0 }
        graceCapUnits: { type: integer, nullable: true, minimum: 0, description: Where usage is refused. The allowance plus 10% for governed actions on a paid plan. }
        usedUnits: { type: integer, minimum: 0 }
        overageUnits: { type: integer, minimum: 0 }
        reservedUnits: { type: integer, minimum: 0 }
        projectedOverageCents: { type: number, minimum: 0 }
    BillingAllowances:
      type: object
      properties:
        actionInvokes: { $ref: '#/components/schemas/BillingUsageAllowance' }
        messages: { $ref: '#/components/schemas/BillingUsageAllowance' }
        storage: { $ref: '#/components/schemas/BillingUsageAllowance' }
        bandwidth: { $ref: '#/components/schemas/BillingUsageAllowance' }
        monthlyFeeCents: { type: number, minimum: 0 }
        projectedOverageCents: { type: number, minimum: 0 }

    BillingPlanLimits:
      type: object
      required: [maxMessagesPerDay, maxMonthlyMessages, maxMonthlyBandwidth, maxRetries, maxMessageSize, maxHttpTimeout, rateLimit, maxBatchSize, maxConcurrentDeliveries, analyticsRetentionDays, logRetentionDays, features, pricing]
      properties:
        maxSeats: { $ref: '#/components/schemas/QuotaLimit' }
        maxActions: { $ref: '#/components/schemas/QuotaLimit' }
        maxMonthlyActionInvokes:
          allOf: [{ $ref: '#/components/schemas/QuotaLimit' }]
          description: Governed actions per UTC month the plan includes. The enforced allowance, with `usagePolicy.actionInvokes`.
        auditRetentionMonths:
          allOf: [{ $ref: '#/components/schemas/QuotaLimit' }]
          description: Months the plan keeps audit records before they are deleted. `unlimited` where the deployment sets no plan retention.
        maxEnvironments: { $ref: '#/components/schemas/QuotaLimit' }
        traceRetentionDays: { type: integer }
        traceArchival: { type: boolean }
        usagePolicy: { $ref: '#/components/schemas/BillingUsagePolicies' }
        maxMessagesPerDay: { $ref: '#/components/schemas/QuotaLimit' }
        maxMonthlyMessages: { $ref: '#/components/schemas/QuotaLimit' }
        maxMonthlyBandwidth: { type: integer, minimum: 0, description: Bytes. }
        maxRetries: { type: integer, minimum: 0 }
        maxMessageSize: { type: integer, minimum: 0, description: Bytes. }
        maxHttpTimeout: { type: integer, minimum: 0, description: Milliseconds. }
        rateLimit:
          type: object
          required: [requestsPerMinute, requestsPerHour]
          properties:
            requestsPerMinute: { $ref: '#/components/schemas/QuotaLimit' }
            requestsPerHour:
              allOf: [{ $ref: '#/components/schemas/QuotaLimit' }]
              description: API requests per UTC clock hour for the workspace, enforced with the minute limit.
        maxBatchSize: { type: integer, minimum: 1 }
        maxConcurrentDeliveries: { $ref: '#/components/schemas/QuotaLimit' }
        analyticsRetentionDays: { $ref: '#/components/schemas/QuotaLimit' }
        logRetentionDays: { $ref: '#/components/schemas/QuotaLimit' }
        maxMonthlyAssistantReviews:
          allOf: [{ $ref: '#/components/schemas/QuotaLimit' }]
          description: Anlyon Vigil (Beta) reviews per UTC month. A hard cap; at the cap approvals are reviewed without a suggestion.
        maxDailyAssistantAutoApprovals:
          allOf: [{ $ref: '#/components/schemas/QuotaLimit' }]
          description: Approvals Anlyon Vigil may make per UTC day. A hard cap; at the cap requests go to a person.
        maxApprovalPoliciesPerEnvironment:
          allOf: [{ $ref: '#/components/schemas/QuotaLimit' }]
          description: Approval policies one environment may hold.
        maxMonthlyConditionDrafts:
          type: integer
          minimum: 0
          description: Plain-English policy condition drafts per workspace per UTC month. Complimentary during the beta.
        functionRuns: { $ref: '#/components/schemas/FunctionRunLimits' }
        features: { $ref: '#/components/schemas/BillingPublicFeatures' }
        pricing: { $ref: '#/components/schemas/BillingRawPricing' }

    BillingDisplayPricing:
      type: object
      required: [monthlyFee, perMessageCost, includedMessages, bandwidthOverageCost, includedBandwidth]
      properties:
        monthlyFee: { type: number, minimum: 0, description: Major currency units. }
        perMessageCost: { type: number, minimum: 0, description: 'Cents per message, retained for backward compatibility.' }
        includedMessages: { type: integer, minimum: 0 }
        bandwidthOverageCost: { type: number, minimum: 0, description: Major currency units per GB. }
        includedBandwidth: { type: string, description: 'Human-readable byte count., example: 50 GB' }

    BillingSubscriptionSummary:
      type: object
      description: Provider-safe subscription state; the billing provider's identifiers are never returned.
      required: [status, isCustomerConfigured, hasSubscription, trialEndsAt]
      properties:
        status: { $ref: '#/components/schemas/BillingStatus' }
        isCustomerConfigured: { type: boolean }
        hasSubscription: { type: boolean }
        trialEndsAt: { type: string, format: date-time, nullable: true }

    BillingStatus:
      type: string
      description: none when the workspace has never subscribed.
      enum: [none, trialing, active, past_due, canceled, paused]

    BillingActionAllowance:
      type: object
      description: >-
        This usage month's governed actions. Actions run to graceCap (the allowance plus 10%, plus action
        packs) and are then refused with QUOTA_EXCEEDED; nothing past the allowance is charged.
      required: [included, credits, graceCap, used, paymentRequired]
      properties:
        included: { type: integer, nullable: true, minimum: 0, description: The plan's allowance. Null when nothing caps actions (Enterprise). }
        credits: { type: integer, minimum: 0, description: 'Action-pack actions this month can use, those already drawn for it plus what is left unexpired. Packs are valid for 12 months and used after the plan allowance.' }
        graceCap: { type: integer, nullable: true, minimum: 0, description: Where actions are refused. Null when uncapped. }
        used: { type: integer, minimum: 0, description: Actions run or reserved this month. }
        paymentRequired: { type: boolean, description: True when the workspace has no plan and actions answer 402. }

    BetaAllowances:
      type: object
      description: The Early Beta Access allowances, derived from the limits the API enforces. Null means the dimension has no fixed cap.
      required: [actionExecutionsPerMonth, durableMessagesPerMonth, actionDefinitions, seatsIncludingPendingInvitations, environments, combinedStorageBytes, egressBytesPerMonth, traceRetentionDays]
      properties:
        actionExecutionsPerMonth: { type: integer, nullable: true, example: 10000 }
        durableMessagesPerMonth: { type: integer, nullable: true, example: 25000 }
        actionDefinitions: { oneOf: [{ type: integer }, { type: string, enum: [unlimited] }], example: 10 }
        seatsIncludingPendingInvitations: { oneOf: [{ type: integer }, { type: string, enum: [unlimited] }], example: 3 }
        environments: { oneOf: [{ type: integer }, { type: string, enum: [unlimited] }], description: 'Total environments a workspace may hold, of any kind.', example: 3 }
        combinedStorageBytes: { type: integer, nullable: true, description: 'Capacity in bytes. Does not reset monthly., example: 1073741824' }
        egressBytesPerMonth: { type: integer, nullable: true, example: 53687091200 }
        traceRetentionDays: { type: integer, example: 14 }

    BillingAccess:
      type: object
      description: How this workspace is served right now. Server-controlled and shared by enforcement, the console, and public pricing.
      required: [mode, betaAllowancesApply, paidPlansAvailable, betaAllowancesEndAt, usageResetsAt, overageBilling, automaticCharges]
      properties:
        mode: { type: string, enum: [early_beta, standard], example: early_beta }
        betaAllowancesApply: { type: boolean, example: true }
        paidPlansAvailable: { type: boolean, description: 'Whether a paid plan can be bought right now. Purchase endpoints return PAID_PLANS_UNAVAILABLE when false., example: false' }
        betaAllowancesEndAt: { type: string, format: date-time, nullable: true, description: 'Only set once normal pricing is open, and only while this workspace still has beta allowances. The end date is fixed once set.' }
        usageResetsAt: { type: string, format: date-time, description: 'The next UTC month boundary, when monthly allowances reset.' }
        overageBilling: { type: boolean, enum: [false], description: Early Beta Access never bills overage. }
        automaticCharges: { type: boolean, enum: [false], description: Nothing is charged or upgraded automatically. }

    McpVendor:
      type: object
      required: [name, slug, aliases, domains, githubOrgs, registryName, url, proven, checkedOn]
      properties:
        name: { type: string, description: The vendor's own spelling., example: Linear }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', description: 'The vendor''s stable id in links, for example `monday-com`. It does not change when the vendor is renamed.', example: linear }
        aliases: { type: array, items: { type: string }, description: Other names a person types for this vendor. }
        domains: { type: array, items: { type: string }, description: Domains the vendor controls. The server's namespace and endpoint host are under one of them. }
        githubOrgs: { type: array, items: { type: string }, description: GitHub organisations the vendor controls, for an `io.github.<org>` namespace. }
        registryName: { type: string, description: The server's name in the MCP Registry., example: app.linear/linear }
        url: { type: string, format: uri, description: The server's streamable HTTP endpoint., example: 'https://mcp.linear.app/mcp' }
        proven: { type: boolean, description: Whether the vendor's server has passed Anlyon's live proof. }
        checkedOn: { type: string, format: date, description: The day the entry was checked against the MCP Registry., example: '2026-11-02' }

    McpVendorListResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [checkedOn, source, vendors]
          properties:
            checkedOn: { type: string, format: date, description: The day the list was checked against the MCP Registry., example: '2026-11-02' }
            source: { type: string, format: uri, description: Where the list is kept. }
            vendors:
              type: array
              items: { $ref: '#/components/schemas/McpVendor' }

    BillingPlanDetailsResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [plan, displayName, status, interval, trialEndsAt, currentPeriodEnd, cancelAtPeriodEnd, pendingPlan, trialAvailable, limits, features, pricing, subscription]
          properties:
            access: { $ref: '#/components/schemas/BillingAccess' }
            betaAllowances: { $ref: '#/components/schemas/BetaAllowances' }
            plan: { type: string, enum: [free, starter, paygo, enterprise, production, growth], description: 'The plan id. Display names: starter Starter, production Pro, growth Team, enterprise Enterprise, free no plan.', example: production }
            displayName: { type: string, example: Pro }
            status: { $ref: '#/components/schemas/BillingStatus' }
            interval: { type: string, enum: [month, year], nullable: true }
            trialEndsAt: { type: string, format: date-time, nullable: true }
            currentPeriodEnd: { type: string, format: date-time, nullable: true, description: When the paid period (or the trial) ends. }
            cancelAtPeriodEnd: { type: boolean }
            graceEndsAt: { type: string, format: date-time, nullable: true, description: 'After a failed renewal, when the plan lapses unless the payment is fixed in the billing portal. Null otherwise.' }
            trialAvailable: { type: boolean, description: Whether a checkout now would start the 14-day trial. One trial per workspace and per person. }
            pendingPlan: { type: string, nullable: true, description: 'Requested period-end target. Resource creation is restricted to this plan while the change is pending., example: free' }
            limits: { $ref: '#/components/schemas/BillingPlanLimits' }
            features: { $ref: '#/components/schemas/BillingPublicFeatures' }
            pricing: { $ref: '#/components/schemas/BillingDisplayPricing' }
            subscription: { $ref: '#/components/schemas/BillingSubscriptionSummary' }

    BillingCurrentUsageResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [currentMonthMessages, currentMonthBandwidth, dailyMessages, estimatedCost, billingPeriodStart, billingPeriodEnd, usageResetDate, actionAllowance]
          properties:
            currentMonthMessages: { type: integer, minimum: 0, example: 5000 }
            currentMonthBandwidth: { type: integer, minimum: 0, description: 'Bytes., example: 52428800' }
            dailyMessages: { type: integer, minimum: 0, example: 120 }
            estimatedCost: { type: number, minimum: 0, description: 'Estimated cost in major currency units., example: 0.05' }
            billingPeriodStart: { type: string, format: date-time }
            billingPeriodEnd: { type: string, format: date-time }
            usageResetDate: { type: string, format: date-time }
            actionAllowance: { $ref: '#/components/schemas/BillingActionAllowance' }
            functionRuns: { $ref: '#/components/schemas/FunctionRunUsage' }

    FunctionRunLimits:
      type: object
      description: Hosted function runs a plan allows. A run's own action calls count as governed actions, not here.
      required: [runsPerMonth, concurrentRuns, runStartsPerMinute]
      properties:
        runsPerMonth: { allOf: [{ $ref: '#/components/schemas/QuotaLimit' }], description: Runs started in a UTC month. }
        concurrentRuns: { allOf: [{ $ref: '#/components/schemas/QuotaLimit' }], description: Runs going at the same time across the workspace. }
        runStartsPerMinute: { allOf: [{ $ref: '#/components/schemas/QuotaLimit' }], description: Runs started in any 60 seconds. }

    FunctionRunUsage:
      type: object
      description: Hosted function runs this UTC month and running now, against the plan's limits.
      required: [used, running, limits, available]
      properties:
        used: { type: integer, minimum: 0, example: 140 }
        running: { type: integer, minimum: 0, example: 1 }
        limits: { $ref: '#/components/schemas/FunctionRunLimits' }
        available: { type: boolean, description: Whether this deployment serves hosted functions yet. }

    QuotaDimension:
      type: object
      required: [used, limit, percentage]
      properties:
        used: { type: integer, minimum: 0 }
        limit: { $ref: '#/components/schemas/QuotaLimit' }
        percentage: { type: integer, minimum: 0 }

    BillingQuotaResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [plan, daily, monthly, bandwidth]
          properties:
            allowances: { $ref: '#/components/schemas/BillingAllowances' }
            actionInvokes: { $ref: '#/components/schemas/BillingUsageAllowance' }
            actionAllowance: { $ref: '#/components/schemas/BillingActionAllowance' }
            functionRuns: { $ref: '#/components/schemas/FunctionRunUsage' }
            projectedOverageCents: { type: number, minimum: 0 }
            plan: { type: string, enum: [free, starter, paygo, enterprise, production, growth] }
            daily: { $ref: '#/components/schemas/QuotaDimension' }
            monthly: { $ref: '#/components/schemas/QuotaDimension' }
            bandwidth: { $ref: '#/components/schemas/QuotaDimension' }

    AnalyticsCharts:
      type: object
      description: Chart-library-ready projections of the canonical data payload.
      additionalProperties: true

    MessageAnalyticsData:
      type: object
      required: [published, delivered, failed, pending, successRate, averageDeliveryTime]
      properties:
        published: { type: integer, minimum: 0, example: 1000 }
        delivered: { type: integer, minimum: 0, example: 950 }
        failed: { type: integer, minimum: 0, example: 30 }
        pending: { type: integer, minimum: 0, example: 20 }
        successRate: { type: number, minimum: 0, maximum: 100, example: 95 }
        averageDeliveryTime: { type: integer, minimum: 0, description: 'Average delivery time in milliseconds., example: 142' }

    MessageAnalyticsResponse:
      type: object
      required: [success, data, charts]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: '#/components/schemas/MessageAnalyticsData' }
        charts: { $ref: '#/components/schemas/AnalyticsCharts' }

    MessageTimeSeriesPoint:
      type: object
      required: [period, published, delivered, failed]
      properties:
        period: { type: string, description: 'Bucket label formatted for the requested granularity., example: 2026-W29' }
        published: { type: integer, minimum: 0, example: 120 }
        delivered: { type: integer, minimum: 0, example: 116 }
        failed: { type: integer, minimum: 0, example: 4 }

    MessageTimeSeriesResponse:
      type: object
      required: [success, data, charts]
      properties:
        success: { type: boolean, enum: [true] }
        data: { type: array, items: { $ref: '#/components/schemas/MessageTimeSeriesPoint' } }
        charts: { $ref: '#/components/schemas/AnalyticsCharts' }

    TopUrlAnalytics:
      type: object
      required: [url, messageCount, successCount, failureCount, successRate]
      properties:
        url: { type: string, format: uri, example: https://example.com/webhook }
        messageCount: { type: integer, minimum: 0, example: 500 }
        successCount: { type: integer, minimum: 0, example: 490 }
        failureCount: { type: integer, minimum: 0, example: 10 }
        successRate: { type: number, minimum: 0, maximum: 100, example: 98 }

    TopUrlsResponse:
      type: object
      required: [success, data, charts]
      properties:
        success: { type: boolean, enum: [true] }
        data: { type: array, items: { $ref: '#/components/schemas/TopUrlAnalytics' } }
        charts: { $ref: '#/components/schemas/AnalyticsCharts' }

    AnalyticsUsage:
      type: object
      required: [date, messagesPublished, messagesDelivered, messagesFailed, bandwidthBytes, eventPublishes, actionInvokes]
      properties:
        date: { type: string, format: date, example: '2026-07-13' }
        messagesPublished: { type: integer, minimum: 0, example: 500 }
        messagesDelivered: { type: integer, minimum: 0, example: 480 }
        messagesFailed: { type: integer, minimum: 0, example: 20 }
        bandwidthBytes: { type: integer, minimum: 0, example: 1048576 }
        eventPublishes: { type: integer, minimum: 0, example: 76 }
        actionInvokes: { type: integer, minimum: 0, example: 44 }

    AnalyticsRangeMetadata:
      type: object
      required: [startDate, endDate, granularity, truncated, retentionDays]
      properties:
        startDate: { type: string, format: date-time }
        endDate: { type: string, format: date-time }
        granularity: { type: string, enum: [hour, day, week, month] }
        truncated: { type: boolean, description: True when the requested range exceeded plan retention. }
        retentionDays: { type: integer, minimum: 1, nullable: true, description: Null means unlimited retention. }

    AnalyticsScopeMetadata:
      type: object
      required: [workspaceId, environmentId]
      properties:
        workspaceId: { type: string, format: uuid }
        environmentId: { type: string, format: uuid, nullable: true }

    ProductAnalyticsMetadata:
      type: object
      required: [range, scope]
      properties:
        range: { $ref: '#/components/schemas/AnalyticsRangeMetadata' }
        scope: { $ref: '#/components/schemas/AnalyticsScopeMetadata' }

    AnalyticsOverviewData:
      allOf:
        - $ref: '#/components/schemas/ProductAnalyticsMetadata'
        - type: object
          required: [summary, usage, series, attention]
          properties:
            summary:
              type: object
              required: [agentRuns, agentRunSuccessRate, messagesDelivered, messageSuccessRate, actionInvocations, actionSuccessRate, pendingApprovals]
              properties:
                agentRuns: { type: integer, minimum: 0 }
                agentRunSuccessRate: { type: number, minimum: 0, maximum: 100 }
                messagesDelivered: { type: integer, minimum: 0 }
                messageSuccessRate: { type: number, minimum: 0, maximum: 100 }
                actionInvocations: { type: integer, minimum: 0 }
                actionSuccessRate: { type: number, minimum: 0, maximum: 100 }
                pendingApprovals: { type: integer, minimum: 0 }
            usage: { type: object, additionalProperties: true }
            series: { type: array, items: { $ref: '#/components/schemas/AnalyticsUsage' } }
            attention:
              type: array
              items:
                type: object
                required: [product, label, count, href]
                properties:
                  product: { type: string, enum: [agents, delivery, actions, approvals] }
                  label: { type: string }
                  count: { type: integer, minimum: 0 }
                  href: { type: string }

    AgentAnalyticsData:
      allOf:
        - $ref: '#/components/schemas/ProductAnalyticsMetadata'
        - type: object
          required: [summary, series, topAgents, topVersions]
          properties:
            summary:
              type: object
              required: [totalRuns, runningRuns, succeededRuns, failedRuns, cancelledRuns, successRate, p50DurationMs, p95DurationMs, totalTokens, totalCost]
              properties:
                totalRuns: { type: integer, minimum: 0 }
                runningRuns: { type: integer, minimum: 0 }
                succeededRuns: { type: integer, minimum: 0 }
                failedRuns: { type: integer, minimum: 0 }
                cancelledRuns: { type: integer, minimum: 0 }
                successRate: { type: number, minimum: 0, maximum: 100 }
                p50DurationMs: { type: integer, minimum: 0 }
                p95DurationMs: { type: integer, minimum: 0 }
                totalTokens: { type: integer, minimum: 0 }
                totalCost: { type: number, minimum: 0 }
            series: { type: array, items: { type: object, additionalProperties: true } }
            topAgents: { type: array, items: { type: object, additionalProperties: true } }
            topVersions: { type: array, items: { type: object, additionalProperties: true } }

    TrustControlAnalyticsData:
      allOf:
        - $ref: '#/components/schemas/ProductAnalyticsMetadata'
        - type: object
          required: [actions, approvals]
          properties:
            actions: { type: object, additionalProperties: true }
            approvals: { type: object, additionalProperties: true }

    DeliveryAnalyticsData:
      allOf:
        - $ref: '#/components/schemas/ProductAnalyticsMetadata'
        - type: object
          required: [messages, messageSeries, bandwidthBytes, topUrls, errors]
          properties:
            messages: { $ref: '#/components/schemas/MessageAnalyticsData' }
            messageSeries: { type: array, items: { $ref: '#/components/schemas/MessageTimeSeriesPoint' } }
            bandwidthBytes: { type: integer, minimum: 0 }
            topUrls: { type: array, items: { $ref: '#/components/schemas/TopUrlAnalytics' } }
            errors: { type: array, items: { $ref: '#/components/schemas/ErrorDistributionItem' } }

    AnalyticsOverviewResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: '#/components/schemas/AnalyticsOverviewData' }

    AgentAnalyticsResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: '#/components/schemas/AgentAnalyticsData' }

    TrustControlAnalyticsResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: '#/components/schemas/TrustControlAnalyticsData' }

    DeliveryAnalyticsResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: '#/components/schemas/DeliveryAnalyticsData' }

    CurrentAnalyticsUsageResponse:
      type: object
      required: [success, data, charts]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: '#/components/schemas/AnalyticsUsage' }
        charts: { $ref: '#/components/schemas/AnalyticsCharts' }

    AnalyticsUsageHistoryResponse:
      type: object
      required: [success, data, charts]
      properties:
        success: { type: boolean, enum: [true] }
        data: { type: array, items: { $ref: '#/components/schemas/AnalyticsUsage' } }
        charts: { $ref: '#/components/schemas/AnalyticsCharts' }

    ErrorDistributionItem:
      type: object
      required: [errorMessage, count]
      properties:
        errorMessage: { type: string }
        count: { type: integer, minimum: 0 }

    ErrorDistributionResponse:
      type: object
      required: [success, data, charts]
      properties:
        success: { type: boolean, enum: [true] }
        data: { type: array, items: { $ref: '#/components/schemas/ErrorDistributionItem' } }
        charts: { $ref: '#/components/schemas/AnalyticsCharts' }

    OnboardingStep:
      type: object
      required: [id, completed, label]
      properties:
        id: { type: string, enum: [api_key, first_invocation] }
        completed: { type: boolean }
        label: { type: string }

    OnboardingStatus:
      type: object
      required: [isOnboarded, hasApiKey, hasInvocations, totalInvocations, steps, completedSteps, totalSteps, completionPercentage]
      properties:
        isOnboarded: { type: boolean, description: 'True after the workspace has invoked its first action, whatever the outcome.' }
        hasApiKey: { type: boolean }
        hasInvocations: { type: boolean }
        totalInvocations: { type: integer, minimum: 0, description: Action invocations recorded for the workspace. }
        steps: { type: array, items: { $ref: '#/components/schemas/OnboardingStep' } }
        completedSteps: { type: integer, minimum: 0 }
        totalSteps: { type: integer, minimum: 0 }
        completionPercentage: { type: integer, minimum: 0, maximum: 100 }

    OnboardingStatusResponse:
      type: object
      required: [success, data, charts]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: '#/components/schemas/OnboardingStatus' }
        charts: { $ref: '#/components/schemas/AnalyticsCharts' }

    EventTopicName:
      type: string
      minLength: 1
      maxLength: 100
      pattern: '^[a-zA-Z0-9_-]+$'

    EventTypePattern:
      type: string
      minLength: 1
      maxLength: 200
      pattern: '^(\*|[a-zA-Z0-9_-]+(\.[a-zA-Z0-9_-]+)*(\.\*)?)$'
      example: approval.*

    CreateEventTopicRequest:
      type: object
      required: [name]
      properties:
        name: { $ref: '#/components/schemas/EventTopicName' }
        description: { type: string, maxLength: 500 }

    UpdateEventTopicRequest:
      type: object
      minProperties: 1
      properties:
        name: { $ref: '#/components/schemas/EventTopicName' }
        description: { type: string, maxLength: 500 }

    EventTopic:
      type: object
      required: [id, name, description, isReserved, createdAt, updatedAt]
      properties:
        id: { type: string, pattern: '^top_' }
        name: { $ref: '#/components/schemas/EventTopicName' }
        description: { type: string, nullable: true }
        isReserved:
          type: boolean
          description: True only for the non-publishable, non-deletable `anlyon` platform topic.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    EventTopicResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: '#/components/schemas/EventTopic' }

    EventTopicListResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data: { type: array, items: { $ref: '#/components/schemas/EventTopic' } }

    EventHeaders:
      type: object
      description: >-
        Custom headers sent with every delivery of the subscription. The same rules as a
        message's headers: a credential header (Authorization, Cookie, an API-key header and the like)
        must be a `{{secret:NAME}}` reference, which needs `secrets:read`; names reserved for
        delivery signing, and Host, Content-Length, Transfer-Encoding and connection headers,
        are refused; a name is a token and a value has no line breaks. Credential headers are
        redacted when a subscription is read.
      additionalProperties: { type: string, maxLength: 8192 }

    CreateEventSubscriptionRequest:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri, maxLength: 2048 }
        eventTypes:
          type: array
          minItems: 1
          maxItems: 50
          default: ['*']
          items: { $ref: '#/components/schemas/EventTypePattern' }
        enabled: { type: boolean, default: true }
        generateSecret:
          type: boolean
          default: false
          description: Generate a per-subscription webhook signing secret and return it once.
        headers: { $ref: '#/components/schemas/EventHeaders' }

    UpdateEventSubscriptionRequest:
      type: object
      minProperties: 1
      properties:
        url: { type: string, format: uri, maxLength: 2048 }
        eventTypes:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: '#/components/schemas/EventTypePattern' }
        enabled: { type: boolean }
        headers:
          allOf:
            - $ref: '#/components/schemas/EventHeaders'
          nullable: true
          description: Set to null to remove all custom delivery headers.

    EventSubscription:
      type: object
      required: [id, url, eventTypes, enabled, hasCustomSecret, headers, createdAt, updatedAt]
      properties:
        id: { type: string, pattern: '^sub_' }
        url: { type: string, format: uri }
        eventTypes:
          type: array
          items: { $ref: '#/components/schemas/EventTypePattern' }
        enabled: { type: boolean }
        hasCustomSecret: { type: boolean }
        headers:
          allOf:
            - $ref: '#/components/schemas/EventHeaders'
          nullable: true
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    EventSubscriptionCreated:
      allOf:
        - $ref: '#/components/schemas/EventSubscription'
        - type: object
          properties:
            secret:
              type: string
              x-sensitive: true
              description: Plaintext signing secret, present only when `generateSecret` was true and never returned again.

    EventSubscriptionResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: '#/components/schemas/EventSubscription' }

    EventSubscriptionCreatedResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: '#/components/schemas/EventSubscriptionCreated' }

    EventSubscriptionListResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data: { type: array, items: { $ref: '#/components/schemas/EventSubscription' } }

    EventSubscriptionSecretResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [id, secret]
          properties:
            id: { type: string, pattern: '^sub_' }
            secret:
              type: string
              x-sensitive: true
              description: Newly rotated plaintext signing secret. This value is returned exactly once.

    PublishEventRequest:
      type: object
      required: [topic, type]
      properties:
        topic: { type: string, minLength: 1, maxLength: 100, description: Public topic ID or name. }
        type:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '^[a-zA-Z0-9_-]+(\.[a-zA-Z0-9_-]+)*$'
          example: order.completed
        data: { type: object, additionalProperties: true, default: {} }
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 255
          description: Durable deduplication key scoped to the workspace and topic.
        runId: { type: string, maxLength: 80, description: 'Existing run in this API key environment for event-delivery spans.' }
        parentSpanId: { type: string, maxLength: 80, description: 'Optional parent span within runId.' }

    EventPublishResult:
      type: object
      required: [id, status]
      properties:
        id: { type: string, pattern: '^evt_' }
        status: { type: string, enum: [received, fanned_out, no_subscribers] }
        deduplicated:
          type: boolean
          description: True when a prior event with the same body idempotency key was returned.

    EventPublishResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: '#/components/schemas/EventPublishResult' }

    Event:
      type: object
      required: [id, topic, type, data, status, subscriptionCount, createdAt]
      properties:
        id: { type: string, pattern: '^evt_' }
        topic: { type: string }
        type: { type: string }
        data: { type: object, additionalProperties: true }
        status:
          type: string
          enum: [received, fanned_out, no_subscribers]
          description: |
            `received` means the fan-out has not finished: either it has not started, or a
            delivery could not be enqueued and the event is waiting to be retried. It becomes
            `fanned_out` once every matching subscription has a delivery — or, if some cannot
            be enqueued after repeated attempts, once the event is finished with the count it
            actually achieved. `subscriptionCount` is therefore what was delivered, which can
            be fewer than the subscriptions that matched.
        subscriptionCount:
          type: integer
          minimum: 0
          description: Deliveries enqueued for this event. Compare with your subscription count for that topic.
        createdAt: { type: string, format: date-time }

    EventDelivery:
      type: object
      required: [messageId, url, status, attempts, responseStatus, deliveredAt, failedAt]
      properties:
        messageId: { type: string, pattern: '^msg_' }
        url: { type: string, format: uri }
        status: { type: string, enum: [pending, scheduled, processing, delivered, failed, cancelled] }
        attempts: { type: integer, minimum: 0, nullable: true }
        responseStatus: { type: integer, minimum: 100, maximum: 599, nullable: true }
        deliveredAt: { type: string, format: date-time, nullable: true }
        failedAt: { type: string, format: date-time, nullable: true }

    EventWithDeliveries:
      allOf:
        - $ref: '#/components/schemas/Event'
        - type: object
          required: [deliveries]
          properties:
            deliveries: { type: array, items: { $ref: '#/components/schemas/EventDelivery' } }

    EventResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: '#/components/schemas/Event' }

    EventWithDeliveriesResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: '#/components/schemas/EventWithDeliveries' }

    EventListResponse:
      type: object
      required: [success, data, pagination]
      properties:
        success: { type: boolean, enum: [true] }
        data: { type: array, items: { $ref: '#/components/schemas/Event' } }
        pagination: { $ref: '#/components/schemas/OffsetPagination' }

    PutSecretRequest:
      type: object
      description: Give `value` (a value to store) or `external` (where to read it), not both.
      additionalProperties: false
      properties:
        value: { type: string, minLength: 1, maxLength: 8192, writeOnly: true }
        external: { $ref: '#/components/schemas/ExternalSecretReference' }
        description: { type: string, maxLength: 500 }
        allowedHosts:
          type: array
          nullable: true
          maxItems: 20
          items: { type: string, maxLength: 253 }
          description: >-
            Hosts this secret may be sent to. A leading dot matches subdomains
            (".stripe.com" admits "api.stripe.com"). Required when a stored value
            is created: a write that would leave it with no hosts is refused with 400.
            Omit it on a rotation to keep the hosts it has. A secret read from your own vault
            (`external`) must name at least one host when it is created; omitting
            it then answers 400. Omitting it on a rotation or a repoint leaves the
            existing value alone, so rotating a secret never widens where it may go.
        allowedPlacements:
          type: array
          nullable: true
          maxItems: 3
          items: { type: string, enum: [url, header, body] }
          description: >-
            Where in the request this secret may appear. Null or omitted means
            anywhere for a stored value, and `["header"]` for a secret read from
            your own vault. A credential in a header is the intended use; the same
            value in a URL is usually a mistake or an exfiltration.

    Secret:
      type: object
      description: Secret metadata. The encrypted value is never exposed by any API.
      required: [id, name, description, allowedHosts, allowedPlacements, kind, connection, integrationId, health, external, lastUsedAt, createdAt, updatedAt]
      properties:
        id: { type: string, example: sec_01JABCDEF }
        name: { type: string, pattern: '^[A-Z0-9_]+$' }
        description: { type: string, nullable: true }
        allowedHosts:
          type: array
          nullable: true
          items: { type: string }
          description: Hosts this secret may be sent to. Null only on a secret stored before hosts were required, which may be sent to any public host until its next write names them.
        allowedPlacements:
          type: array
          nullable: true
          items: { type: string, enum: [url, header, body] }
          description: Where in the request this secret may appear. Null means anywhere.
        kind:
          type: string
          enum: [static, connection, external]
          description: >-
            `static` holds a value you stored. `connection` is a connected account: its value is an
            access token fetched at dispatch, its hosts come from the integration, and it may only
            appear in a header. `external` (Enterprise) is read at dispatch from one of the
            environment's secret stores and is not stored by Anlyon. PUT cannot change a secret's kind.
        connection:
          type: object
          nullable: true
          description: >-
            For a signed-in account, which integration it is and whether it still works. `status`
            mirrors `health.status`, which is the one record of it for both kinds of connected
            account. Null for a static secret, including one connected with an API key.
          required: [integrationId, status]
          properties:
            integrationId: { type: string, example: hubspot }
            status:
              type: string
              enum: [active, needs_reauth]
              description: 'The same value as `health.status`. Reconnect the account to use it again.'
        health:
          type: object
          nullable: true
          description: >-
            Whether the connected account still works, whichever way it was connected. `active`, or
            `needs_reauth` with a `reason` once the provider refused the credential or the connector
            service could not refresh it. A dispatch that uses a `needs_reauth` account fails before
            anything is sent. Reconnect it with `POST /api/v2/connections/{secretName}/reconnect`.
            For an external secret, whether its store could last produce it: `active`, or
            `unreachable` with a `reason`. Null for a secret you stored directly, which Anlyon cannot
            check.
          required: [status, checkedAt, reason]
          properties:
            status: { type: string, enum: [active, needs_reauth, unreachable] }
            checkedAt:
              type: string
              format: date-time
              nullable: true
              description: When Anlyon last asked the provider whether the credential works. Null when it never has.
            reason:
              type: string
              nullable: true
              enum: [key_rejected, access_revoked, refresh_failed, store_unreachable, store_denied, reference_not_found, null]
              description: >-
                Set while `status` is `needs_reauth` or `unreachable`. `key_rejected`: the provider
                refused the stored key. `access_revoked`: the provider no longer honours the signed-in
                account's grant. `refresh_failed`: the connector service could not refresh its token.
                `store_unreachable`: the secret store did not answer. `store_denied`: the store refused
                Anlyon's credential for this path. `reference_not_found`: the store has no secret at
                that path, version or key.
        integrationId:
          type: string
          nullable: true
          example: github
          description: >-
            The integration this secret was connected for, by signing in or with an API key. Null
            for a secret you stored directly. A secret connected with an API key is `static` with
            this set.
        external:
          type: object
          nullable: true
          description: For an external secret, the store and where in it. Never a value. Null otherwise.
          required: [store, storeType, path, key, version]
          properties:
            store: { type: string, example: prod-vault }
            storeType: { type: string, enum: [aws_secrets_manager, hashicorp_vault] }
            path: { type: string, example: payments/stripe }
            key: { type: string, nullable: true, example: apiKey }
            version: { type: string, nullable: true }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ExternalSecretReference:
      type: object
      description: >-
        Enterprise. Where an external secret's value lives: a path in one of the environment's secret
        stores, optionally one key and one version.
      required: [store, path]
      additionalProperties: false
      properties:
        store: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$', description: The store's name. }
        path:
          type: string
          minLength: 1
          maxLength: 512
          description: >-
            AWS: the secret's name or ARN. Vault: the secret's path under the store's KV v2 mount,
            such as `payments/stripe`. Must sit under one of the store's `allowedPaths` when it has
            any.
        key:
          type: string
          nullable: true
          minLength: 1
          maxLength: 256
          description: >-
            A key of the secret. AWS: a key of the secret string read as JSON; omit it to use the whole
            string. Vault: a key of the secret's data, required.
        version:
          type: string
          nullable: true
          minLength: 1
          maxLength: 64
          pattern: '^[A-Za-z0-9_.:-]+$'
          description: >-
            AWS: a version id (a UUID) or a staging label such as `AWSPREVIOUS`. Vault: a version
            number. Omit it to read the current version at each dispatch.

    SecretStore:
      type: object
      description: A secret store's settings and health. Its credential is never exposed by any API.
      required: [id, name, type, description, config, credentialKind, allowedPaths, cacheTtlSeconds, health, createdAt, updatedAt]
      properties:
        id: { type: string, example: sst_01JABCDEF }
        name: { type: string, example: prod-vault }
        type: { type: string, enum: [aws_secrets_manager, hashicorp_vault] }
        description: { type: string, nullable: true }
        config:
          oneOf:
            - $ref: '#/components/schemas/AwsSecretStoreConfig'
            - $ref: '#/components/schemas/VaultSecretStoreConfig'
        credentialKind:
          type: string
          enum: [access_key, token, approle]
          description: Which kind of credential is stored. The credential itself is never returned.
        allowedPaths:
          type: array
          nullable: true
          items: { type: string }
          description: Path prefixes a secret may point at. Null means any path the credential can read.
        cacheTtlSeconds:
          type: integer
          minimum: 0
          maximum: 300
          description: >-
            How long a value read from the store is kept in the API process's memory, never on disk
            or in a shared cache. 0 reads the store at every dispatch.
        health:
          type: object
          nullable: true
          required: [status, checkedAt, reason]
          properties:
            status: { type: string, enum: [active, unreachable] }
            checkedAt: { type: string, format: date-time }
            reason: { type: string, nullable: true, enum: [store_unreachable, store_denied, reference_not_found, null] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AwsSecretStoreConfig:
      type: object
      required: [region, auth]
      additionalProperties: false
      properties:
        region: { type: string, pattern: '^[a-z]{2}(-[a-z]+)+-\d{1,2}$', example: eu-west-1 }
        auth:
          type: string
          enum: [access_key, assume_role]
          description: '`access_key` signs with the stored keys. `assume_role` uses them to assume `roleArn` first.'
        roleArn: { type: string, nullable: true, example: 'arn:aws:iam::123456789012:role/anlyon-secrets-reader' }
        externalId: { type: string, nullable: true, minLength: 2, maxLength: 1224 }

    VaultSecretStoreConfig:
      type: object
      required: [address, auth]
      additionalProperties: false
      properties:
        address: { type: string, format: uri, maxLength: 512, example: 'https://vault.example.com:8200', description: The Vault origin alone, https. }
        namespace: { type: string, nullable: true, description: Vault Enterprise namespace. }
        mount: { type: string, default: secret, description: The KV version 2 mount. }
        auth: { type: string, enum: [token, approle] }
        authMount: { type: string, nullable: true, description: The AppRole auth mount. Default `approle`. }

    AwsSecretStoreCredential:
      type: object
      required: [accessKeyId, secretAccessKey]
      additionalProperties: false
      properties:
        accessKeyId: { type: string, pattern: '^[A-Z0-9]{16,128}$', writeOnly: true, example: EXAMPLEACCESSKEYID00 }
        secretAccessKey: { type: string, minLength: 16, maxLength: 256, writeOnly: true }

    VaultSecretStoreCredential:
      oneOf:
        - type: object
          required: [token]
          additionalProperties: false
          properties:
            token: { type: string, minLength: 8, maxLength: 4096, writeOnly: true }
        - type: object
          required: [roleId, secretId]
          additionalProperties: false
          properties:
            roleId: { type: string, minLength: 1, maxLength: 256, writeOnly: true }
            secretId: { type: string, minLength: 1, maxLength: 4096, writeOnly: true }

    CreateSecretStoreRequest:
      oneOf:
        - type: object
          required: [name, type, config, credential]
          additionalProperties: false
          properties:
            name: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$' }
            type: { type: string, enum: [aws_secrets_manager] }
            description: { type: string, maxLength: 500 }
            config: { $ref: '#/components/schemas/AwsSecretStoreConfig' }
            credential: { $ref: '#/components/schemas/AwsSecretStoreCredential' }
            allowedPaths: { type: array, nullable: true, minItems: 1, maxItems: 20, items: { type: string, minLength: 1, maxLength: 512 } }
            cacheTtlSeconds: { type: integer, minimum: 0, maximum: 300, default: 30 }
        - type: object
          required: [name, type, config, credential]
          additionalProperties: false
          properties:
            name: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$' }
            type: { type: string, enum: [hashicorp_vault] }
            description: { type: string, maxLength: 500 }
            config: { $ref: '#/components/schemas/VaultSecretStoreConfig' }
            credential: { $ref: '#/components/schemas/VaultSecretStoreCredential' }
            allowedPaths: { type: array, nullable: true, minItems: 1, maxItems: 20, items: { type: string, minLength: 1, maxLength: 512 } }
            cacheTtlSeconds: { type: integer, minimum: 0, maximum: 300, default: 30 }
      discriminator:
        propertyName: type

    UpdateSecretStoreRequest:
      type: object
      additionalProperties: false
      properties:
        description: { type: string, nullable: true, maxLength: 500 }
        config: { type: object, additionalProperties: true, description: Fields that replace the stored settings they name. }
        credential: { type: object, additionalProperties: true, writeOnly: true, description: A whole new credential for the store's type. }
        allowedPaths: { type: array, nullable: true, minItems: 1, maxItems: 20, items: { type: string, minLength: 1, maxLength: 512 } }
        cacheTtlSeconds: { type: integer, minimum: 0, maximum: 300 }

    ExternalSecretWarning:
      type: object
      description: >-
        The secret was saved, and its store could not produce the value just now. Calls that use it
        fail before anything is sent until the store can.
      required: [code, reason, message]
      properties:
        code: { type: string, enum: [EXTERNAL_SECRET_UNREADABLE] }
        reason: { type: string, enum: [store_unreachable, store_denied, reference_not_found] }
        message: { type: string }

    PutSecretResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: '#/components/schemas/Secret' }
        warning: { $ref: '#/components/schemas/ExternalSecretWarning' }

    SecretStoreSettings:
      type: object
      required: [allowPrivateNetwork, available, effective, updatedAt]
      properties:
        allowPrivateNetwork: { type: boolean, description: What the workspace admin chose. }
        available: { type: boolean, description: "Whether a workspace admin may turn the setting on here. False on Anlyon's hosted service, and on a self-hosted install whose instance admins set network.private_destinations to off." }
        effective: { type: boolean, description: Whether store requests may reach private addresses now. }
        updatedAt: { type: string, format: date-time, nullable: true }

    SecretStoreSettingsResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: '#/components/schemas/SecretStoreSettings' }

    SecretStoreResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: '#/components/schemas/SecretStore' }

    SecretStoreListResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data: { type: array, items: { $ref: '#/components/schemas/SecretStore' } }

    SecretResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: '#/components/schemas/Secret' }

    SecretListResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data: { type: array, items: { $ref: '#/components/schemas/Secret' } }

    ConnectionIntegration:
      type: object
      description: An integration an account can be connected for.
      required: [id, name, auth, hosts, hostsFromAccount, scopes, operationsPack, workflowPacks]
      properties:
        ownOAuthAppRequired:
          type: boolean
          enum: [true]
          description: >-
            Present on a sign-in integration whose OAuth app this deployment does not have: it is
            connected through the environment's own app (`PUT
            /api/v2/environments/{environmentId}/oauth-apps/{integration}`), and until that is set
            a connect session or link answers `400 OWN_OAUTH_APP_REQUIRED`. Absent otherwise.
        id: { type: string, example: hubspot, description: Stable id used in sessions and pack manifests. }
        name: { type: string, example: HubSpot }
        auth:
          type: object
          description: >-
            How an account is connected. `oauth`: start a connect session and sign in at the
            provider. `api_key`: create a key in the provider's own settings, following
            `instructions`, and send it to `POST /api/v2/connections/keys`. An integration that
            signs in and also takes a key (GitHub, Notion) is `oauth` with `apiKey` set where signing
            in works here, and `api_key` where it does not.
          required: [kind]
          properties:
            kind: { type: string, enum: [oauth, api_key] }
            apiKey:
              type: object
              description: >-
                For `oauth`: the key that may be sent to `POST /api/v2/connections/keys` instead of
                signing in. Absent for an integration that only signs in.
              required: [instructions, instructionsUrl]
              properties:
                instructions: { type: string, description: 'Where in the provider''s settings the key is created, and with which permissions.' }
                instructionsUrl: { type: string, format: uri, description: 'The provider''s own page for creating the key.' }
                fields:
                  type: array
                  description: 'As `fields` below, for a key made of several values.'
                  items:
                    type: object
                    required: [name, label, secret, kind]
                    properties:
                      name: { type: string }
                      label: { type: string }
                      secret: { type: boolean }
                      kind: { type: string, enum: [account, credential] }
                      hint: { type: string }
            instructions: { type: string, description: 'For `api_key`: where in the provider''s settings the key is created, and with which permissions.' }
            instructionsUrl: { type: string, format: uri, description: 'For `api_key`: the provider''s own page for creating the key.' }
            fields:
              type: array
              description: >-
                For `api_key`, when the key is several values (an email and an API token) or the
                host is the account's own (a subdomain): what to ask for, in order. Send them as
                `fields` instead of `apiKey`. Every value is stored encrypted and never returned.
              items:
                type: object
                required: [name, label, secret, kind]
                properties:
                  name: { type: string, example: apiToken }
                  label: { type: string, example: API token }
                  secret: { type: boolean, description: Mask it in a form. }
                  kind: { type: string, enum: [account, credential], description: '`account` names the account''s own host (see `hostTemplate`); `credential` is part of the key.' }
                  hint: { type: string }
        hosts:
          type: array
          nullable: true
          items: { type: string }
          description: The API hosts the token may be sent to. Null when they come from the connected account itself (see hostsFromAccount).
        hostsFromAccount: { type: boolean, description: 'True when the API host is the account''s own (a Salesforce instance, a Zendesk subdomain) and is fixed at connect time.' }
        hostTemplate: { type: string, example: '{subdomain}.zendesk.com', description: 'For an API-key integration whose host is the account''s own: the one host shape it may be. The account field fills it; anything outside it is refused.' }
        scopes: { type: array, items: { type: string }, description: 'The scopes requested at the provider''s consent page. Empty for an `api_key` integration, whose access is whatever the key was given.' }
        operationsPack: { type: string, nullable: true, example: anlyon/hubspot, description: 'The pack whose actions are this integration''s operations: what an agent may be allowed to do once the account is connected.' }
        workflowPacks: { type: array, items: { type: string }, description: Workflow packs that use this integration together with others. }

    ConnectionsOverviewResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/ConnectionIntegration'
              - type: object
                required: [connectable, signIn, workspace, endUsers]
                properties:
                  connectable: { type: boolean, description: 'A new account, the workspace''s or an end user''s, can be connected to it here.' }
                  signIn:
                    type: [object, 'null']
                    description: Null for an API-key integration.
                    required: [app, redirectUri]
                    properties:
                      app:
                        type: string
                        enum: [own, anlyon, own_required, unavailable]
                        description: >-
                          Whose OAuth app signs people in here. `own`: the environment's own.
                          `anlyon`: Anlyon's, with no setup. `own_required`: Anlyon offers no app here, or this
                          deployment has none set; add the environment's
                          own app first. `unavailable`: this deployment cannot sign in.
                      redirectUri: { type: string, format: uri, description: The redirect URI to register in your own OAuth app. }
                  workspace:
                    type: object
                    required: [connected, needsAttention]
                    properties:
                      connected: { type: integer }
                      needsAttention: { type: integer }
                  endUsers:
                    type: object
                    required: [connected, needsReconnect]
                    properties:
                      connected: { type: integer }
                      needsReconnect: { type: integer }

    IntegrationRoute:
      type: object
      description: One way to act in an app.
      required: [kind, why, next]
      properties:
        kind:
          type: string
          enum: [integration, mcp, openapi, mcp_address, custom_action]
          description: >-
            `integration`: connect an account for a catalogue integration. `mcp`: add the vendor's own
            MCP server, whose publisher is verified as the vendor.
            `openapi`: import an OpenAPI spec. `mcp_address`: add a server by an address you bring.
            `custom_action`: declare an action on the app's HTTP API.
        why: { type: string, description: One sentence on why this route. }
        next: { $ref: '#/components/schemas/ErrorFix' }
        integration:
          type: object
          required: [id, connect]
          properties:
            id: { type: string, example: stripe }
            connect: { type: string, enum: [sign_in, api_key] }
        mcp:
          type: object
          required: [registryName, url, host, publisher, report]
          properties:
            registryName: { type: string, example: com.example/mcp }
            url: { type: string, format: uri, example: 'https://mcp.example.com/mcp' }
            host: { type: string, example: mcp.example.com }
            publisher:
              type: object
              required: [verifiedBy, namespace]
              properties:
                verifiedBy: { type: string, enum: [domain, github], description: How the MCP Registry verified the namespace. }
                namespace: { type: string, example: com.example }
            report: { type: string, format: uri, description: What Anlyon Radar reports about the server's tools. }

    IntegrationRouteResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [query, name, route, alternatives, tellUs]
          properties:
            query: { type: string, description: The name as it was asked for. Untrusted, so show it as text. }
            name: { type: string, description: The vendor's own spelling when it is known, otherwise the query. }
            route: { $ref: '#/components/schemas/IntegrationRoute' }
            alternatives: { type: array, items: { $ref: '#/components/schemas/IntegrationRoute' }, description: 'The other routes, best first.' }
            tellUs: { type: string, description: Where to ask for an integration. }

    ConnectionIntegrationListResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data: { type: array, items: { $ref: '#/components/schemas/ConnectionIntegration' } }

    CreateConnectSessionRequest:
      type: object
      required: [integrationId, secretName]
      additionalProperties: false
      properties:
        integrationId: { type: string, maxLength: 64, pattern: '^[a-z0-9-]+$', example: hubspot }
        secretName: { type: string, minLength: 1, maxLength: 100, pattern: '^[A-Z0-9_]+$', example: HUBSPOT, description: 'The secret the connected account becomes; actions reference it as {{secret:NAME}}.' }
        description: { type: string, maxLength: 500 }

    ConnectWithApiKeyRequest:
      type: object
      required: [integrationId, secretName]
      additionalProperties: false
      description: '`apiKey` for an integration connected with one key; `fields` for one whose `auth.fields` is set. One or the other.'
      properties:
        integrationId: { type: string, maxLength: 64, pattern: '^[a-z0-9-]+$', example: github }
        secretName: { type: string, minLength: 1, maxLength: 100, pattern: '^[A-Z0-9_]+$', example: GITHUB, description: 'The secret the key is stored as; actions reference it as {{secret:NAME}}.' }
        apiKey: { type: string, minLength: 8, maxLength: 4096, pattern: '^[\x21-\x7e]+$', writeOnly: true, example: the-key-you-created-at-the-provider, description: The key alone, with no spaces or line breaks. Checked with the provider, stored encrypted, and never returned. }
        fields: { $ref: '#/components/schemas/ConnectionFieldValues' }
        description: { type: string, maxLength: 500 }

    ConnectionFieldValues:
      type: object
      writeOnly: true
      minProperties: 1
      maxProperties: 8
      description: >-
        For an integration whose `auth.fields` is set: each field by name, e.g.
        `{ "site": "acme", "email": "ana@acme.com", "apiToken": "..." }`. Each value is checked
        against the integration's own pattern. The account field becomes the one host the key is
        bound to (`acme.atlassian.net`); the rest are stored encrypted together as one credential and
        never returned. Sent composed in the integration's header (HTTP Basic, or the provider's own
        header form).
      additionalProperties: { type: string, minLength: 1, maxLength: 4096, pattern: '^[\x21-\x7e]+$' }

    ConnectSession:
      type: object
      required: [sessionId, sessionToken, expiresAt, connectUrl, integration]
      properties:
        sessionId: { type: string, example: csn_4f9a1c2b7d8e0f3a }
        sessionToken: { type: string, description: 'The consent token in `connectUrl`. Whoever holds it can sign in for this session until it expires, so treat it like the link.' }
        expiresAt: { type: string, format: date-time }
        connectUrl: { type: string, format: uri, example: 'https://api.anlyon.com/api/v2/connection-consent/start?token=cst_9Qm2', description: 'Open in a browser to sign in at the provider. Then poll `complete`.' }
        integration: { $ref: '#/components/schemas/ConnectionIntegration' }

    ConnectSessionResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: '#/components/schemas/ConnectSession' }

    CompleteConnectSessionRequest:
      type: object
      additionalProperties: false
      properties:
        reference: { type: string, maxLength: 200, pattern: '^[A-Za-z0-9._:-]+$', deprecated: true, x-anlyon-replacement: 'an empty request body', x-anlyon-removal-date: '2027-04-18', description: 'Deprecated: send an empty body. Anlyon records the connection itself when the provider redirects back, and refuses a reference that differs from it.' }

    ConnectSessionCompletion:
      type: object
      required: [status, secret]
      properties:
        status: { type: string, enum: [pending, completed] }
        secret:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/Secret' }]
          description: The connected-account secret once completed; null while pending.

    ConnectSessionCompletionResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: '#/components/schemas/ConnectSessionCompletion' }

    ReconnectConnectionRequest:
      type: object
      additionalProperties: false
      properties:
        apiKey: { type: string, minLength: 8, maxLength: 4096, pattern: '^[\x21-\x7e]+$', writeOnly: true, example: the-new-key-you-created-at-the-provider, description: 'For an API-key integration: the new key alone, with no spaces or line breaks. Checked with the provider, stored encrypted, and never returned. Omit for a sign-in integration.' }
        fields:
          allOf: [{ $ref: '#/components/schemas/ConnectionFieldValues' }]
          description: 'For an integration whose `auth.fields` is set: every field again. The account field must name the account already connected; another account is a new connection.'

    ConnectionReconnect:
      type: object
      description: >-
        How the reconnect went. `completed`: a new key was accepted and stored; `secret` is the
        account as it now stands. `pending`: a consent session was started for a signed-in account;
        finish it with `POST /api/v2/connections/sessions/{sessionId}/complete`.
      required: [status, secret, session]
      properties:
        status: { type: string, enum: [completed, pending] }
        secret:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/Secret' }]
          description: The reconnected account once completed; null while pending.
        session:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/ConnectSession' }]
          description: The consent session to finish, for a signed-in account; null once completed.

    ConnectionReconnectResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: '#/components/schemas/ConnectionReconnect' }

    ActionAdapter:
      type: object
      description: >-
        Makes the action a governed effect (see the Governed effects guide). The request is built by
        the adapter from `config`; the credential is a vault secret referenced by name. Available
        types: `stripe.refund` (config `account`, `mode: test`, `currency`),
        `github.file_update` (config `owner`, `repo`, `branch`, optional `pathPrefix`,
        `allowDefaultBranch`) and `resend.email_send` (config `domain`, optional `fromAddresses`).
      required: [type, config, credentialSecret]
      additionalProperties: false
      properties:
        type: { type: string, enum: [stripe.refund, github.file_update, resend.email_send] }
        config: { type: object, additionalProperties: true, example: { account: acct_123, mode: test, currency: usd } }
        credentialSecret: { type: string, pattern: '^[A-Z0-9_]+$', example: STRIPE_TEST_KEY }

    ImpactQuantity:
      type: object
      required: [dimension, amount, bound]
      properties:
        dimension: { type: string, pattern: '^[a-z][a-z0-9_]{0,31}$', example: money, description: '`money`, `resource_mutations`, or a workspace-declared unit such as `emails`.' }
        currency: { type: string, pattern: '^[a-z]{3}$', example: usd, description: Present for money. }
        amount: { type: integer, minimum: 0, description: Integer minor units for money. A count for every other dimension. }
        bound: { type: string, enum: [exact, upper_bound] }

    ActionImpact:
      type: object
      description: >-
        How much one invocation changes, declared on a template action. Declaring it makes the
        action governed: the quantity is reserved against every applicable impact limit before
        dispatch. `amount` is an expression over the input, evaluated at admission after schema
        validation. It may be an integer, `input.<path>`, or `count(input.<path>)`, followed by one
        optional `* <integer>`, and it must produce a non-negative integer. An amount that reads an
        optional input the caller left out yields no quantity. The effect is then unbounded for that
        dimension: an applicable limit refuses it with `impact_unbounded`, and with no applicable
        limit it runs. Anlyon evaluates the expression as written. It does not check that the
        expression describes what the provider will do.
      required: [dimension, amount, bound]
      additionalProperties: false
      properties:
        dimension: { type: string, pattern: '^[a-z][a-z0-9_]{0,31}$', example: emails, description: '`money`, `resource_mutations`, or a workspace-declared unit such as `emails`, `messages` or `rows`.' }
        unit: { type: string, minLength: 1, maxLength: 32, example: emails, description: 'The currency for `money` (lowercase ISO 4217, required). For every other dimension the unit is the dimension name and may be left out.' }
        amount: { type: string, minLength: 1, maxLength: 200, example: count(input.to) }
        bound: { type: string, enum: [exact, upper_bound] }

    ActionVerify:
      type: object
      description: >-
        A read-back that confirms a write, declared on a template action. After the provider
        accepts the write, Anlyon issues this `GET` through the same pinned transport with the
        action's own headers and compares the answer. A match grades the effect `confirmed`.
        Without one a 2xx grades `acknowledged`. The URL must be on the action's own host. It may
        reference `{{input.field}}`, `{{response.field}}` (a value from the provider's response to
        the write) and `{{secret:NAME}}`. A rule that needs `response` cannot run after a lost
        response, so that effect stays `unknown` until an operator resolves it.
      required: [url, status]
      additionalProperties: false
      properties:
        url: { type: string, minLength: 1, maxLength: 2048, example: 'https://api.example.com/v1/messages/{{response.id}}' }
        status: { type: integer, minimum: 100, maximum: 599, example: 200, description: The status the read-back must answer with. }
        match:
          type: array
          maxItems: 10
          description: JSON path equality checks on the read-back body. Every one must hold.
          items:
            type: object
            additionalProperties: false
            required: [path, equals]
            properties:
              path: { type: string, minLength: 1, maxLength: 200, example: status, description: 'A dotted path into the read-back body. A numeric segment indexes an array; a `*` segment stands for any item of one (`labels.*.name`).' }
              equals:
                nullable: true
                example: sent
                description: A string, number, boolean or null. A string may be exactly one `{{input.field}}` or `{{response.field}}`.
              absent:
                type: boolean
                description: 'True when the check holds only if no value at the path equals `equals`: how a removal is read back. Left out, the check holds when one does.'
        graphql:
          type: object
          additionalProperties: false
          required: [query]
          description: >-
            A GraphQL read-back: Anlyon POSTs `{ query, variables }` to `url` instead of a `GET`. The
            query is fixed text: no placeholder, and no `mutation` or `subscription` anywhere in it,
            so a read-back cannot write. Only the variables come from the call.
          properties:
            query: { type: string, minLength: 1, maxLength: 10000, example: 'query($id: String!) { issue(id: $id) { title } }' }
            variables:
              type: object
              maxProperties: 20
              additionalProperties: { nullable: true }
              description: Each a string, number, boolean or null; a string may be exactly one `{{input.field}}` or `{{response.field}}`.

    PreviewBlock:
      type: object
      description: >-
        One typed presentation block. `fields` holds label/value pairs, `text_diff` holds before and
        after text for one path, `impact` holds quantities, `limitations` holds labelled guarantees
        (`guarantee`, `freshness`, `unsupported`, `irreversible`). Never provider HTML.
      required: [type, title]
      properties:
        type: { type: string, enum: [fields, text_diff, impact, limitations] }
        title: { type: string }
        fields: { type: array, items: { type: object, required: [label, value], properties: { label: { type: string }, value: { type: string } } } }
        path: { type: string }
        before: { type: string }
        after: { type: string }
        truncated: { type: boolean }
        quantities: { type: array, items: { $ref: '#/components/schemas/ImpactQuantity' } }
        items:
          type: array
          items:
            type: object
            required: [kind, text]
            properties:
              kind: { type: string, enum: [guarantee, freshness, unsupported, irreversible] }
              text: { type: string }

    ActionPreview:
      type: object
      required: [id, action, adapter, environment, target, request, impact, blocks, preconditions, capabilities, allowances, evidenceObservedAt, expiresAt, expired, requestDigest, bindingDigest, supersedes, effectId, endUserId, createdAt]
      properties:
        id: { type: string, example: prv_01JABCDEF }
        action:
          type: object
          required: [id, name, versionId]
          properties:
            id: { type: string }
            name: { type: string }
            versionId: { type: string }
        adapter: { type: object, required: [type, version], properties: { type: { type: string }, version: { type: string } } }
        environment: { type: object, required: [id, name, kind], properties: { id: { type: string }, name: { type: string }, kind: { type: string } } }
        target: { type: object, additionalProperties: true }
        request: { type: object, additionalProperties: true, description: The exact normalized request that will be dispatched. }
        impact: { type: array, items: { $ref: '#/components/schemas/ImpactQuantity' } }
        blocks: { type: array, items: { $ref: '#/components/schemas/PreviewBlock' } }
        preconditions: { type: object, additionalProperties: true, description: Material preconditions; part of the binding. }
        capabilities: { type: object, additionalProperties: true, description: The adapter's declared guarantees. }
        allowances: { type: array, items: { type: object, additionalProperties: true }, description: Applicable impact limits at preview time. Dispatch rechecks. }
        evidenceObservedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        expired: { type: boolean }
        requestDigest: { type: string }
        bindingDigest: { type: string, description: 'SHA-256 over the canonical request, target, versions, preconditions, scope and expiry. What an approval agrees to.' }
        supersedes: { type: string, nullable: true }
        effectId: { type: string, nullable: true, description: 'The effect executing this preview, once one is admitted.' }
        endUserId: { type: string, nullable: true, description: 'The end user whose account read the provider. An invoke with this preview must name the same end user, and only a call for that end user (or one naming none) can read it.' }
        createdAt: { type: string, format: date-time }

    Effect:
      type: object
      required: [id, invocationId, operationKey, environmentId, action, adapter, stage, outcome, partialEffect, grade, verification, providerReference, target, impact, previewId, approvalId, bindingDigest, dependsOn, compensates, rejectionReason, unresolvedExposure, reconciliation, endUserId, createdAt, firstDispatchedAt, outcomeAt, updatedAt]
      properties:
        id: { type: string, example: eff_01JABCDEF }
        endUserId: { type: string, nullable: true, description: 'The end user whose account the effect is sent with (`Anlyon-End-User`), or null for the workspace''s own accounts. `erased~<hash>` once that end user is erased.' }
        invocationId: { type: string }
        operationKey: { type: string }
        environmentId: { type: string, format: uuid }
        action: { type: object, required: [name, versionId], properties: { name: { type: string }, versionId: { type: string } } }
        adapter: { type: object, required: [type, version], properties: { type: { type: string }, version: { type: string } } }
        stage: { type: string, enum: [awaiting_approval, ready, dispatching, reconciling, settled, rejected] }
        outcome: { type: string, enum: [not_dispatched, pending, succeeded, failed, unknown] }
        partialEffect: { type: string, enum: [none, possible, confirmed], description: A failure is not proof of zero impact. }
        grade:
          type: string
          enum: [confirmed, acknowledged, unknown, failed, refused, denied, pending]
          description: >-
            The receipt grade, derived by the database from the stage, outcome, outcome source and
            rejection reason. `confirmed`: the outcome is `succeeded` and it was read from the
            provider's own record of the operation, or a declared read-back matched.
            `acknowledged`: the provider accepted the request with a 2xx and no read-back has
            matched. An operator's manual `succeeded` also grades here and keeps
            `verification: manual`. `unknown`: no usable response, so reconciliation owns the effect
            and its allowance stays held. `failed`: the provider rejected the request, or the
            request provably never left Anlyon. `refused`: Anlyon refused at dispatch, for example
            on a digest mismatch, an exhausted or unbounded limit, an expired preview or a changed
            action version. `denied`: the approval was denied. `pending`: no receipt yet.
        verification: { type: string, enum: [provider, manual, unverified, not_dispatched] }
        providerReference: { type: string, nullable: true }
        target: { type: object, additionalProperties: true }
        impact: { type: array, items: { $ref: '#/components/schemas/ImpactQuantity' } }
        previewId: { type: string, nullable: true }
        approvalId: { type: string, nullable: true }
        bindingDigest: { type: string, nullable: true }
        dependsOn: { type: array, items: { type: object, required: [effectId, outcome], properties: { effectId: { type: string }, outcome: { type: string } } } }
        compensates: { type: string, nullable: true }
        rejectionReason: { type: string, nullable: true }
        unresolvedExposure: { type: boolean }
        reconciliation:
          type: object
          required: [attempts, nextAt, exhausted]
          properties:
            attempts: { type: integer, minimum: 0 }
            nextAt: { type: string, format: date-time, nullable: true }
            exhausted: { type: boolean }
        createdAt: { type: string, format: date-time }
        firstDispatchedAt: { type: string, format: date-time, nullable: true }
        outcomeAt: { type: string, format: date-time, nullable: true }
        updatedAt: { type: string, format: date-time }

    EffectDetail:
      allOf:
        - $ref: '#/components/schemas/Effect'
        - type: object
          required: [request, capabilities, attempts, evidence, reservations, preview]
          properties:
            request: { type: object, additionalProperties: true }
            capabilities: { type: object, additionalProperties: true }
            attempts:
              type: array
              items:
                type: object
                required: [number, kind, status, observedOutcome, error, startedAt, finishedAt]
                properties:
                  number: { type: integer }
                  kind: { type: string, enum: [dispatch, replay, reconcile] }
                  status: { type: string, enum: [started, completed, abandoned] }
                  observedOutcome: { type: string, nullable: true }
                  error: { type: string, nullable: true }
                  startedAt: { type: string, format: date-time }
                  finishedAt: { type: string, format: date-time, nullable: true }
            evidence:
              type: array
              items:
                type: object
                required: [id, source, observedAt, impliedOutcome, providerIds, summary, details, actor, recordedAt]
                properties:
                  id: { type: string }
                  source: { type: string, enum: [preview, provider_response, provider_lookup, system, operator_note, manual_resolution] }
                  observedAt: { type: string, format: date-time }
                  impliedOutcome: { type: string, nullable: true }
                  providerIds: { type: object, additionalProperties: { type: string } }
                  summary: { type: string }
                  details: { type: object, additionalProperties: true }
                  actor: { type: object, required: [type, id], properties: { type: { type: string }, id: { type: string, nullable: true } } }
                  recordedAt: { type: string, format: date-time }
            reservations:
              type: array
              items:
                type: object
                required: [limitId, name, dimension, currency, period, amount, state, exposure, settled, released, createdAt, finishedAt]
                properties:
                  limitId: { type: string }
                  name: { type: string }
                  dimension: { type: string, example: money }
                  currency: { type: string, nullable: true }
                  period: { type: string, description: The accounting period this reservation belongs to for its whole life. }
                  amount: { type: integer }
                  state: { type: string, enum: [reserved, settled, released] }
                  exposure: { type: string, nullable: true, enum: [dispatching, pending, unknown, partial, null] }
                  settled: { type: integer }
                  released: { type: integer }
                  createdAt: { type: string, format: date-time }
                  finishedAt: { type: string, format: date-time, nullable: true }
            preview:
              allOf: [{ $ref: '#/components/schemas/ActionPreview' }]
              nullable: true

    ResolveEffectRequest:
      type: object
      additionalProperties: false
      required: [outcome, reason]
      properties:
        outcome: { type: string, enum: [succeeded, failed] }
        partialEffect: { type: string, enum: [none, possible, confirmed] }
        actualImpact: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/ImpactQuantity' } }
        reason: { type: string, minLength: 10, maxLength: 2000, description: What you checked and why. }
        externalReference: { type: string, nullable: true, minLength: 1, maxLength: 200 }

    CreatePreviewRequest:
      type: object
      additionalProperties: false
      properties:
        input: { type: object, additionalProperties: true }
        ttlSeconds: { type: integer, minimum: 60, maximum: 604800, default: 3600 }
        runId: { type: string, maxLength: 80, description: Resolve the action version this run's agent pins. }

    ImpactLimit:
      type: object
      required: [id, name, dimension, currency, unit, scope, period, limit, currentPeriod, consumed, reserved, unknownExposure, available, archived, createdAt, updatedAt]
      properties:
        id: { type: string, example: lim_01JABCDEF }
        name: { type: string }
        dimension: { type: string, pattern: '^[a-z][a-z0-9_]{0,31}$', example: money, description: '`money`, `resource_mutations`, or a workspace-declared unit such as `emails`.' }
        currency: { type: string, nullable: true }
        unit: { type: string, example: usd, description: 'What the amounts count. The currency for money, the dimension name for every other dimension.' }
        scope:
          type: object
          required: [environmentId, actionName, resourcePrefix, kind]
          properties:
            environmentId: { type: string, format: uuid }
            actionName: { type: string, nullable: true }
            resourcePrefix: { type: string, nullable: true }
            kind:
              type: string
              enum: [environment, end_user]
              description: '`environment`: one allowance shared by every call. `end_user`: each end user has the whole amount; the figures are then those of the end user named by `?endUserId=`, or of calls with no end user.'
        period: { type: string, enum: [day, month, total] }
        limit: { type: integer, minimum: 0 }
        currentPeriod: { type: string, example: 'month:2026-09' }
        consumed: { type: integer, minimum: 0 }
        reserved: { type: integer, minimum: 0 }
        unknownExposure: { type: integer, minimum: 0 }
        available: { type: integer, minimum: 0 }
        archived: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateImpactLimitRequest:
      type: object
      additionalProperties: false
      required: [name, dimension, period, amount]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        dimension: { type: string, pattern: '^[a-z][a-z0-9_]{0,31}$', example: money, description: '`money`, `resource_mutations`, or a workspace-declared unit such as `emails`. A declared unit caps the actions that declare an impact in that unit.' }
        currency: { type: string, pattern: '^[a-z]{3}$', example: usd, description: Required for money. }
        unit: { type: string, pattern: '^[a-z][a-z0-9_]{0,31}$', example: usd, description: 'Optional. The currency for money, the dimension name for every other dimension. It is implied by `dimension` and `currency`, and refused when it disagrees with them.' }
        actionName: { type: string, nullable: true, minLength: 1, maxLength: 100 }
        resourcePrefix: { type: string, nullable: true, minLength: 1, maxLength: 500, example: 'github:acme/fixtures@' }
        scope: { type: string, enum: [environment, end_user], default: environment, description: '`end_user`: each end user has the whole amount, counted on their own periods ("each user may send 20 emails a day"). A call with no end user counts on the shared allowance. Fixed once created.' }
        period: { type: string, enum: [day, month, total] }
        amount: { type: integer, minimum: 0 }

    UpdateImpactLimitRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        amount: { type: integer, minimum: 0 }

    EffectListResponse:
      type: object
      required: [success, data, pagination]
      properties:
        success: { type: boolean, enum: [true] }
        data: { type: array, items: { $ref: '#/components/schemas/Effect' } }
        pagination: { $ref: '#/components/schemas/OffsetPagination' }

    EffectDetailResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: '#/components/schemas/EffectDetail' }

    PreviewResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: '#/components/schemas/ActionPreview' }

    ImpactLimitResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: '#/components/schemas/ImpactLimit' }

    ImpactLimitListResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data: { type: array, items: { $ref: '#/components/schemas/ImpactLimit' } }

    CreateActionRequest:
      type: object
      description: >-
        A template action needs `urlTemplate`. An adapter action needs `adapter` instead, and its
        request, method and input schema come from the adapter. A template action that carries
        `impact`, `verify` or `governed: true` is a governed action: every invocation creates an
        effect with a bound preview, a limit reservation and a receipt grade. Its host must be
        fixed by `urlTemplate` and it must use https. An adapter action is already governed and
        accepts none of the three.
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100, pattern: '^[a-zA-Z0-9_-]+$' }
        description: { type: string, maxLength: 1000 }
        method: { type: string, enum: [GET, POST, PUT, PATCH, DELETE], default: POST }
        urlTemplate: { type: string, minLength: 1, maxLength: 2048, example: 'https://api.example.com/users/{{input.userId}}' }
        headers:
          type: object
          additionalProperties: { type: string, maxLength: 4096 }
          example: { Authorization: 'Bearer {{secret:EXAMPLE_TOKEN}}' }
        bodyTemplate: { type: object, additionalProperties: true }
        inputSchema: { type: object, additionalProperties: true }
        requiresApproval: { type: boolean, default: false }
        enabled: { type: boolean, default: true }
        adapter: { $ref: '#/components/schemas/ActionAdapter' }
        impact: { $ref: '#/components/schemas/ActionImpact' }
        verify: { $ref: '#/components/schemas/ActionVerify' }
        governed: { type: boolean, description: 'Set `true` to govern a template action that declares neither `impact` nor `verify`. Its 2xx then grades `acknowledged`.' }

    UpdateActionRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100, pattern: '^[a-zA-Z0-9_-]+$' }
        description: { type: string, maxLength: 1000 }
        method: { type: string, enum: [GET, POST, PUT, PATCH, DELETE] }
        urlTemplate: { type: string, minLength: 1, maxLength: 2048 }
        headers: { type: object, additionalProperties: { type: string, maxLength: 4096 } }
        bodyTemplate: { type: object, additionalProperties: true }
        inputSchema: { type: object, additionalProperties: true }
        requiresApproval: { type: boolean }
        enabled: { type: boolean }
        adapter:
          allOf: [{ $ref: '#/components/schemas/ActionAdapter' }]
          description: Retarget an adapter action (same type). Needs `actions:govern`.
        impact:
          allOf: [{ $ref: '#/components/schemas/ActionImpact' }]
          nullable: true
          description: Declare or replace the impact. `null` removes it. Omit it to keep what the action declares. Changing what a governed action declares needs `actions:govern`.
        verify:
          allOf: [{ $ref: '#/components/schemas/ActionVerify' }]
          nullable: true
          description: Declare or replace the read-back. `null` removes it. Omit it to keep what the action declares. Changing what a governed action declares needs `actions:govern`.
        governed: { type: boolean, description: '`false` removes every declaration and returns the action to the template executor. Needs `actions:govern`.' }

    InvokeActionRequest:
      type: object
      additionalProperties: false
      properties:
        input: { type: object, additionalProperties: true }
        runId: { type: string, maxLength: 80, description: 'Existing run in this API key environment to receive the automatic action_call span.' }
        parentSpanId: { type: string, maxLength: 80, description: 'Optional parent span within runId.' }
        retryOf: { type: string, maxLength: 100, pattern: '^inv_[A-Za-z0-9_-]+$', description: 'A failed invocation of the same action that this call deliberately retries. Needs its own Idempotency-Key. Refused while the original is unknown (resolve it first) or succeeded, and once it has already been retried.' }
        operationKey: { type: string, pattern: '^[A-Za-z0-9._:-]{1,200}$', description: 'Governed actions only (an adapter or a declaration). Stable operation identity: the same key with the same request returns the existing effect. The same key with a different request is a 409. Defaults to the Idempotency-Key. Different keys do not make two requests different business operations.' }
        previewId: { type: string, pattern: '^prv_[A-Za-z0-9_-]{1,64}$', description: 'Governed actions only. A reviewed preview this invocation must match exactly (409 PREVIEW_MISMATCH, PREVIEW_EXPIRED or PREVIEW_ALREADY_USED otherwise).' }
        dependsOn:
          type: array
          maxItems: 10
          description: Governed actions only. Effects that must already have the stated outcome. Pending and unknown never satisfy a dependency (409 DEPENDENCY_UNRESOLVED).
          items:
            type: object
            additionalProperties: false
            required: [effect, outcome]
            properties:
              effect: { type: string, pattern: '^eff_[A-Za-z0-9_-]{1,64}$' }
              outcome: { type: string, enum: [succeeded, failed] }
        compensates: { type: string, pattern: '^eff_[A-Za-z0-9_-]{1,64}$', description: Governed actions only. The effect this one compensates. A compensation is its own governed effect. }

    McpToolSnapshot:
      type: object
      description: One tool as the server last listed it. `definition` is the server's text, untrusted.
      required: [name, hash, definition, suggestedClass, reasons, schemaCheck, schemaCheckReason]
      properties:
        name: { type: string }
        hash: { type: string, description: sha256 of the tool's normalised definition, as Anlyon Radar computes it. }
        definition: { type: object, additionalProperties: true }
        suggestedClass: { type: string, enum: [read, write, irreversible, destructive] }
        reasons: { type: array, items: { type: string } }
        schemaCheck: { $ref: '#/components/schemas/McpSchemaCheck' }
        schemaCheckReason: { $ref: '#/components/schemas/McpSchemaCheckReason' }
    McpSchemaCheck:
      type: string
      enum: [full, loose]
      description: >-
        How a tool's arguments are checked. `full`: against its whole input schema (JSON Schema drafts
        2020-12, 2019-09, 07 and 04). `loose`: the schema uses something Anlyon does not check, so only that
        the arguments are a JSON object of at most 256 KiB. A loose tool is still pinned by hash, and
        approval is always suggested for it.
    McpSchemaCheckReason:
      type: string
      nullable: true
      enum: [remote_ref, too_large, unsafe_pattern, invalid_schema, unsupported_keyword, unknown_dialect, ref_cycle, null]
      description: >-
        Why a tool is loosely checked; null when it is checked in full. `remote_ref`: a `$ref` points
        outside the schema, and nothing is fetched. `too_large`: the schema is past a size, depth or
        reference limit. `unsafe_pattern`: a pattern could backtrack catastrophically or is too long.
        `invalid_schema`: the schema is not valid JSON Schema. `unsupported_keyword`: `$dynamicRef` or
        `$recursiveRef`. `unknown_dialect`: `$schema` names a dialect Anlyon does not know.
        `ref_cycle`: a `$ref` leads back to itself without moving into the value.
    McpUpstream:
      type: object
      required: [id, name, url, headers, registryName, protocolVersion, transport, serverInfo, tools, toolsHash, listedAt, lastError, listedWith, check, changes, oauth, endUserKey, adopted, archivedAt, createdAt, updatedAt]
      properties:
        id: { type: string, example: mcpu_01JABCDEF }
        name: { type: string, example: mailer }
        url: { type: string, format: uri }
        headers: { type: object, additionalProperties: { type: string }, description: Sent on every request. Credentials appear only as secret references. }
        registryName: { type: string, nullable: true }
        protocolVersion: { type: string, nullable: true }
        transport: { type: string, nullable: true, readOnly: true, enum: [streamable-http, sse, null], description: 'How the server is reached, as the last listing found: Streamable HTTP, or the older HTTP+SSE transport (MCP 2024-11-05) Anlyon falls back to when the server answers 400, 404 or 405. Null until a listing has worked.' }
        serverInfo: { type: object, nullable: true, additionalProperties: true }
        tools: { type: array, items: { $ref: '#/components/schemas/McpToolSnapshot' } }
        toolsHash: { type: string, nullable: true, description: The hash of the whole listing, the value Anlyon Radar writes into mcp-lock.json. }
        listedAt: { type: string, format: date-time, nullable: true }
        lastError: { type: object, nullable: true, additionalProperties: true }
        listedWith: { type: string, nullable: true, enum: [anonymous, headers, operator, null], description: 'How the last listing was made: without a credential, with the headers, or with the operator''s own OAuth grant.' }
        check:
          type: object
          description: Whether Anlyon can re-list the server by itself, and when it last tried.
          required: [status, checkedAt, nextCheckAt, failures]
          properties:
            status: { type: string, enum: [ok, failed, needs_sign_in, pending], description: '`failed`: nothing is known since `listedAt`. `needs_sign_in`: it cannot be checked until someone connects their own account. An end user''s sign-in is never used for it.' }
            checkedAt: { type: string, format: date-time, nullable: true }
            nextCheckAt: { type: string, format: date-time, nullable: true }
            failures: { type: integer, description: Failed checks in a row. }
        changes:
          type: array
          description: How the last listing differs from what was adopted. Finding a change adopts nothing and enables nothing. `tool` and `before` are the server's text, untrusted.
          items:
            type: object
            required: [tool, kind, action, actionId, pinnedHash, currentHash, suggestedClass, before, detectedAt]
            properties:
              tool: { type: string }
              kind: { type: string, enum: [changed, removed, added], description: '`changed` and `removed` are adopted tools, refused at dispatch until re-adopted. `added` is shown and never adopted.' }
              action: { type: string, nullable: true }
              actionId: { type: string, nullable: true }
              pinnedHash: { type: string, nullable: true }
              currentHash: { type: string, nullable: true }
              suggestedClass: { type: string, nullable: true, enum: [read, write, irreversible, destructive, null] }
              before: { type: object, nullable: true, additionalProperties: true, description: The definition at the pin, when it was still known and small enough to keep. }
              detectedAt: { type: string, format: date-time }
        oauth:
          type: object
          nullable: true
          description: Set for an upstream that signs people in with OAuth. Never a token or a secret.
          required: [resource, issuer, authorizationServers, authorizationEndpoint, tokenEndpoint, scopesSupported, scopes, clientId, clientRegistration, advertised, publicClient, redirectUri, operatorConnected]
          properties:
            resource: { type: string, format: uri }
            issuer: { type: string, format: uri }
            authorizationServers: { type: array, items: { type: string }, description: Every authorization server the resource named; issuer is the one in use. }
            authorizationEndpoint: { type: string, format: uri }
            tokenEndpoint: { type: string, format: uri }
            scopesSupported: { type: array, items: { type: string } }
            scopes: { type: array, items: { type: string } }
            clientId: { type: string, description: The operator's client id, this deployment's client metadata document URL, or the id a dynamic registration issued. }
            clientRegistration: { type: string, enum: [pre_registered, client_metadata_document, dynamic] }
            advertised:
              type: object
              required: [dynamicRegistration, clientIdMetadataDocuments, pkceS256]
              properties:
                dynamicRegistration: { type: boolean }
                clientIdMetadataDocuments: { type: boolean }
                pkceS256: { type: boolean }
            publicClient: { type: boolean }
            redirectUri: { type: string, format: uri }
            operatorConnected: { type: boolean }
        endUserKey:
          type: object
          nullable: true
          description: Set for an upstream each end user brings their own key to. Never a key.
          required: [header]
          properties:
            header: { type: string, example: Authorization, description: 'The header an end user''s key is sent in, in place of the secret reference it holds, for calls made for that end user.' }
            integration: { type: string, example: mcp-0b6f3c1e-8a2d-4f5b-9c7e-1d2a3b4c5d6e, description: 'What an end user''s key is stored under: the `integration` of `PUT /api/v2/end-users/{endUserId}/connections/{integration}` and of the end user''s connections.' }
        adopted:
          type: array
          items:
            type: object
            required: [tool, action, actionId, enabled, state, toolHash, requiresApproval, schemaCheck, schemaCheckReason]
            properties:
              tool: { type: string }
              action: { type: string }
              actionId: { type: string }
              enabled: { type: boolean }
              state: { type: string, enum: [current, changed, missing] }
              toolHash: { type: string, description: The definition this action is pinned to. }
              requiresApproval: { type: boolean }
              schemaCheck: { $ref: '#/components/schemas/McpSchemaCheck' }
              schemaCheckReason: { $ref: '#/components/schemas/McpSchemaCheckReason' }
        archivedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    McpUpstreamRegistration:
      type: object
      required: [name, url]
      additionalProperties: false
      properties:
        name: { type: string, pattern: '^[a-z][a-z0-9-]{0,31}$' }
        url: { type: string, format: uri, maxLength: 2048 }
        headers: { type: object, additionalProperties: { type: string, maxLength: 4096 } }
        registryName: { type: string, nullable: true, maxLength: 200 }
        oauth:
          type: object
          nullable: true
          additionalProperties: false
          description: For a server that signs people in with OAuth. With `clientId`, the client registered with the vendor, whose secret must have allowed hosts. Without it, this deployment's own client metadata document on a verified vendor's server whose authorization server accepts one, else a client registered with it dynamically (RFC 7591).
          properties:
            clientId: { type: string, nullable: true, minLength: 1, maxLength: 512 }
            clientSecret: { type: string, nullable: true, example: '{{secret:MCP_CLIENT_SECRET}}', pattern: '^\{\{secret:[A-Z0-9_]+\}\}$', description: A confidential client's secret as a secret reference. Omit for a public client (PKCE). }
            scopes: { type: array, maxItems: 50, items: { type: string, minLength: 1, maxLength: 200 } }
            redirectUri: { type: string, format: uri, nullable: true, maxLength: 2048, description: The redirect URI the client is registered with, when stated. It must be this deployment's. }
            authorizationServer: { type: string, format: uri, nullable: true, maxLength: 2048, description: 'Which of the resource''s authorization servers to use, when it names several. Default: the first.' }
        endUserKey:
          type: object
          nullable: true
          additionalProperties: false
          required: [header]
          description: >-
            For a server that takes an API key in a header, when each end user brings their own. `header` must be one
            of `headers`, holding your own key as exactly one secret reference: that key lists the tools and is used
            for calls made for no end user. A call made for an end user sends that end user's key in its place, to this
            server only. End users connect with a connect link or `PUT /api/v2/end-users/{endUserId}/connections/{integration}`.
            Not with `oauth`.
          properties:
            header: { type: string, pattern: '^[A-Za-z0-9-]{1,64}$', example: Authorization }
    McpUpstreamInspectRequest:
      type: object
      required: [url]
      additionalProperties: false
      properties:
        url: { type: string, format: uri, maxLength: 2048, example: 'https://mcp.example.com/mcp' }
    McpUpstreamSignIn:
      type: object
      description: What the server's authorization server offers. Client ID Metadata Document support counts only on a verified vendor's server, and it and dynamic registration support decide whether a client of the operator's own is needed.
      required: [issuer, authorizationHost, tokenHost, scopesSupported, advertised, redirectUri]
      properties:
        issuer: { type: string, format: uri }
        authorizationHost: { type: string }
        tokenHost: { type: string, description: The one host a client secret may be sent to. }
        scopesSupported: { type: array, items: { type: string } }
        advertised:
          type: object
          required: [dynamicRegistration, clientIdMetadataDocuments, pkceS256]
          properties:
            dynamicRegistration: { type: boolean }
            clientIdMetadataDocuments: { type: boolean }
            pkceS256: { type: boolean }
        redirectUri: { type: string, format: uri, nullable: true, description: The callback a client must list at the vendor. Null where this deployment has no connections configured. }
    McpUpstreamInspection:
      type: object
      description: What the server is. `kind` says which of the other fields are present.
      required: [kind, host]
      properties:
        kind: { type: string, enum: [open, oauth, credential, refused, unreachable] }
        host: { type: string, example: mcp.example.com }
        toolCount: { type: integer, description: 'For `open`: the tools it lists without a sign-in.' }
        transport: { type: string, enum: [streamable-http, sse], description: 'For `open`: the transport that answered. `sse` is the older HTTP+SSE transport.' }
        serverInfo:
          type: object
          nullable: true
          description: 'For `open`: what the server calls itself. Untrusted.'
          properties:
            name: { type: string }
            title: { type: string }
            version: { type: string }
        signIn:
          description: 'For `oauth`, and for `open` when it also publishes OAuth metadata for calls (otherwise null).'
          nullable: true
          allOf: [{ $ref: '#/components/schemas/McpUpstreamSignIn' }]
        status: { type: integer, description: 'For `credential`: the status the server answered, 401 or 403.' }
        reason: { type: string, description: 'For `refused`: why, as a stable code.' }
        message: { type: string, description: 'For `refused` and `unreachable`: why, in words.' }
    McpToolAdoption:
      type: object
      required: [tools]
      additionalProperties: false
      properties:
        tools:
          type: object
          description: Tool name to the operator's choices. 1 to 100 tools.
          additionalProperties:
            type: object
            additionalProperties: false
            properties:
              requiresApproval: { type: boolean }
              description: { type: string, maxLength: 1000 }
              toolHash: { type: string, pattern: '^[0-9a-f]{64}$', description: The definition hash the person read. If the last listing has since replaced it the tool is reported in `skipped`, not pinned at a definition nobody read. }
              impact:
                type: object
                nullable: true
                required: [dimension, amount, bound]
                properties:
                  dimension: { type: string }
                  unit: { type: string }
                  amount: { type: string }
                  bound: { type: string, enum: [exact, upper_bound] }
    McpAdoptResult:
      type: object
      required: [adopted, skipped]
      properties:
        adopted:
          type: array
          items:
            type: object
            required: [tool, action, readopted]
            properties:
              tool: { type: string }
              action: { $ref: '#/components/schemas/Action' }
              readopted: { type: boolean }
        skipped:
          type: array
          items:
            type: object
            required: [tool, reason]
            properties:
              tool: { type: string }
              reason: { type: string }
    Action:
      type: object
      required: [id, name, description, method, urlTemplate, headers, bodyTemplate, inputSchema, requiresApproval, enabled, secrets, currentVersionId, environmentId, adapter, governed, impact, verify, createdAt, updatedAt]
      properties:
        id: { type: string, example: act_01JABCDEF }
        environmentId: { type: string, format: uuid, description: The environment this action lives in. An action belongs to exactly one. }
        name: { type: string, example: create-ticket }
        description: { type: string, nullable: true }
        method: { type: string, enum: [GET, POST, PUT, PATCH, DELETE] }
        urlTemplate: { type: string }
        headers: { type: object, additionalProperties: true }
        bodyTemplate: { type: object, additionalProperties: true, nullable: true }
        inputSchema: { type: object, additionalProperties: true }
        requiresApproval: { type: boolean }
        enabled: { type: boolean }
        secrets:
          type: array
          description: Referenced secret names only; values are never returned.
          items: { type: string }
        currentVersionId:
          type: string
          nullable: true
          example: acv_01JABCDEF
          description: >-
            The immutable version this definition currently is. An agent version pins
            a version id, so this is what to pin to hold an action at its present
            definition. Null only for actions that predate versioning and have not
            been edited since.
        adapter:
          allOf: [{ $ref: '#/components/schemas/ActionAdapter' }]
          nullable: true
          description: The governed-effect adapter, or null for a template action.
        governed: { type: boolean, description: 'True when every invocation creates a governed effect. The action has an adapter, or it carries a declaration.' }
        impact:
          allOf: [{ $ref: '#/components/schemas/ActionImpact' }]
          nullable: true
          description: The declared impact, or null when the action declares none.
        verify:
          allOf: [{ $ref: '#/components/schemas/ActionVerify' }]
          nullable: true
          description: The declared read-back, or null when the action declares none.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ActionResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: '#/components/schemas/Action' }

    ActionListResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data: { type: array, items: { $ref: '#/components/schemas/Action' } }

    Invocation:
      type: object
      required: [id, actionName, actionVersionId, status, responseStatus, body, error, durationMs, approvalId, decision, retryOf, effectId, endUserId, createdAt, completedAt]
      properties:
        id: { type: string, example: inv_01JABCDEF }
        effectId: { type: string, nullable: true, example: eff_01JABCDEF, description: 'The governed effect this invocation created, for a governed action (an adapter or a declaration). Its outcome, evidence and recovery are at GET /api/v2/actions/effects/{id}. Null for template actions.' }
        endUserId: { type: string, nullable: true, description: 'The end user the call acted for (`Anlyon-End-User`), whose own accounts it used. Null for a call with the workspace''s own accounts. `erased~<hash>` once that end user is erased.' }
        grade:
          type: string
          nullable: true
          enum: [confirmed, acknowledged, unknown, failed, refused, denied, pending, null]
          description: 'On invoke responses and single reads: the receipt grade of the effect this invocation created. See `Effect.grade`. Absent when the invocation has no effect, and on list reads.'
        retryOf: { type: string, nullable: true, description: The failed invocation this one deliberately retried. }
        retriedBy: { type: string, nullable: true, description: 'On single reads: the invocation that retried this one.' }
        resolution:
          type: object
          nullable: true
          description: 'On single reads: the operator''s confirmed outcome for an invocation that was unknown.'
          required: [outcome, evidence, externalReference, resolvedBy, resolvedAt]
          properties:
            outcome: { type: string, enum: [succeeded, failed] }
            evidence: { type: string }
            externalReference: { type: string, nullable: true }
            resolvedBy:
              type: object
              required: [type, id]
              properties:
                type: { type: string, enum: [api_key, user] }
                id: { type: string }
            resolvedAt: { type: string, format: date-time }
        actionName: { type: string }
        actionVersionId:
          type: string
          nullable: true
          example: acv_01JABCDEF
          description: >-
            The immutable action version this invocation ran. Lets an audit answer which
            definition executed a given call rather than inferring it. Null only for
            invocations recorded before versioning existed.
        status:
          type: string
          enum: [pending_approval, running, succeeded, failed, unknown, denied, expired]
          description: >-
            `unknown` means the request may have reached the destination and
            Anlyon cannot confirm what happened  a timeout, or a socket that
            died after the request was written. It is deliberately distinct from
            `failed`, which means the call did not happen: an error before
            anything left, such as a blocked URL or an invalid template.
            **Do not retry an `unknown` invocation automatically.** Reconcile it
            with the destination first; retrying is how one refund becomes two.
            This value is additive  clients that do not know it should treat an
            unrecognised status as not-successful rather than as failed.
        responseStatus: { type: integer, minimum: 100, maximum: 599, nullable: true }
        body: { type: string, nullable: true, description: Redacted and truncated upstream response body. }
        error: { type: string, nullable: true }
        durationMs: { type: integer, minimum: 0, nullable: true }
        approvalId: { type: string, nullable: true }
        decision:
          allOf: [{ $ref: '#/components/schemas/InvocationDecision' }]
          nullable: true
          description: >-
            Why the request was allowed or refused, when a policy, a person or expiry decided it.
            Persisted on the invocation, so it reads the same after the policy is edited or deleted.
            Null while undecided, for an invocation that ran with no gate, and on rows recorded
            before this field existed. For a request that was never sent, `responseStatus` and
            `body` stay null: no response is fabricated.
        createdAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }

    InvocationDecision:
      type: object
      description: A frozen, secret-free record of one decision. Contains no policy conditions, matchers, approver identities or request input.
      required: [source, code, effect, explanation, policy, decidedAt]
      properties:
        source: { type: string, enum: [policy, human, system, assistant] }
        code: { type: string, enum: [POLICY_DENIED, POLICY_APPROVED, HUMAN_APPROVED, HUMAN_DENIED, APPROVAL_EXPIRED, ASSISTANT_APPROVED, END_USER_ERASED] }
        effect: { type: string, enum: [approved, denied, expired], description: What actually happened to the request. }
        explanation: { type: string, example: 'Denied by policy "refund_order_denied", version 2. The request was not sent.' }
        policy:
          type: object
          nullable: true
          description: The policy that decided, as it stood at decision time. Null when no policy decided.
          required: [id, name, version]
          properties:
            id: { type: string, example: apol_01JABCDEF }
            name: { type: string }
            version: { type: integer }
        decidedAt: { type: string, format: date-time, description: Database time the decision was committed. }

    InvocationResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: '#/components/schemas/Invocation' }

    InvocationListResponse:
      type: object
      required: [success, data, pagination]
      properties:
        success: { type: boolean, enum: [true] }
        data: { type: array, items: { $ref: '#/components/schemas/Invocation' } }
        pagination: { $ref: '#/components/schemas/OffsetPagination' }

    ActionVersion:
      type: object
      description: >-
        An immutable snapshot of an action's request-shaping definition. Editing an action
        appends one; nothing ever updates one. Identity (name, workspace, environment) belongs
        to the action, and `enabled` is an operational switch rather than part of a definition,
        so neither appears here.
      required: [id, version, method, urlTemplate, headers, bodyTemplate, inputSchema, requiresApproval, governed, impact, verify, secrets, current, createdAt]
      properties:
        id: { type: string, example: acv_01JABCDEF, description: "Pin this from an agent version's config.actions." }
        version: { type: integer, minimum: 1, description: "Monotonic per action, starting at 1." }
        method: { type: string, enum: [GET, POST, PUT, PATCH, DELETE] }
        urlTemplate: { type: string }
        headers: { type: object, additionalProperties: true }
        bodyTemplate: { type: object, additionalProperties: true, nullable: true }
        inputSchema: { type: object, additionalProperties: true }
        requiresApproval: { type: boolean, description: "Part of the definition, so a rollback to this version restores its approval requirement too." }
        adapter:
          allOf: [{ $ref: '#/components/schemas/ActionAdapter' }]
          nullable: true
          description: The adapter configuration this version pins, or null for a template version.
        governed: { type: boolean, description: Whether this version is governed. A pin or a rollback restores it with the request. }
        impact:
          allOf: [{ $ref: '#/components/schemas/ActionImpact' }]
          nullable: true
          description: The impact this version declares, or null.
        verify:
          allOf: [{ $ref: '#/components/schemas/ActionVerify' }]
          nullable: true
          description: The read-back this version declares, or null.
        secrets: { type: array, items: { type: string }, description: "Secret names this version references. Names only, never values." }
        current: { type: boolean, description: "Whether this is the action's present definition." }
        createdAt: { type: string, format: date-time }

    ActionVersionListResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data: { type: array, items: { $ref: '#/components/schemas/ActionVersion' } }

    ActionInvocation:
      allOf:
        - $ref: '#/components/schemas/Invocation'
        - type: object
          required: [pendingApproval]
          properties:
            pendingApproval: { type: boolean }

    ActionInvocationResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: '#/components/schemas/ActionInvocation' }

    ImportActionsRequest:
      type: object
      required: [spec]
      additionalProperties: false
      properties:
        spec: { type: object, additionalProperties: true, description: OpenAPI 3.x document. }
        baseUrl: { type: string, format: uri }
        auth:
          type: object
          required: [headerName, secretName]
          additionalProperties: false
          properties:
            headerName: { type: string, minLength: 1, maxLength: 100 }
            secretName: { type: string, minLength: 1, maxLength: 100, pattern: '^[A-Z0-9_]+$' }
            valueTemplate: { type: string, minLength: 1, maxLength: 500, example: 'Bearer {{secret}}' }
        requiresApproval: { type: boolean, default: false }
        dryRun: { type: boolean, default: false }
        only:
          type: array
          maxItems: 200
          items: { type: string, minLength: 1, maxLength: 200 }
        governed: { type: boolean, default: true, description: 'Import every operation that is not a GET as a governed action declaring one resource mutation. `false` imports plain template actions.' }
        operations:
          type: object
          maxProperties: 200
          description: >-
            Settings chosen per operation, keyed by operationId or `METHOD /path`, usually accepted
            from a dry run's `suggestion`. An operation not named here gets the defaults. A key that
            names no operation in the spec, an operation named twice, or an impact an action would
            not accept fails the whole request with `400` before anything is created.
          additionalProperties: { $ref: '#/components/schemas/ImportOperationChoice' }
          example:
            PostRefunds: { requiresApproval: true, impact: { dimension: money, unit: usd, amount: input.amount, bound: exact } }
            'DELETE /v1/customers/{customer}': { requiresApproval: true }

    ImportOperationChoice:
      type: object
      additionalProperties: false
      properties:
        requiresApproval: { type: boolean, description: Overrides the import-wide `requiresApproval` for this operation. }
        impact:
          allOf: [{ $ref: '#/components/schemas/ActionImpact' }]
          nullable: true
          description: The impact to declare instead of one resource mutation. `null` imports the operation as a plain template action.

    ImportSuggestion:
      type: object
      required: [risk, reasons, requiresApproval, impact, impactNote]
      description: >-
        Suggested from the spec alone, with no model call, so the same spec always gives the same
        suggestion. Never applied by itself.
      properties:
        risk: { type: string, enum: [read, write, irreversible, destructive] }
        reasons: { type: array, items: { type: string }, description: The signals in the spec that produced the risk and the impact. }
        requiresApproval: { type: boolean, description: True for an irreversible or destructive operation. }
        impact:
          type: object
          nullable: true
          description: An impact in the shape an action declares, or null when the operation changes nothing. `unit` is null for money when the spec does not fix one currency; choose it before accepting.
          required: [dimension, unit, amount, bound]
          properties:
            dimension: { type: string, example: money }
            unit: { type: string, nullable: true, example: usd }
            amount: { type: string, example: input.amount }
            bound: { type: string, enum: [exact, upper_bound] }
        impactNote: { type: string, nullable: true, description: What to check before accepting the impact. }

    ImportedAction:
      type: object
      required: [name, method, path, urlTemplate, warnings, governed, impact, requiresApproval, customized, suggestion, proposedVerify, verifyNote]
      properties:
        name: { type: string }
        method: { type: string, enum: [GET, POST, PUT, PATCH, DELETE] }
        path: { type: string }
        urlTemplate: { type: string }
        warnings: { type: array, items: { type: string } }
        governed: { type: boolean, description: True when the action was imported governed. A GET never is. }
        impact:
          type: object
          nullable: true
          description: What a governed imported action declares it changes. One exact resource mutation unless `operations` chose another impact for it. Null for an ungoverned action.
          required: [dimension, amount, bound]
          properties:
            dimension: { type: string, example: resource_mutations }
            unit: { type: string }
            amount: { type: string, example: '1' }
            bound: { type: string, enum: [exact, upper_bound] }
        requiresApproval: { type: boolean, description: Whether each call waits for a person's approval. }
        customized: { type: boolean, description: True when `operations` named this operation. }
        suggestion: { $ref: '#/components/schemas/ImportSuggestion' }
        proposedVerify:
          type: object
          nullable: true
          description: >-
            A read-back rule the spec makes possible for this write, or null. It is NOT on the
            action. Check that it reads back what the write changed, then set it as the action's
            `verify`.
          required: [url, status, match]
          properties:
            url: { type: string, example: 'https://api.example.com/v1/pets/{{response.id}}' }
            status: { type: integer, example: 200 }
            match:
              type: array
              items:
                type: object
                required: [path, equals]
                properties:
                  path: { type: string, example: name }
                  equals: { type: string, example: '{{input.name}}' }
        verifyNote: { type: string, nullable: true, description: Why no read-back is proposed, or what to check before accepting the one that is. Null for an ungoverned action. }
        action: { $ref: '#/components/schemas/Action' }

    SkippedActionOperation:
      type: object
      required: [path, method, reason]
      properties:
        path: { type: string }
        method: { type: string }
        reason: { type: string }

    ImportActionsResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [created, skipped, dryRun, suggestedAllowedHosts]
          properties:
            created: { type: array, items: { $ref: '#/components/schemas/ImportedAction' } }
            skipped: { type: array, items: { $ref: '#/components/schemas/SkippedActionOperation' } }
            dryRun: { type: boolean }
            suggestedAllowedHosts:
              type: array
              items: { type: string }
              example: [api.stripe.com]
              description: Hosts the import's credential could be limited to, from the base URL and the spec's servers. Not applied; set them as the secret's `allowedHosts`.

    CreateApprovalRequest:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        payload: { type: object, additionalProperties: true }
        expiresInSeconds: { type: integer, minimum: 60, maximum: 2592000 }
        runId: { type: string, maxLength: 80, description: 'Existing run in this API key environment for approval lifecycle spans.' }
        parentSpanId: { type: string, maxLength: 80, description: 'Optional parent span within runId.' }

    DecideApprovalRequest:
      type: object
      additionalProperties: false
      properties:
        note: { type: string, maxLength: 1000 }

    PolicyFilePlanRequest:
      type: object
      additionalProperties: false
      required: [source]
      properties:
        source: { type: string, minLength: 1, maxLength: 262144, description: 'The policy file text (YAML or JSON). apiVersion anlyon.com/policies/v1.' }

    PolicyFileApplyRequest:
      type: object
      additionalProperties: false
      required: [source, digest]
      properties:
        source: { type: string, minLength: 1, maxLength: 262144 }
        digest: { type: string, pattern: '^[0-9a-f]{64}$', example: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855, description: The digest from the plan you reviewed. }
        changeNote: { type: string, maxLength: 1000, description: 'Recorded on every version this apply writes. Defaults to "Applied policy file <file>".' }

    PolicyFileTestRequest:
      type: object
      additionalProperties: false
      required: [source, cases]
      properties:
        source: { type: string, minLength: 1, maxLength: 262144 }
        cases:
          description: 'Fixture cases as YAML/JSON text (a list, or an object with `cases`), or as a list. Each case has `name`, `request` { kind, action, input, agent, user, tags } and `expect` { effect and/or policy (a key in this file, another policy id, or null) }.'
          oneOf:
            - { type: string, minLength: 1, maxLength: 262144 }
            - { type: array, maxItems: 200, items: { type: object, additionalProperties: true } }

    PolicyFileChange:
      type: object
      required: [op, key, name]
      properties:
        op: { type: string, enum: [create, update, delete, unchanged] }
        key: { type: string }
        name: { type: string }
        policyId: { type: string }
        version: { type: integer }
        fields: { type: array, items: { type: string }, description: 'For updates: the fields that change.' }
        after: { type: object, additionalProperties: true, description: 'For creates and updates: the policy as the file declares it.' }

    PolicyFilePlan:
      type: object
      required: [file, environmentId, digest, changes, summary, errors]
      properties:
        file: { type: string }
        environmentId: { type: string, format: uuid }
        digest: { type: string, pattern: '^[0-9a-f]{64}$', example: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855 }
        changes: { type: array, items: { $ref: '#/components/schemas/PolicyFileChange' } }
        summary:
          type: object
          required: [create, update, delete, unchanged]
          properties:
            create: { type: integer }
            update: { type: integer }
            delete: { type: integer }
            unchanged: { type: integer }
        errors: { type: array, items: { type: string }, description: Problems that prevent applying. Empty when the file can be applied. }

    PolicyFileTestResult:
      type: object
      required: [file, passed, failed, results]
      properties:
        file: { type: string }
        passed: { type: integer }
        failed: { type: integer }
        results:
          type: array
          items:
            type: object
            required: [name, pass, policy, effect, explanation]
            properties:
              name: { type: string }
              pass: { type: boolean }
              policy: { type: string, nullable: true, description: 'The governing policy: a key in this file, another policy id, or null.' }
              effect: { type: string, enum: [require_approval, auto_approve, auto_deny] }
              explanation: { type: string }

    ApprovalPolicyVersionPage:
      type: object
      required: [success, data, pagination]
      properties:
        success: { type: boolean, enum: [true] }
        data: { type: array, items: { $ref: '#/components/schemas/ApprovalPolicyVersion' } }
        pagination:
          type: object
          required: [limit, nextBefore, earliestVersion, latestVersion]
          properties:
            limit: { type: integer, minimum: 1, maximum: 100 }
            nextBefore: { type: integer, nullable: true, description: Pass as `before` for the next (older) page. Null on the last page. }
            earliestVersion: { type: integer, minimum: 1, description: The oldest retained version. }
            latestVersion: { type: integer, minimum: 1 }

    ApprovalPolicyVersion:
      type: object
      required: [policyId, version, operation, snapshot, contentHash, actor, changeNote, createdAt]
      properties:
        policyId: { type: string }
        version: { type: integer }
        operation: { type: string, enum: [created, updated, deleted, baseline] }
        snapshot: { type: object, additionalProperties: true, description: Immutable database row snapshot with snake_case field names. A deletion tombstone carries the next version number. }
        contentHash: { type: string, description: 'SHA-256 of PostgreSQL snapshot jsonb text encoded as UTF-8. An integrity digest, not a signature.' }
        actor:
          type: object
          nullable: true
          required: [type, id]
          properties:
            type: { type: string, enum: [api_key, user, unknown] }
            id: { type: string }
        changeNote: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    EvaluateApprovalPoliciesRequest:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: { type: string, enum: [action, custom] }
        actionName: { type: string, minLength: 1, maxLength: 200, description: Required for action contexts; forbidden for custom contexts. }
        agentId: { type: string, maxLength: 60, nullable: true, description: 'Hypothetical attribution, never runtime authority.' }
        userId: { type: string, maxLength: 200, nullable: true }
        payload: { type: object, additionalProperties: true, description: Action input or custom payload. Amount is read from the numeric amount field; only custom requests use the tags field. }

    PolicyEvaluation:
      type: object
      required: [evaluation, environmentId, decision, limitations]
      properties:
        evaluation: { type: string, enum: [policy_only] }
        environmentId: { type: string }
        limitations: { type: string }
        decision:
          type: object
          required: [matched, effect, requiredApprovals, matchedPolicyId, matchedPolicyVersion, matchedPolicyName, matchedActionName, explanation]
          properties:
            matched: { type: boolean }
            effect: { type: string, enum: [require_approval, auto_approve, auto_deny] }
            requiredApprovals: { type: integer }
            matchedPolicyId: { type: string, nullable: true }
            matchedPolicyVersion: { type: integer, nullable: true }
            matchedPolicyName: { type: string, nullable: true }
            matchedActionName: { type: string, nullable: true }
            explanation: { type: string }

    ApprovalActor:
      type: object
      required: [type, id, displayName]
      properties:
        type: { type: string, enum: [api_key, user] }
        id: { type: string, description: Stable recorded reviewer identity. Never an API key value. }
        displayName: { type: string, nullable: true, description: Null when no historical display name was recorded. }

    ApprovalVote:
      type: object
      required: [decision, decidedBy, note, selfApproved, decidedAt]
      properties:
        decision: { type: string, enum: [approve, deny] }
        decidedBy:
          allOf: [{ $ref: '#/components/schemas/ApprovalActor' }]
          nullable: true
        note: { type: string, nullable: true }
        selfApproved:
          type: boolean
          description: >-
            True when an app acting for the decider, or an API key they created, requested the
            approval. Allowed only while the decider is the only member who can decide approvals in
            its environment; with a second one, the request answers 403 SELF_APPROVAL_NOT_ALLOWED.
        decidedAt: { type: string, format: date-time }

    Approval:
      type: object
      required: [id, kind, status, title, description, payload, decisionNote, requiredApprovals, approvedCount, matchedPolicyId, matchedPolicyVersion, policyExplanation, decisionOrigin, endUserId, decider, expiresAt, decidedAt, createdAt]
      properties:
        id: { type: string, example: apr_01JABCDEF }
        kind: { type: string, enum: [action, custom, function_plan], description: "`function_plan`: the writes a hosted function's plan run recorded, bound to the plan's digest in `payload.planDigest`." }
        status: { type: string, enum: [pending, approved, denied, expired] }
        title: { type: string }
        description: { type: string, nullable: true }
        payload: { type: object, additionalProperties: true, description: Secret-safe review payload. }
        decisionNote: { type: string, nullable: true }
        decidedBy:
          allOf: [{ $ref: '#/components/schemas/ApprovalActor' }]
          nullable: true
          description: The recorded reviewer who finalized the decision, not all voters. Null for pending, expired, automated or unattributed decisions. Available to approval readers; not copied into invocation responses.
        votes:
          type: array
          items: { $ref: '#/components/schemas/ApprovalVote' }
          description: Recorded votes in chronological order on detail reads, including long-poll results. Omitted on list, create and decide responses; fetch the detail to audit all reviewers.
        requiredApprovals: { type: integer, minimum: 1, description: 'Distinct approvers needed (N-of-M), as resolved from the governing policy when the approval was created.' }
        approvedCount: { type: integer, minimum: 0, description: Approvals recorded so far. }
        matchedPolicyId:
          type: string
          nullable: true
          description: The policy that governed this approval, as recorded when it was created. Null when no policy matched (the default gate applied) and on approvals recorded before policies existed.
        matchedPolicyVersion:
          type: integer
          nullable: true
          description: The version of that policy at the time. Null exactly when matchedPolicyId is null.
        policyExplanation:
          type: string
          nullable: true
          description: A human-readable account of how the policy was applied. Null on approvals recorded before it was kept. It is the approval's own record; an invocation carries its own `decision` and does not need this.
        decisionOrigin:
          type: string
          nullable: true
          enum: [human, policy, system, unknown, assistant, null]
          description: Who decided. Persisted, not inferred from status. Null while pending. `unknown` marks a decision made before origin was recorded whose evidence does not settle it; it is never guessed. `assistant` is an approval by opt-in Anlyon Vigil inside the limits an admin set; it never denies.
        endUserId: { type: string, nullable: true, description: 'The end user the gated call was made for (`Anlyon-End-User`), or null for a call with the workspace''s own accounts. `erased~<hash>` once that end user is erased.' }
        decider:
          type: string
          enum: [team, end_user]
          description: 'Who decides it. `end_user`: the end user it was made for, in your app, through /api/v2/end-users/{endUserId}/approvals (a policy with `decidedBy: end_user`). Such an approval is not in the team''s inbox or Slack, and the team''s decide routes answer 404 for it. Not `decidedBy`, which is the reviewer.'
        expiresAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        advice:
          allOf: [{ $ref: '#/components/schemas/AssistantAdvice' }]
          description: Anlyon Vigil's suggestion, on dashboard (session) responses only and only for workspaces that opted in. API-key callers never receive it.

    ApprovalResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: '#/components/schemas/Approval' }

    ApprovalListResponse:
      type: object
      required: [success, data, pagination]
      properties:
        success: { type: boolean, enum: [true] }
        data: { type: array, items: { $ref: '#/components/schemas/Approval' } }
        pagination: { $ref: '#/components/schemas/OffsetPagination' }

    ApprovalDecision:
      type: object
      required: [approval, selfApproved]
      properties:
        approval: { $ref: '#/components/schemas/Approval' }
        selfApproved: { type: boolean, description: This decision was a self-approval (see ApprovalVote.selfApproved). }
        invocation: { $ref: '#/components/schemas/Invocation' }

    ApprovalDecisionResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: '#/components/schemas/ApprovalDecision' }

    AssistantAdvice:
      type: object
      description: >-
        Advice from opt-in Anlyon Vigil. Not a decision. `reasons` are
        templates over the model's numeric answers; no model-written text is
        shown. A missing suggestion never blocks review.
      required: [status, statusReason, model, recommendation, risk, riskLevel, confidence, reasons, flags, history, auditRequested, auditVerdict, createdAt, completedAt]
      properties:
        status: { type: string, enum: [pending, ready, failed, skipped] }
        statusReason: { type: string, nullable: true, description: 'Why advice failed or was skipped, e.g. `quota_exceeded`, `timeout`, `already_decided`.' }
        model: { type: string, nullable: true, example: vigil-1, description: Vigil's public model version. Auto-approve thresholds are calibrated per version. }
        recommendation: { type: string, nullable: true, enum: [approve, deny, review, null] }
        risk: { type: number, nullable: true, minimum: 0, maximum: 4, description: 'Expected harm if approving were wrong, 0 routine to 4 critical.' }
        riskLevel: { type: string, nullable: true, enum: [routine, low, moderate, high, critical, null] }
        confidence: { type: number, nullable: true, minimum: 0, maximum: 1 }
        reasons: { type: array, items: { type: string } }
        flags:
          type: object
          nullable: true
          required: [injectionSuspected, consistentWithHistory, amountUnusual]
          properties:
            injectionSuspected: { type: number, nullable: true, minimum: 0, maximum: 1 }
            consistentWithHistory: { type: number, nullable: true, minimum: 0, maximum: 1 }
            amountUnusual: { type: number, nullable: true, minimum: 0, maximum: 1 }
        history:
          type: object
          nullable: true
          description: This agent and action over the last 30 days.
          required: [approved, denied, maxAmount, medianAmount]
          properties:
            approved: { type: integer, minimum: 0 }
            denied: { type: integer, minimum: 0 }
            maxAmount: { type: number, nullable: true }
            medianAmount: { type: number, nullable: true }
        auditRequested: { type: boolean, description: This Vigil decision was sampled for a person to check. }
        auditVerdict: { type: string, nullable: true, enum: [agree, disagree, null] }
        createdAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }

    AssistantAdviceResponse:
      type: object
      required: [success, data]
      properties: { success: { type: boolean, enum: [true] }, data: { $ref: '#/components/schemas/AssistantAdvice' } }

    AssistantAuditQueueResponse:
      type: object
      required: [success, data]
      properties: { success: { type: boolean, enum: [true] }, data: { type: array, items: { $ref: '#/components/schemas/Approval' } } }

    AdviceAuditRequest:
      type: object
      additionalProperties: false
      required: [verdict]
      properties:
        verdict: { type: string, enum: [agree, disagree] }

    AssistantAutoApprove:
      type: object
      description: Bounded auto-approve. Every rule must hold; Vigil never approves N-of-M approvals and never denies.
      required: [enabled, actions, minConfidence, maxRisk, minHistory]
      properties:
        enabled: { type: boolean, default: false }
        actions: { type: array, items: { type: string }, description: Action names Vigil may approve. Required when enabled. }
        environments: { type: array, items: { type: string, format: uuid }, description: Limit to these environments. Empty means all. }
        maxAmount: { type: number, nullable: true, minimum: 0, description: 'When set, a request needs an `amount` at or below this.' }
        minConfidence: { type: number, minimum: 0.8, maximum: 1, default: 0.9 }
        maxRisk: { type: integer, minimum: 0, maximum: 4, default: 1 }
        minHistory: { type: integer, minimum: 0, default: 20, description: Human approvals of this action by this agent in 30 days. }

    AssistantUsageCounter:
      type: object
      required: [used, cap, period]
      properties:
        used: { type: integer, minimum: 0 }
        cap: { $ref: '#/components/schemas/QuotaLimit' }
        period: { type: string, description: 'UTC month (`2026-09`) for reviews, UTC day (`2026-09-24`) for auto-approvals.' }

    AssistantSettings:
      type: object
      required: [available, enabled, consentVersion, currentConsentVersion, consentedAt, excludedFields, autoApprove, auditSampleRate, model, usage]
      properties:
        available: { type: boolean, description: False when Anlyon Vigil is not available on this deployment. }
        enabled: { type: boolean, description: True only with consent to the current version. }
        consentVersion: { type: string, nullable: true }
        currentConsentVersion: { type: string, example: '2026-09-24' }
        consentedAt: { type: string, format: date-time, nullable: true }
        excludedFields: { type: array, items: { type: string }, description: Dot-paths removed from the request input before it is sent. }
        autoApprove: { $ref: '#/components/schemas/AssistantAutoApprove' }
        auditSampleRate: { type: number, minimum: 0, maximum: 1 }
        model: { type: string, example: vigil-1, description: Vigil's current public model version. }
        usage:
          type: object
          description: Hard caps from the workspace's plan. At the review cap a request is reviewed without a suggestion; at the auto-approve cap it goes to a person.
          required: [reviews, autoApprovals]
          properties:
            reviews: { $ref: '#/components/schemas/AssistantUsageCounter' }
            autoApprovals: { $ref: '#/components/schemas/AssistantUsageCounter' }

    AssistantSettingsResponse:
      type: object
      required: [success, data]
      properties: { success: { type: boolean, enum: [true] }, data: { $ref: '#/components/schemas/AssistantSettings' } }

    UpdateAssistantSettingsRequest:
      type: object
      additionalProperties: false
      properties:
        enabled: { type: boolean }
        consentVersion: { type: string, maxLength: 40, description: Required with `enabled` true; must equal `currentConsentVersion`. }
        excludedFields: { type: array, maxItems: 50, items: { type: string, minLength: 1, maxLength: 200 } }
        autoApprove:
          type: object
          additionalProperties: false
          properties:
            enabled: { type: boolean }
            actions: { type: array, maxItems: 100, items: { type: string, minLength: 1, maxLength: 100 } }
            environments: { type: array, maxItems: 20, items: { type: string, format: uuid } }
            maxAmount: { type: number, minimum: 0, nullable: true }
            minConfidence: { type: number, minimum: 0.8, maximum: 1 }
            maxRisk: { type: integer, minimum: 0, maximum: 4 }
            minHistory: { type: integer, minimum: 0, maximum: 10000 }
        auditSampleRate: { type: number, minimum: 0, maximum: 1 }

    SuggestedPolicy:
      type: object
      required: [name, priority, matchKind, matchActionName, matchAgentId, minAmount, effect]
      properties:
        name: { type: string }
        priority: { type: integer }
        matchKind: { type: string, enum: [action] }
        matchActionName: { type: string }
        matchAgentId: { type: string, nullable: true }
        minAmount: { type: number, nullable: true }
        effect: { type: string, enum: [auto_approve, require_approval] }

    PolicySuggestion:
      type: object
      required: [key, environmentId, actionName, agentId, approved, maxAmount, averageRisk, policies, preview]
      properties:
        key: { type: string }
        environmentId: { type: string, format: uuid }
        actionName: { type: string }
        agentId: { type: string, nullable: true }
        approved: { type: integer, minimum: 0, description: Human approvals in the group in 30 days. }
        maxAmount: { type: number, nullable: true }
        averageRisk: { type: number, nullable: true }
        policies: { type: array, items: { $ref: '#/components/schemas/SuggestedPolicy' } }
        preview:
          type: object
          description: The group's history replayed through the production policy engine with these policies added.
          required: [wouldAutoApprove, wouldStillReview, wouldApproveDenied]
          properties:
            wouldAutoApprove: { type: integer, minimum: 0 }
            wouldStillReview: { type: integer, minimum: 0 }
            wouldApproveDenied: { type: integer, minimum: 0 }

    PolicySuggestionListResponse:
      type: object
      required: [success, data]
      properties: { success: { type: boolean, enum: [true] }, data: { type: array, items: { $ref: '#/components/schemas/PolicySuggestion' } } }

    BudgetDimensions:
      type: object
      additionalProperties: false
      properties:
        messages: { type: integer, minimum: 0 }
        eventPublishes: { type: integer, minimum: 0 }
        actionInvokes: { type: integer, minimum: 0 }

    PutBudgetRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        monthlyCostCentsCap: { type: integer, minimum: 0, nullable: true }
        dimensionCaps: { $ref: '#/components/schemas/BudgetDimensions' }
        alertThreshold: { type: number, minimum: 0.1, maximum: 1, default: 0.8 }
        enabled: { type: boolean, default: true }

    Budget:
      type: object
      required: [workspaceId, apiKeyId, monthlyCostCentsCap, dimensionCaps, alertThreshold, enabled, usage, estimatedCostCents, reconciliationRequired, alertedAt]
      properties:
        workspaceId: { type: string, format: uuid }
        apiKeyId: { type: string, format: uuid }
        monthlyCostCentsCap: { type: integer, minimum: 0, nullable: true }
        dimensionCaps: { $ref: '#/components/schemas/BudgetDimensions' }
        alertThreshold: { type: number, minimum: 0.1, maximum: 1 }
        enabled: { type: boolean }
        usage:
          allOf:
            - $ref: '#/components/schemas/BudgetDimensions'
            - type: object
              required: [messages, eventPublishes, actionInvokes]
        estimatedCostCents: { type: number, minimum: 0 }
        reconciliationRequired:
          type: boolean
          description: Legacy current-month usage is unknown. Budgeted admissions return 503 BUDGET_RECONCILIATION_REQUIRED until an operator imports a verified usage floor; displayed usage is incomplete while true.
        alertedAt: { type: string, format: date-time, nullable: true }

    BudgetResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: '#/components/schemas/Budget' }

    BudgetListResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data: { type: array, items: { $ref: '#/components/schemas/Budget' } }

    OffsetPagination:
      type: object
      required: [total, page, limit, totalPages, hasMore]
      properties:
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1 }
        totalPages: { type: integer, minimum: 0 }
        hasMore: { type: boolean }

    DeletedResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [deleted]
          properties:
            deleted: { type: boolean, enum: [true] }

    UpdateNotificationPreferencesRequest:
      type: object
      minProperties: 1
      properties:
        emailEnabled:
          type: boolean
        webhookEnabled:
          type: boolean
        inAppEnabled:
          type: boolean
        slackEnabled:
          type: boolean
        discordEnabled:
          type: boolean
        emailRecipients:
          type: array
          maxItems: 50
          items:
            type: string
            format: email
        webhookUrl:
          type: string
          format: uri
          nullable: true
        webhookSecret:
          type: string
          maxLength: 4096
          nullable: true
          writeOnly: true
          description: Set or rotate the signing secret; use null to remove it. The stored value is never returned.
        quotaAlertThresholds:
          type: array
          maxItems: 20
          items:
            type: integer
            minimum: 0
            maximum: 100
        enabledTypes:
          type: array
          maxItems: 15
          items:
            type: string
            enum:
              - quota_warning
              - quota_exceeded
              - payment_failed
              - plan_upgraded
              - plan_downgraded
              - feature_enabled
              - system_alert
              - security_alert
              - delivery_failure_spike
              - api_key_expiring
              - approval_requested
              - budget_alert
              - approval_expired
              - outcome_unknown
              - connection_broken

    PlanDetails:
      type: object
      properties:
        pendingPlan: { type: string, nullable: true, description: Requested period-end target plan. }
        plan:
          type: string
          enum: [free, starter, paygo, enterprise, production, growth]
          example: paygo
        limits:
          type: object
          properties:
            maxMessagesPerDay:
              oneOf:
                - type: integer
                - type: string
                  enum: [unlimited]
              example: unlimited
            maxMonthlyMessages:
              oneOf:
                - type: integer
                - type: string
                  enum: [unlimited]
              example: unlimited
            maxMonthlyBandwidth:
              type: integer
              example: 53687091200
            maxRetries:
              type: integer
              example: 5
            maxMessageSize:
              type: integer
              example: 10485760
            maxHttpTimeout:
              type: integer
              example: 7200000
        features:
          type: object
          properties:
            customHeaders:
              type: boolean
            webhooks:
              type: boolean
            analytics:
              type: boolean
            prioritySupport:
              type: boolean
        pricing:
          type: object
          properties:
            monthlyFee:
              type: number
              format: float
              example: 0
            perMessageCost:
              type: number
              format: float
              example: 0.001
            includedMessages:
              type: integer
              example: 0

    Plan:
      type: object
      properties:
        id:
          type: string
          enum: [free, starter, paygo, enterprise, production, growth]
        name:
          type: string
          example: Pay as You Go
        description:
          type: string
        pricing:
          type: object
          properties:
            monthlyFee:
              type: number
              format: float
            perMessageCost:
              type: number
              format: float
        limits:
          type: object
        features:
          type: object

    Notification:
      type: object
      required: [id, type, priority, title, message, metadata, actionUrl, actionLabel, isRead, readAt, createdAt, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - quota_warning
            - quota_exceeded
            - payment_failed
            - plan_upgraded
            - plan_downgraded
            - feature_enabled
            - system_alert
            - security_alert
            - delivery_failure_spike
            - api_key_expiring
            - approval_requested
            - budget_alert
            - approval_expired
            - outcome_unknown
            - connection_broken
        priority:
          type: string
          enum: [low, medium, high, critical]
        title:
          type: string
          example: Quota Warning
        message:
          type: string
          example: You have used 75% of your daily message quota
        metadata:
          type: object
          nullable: true
          additionalProperties: true
        actionUrl:
          type: string
          nullable: true
        actionLabel:
          type: string
          nullable: true
        isRead:
          type: boolean
          default: false
        readAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          nullable: true

    NotificationPreferences:
      type: object
      required: [emailEnabled, webhookEnabled, inAppEnabled, slackEnabled, discordEnabled, emailRecipients, webhookUrl, hasWebhookSecret, quotaAlertThresholds, enabledTypes, createdAt, updatedAt]
      properties:
        emailEnabled:
          type: boolean
          default: true
        webhookEnabled:
          type: boolean
          default: false
        inAppEnabled:
          type: boolean
          default: true
        slackEnabled:
          type: boolean
        discordEnabled:
          type: boolean
        emailRecipients:
          type: array
          items:
            type: string
            format: email
        webhookUrl:
          type: string
          format: uri
          nullable: true
        hasWebhookSecret:
          type: boolean
          description: Whether a signing secret is stored. The value itself is never returned.
        quotaAlertThresholds:
          type: array
          items:
            type: integer
          example: [50, 75, 90, 100]
        enabledTypes:
          type: array
          items:
            type: string
            enum: [quota_warning, quota_exceeded, payment_failed, plan_upgraded, plan_downgraded, feature_enabled, system_alert, security_alert, delivery_failure_spike, api_key_expiring, approval_requested, budget_alert, approval_expired, outcome_unknown, connection_broken]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    EndUserConnectionError:
      type: object
      required: [success, error, requestId]
      properties:
        success: { type: boolean, example: false }
        requestId: { type: string, example: req_0123456789abcdef0123456789abcdef }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: END_USER_NOT_CONNECTED, description: 'END_USER_NOT_CONNECTED, END_USER_RECONNECT_REQUIRED, or another conflict code.' }
            message: { type: string }
            details: { type: object }
            integration: { type: string, example: gmail, description: 'The integration the end user needs to connect, or `mcp-<id>` for a tool adopted from an MCP server that signs people in. Present on the two end-user codes.' }
            displayName: { type: string, example: Gmail, description: 'The name to show the end user: the integration''s, or the MCP server''s. Present on the two end-user codes.' }
            endUserId: { type: string, example: user_123, description: Present on the two end-user codes. }
            connectUrl: { type: string, format: uri, description: A fresh connect link on the environment's default redirect URL. Absent without a default redirect URL, and for an API-key integration. }
            expiresAt: { type: string, format: date-time, description: When connectUrl expires. }
            fix: { $ref: '#/components/schemas/ErrorFix' }

    EndUserConnection:
      type: object
      required: [integration, kind, status, scopes, connectedAt, updatedAt]
      properties:
        integration: { type: string, example: gmail }
        kind: { type: string, enum: [oauth, api_key], description: Connected by signing in, or with the end user's own key. }
        status: { type: string, enum: [active, needs_reconnect, revoked], description: '`needs_reconnect` once the provider refused the grant or a refresh failed for good. `revoked` is reserved: a disconnected account is deleted and not listed.' }
        scopes: { type: array, items: { type: string }, description: What the provider says was granted. Empty for an API key. }
        connectedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    EndUserConnectionResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: '#/components/schemas/EndUserConnection' }

    EndUserConnectionListResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data: { type: array, items: { $ref: '#/components/schemas/EndUserConnection' } }

    CreateFunctionRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100, pattern: '^[a-zA-Z0-9_-]+$', example: refund-with-checks }
        description: { type: string, maxLength: 1000, example: Refund an order after checking it was paid. }

    FunctionBudgets:
      type: object
      additionalProperties: false
      description: Per-run budgets. When one runs out the run ends `budget_exceeded`.
      properties:
        maxActionCalls: { type: integer, minimum: 1, maximum: 500, example: 50, description: Action calls dispatched in one run. Default 50. }
        maxCpuMs: { type: integer, minimum: 1, maximum: 30000, example: 1000, description: CPU time in one run. Default 1000. }
        maxSubrequests: { type: integer, minimum: 1, maximum: 1000, example: 100, description: Calls through the anlyon binding in one run, refused ones included. Default 100. }
        timeoutMs: { type: integer, minimum: 100, maximum: 300000, example: 30000, description: Wall time of one run. Default 30000. }

    FunctionVersion:
      type: object
      required: [id, version, language, digest, allowedActions, inputSchema, budgets, straightThrough, review, createdAt]
      properties:
        id: { type: string, example: fnv_V1StGXR8_Z5jdHi6B-myT, description: The version id. }
        version: { type: integer, minimum: 1, example: 1 }
        language: { type: string, enum: [javascript, python] }
        digest: { type: string, example: 'sha256:9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08', description: SHA-256 of the source. }
        allowedActions: { type: array, items: { type: string }, example: [lookup-order, refund] }
        inputSchema: { type: object, additionalProperties: true }
        budgets:
          type: object
          required: [maxActionCalls, maxCpuMs, maxSubrequests, timeoutMs]
          properties:
            maxActionCalls: { type: integer, example: 50 }
            maxCpuMs: { type: integer, example: 1000 }
            maxSubrequests: { type: integer, example: 100 }
            timeoutMs: { type: integer, example: 30000 }
        straightThrough: { allOf: [{ $ref: '#/components/schemas/FunctionStraightThroughPolicy' }], nullable: true }
        review: { allOf: [{ $ref: '#/components/schemas/FunctionVersionReview' }], nullable: true }
        createdAt: { type: string, format: date-time }

    FunctionSourceFindings:
      type: object
      required: [language, parsed, parseError, calls, proposedAllowedActions, computedActionNames, risky, writesInLoop]
      description: What the source says it calls and uses, read from its syntax tree. Advice for people; what a run may call is the version's allowedActions.
      properties:
        language: { type: string, enum: [javascript, python] }
        parsed: { type: boolean }
        parseError: { type: string, nullable: true }
        calls:
          type: array
          items:
            type: object
            required: [kind, action, line]
            properties:
              kind: { type: string, enum: [invoke, read] }
              action: { type: string, example: refund }
              line: { type: integer, example: 5 }
        proposedAllowedActions: { type: array, items: { type: string }, example: [lookup-order, refund] }
        computedActionNames:
          type: array
          items:
            type: object
            required: [kind, line]
            properties:
              kind: { type: string, enum: [invoke, read] }
              line: { type: integer }
        risky:
          type: array
          description: Network, file, process, environment and eval APIs. They fail inside a function anyway.
          items:
            type: object
            required: [api, category, line]
            properties:
              api: { type: string, example: fetch }
              category: { type: string, enum: [network, file, process, environment, eval] }
              line: { type: integer }
        writesInLoop:
          type: array
          items:
            type: object
            required: [action, line]
            properties:
              action: { type: string, nullable: true }
              line: { type: integer }

    FunctionVersionReview:
      type: object
      required: [ast, ai]
      description: Advice shown to the people who approve a plan. Nothing here allows or refuses a call.
      properties:
        ast: { $ref: '#/components/schemas/FunctionSourceFindings' }
        ai:
          type: object
          nullable: true
          description: The AI review, for a workspace with Anlyon Vigil on. Null until it is done.
          required: [status, reason, model, summary, purpose, riskyPatterns, suggestedRiskTier, confidence, truncated, reviewedAt]
          properties:
            status: { type: string, enum: [reviewed, skipped, failed] }
            reason: { type: string, nullable: true, example: assistant_disabled }
            model: { type: string, nullable: true, example: vigil-1 }
            summary: { type: string, nullable: true }
            purpose: { type: string, nullable: true, enum: [refunds, payments, messages, records, accounts, lookups, other] }
            riskyPatterns:
              type: array
              items:
                type: object
                required: [pattern, description, probability]
                properties:
                  pattern: { type: string, enum: [writes_in_loop, money_per_item, amount_from_input, unchecked_write] }
                  description: { type: string }
                  probability: { type: number, minimum: 0, maximum: 1 }
            suggestedRiskTier: { type: string, nullable: true, enum: [routine, low, moderate, high, critical] }
            confidence: { type: number, nullable: true, minimum: 0, maximum: 1 }
            truncated: { type: boolean }
            reviewedAt: { type: string, format: date-time }

    AnalyzeFunctionSourceRequest:
      type: object
      additionalProperties: false
      required: [language, source]
      properties:
        language: { type: string, enum: [javascript, python] }
        source: { type: string, minLength: 1, maxLength: 262144 }

    FunctionSourceFindingsResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: '#/components/schemas/FunctionSourceFindings' }

    Function:
      type: object
      required: [id, name, description, environmentId, currentVersion, createdAt, updatedAt]
      properties:
        id: { type: string, example: fn_V1StGXR8_Z5jdHi6B-myT }
        name: { type: string, example: refund-with-checks }
        description: { type: string, nullable: true }
        environmentId: { type: string, format: uuid }
        currentVersion: { allOf: [{ $ref: '#/components/schemas/FunctionVersion' }], nullable: true, description: Null until the first publish. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    FunctionResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: '#/components/schemas/Function' }

    FunctionListResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data: { type: array, items: { $ref: '#/components/schemas/Function' } }

    PublishFunctionVersionRequest:
      type: object
      additionalProperties: false
      required: [language, source]
      properties:
        language: { type: string, enum: [javascript, python] }
        source: { type: string, minLength: 1, maxLength: 262144, example: 'export default async function run(input, anlyon) { return anlyon.invoke("refund", { order: input.order }); }', description: One module. At most 256 KB. }
        allowedActions: { type: array, maxItems: 100, items: { type: string, pattern: '^[a-zA-Z0-9_-]+$', maxLength: 100 }, example: [refund], description: 'Action names the function may call. Each must exist and be enabled. Omitted, the list is read from the source''s literal `anlyon.invoke("…")` and `anlyon.read("…")` calls; a source that computes an action name, or does not parse, needs it listed (`400 ALLOWED_ACTIONS_REQUIRED`).' }
        inputSchema: { type: object, additionalProperties: true, description: A JSON Schema the run's input must match. }
        budgets: { $ref: '#/components/schemas/FunctionBudgets' }
        straightThrough: { allOf: [{ $ref: '#/components/schemas/FunctionStraightThroughPolicy' }], nullable: true, description: When a run may skip the plan. Omitted or null, a straight-through run reads and does not write. }

    FunctionStraightThroughPolicy:
      type: object
      additionalProperties: false
      required: [actions, maxWrites]
      description: Writes a straight-through run may make without a plan. Every write is still governed and receipted.
      properties:
        actions: { type: array, minItems: 1, maxItems: 100, items: { type: string, pattern: '^[a-zA-Z0-9_-]+$', maxLength: 100 }, example: [send-receipt], description: Allowed actions a straight-through run may write to. Each must be in allowedActions. }
        maxWrites: { type: integer, minimum: 1, maximum: 500, example: 1, description: Writes in one straight-through run. }

    FunctionVersionPublishedResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [function, version]
          properties:
            function: { $ref: '#/components/schemas/Function' }
            version: { $ref: '#/components/schemas/FunctionVersion' }

    RunFunctionRequest:
      type: object
      additionalProperties: false
      properties:
        input: { type: object, additionalProperties: true, example: { order: ord_123 }, description: Passed to `run(input, anlyon)`. Checked against the version's input schema. }
        mode: { type: string, enum: [plan, apply, straight_through], default: plan, description: 'What happens to writes: `plan` records them for approval, `apply` carries out an approved plan, `straight_through` sends them under the version''s straight-through policy.' }
        planRunId: { type: string, maxLength: 100, example: frn_V1StGXR8_Z5jdHi6B-myT, description: 'For `apply`: the approved plan run to carry out. Required with `apply`, and refused with another mode.' }

    FunctionRunCall:
      type: object
      required: [sequence, action, kind, state, invocationId, refusal, plannedSequence, createdAt]
      properties:
        sequence: { type: integer, minimum: 1, example: 1 }
        action: { type: string, example: refund }
        kind: { type: string, enum: [read, write], description: From the action's method. A GET reads. }
        state: { type: string, enum: [intent, dispatched, refused, failed], description: '`intent` is a write a plan run recorded and did not send.' }
        invocationId: { type: string, nullable: true, example: inv_V1StGXR8_Z5jdHi6B-myT, description: The invocation the call became, with its own receipt. }
        refusal: { type: string, nullable: true, example: ACTION_NOT_ALLOWED, description: 'Why the call was refused, when it was. `RUN_DIVERGED` for an apply run''s write that did not match its plan.' }
        plannedSequence: { type: integer, nullable: true, example: 2, description: An apply run's write, the plan run's call it matched. }
        createdAt: { type: string, format: date-time }

    FunctionRunPlan:
      type: object
      required: [digest, writes, approval, appliedByRunId]
      description: The writes a plan run recorded, and the approval they need.
      properties:
        digest: { type: string, example: 'sha256:9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08', description: Covers the version, the input, the end user and every write in order. The approval is bound to it. }
        writes:
          type: array
          items:
            type: object
            required: [sequence, action, input]
            properties:
              sequence: { type: integer, example: 2 }
              action: { type: string, example: refund }
              input: { description: The write's input, as it will be sent. }
        approval:
          type: object
          nullable: true
          description: Null when the plan has no writes. It needs no approval.
          required: [id, status, decider]
          properties:
            id: { type: string, example: apr_V1StGXR8_Z5jdHi6B-myT }
            status: { type: string, enum: [pending, approved, denied, expired] }
            decider: { type: string, enum: [team, end_user] }
        appliedByRunId: { type: string, nullable: true, description: The apply run that carried out the plan. A plan is applied at most once. }

    FunctionRunReceipt:
      type: object
      required: [functionId, functionVersionId, digest, inputDigest, mode, planDigest, approvalId, planRunId, calls, outcome, budget, finishedAt]
      properties:
        functionId: { type: string, example: fn_V1StGXR8_Z5jdHi6B-myT }
        functionVersionId: { type: string, example: fnv_V1StGXR8_Z5jdHi6B-myT }
        digest: { type: string, example: 'sha256:9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08' }
        inputDigest: { type: string, example: 'sha256:9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08' }
        mode: { type: string, enum: [straight_through, plan, apply] }
        planDigest: { type: string, nullable: true, description: A plan run's plan, or the approved plan an apply run carried out. }
        approvalId: { type: string, nullable: true }
        planRunId: { type: string, nullable: true, description: For an apply run, the plan run it carried out. }
        calls:
          type: array
          items:
            type: object
            required: [sequence, action, kind, state, invocationId, refusal, plannedSequence]
            properties:
              sequence: { type: integer, example: 1 }
              action: { type: string, example: refund }
              kind: { type: string, enum: [read, write] }
              state: { type: string, enum: [intent, dispatched, refused, failed] }
              invocationId: { type: string, nullable: true }
              refusal: { type: string, nullable: true }
              plannedSequence: { type: integer, nullable: true }
        outcome: { type: string, enum: [succeeded, failed, budget_exceeded, planned, awaiting_approval, diverged] }
        budget: { type: string, nullable: true, enum: [maxActionCalls, maxCpuMs, maxSubrequests, timeoutMs] }
        finishedAt: { type: string, format: date-time }

    FunctionRun:
      type: object
      required: [id, functionId, functionName, functionVersionId, mode, status, endUserId, input, inputDigest, output, error, logs, budget, actionCalls, calls, plan, planRunId, planDigest, approvalId, receipt, durationMs, createdAt, finishedAt]
      properties:
        id: { type: string, example: frn_V1StGXR8_Z5jdHi6B-myT }
        functionId: { type: string, example: fn_V1StGXR8_Z5jdHi6B-myT }
        functionName: { type: string, example: refund-with-checks }
        functionVersionId: { type: string, example: fnv_V1StGXR8_Z5jdHi6B-myT }
        mode: { type: string, enum: [straight_through, plan, apply] }
        status: { type: string, enum: [running, succeeded, failed, budget_exceeded, planned, awaiting_approval, diverged] }
        endUserId: { type: string, nullable: true, example: user_123, description: The end user the run acted for. Every call carried it. }
        input: { type: object, additionalProperties: true }
        inputDigest: { type: string, example: 'sha256:9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08' }
        output: { nullable: true, description: What `run` returned, when the run succeeded. }
        error:
          type: object
          nullable: true
          required: [code, message]
          properties:
            code: { type: string, example: FUNCTION_THREW }
            message: { type: string }
        logs: { type: array, items: { type: string }, description: Lines from `anlyon.log`. At most 100. }
        budget: { type: string, nullable: true, enum: [maxActionCalls, maxCpuMs, maxSubrequests, timeoutMs], description: The budget that ended the run. }
        actionCalls: { type: integer, minimum: 0, example: 2 }
        calls: { type: array, items: { $ref: '#/components/schemas/FunctionRunCall' } }
        plan: { allOf: [{ $ref: '#/components/schemas/FunctionRunPlan' }], nullable: true, description: A plan run's plan, once it has ended with one. }
        planRunId: { type: string, nullable: true, description: An apply run's plan run. }
        planDigest: { type: string, nullable: true, description: An apply run's approved plan digest. }
        approvalId: { type: string, nullable: true, description: An apply run's plan approval. }
        receipt: { allOf: [{ $ref: '#/components/schemas/FunctionRunReceipt' }], nullable: true }
        durationMs: { type: integer, nullable: true }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true }

    FunctionRunResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: '#/components/schemas/FunctionRun' }

    FunctionVersionListResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/FunctionVersion'
              - type: object
                required: [current]
                properties:
                  current: { type: boolean, description: The version runs use. }

    FunctionVersionDetailResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          allOf:
            - $ref: '#/components/schemas/FunctionVersion'
            - type: object
              required: [current, source]
              properties:
                current: { type: boolean, description: The version runs use. }
                source: { type: string, description: The source the version runs. }

    FunctionRunListResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: array
          items:
            type: object
            required: [id, functionVersionId, version, mode, status, endUserId, actionCalls, budget, error, approvalId, durationMs, createdAt, finishedAt]
            properties:
              id: { type: string, example: frn_V1StGXR8_Z5jdHi6B-myT }
              functionVersionId: { type: string, example: fnv_V1StGXR8_Z5jdHi6B-myT }
              version: { type: integer, minimum: 1, example: 1 }
              mode: { type: string, enum: [straight_through, plan, apply] }
              status: { type: string, enum: [running, succeeded, failed, budget_exceeded, planned, awaiting_approval, diverged] }
              endUserId: { type: string, nullable: true }
              actionCalls: { type: integer, minimum: 0 }
              budget: { type: string, nullable: true, enum: [maxActionCalls, maxCpuMs, maxSubrequests, timeoutMs] }
              error:
                type: object
                nullable: true
                required: [code, message]
                properties:
                  code: { type: string }
                  message: { type: string }
              approvalId: { type: string, nullable: true, description: A plan run's approval, or the approval an apply run carries out. }
              durationMs: { type: integer, nullable: true }
              createdAt: { type: string, format: date-time }
              finishedAt: { type: string, format: date-time, nullable: true }

    CreateEndUserConnectLinkRequest:
      type: object
      additionalProperties: false
      required: [integration]
      properties:
        integration: { type: string, pattern: '^[a-z][a-z0-9-]{0,63}$', example: gmail, description: 'An OAuth integration from the catalogue. On `POST /api/v2/end-user-session/connect-links`, also the `mcp-<id>` key a 409 named for an MCP server.' }
        redirectUrl: { type: string, maxLength: 2048, example: 'https://app.example.com/settings/connections', description: Where the browser goes when consent ends. Must fall under one of the environment's allowed redirect URLs. Defaults to the environment's default redirect URL. }

    EndUserConnectLinkResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [url, expiresAt, integration]
          properties:
            url: { type: string, format: uri, description: Send the end user here. Works once, for 10 minutes. }
            expiresAt: { type: string, format: date-time }
            integration: { type: string, example: gmail }

    ConfirmEndUserConnectionRequest:
      type: object
      additionalProperties: false
      required: [flowId]
      properties:
        flowId: { type: string, maxLength: 64, example: flw_3kTq9ZbW2xYv8RmNcPd5LsA1hGfE7j, description: The `anlyon_flow` your redirect received. }

    ConfirmEndUserConnectionResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [integration, status]
          properties:
            integration: { type: string, example: gmail }
            status: { type: string, enum: [active] }

    SetEndUserConnectionRequest:
      type: object
      additionalProperties: false
      description: >-
        `token` for an integration connected with one key; `fields` for one whose `auth.fields` is
        set (a key made of several values, or a per-account host), by those names. One or the other.
      properties:
        token: { type: string, minLength: 1, maxLength: 4096, writeOnly: true, description: The end user's own API key for the integration. Never returned. }
        fields: { $ref: '#/components/schemas/ConnectionFieldValues' }

    EndUserSummary:
      type: object
      required: [endUserId, connections, invocations, pendingApprovals]
      properties:
        endUserId: { type: string, example: user_123 }
        connections: { type: integer, minimum: 0 }
        invocations: { type: integer, minimum: 0 }
        pendingApprovals: { type: integer, minimum: 0, description: Pending approvals of calls made for this end user, whoever decides them. }

    EndUserListResponse:
      type: object
      required: [success, data, pagination]
      properties:
        success: { type: boolean, enum: [true] }
        data: { type: array, items: { $ref: '#/components/schemas/EndUserSummary' } }
        pagination:
          type: object
          required: [nextCursor]
          properties:
            nextCursor: { type: string, nullable: true, description: Pass as `cursor` for the next page. Null on the last page. }

    EndUserErasureResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [connectionsDeleted, approvalsCancelled, countersCleared, erasedAs]
          properties:
            connectionsDeleted: { type: integer, minimum: 0 }
            approvalsCancelled: { type: integer, minimum: 0 }
            countersCleared: { type: integer, minimum: 0 }
            erasedAs: { type: string, example: erased~5f13b7c7de7d0af85029c02dc1a63ef7, description: The one-way hash the kept records now carry in place of the id. }

    DecideEndUserApprovalRequest:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision: { type: string, enum: [approve, deny] }
        reason: { type: string, maxLength: 1000, description: Recorded as the decision note. }

    EndUserApprovalDecisionResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [approval]
          properties:
            approval: { $ref: '#/components/schemas/Approval' }
            invocation: { $ref: '#/components/schemas/Invocation' }

    CreateEndUserSessionRequest:
      type: object
      additionalProperties: false
      properties:
        ttlSeconds: { type: integer, minimum: 60, maximum: 3600, default: 900, description: How long the token lasts. Never past the key's own expiry. }

    EndUserSessionResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [token, expiresAt, endUserId, capabilities]
          properties:
            token: { type: string, example: eus_v1_example_session_token, description: 'Send as `Authorization: Bearer <token>` to /api/v2/end-user-session. Never put it in a URL or storage.' }
            expiresAt: { type: string, format: date-time }
            endUserId: { type: string, example: user_123 }
            capabilities: { type: array, items: { type: string, enum: [connections, approvals] }, description: '`connections` lists, connects and disconnects; `approvals` lists and decides, granted only when the key has `end-users:approvals`.' }

    SessionEndUserConnection:
      allOf:
        - $ref: '#/components/schemas/EndUserConnection'
        - type: object
          required: [displayName]
          properties:
            displayName: { type: string, example: Gmail }

    SessionEndUserConnectionListResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data: { type: array, items: { $ref: '#/components/schemas/SessionEndUserConnection' } }

    SessionApproval:
      type: object
      description: What the end user needs to decide, and nothing that identifies your keys, people, policies or internal ids.
      required: [id, kind, status, title, description, actionName, input, preview, decisionNote, expiresAt, decidedAt, createdAt]
      properties:
        id: { type: string, example: apr_01J9ZK3Q2W }
        kind: { type: string, enum: [action, custom, function_plan] }
        status: { type: string, enum: [pending, approved, denied, expired] }
        title: { type: string, example: Run action "gmail-send" }
        description: { type: string, nullable: true }
        actionName: { type: string, nullable: true, example: gmail-send }
        input: { type: object, nullable: true, additionalProperties: true, description: The action's input, or a custom approval's details. }
        preview:
          type: object
          nullable: true
          description: >-
            The end user's view of the preview: the exact change and whether it can be undone. The
            operator's detail (where it executes, the adapter, its guarantees and recovery) is left
            out; it stays on the team's approval and preview routes.
          required: [target, blocks, impact, reversible, undo, expiresAt]
          properties:
            target:
              type: object
              required: [account, display]
              properties:
                account: { type: string, nullable: true }
                display: { type: object, additionalProperties: { type: string } }
            blocks: { type: array, description: The adapter's own fields and diffs. Never a `limitations` block. Empty for a declared action, whose input is the change., items: { $ref: '#/components/schemas/PreviewBlock' } }
            impact: { type: array, items: { $ref: '#/components/schemas/ImpactQuantity' } }
            reversible: { type: boolean, description: Whether the change can be undone afterwards. }
            undo: { type: string, description: The same as one short line for the end user., example: This can't be undone once it runs. }
            expiresAt: { type: string, format: date-time }
        decisionNote: { type: string, nullable: true }
        expiresAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    SessionApprovalResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: '#/components/schemas/SessionApproval' }

    SessionApprovalListResponse:
      type: object
      required: [success, data, pagination]
      properties:
        success: { type: boolean, enum: [true] }
        data: { type: array, items: { $ref: '#/components/schemas/SessionApproval' } }
        pagination: { $ref: '#/components/schemas/OffsetPagination' }

    SessionApprovalDecisionResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [approval]
          properties:
            approval: { $ref: '#/components/schemas/SessionApproval' }
            result:
              type: object
              description: Present when approving ran the parked call.
              required: [status]
              properties:
                status: { type: string, example: succeeded }

    EnvironmentOAuthApp:
      type: object
      required: [integration, configured, clientId, redirectUri, createdAt, updatedAt]
      properties:
        integration: { type: string, example: gmail }
        configured: { type: boolean, description: Whether this environment uses its own app for the integration. }
        clientId: { type: string, nullable: true }
        redirectUri: { type: string, format: uri, description: The redirect URI to register with the provider for this app. }
        createdAt: { type: string, format: date-time, nullable: true }
        updatedAt: { type: string, format: date-time, nullable: true }

    EnvironmentOAuthAppResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: '#/components/schemas/EnvironmentOAuthApp' }

    EnvironmentOAuthAppListResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data: { type: array, items: { $ref: '#/components/schemas/EnvironmentOAuthApp' } }

    EnvironmentOAuthAppDeletedResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [deleted, affectedConnections]
          properties:
            deleted: { type: boolean }
            affectedConnections: { type: integer, minimum: 0, description: Accounts the removed app issued, which now need a reconnect. }

    SetEnvironmentOAuthAppRequest:
      type: object
      additionalProperties: false
      required: [clientId, clientSecret]
      properties:
        clientId: { type: string, minLength: 1, maxLength: 256, pattern: '^\S+$' }
        clientSecret: { type: string, minLength: 1, maxLength: 1024, writeOnly: true, description: Encrypted at rest and never returned. }

    Error:
      type: object
      required: [success, error, requestId]
      properties:
        success:
          type: boolean
          example: false
        requestId:
          type: string
          description: Correlation ID matching the X-Request-Id response header.
          example: req_0123456789abcdef0123456789abcdef
        error:
          type: object
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: Invalid request data
            details:
              type: object
            fix:
              $ref: '#/components/schemas/ErrorFix'

    ErrorFix:
      type: object
      description: >-
        How to get past this error, for a person or an agent. Present on refusals with a known next
        step, such as a missing scope or role, a plan or billing limit, a halted environment, or a
        missing secret, connected account, OAuth app or end-user header. Absent when there is no fix to
        give. Kept in production responses, unlike `details`.
      required: [summary]
      properties:
        summary:
          type: string
          description: One sentence that says what to do.
          example: Log in again and approve the anlyon:secrets consent group, which grants secrets:write.
        command:
          type: string
          description: An exact `anlyon` CLI command that fixes it. Absent when no command does.
          example: anlyon auth login --scope anlyon:secrets
        url:
          type: string
          format: uri
          description: An absolute console link where a person fixes it.
          example: https://console.anlyon.com/settings/api-keys
        docs:
          type: string
          format: uri
          description: A docs page that explains it.
          example: https://docs.anlyon.com/cli/authentication

    SsoConnection:
      type: object
      required: [workspaceId, providerId, protocol, issuer, domains, domainsVerified, domainsVerifiedAt, verificationRecords, enforced, defaultRole, serviceProvider, createdAt, updatedAt]
      properties:
        workspaceId: { type: string, format: uuid }
        providerId: { type: string, example: anlyon-0123456789abcdef }
        protocol: { type: string, enum: [oidc, saml] }
        issuer: { type: string, example: 'https://acme.okta.com' }
        domains: { type: array, items: { type: string, example: acme.com } }
        domainsVerified: { type: boolean }
        domainsVerifiedAt: { type: string, format: date-time, nullable: true }
        verificationRecords:
          type: array
          items:
            type: object
            required: [domain, name, type, value]
            properties:
              domain: { type: string, example: acme.com }
              name: { type: string, example: _anlyon-sso.acme.com }
              type: { type: string, enum: [TXT] }
              value: { type: string, example: anlyon-sso-verification=example }
        enforced: { type: boolean }
        defaultRole: { type: string, description: 'Any workspace role.', example: member }
        serviceProvider:
          type: object
          description: What to enter in the identity provider.
          properties:
            oidcRedirectUri: { type: string }
            samlAcsUrl: { type: string }
            samlEntityId: { type: string }
            samlMetadataUrl: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    SsoConnectionResponse:
      type: object
      required: [success, data]
      properties: { success: { type: boolean, enum: [true] }, data: { $ref: '#/components/schemas/SsoConnection' } }

    SsoConnectionOrNullResponse:
      type: object
      required: [success, data]
      properties: { success: { type: boolean, enum: [true] }, data: { allOf: [{ $ref: '#/components/schemas/SsoConnection' }], nullable: true } }

    CreateSsoConnectionRequest:
      type: object
      required: [protocol, domains]
      description: Send `oidc` when protocol is oidc, `saml` when protocol is saml.
      properties:
        protocol: { type: string, enum: [oidc, saml] }
        domains: { type: array, minItems: 1, maxItems: 20, items: { type: string, maxLength: 253, example: acme.com } }
        defaultRole: { type: string, description: 'Role for a first SSO sign-in when no SCIM directory is connected. Any workspace role.', example: member }
        oidc:
          type: object
          required: [issuer, clientId, clientSecret]
          properties:
            issuer: { type: string, format: uri, example: 'https://acme.okta.com' }
            clientId: { type: string, maxLength: 500, example: '<your-client-id>' }
            clientSecret: { type: string, maxLength: 2000, writeOnly: true, example: '<your-client-secret>' }
        saml:
          type: object
          required: [entityId, ssoUrl, certificate]
          properties:
            entityId: { type: string, format: uri, example: 'http://www.okta.com/exk0000000000000000' }
            ssoUrl: { type: string, format: uri, example: 'https://acme.okta.com/app/acme/sso/saml' }
            certificate: { type: string, minLength: 20, maxLength: 20000, description: 'The signing certificate, PEM or base64.', example: '<your-idp-signing-certificate>' }
            emailAttribute: { type: string, maxLength: 300, description: 'Assertion attribute holding the email. Default `email`.' }
            nameAttribute: { type: string, maxLength: 300, description: 'Assertion attribute holding the display name. Default `displayName`.' }

    UpdateSsoConnectionRequest:
      type: object
      properties:
        enforced: { type: boolean }
        defaultRole: { type: string, example: member }

    ScimSettings:
      type: object
      required: [connected, baseUrl, tokenPrefix, defaultRole, createdAt, rotatedAt, lastUsedAt, roleMappings]
      properties:
        connected: { type: boolean }
        baseUrl: { type: string, example: 'https://api.anlyon.com/api/v2/scim' }
        tokenPrefix: { type: string, nullable: true, example: anlyon_scim_abcdef }
        defaultRole: { type: string, example: member }
        createdAt: { type: string, format: date-time, nullable: true }
        rotatedAt: { type: string, format: date-time, nullable: true }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        roleMappings: { type: array, items: { $ref: '#/components/schemas/ScimRoleMapping' } }

    ScimRoleMapping:
      type: object
      required: [groupName, role, priority]
      properties:
        groupName: { type: string, maxLength: 256, example: Anlyon Admins }
        role: { type: string, description: 'Any workspace role.', example: admin }
        priority: { type: integer, minimum: -1000, maximum: 1000, example: 10 }

    ScimSettingsResponse:
      type: object
      required: [success, data]
      properties: { success: { type: boolean, enum: [true] }, data: { $ref: '#/components/schemas/ScimSettings' } }

    ScimTokenResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [token, settings]
          properties:
            token: { type: string, description: 'Shown once. Only its hash is stored.', example: anlyon_scim_example }
            settings: { $ref: '#/components/schemas/ScimSettings' }

    UpdateScimSettingsRequest:
      type: object
      required: [defaultRole]
      properties:
        defaultRole: { type: string, example: member }

    ReplaceScimRoleMappingsRequest:
      type: object
      required: [mappings]
      properties:
        mappings:
          type: array
          maxItems: 100
          items:
            type: object
            required: [groupName, role]
            properties:
              groupName: { type: string, minLength: 1, maxLength: 256, example: Anlyon Admins }
              role: { type: string, example: admin }
              priority: { type: integer, minimum: -1000, maximum: 1000, example: 10 }

    ScimUser:
      type: object
      required: [userName]
      properties:
        schemas: { type: array, items: { type: string, example: 'urn:ietf:params:scim:schemas:core:2.0:User' } }
        externalId: { type: string, example: 00u0000000000000000 }
        userName: { type: string, example: jane@acme.com }
        name: { type: object, properties: { formatted: { type: string }, givenName: { type: string }, familyName: { type: string } } }
        displayName: { type: string, example: Jane Doe }
        emails: { type: array, items: { type: object, properties: { value: { type: string, example: jane@acme.com }, primary: { type: boolean }, type: { type: string, example: work } } } }
        active: { type: boolean }

    ScimGroup:
      type: object
      required: [displayName]
      properties:
        schemas: { type: array, items: { type: string, example: 'urn:ietf:params:scim:schemas:core:2.0:Group' } }
        externalId: { type: string }
        displayName: { type: string, example: Anlyon Admins }
        members: { type: array, items: { type: object, required: [value], properties: { value: { type: string, format: uuid }, display: { type: string } } } }

    ScimPatchRequest:
      type: object
      required: [schemas, Operations]
      properties:
        schemas: { type: array, items: { type: string, example: 'urn:ietf:params:scim:api:messages:2.0:PatchOp' } }
        Operations:
          type: array
          minItems: 1
          items:
            type: object
            required: [op]
            properties:
              op: { type: string, description: 'add, replace or remove, in any case.', example: replace }
              path: { type: string, example: active }
              value: { description: 'The new value. For an operation without a path, an object of attributes.' }

    ScimListResponse:
      type: object
      required: [schemas, totalResults, startIndex, itemsPerPage, Resources]
      properties:
        schemas: { type: array, items: { type: string, example: 'urn:ietf:params:scim:api:messages:2.0:ListResponse' } }
        totalResults: { type: integer }
        startIndex: { type: integer }
        itemsPerPage: { type: integer }
        Resources: { type: array, items: { type: object, additionalProperties: true } }

    ScimErrorBody:
      type: object
      required: [schemas, status, detail]
      properties:
        schemas: { type: array, items: { type: string, example: 'urn:ietf:params:scim:api:messages:2.0:Error' } }
        status: { type: string, example: '409' }
        scimType: { type: string, enum: [invalidFilter, uniqueness, mutability, invalidSyntax, invalidValue, noTarget] }
        detail: { type: string }

    AuditCategory:
      type: string
      enum: [approval, invocation, policy, action, access, environment, connection, limit, audit]

    AuditActor:
      type: object
      required: [type, id]
      properties:
        type: { type: string, enum: [user, api_key, oauth_client, assistant, policy, system] }
        id: { type: string, nullable: true, description: User id, API key id, OAuth client id or policy id. Null for the system. }
        onBehalfOf: { type: string, nullable: true, description: For an OAuth client, the user it acted for. }

    AuditEvent:
      type: object
      description: >-
        One audit record, schema `anlyon.audit.v1`. `id` is stable across retries, redeliveries,
        sinks and exports: deduplicate on it. `sequence` orders records within one deployment and is
        not a dedup key.
      required: [schema, id, sequence, type, category, occurredAt, workspaceId, environmentId, actor, resource, outcome, data, context]
      properties:
        schema: { type: string, enum: [anlyon.audit.v1] }
        id: { type: string, example: aud_V1StGXR8Z5jdHi6BmyT4a9Qe }
        sequence: { type: integer, example: 1042 }
        type: { type: string, example: approval.vote }
        category: { $ref: '#/components/schemas/AuditCategory' }
        occurredAt: { type: string, format: date-time }
        workspaceId: { type: string, format: uuid }
        environmentId: { type: string, format: uuid, nullable: true, description: Null for workspace-level records such as members and keys. }
        actor: { $ref: '#/components/schemas/AuditActor' }
        resource:
          type: object
          nullable: true
          required: [type, id]
          properties: { type: { type: string, example: approval }, id: { type: string, example: apr_123 } }
        outcome: { type: string, nullable: true, example: approve }
        data: { type: object, additionalProperties: true, description: Type-specific detail. Invocation records carry a `receipt`; approval records carry the policy decision. }
        context:
          type: object
          nullable: true
          properties: { requestId: { type: string }, ip: { type: string }, userAgent: { type: string } }
        test: { type: boolean, enum: [true], description: Present only on a test event. }
        backfilled: { type: boolean, enum: [true], description: Present only on a record created from history by the one-time backfill, with the original time. }
        endUserId: { type: string, description: 'Present only on a record of an act for one of your end users. `erased~<hash>` once that end user is erased.' }

    AuditEventListResponse:
      type: object
      required: [success, data, pagination]
      properties:
        success: { type: boolean, enum: [true] }
        data: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } }
        pagination:
          type: object
          required: [nextBefore]
          properties: { nextBefore: { type: integer, nullable: true, description: Pass as `before` for the next page. Null on the last page. } }

    AuditExportDocument:
      type: object
      required: [schema, generatedAt, workspaceId, filters, events, count]
      properties:
        schema: { type: string, enum: [anlyon.audit.export.v1] }
        generatedAt: { type: string, format: date-time }
        workspaceId: { type: string, format: uuid }
        filters: { type: object, additionalProperties: true }
        events: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } }
        count: { type: integer }

    AuditSchemaResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [schema, jsonSchema, eventTypes]
          properties:
            schema: { type: string, enum: [anlyon.audit.v1] }
            jsonSchema: { type: object, additionalProperties: true }
            eventTypes: { type: object, additionalProperties: { type: array, items: { type: string } } }

    AuditSettings:
      type: object
      required: [retentionDays, planRetentionMonths, retentionGraceUntil, hotDays, archiveAvailable, minRetentionDays, maxRetentionDays, allowPrivateDestinations, privateDestinationsAvailable, schema, updatedAt]
      properties:
        retentionDays: { type: integer, nullable: true, description: "The workspace's own window. Null keeps records for the plan's retention; a longer window is held to it." }
        planRetentionMonths: { type: integer, nullable: true, description: Months the plan (or an Enterprise contract) keeps audit records. Null where the deployment sets no plan retention., example: 6 }
        retentionGraceUntil: { type: string, format: date-time, nullable: true, description: Until then a shorter plan retention (after a downgrade) deletes nothing yet. }
        hotDays: { type: integer, description: Days records stay in the console's list before they move to the audit archive. Exports include archived records., example: 90 }
        archiveAvailable: { type: boolean, description: Whether this deployment moves older records to the audit archive. }
        allowPrivateDestinations: { type: boolean, description: The stored setting. In effect only when privateDestinationsAvailable. }
        privateDestinationsAvailable: { type: boolean, description: "Whether a workspace admin may turn private destinations on. False on cloud, where the SSRF rules always apply, and on a self-hosted install whose instance admins set network.private_destinations to off." }
        minRetentionDays: { type: integer, example: 30 }
        maxRetentionDays: { type: integer, example: 3650 }
        schema: { type: string, enum: [anlyon.audit.v1] }
        updatedAt: { type: string, format: date-time, nullable: true }

    AuditSettingsResponse:
      type: object
      required: [success, data]
      properties: { success: { type: boolean, enum: [true] }, data: { $ref: '#/components/schemas/AuditSettings' } }

    UpdateAuditSettingsRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        retentionDays: { type: integer, nullable: true, minimum: 30, maximum: 3650 }
        allowPrivateDestinations: { type: boolean, description: "Self-hosted only. true is refused on cloud, and where the instance admins set network.private_destinations to off." }

    AuditSink:
      type: object
      required: [sinkId, name, type, config, credentialsHint, enabled, eventTypes, environmentIds, includeHistory, status, attempts, nextAttemptAt, lastError, lastAttemptAt, lastSuccessAt, deliveredCount, openDeadLetters, createdAt, updatedAt]
      properties:
        sinkId: { type: string, example: asink_V1StGXR8Z5jdHi6BmyT4a }
        name: { type: string }
        type: { type: string, enum: [webhook, s3, datadog, splunk] }
        config: { type: object, additionalProperties: true, description: Non-secret settings. }
        credentialsHint: { type: string, nullable: true, description: A recognisable fragment, never enough to use. }
        enabled: { type: boolean }
        eventTypes: { type: array, items: { type: string }, example: ['*'] }
        environmentIds: { type: array, nullable: true, items: { type: string, format: uuid }, description: Null delivers every environment. Workspace-level records are always delivered. }
        includeHistory: { type: boolean, description: Also deliver records the backfill created from history. }
        status: { type: string, enum: [active, retrying, disabled] }
        attempts: { type: integer, description: Consecutive failed attempts on the batch at the cursor. }
        nextAttemptAt: { type: string, format: date-time }
        lastError: { type: string, nullable: true }
        lastAttemptAt: { type: string, format: date-time, nullable: true }
        lastSuccessAt: { type: string, format: date-time, nullable: true }
        deliveredCount: { type: integer }
        openDeadLetters: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AuditSinkWithSecret:
      allOf:
        - $ref: '#/components/schemas/AuditSink'
        - type: object
          properties:
            signingSecret: { type: string, description: 'Webhook sinks only, on create and on rotation: the Anlyon-Signature secret. Not shown again.' }

    AuditSinkResponse:
      type: object
      required: [success, data]
      properties: { success: { type: boolean, enum: [true] }, data: { $ref: '#/components/schemas/AuditSink' } }

    AuditSinkWithSecretResponse:
      type: object
      required: [success, data]
      properties: { success: { type: boolean, enum: [true] }, data: { $ref: '#/components/schemas/AuditSinkWithSecret' } }

    AuditSinkListResponse:
      type: object
      required: [success, data]
      properties: { success: { type: boolean, enum: [true] }, data: { type: array, items: { $ref: '#/components/schemas/AuditSink' } } }

    AuditSinkDeletedResponse:
      type: object
      required: [success, data]
      properties: { success: { type: boolean, enum: [true] }, data: { type: object, required: [deleted], properties: { deleted: { type: boolean, enum: [true] } } } }

    CreateAuditSinkRequest:
      type: object
      additionalProperties: false
      required: [name, type, config]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        type: { type: string, enum: [webhook, s3, datadog, splunk] }
        config:
          type: object
          additionalProperties: true
          description: >-
            webhook: `{ url }` (https). s3: `{ bucket, region, endpoint?, prefix?, forcePathStyle? }`;
            `endpoint` for an S3-compatible store. datadog: `{ site, service?, tags? }`. splunk:
            `{ url, index?, sourcetype?, source? }` with `url` the HEC base URL.
        credentials:
          type: object
          additionalProperties: true
          description: >-
            Not for webhook, whose secret is generated. s3: `{ accessKeyId, secretAccessKey,
            sessionToken? }`. datadog: `{ apiKey }`. splunk: `{ token }`.
        enabled: { type: boolean, default: true }
        eventTypes: { type: array, maxItems: 50, items: { type: string, maxLength: 100 }, description: 'Event types or prefixes, for example `approval.*`. Default `*`.' }
        environmentIds: { type: array, nullable: true, maxItems: 50, items: { type: string, format: uuid } }
        startFrom: { type: string, enum: [now, beginning], default: now, description: '`beginning` sends every retained record first.' }
        includeHistory: { type: boolean, default: false, description: 'Also deliver records the backfill created from history (`backfilled: true`).' }

    UpdateAuditSinkRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        config: { type: object, additionalProperties: true }
        credentials: { type: object, additionalProperties: true }
        enabled: { type: boolean }
        eventTypes: { type: array, maxItems: 50, items: { type: string, maxLength: 100 } }
        environmentIds: { type: array, nullable: true, maxItems: 50, items: { type: string, format: uuid } }
        rotateSigningSecret: { type: boolean }
        includeHistory: { type: boolean }

    AuditSendResult:
      type: object
      required: [ok, status, error, durationMs]
      properties:
        ok: { type: boolean }
        status: { type: integer, nullable: true, description: The destination's HTTP status. Null when no response arrived. }
        error: { type: string, nullable: true }
        durationMs: { type: integer }
        location: { type: string, description: S3 only, the object key written. }

    AuditSendResultResponse:
      type: object
      required: [success, data]
      properties: { success: { type: boolean, enum: [true] }, data: { $ref: '#/components/schemas/AuditSendResult' } }

    AuditDeadLetter:
      type: object
      required: [id, eventCount, firstEventId, lastEventId, attempts, lastError, createdAt, lastRetryAt, redeliveredAt]
      properties:
        id: { type: string, format: uuid }
        eventCount: { type: integer }
        firstEventId: { type: string }
        lastEventId: { type: string }
        attempts: { type: integer }
        lastError: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        lastRetryAt: { type: string, format: date-time, nullable: true }
        redeliveredAt: { type: string, format: date-time, nullable: true }

    AuditDeadLetterListResponse:
      type: object
      required: [success, data]
      properties: { success: { type: boolean, enum: [true] }, data: { type: array, items: { $ref: '#/components/schemas/AuditDeadLetter' } } }

    AuditRedeliveryResultResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [deadLetter, result]
          properties: { deadLetter: { $ref: '#/components/schemas/AuditDeadLetter' }, result: { $ref: '#/components/schemas/AuditSendResult' } }

    DLQMessage:
      type: object
      description: Public failed-delivery diagnostics. Tenant-internal database and event-join identifiers are excluded.
      required: [messageId, url, method, headers, body, status, scheduledFor, attempts, maxRetries, responseStatus, responseBody, errorMessage, deliveredAt, failedAt, callbackUrl, failureCallbackUrl, createdAt, updatedAt]
      properties:
        messageId: { type: string, pattern: '^msg_' }
        url: { type: string, format: uri }
        method: { type: string, enum: [GET, POST, PUT, PATCH, DELETE] }
        headers: { type: object, nullable: true, additionalProperties: true }
        body: { nullable: true, description: Original JSON delivery body. }
        status: { type: string, enum: [failed] }
        scheduledFor: { type: string, format: date-time, nullable: true }
        attempts: { type: integer, minimum: 0, nullable: true }
        maxRetries: { type: integer, minimum: 0, nullable: true }
        responseStatus: { type: integer, minimum: 100, maximum: 599, nullable: true }
        responseBody: { type: string, nullable: true }
        errorMessage: { type: string, nullable: true }
        deliveredAt: { type: string, format: date-time, nullable: true }
        failedAt: { type: string, format: date-time, nullable: true }
        callbackUrl: { type: string, format: uri, nullable: true }
        failureCallbackUrl: { type: string, format: uri, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    DLQMessageResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: '#/components/schemas/DLQMessage' }

    DLQMessageListResponse:
      type: object
      required: [success, data, pagination]
      properties:
        success: { type: boolean, enum: [true] }
        data: { type: array, items: { $ref: '#/components/schemas/DLQMessage' } }
        pagination: { $ref: '#/components/schemas/OffsetPagination' }

    DLQStatsResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [totalFailed, oldestFailure, newestFailure]
          properties:
            totalFailed: { type: integer, minimum: 0 }
            oldestFailure: { type: string, format: date-time, nullable: true }
            newestFailure: { type: string, format: date-time, nullable: true }

    DLQRetryResultResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [message, messageId]
          properties:
            message: { type: string }
            messageId: { type: string, pattern: '^msg_' }

    DLQRetryAllResultResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [message, retriedCount, remaining]
          properties:
            message: { type: string }
            retriedCount: { type: integer, minimum: 0 }
            remaining:
              type: integer
              minimum: 0
              description: Failed messages still in this environment's DLQ after the call. Call again to continue.

    DLQClearResultResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [message, deletedCount, remaining]
          properties:
            message: { type: string }
            deletedCount: { type: integer, minimum: 0 }
            remaining:
              type: integer
              minimum: 0
              description: Failed messages still in this environment's DLQ after the call. Call again to continue.

    SandboxEchoResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [receivedAt, method, authorization, contentType, body]
          properties:
            receivedAt: { type: string, format: date-time }
            method: { type: string, example: POST }
            authorization: { type: string, nullable: true, description: 'The Authorization header as received. Through an action it is a vault secret, redacted by Anlyon before the invocation is stored., example: ''Bearer [REDACTED]''' }
            contentType: { type: string, nullable: true, example: application/json }
            body: { description: 'The parsed JSON body, the raw text when it is not JSON, or null when empty., nullable: true' }

    SandboxTokenResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [token]
          properties:
            token: { type: string, description: 'A throwaway value signed for the calling workspace. Store it as a vault secret and send it only to the sandbox., example: demo_sk_v1.d3NfMTIz.q0vW3m8cS5Yb2k9L.Xy3Q1f0yq8S2mZr9vH6c1n0pT5aLw4eJ7uB2dK8sR1Q' }

  responses:
    SignOffRequired:
      description: >-
        Accepted, not applied: the change loosens a guardrail, so a workspace admin has to approve it.
        `Location` is the request to poll.
      headers:
