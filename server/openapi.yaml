    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/WorkspaceId' }]
    get:
      tags: [Single sign-on]
      summary: Get the workspace identity provider
      description: >-
        Requires the admin role or higher. `data` is null when no provider is configured. Enterprise
        edition: on an edition without single sign-on this answers 404 `FEATURE_NOT_IN_EDITION`, or
        404 `SSO_ENFORCEMENT_SUSPENDED` when the workspace required single sign-on, which then no
