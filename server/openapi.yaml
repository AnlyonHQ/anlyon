      description: >-
        Requires the admin role or higher. One OIDC or SAML provider per workspace. For OIDC, Anlyon
        fetches the issuer's discovery document. Sign-in through the provider is refused until every
        domain publishes the TXT record in `verificationRecords` and `verify-domains` succeeds. A
        domain another workspace already uses is refused with 409. Enterprise edition.
