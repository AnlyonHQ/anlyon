      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-scopes: []
      x-anlyon-idempotency: unsupported
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateSsoConnectionRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/SsoConnection' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
    patch:
      tags: [Single sign-on]
      summary: Require single sign-on or change the default role
      description: >-
        Requires the admin role; changing `enforced` requires an admin with emergency access. Turning
        enforcement on needs verified domains (422 `DOMAIN_NOT_VERIFIED`). No session is ended: while
        enforced, a password or social sign-in by a member without emergency access is refused with
        `SSO_REQUIRED`, and a session not created through this provider gets 403 `SSO_REQUIRED` at this
        workspace only. Admins with emergency access keep password and two-factor sign-in, the way back
        in if the provider fails. Enterprise edition.
      operationId: updateWorkspaceSsoConnection
      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-scopes: []
      x-anlyon-idempotency: unsupported
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateSsoConnectionRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/SsoConnection' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/DomainNotVerified' } }
    delete:
      tags: [Single sign-on]
      summary: Remove the workspace identity provider
      description: Requires the admin role, and emergency access when single sign-on is required. Removing the provider lifts enforcement. Enterprise edition.
      operationId: deleteWorkspaceSsoConnection
      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-scopes: []
      x-anlyon-idempotency: unsupported
      responses: { '200': { $ref: '#/components/responses/MessageResult' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }

  /api/v2/workspaces/{workspaceId}/sso/verify-domains:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/WorkspaceId' }]
    post:
      tags: [Single sign-on]
      summary: Verify the identity provider's email domains
      description: >-
        Requires the admin role or higher. Looks up the `_anlyon-sso.<domain>` TXT record of every
        domain. All must match, else 422 `DOMAIN_NOT_VERIFIED` with the missing domains in
        `error.details.domains`. Enterprise edition.
      operationId: verifyWorkspaceSsoDomains
      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-scopes: []
      x-anlyon-idempotency: unsupported
      responses: { '200': { $ref: '#/components/responses/SsoConnection' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/DomainNotVerified' } }

  /api/v2/workspaces/{workspaceId}/scim:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/WorkspaceId' }]
    get:
      tags: [SCIM]
      summary: Get the SCIM directory settings
      description: Requires the admin role or higher. The token itself is never returned here. Enterprise edition.
      operationId: getWorkspaceScimSettings
      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-scopes: []
      responses: { '200': { $ref: '#/components/responses/ScimSettings' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
    patch:
      tags: [SCIM]
      summary: Set the role for people in no mapped group
      description: Requires the admin role or higher. Re-applies every provisioned member's role. Enterprise edition.
      operationId: updateWorkspaceScimSettings
      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-scopes: []
      x-anlyon-idempotency: unsupported
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateScimSettingsRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/ScimSettings' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }

  /api/v2/workspaces/{workspaceId}/scim/token:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/WorkspaceId' }]
    post:
      tags: [SCIM]
      summary: Create or rotate the SCIM token
      description: >-
        Requires the admin role or higher. Returns the bearer token once; only its hash is stored.
        Rotating stops the previous token at once. Enterprise edition.
      operationId: issueWorkspaceScimToken
      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-scopes: []
      x-anlyon-idempotency: unsupported
      responses: { '201': { $ref: '#/components/responses/ScimToken' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
    delete:
      tags: [SCIM]
      summary: Disconnect the SCIM directory
      description: Requires the admin role or higher. The token stops working; provisioned members stay members. Enterprise edition.
      operationId: revokeWorkspaceScimToken
      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-scopes: []
      x-anlyon-idempotency: unsupported
      responses: { '200': { $ref: '#/components/responses/MessageResult' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }

  /api/v2/workspaces/{workspaceId}/scim/role-mappings:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/WorkspaceId' }]
    put:
      tags: [SCIM]
      summary: Replace the group-to-role mappings
      description: >-
        Requires the admin role or higher. A directory group (matched by displayName, ignoring case)
        maps to any workspace role. A person in several mapped groups gets the mapping
        with the highest priority; ties go to the earlier mapping in the list. Re-applies every
        provisioned member's role. Enterprise edition.
      operationId: replaceWorkspaceScimRoleMappings
      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-scopes: []
      x-anlyon-idempotency: unsupported
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReplaceScimRoleMappingsRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/ScimSettings' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }

  /api/v2/scim/ServiceProviderConfig:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    get:
      tags: [SCIM]
      summary: SCIM service provider configuration
      description: RFC 7644 section 4.
      operationId: getScimServiceProviderConfig
      security: [{ ScimBearer: [] }]
      x-anlyon-audience: identity-provider
      x-anlyon-scopes: []
      x-anlyon-response-envelope: scim
      responses: { '200': { $ref: '#/components/responses/ScimResource' }, '401': { $ref: '#/components/responses/ScimError' } }

  /api/v2/scim/ResourceTypes:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    get:
      tags: [SCIM]
      summary: SCIM resource types
      operationId: listScimResourceTypes
      security: [{ ScimBearer: [] }]
      x-anlyon-audience: identity-provider
      x-anlyon-scopes: []
      x-anlyon-response-envelope: scim
      responses: { '200': { $ref: '#/components/responses/ScimList' }, '401': { $ref: '#/components/responses/ScimError' } }

  /api/v2/scim/Schemas:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    get:
      tags: [SCIM]
      summary: SCIM schemas
      operationId: listScimSchemas
      security: [{ ScimBearer: [] }]
      x-anlyon-audience: identity-provider
      x-anlyon-scopes: []
      x-anlyon-response-envelope: scim
      responses: { '200': { $ref: '#/components/responses/ScimList' }, '401': { $ref: '#/components/responses/ScimError' } }

  /api/v2/scim/Users:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    get:
      tags: [SCIM]
      summary: List or find provisioned users
      description: One `eq` filter on `userName`, `externalId` or `id`, and `startIndex`/`count` paging (count at most 200).
      operationId: listScimUsers
      security: [{ ScimBearer: [] }]
      x-anlyon-audience: identity-provider
      x-anlyon-scopes: []
      x-anlyon-response-envelope: scim
      parameters:
        - { name: filter, in: query, schema: { type: string, maxLength: 500 } }
        - { name: startIndex, in: query, schema: { type: integer, minimum: 1 } }
        - { name: count, in: query, schema: { type: integer, minimum: 0, maximum: 200 } }
      responses: { '200': { $ref: '#/components/responses/ScimList' }, '400': { $ref: '#/components/responses/ScimError' }, '401': { $ref: '#/components/responses/ScimError' } }
    post:
      tags: [SCIM]
      summary: Provision a user
      description: >-
        Creates an account with no password, or links an existing one when it is already a member or
        its email domain is verified for the workspace's single sign-on (otherwise 409 uniqueness),
        and adds the membership with the role its groups give.
      operationId: createScimUser
      security: [{ ScimBearer: [] }]
      x-anlyon-audience: identity-provider
      x-anlyon-scopes: []
      x-anlyon-idempotency: unsupported
      x-anlyon-response-envelope: scim
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ScimUser' } }, application/scim+json: { schema: { $ref: '#/components/schemas/ScimUser' } } } }
      responses: { '201': { $ref: '#/components/responses/ScimResource' }, '400': { $ref: '#/components/responses/ScimError' }, '401': { $ref: '#/components/responses/ScimError' }, '409': { $ref: '#/components/responses/ScimError' } }

  /api/v2/scim/Users/{id}:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [SCIM]
      summary: Get a provisioned user
      operationId: getScimUser
      security: [{ ScimBearer: [] }]
      x-anlyon-audience: identity-provider
      x-anlyon-scopes: []
      x-anlyon-response-envelope: scim
      responses: { '200': { $ref: '#/components/responses/ScimResource' }, '401': { $ref: '#/components/responses/ScimError' }, '404': { $ref: '#/components/responses/ScimError' } }
    put:
      tags: [SCIM]
      summary: Replace a provisioned user
      description: >-
        `active: false` ends access to this workspace at once: the membership, the API keys the person
        created in it and their OAuth grants to it; their sessions stop reaching this workspace and
        keep working for their other workspaces. `active: true` restores the membership. An admin
        with emergency access, and the workspace's last admin, cannot be deactivated (400 mutability).
      operationId: replaceScimUser
      security: [{ ScimBearer: [] }]
      x-anlyon-audience: identity-provider
      x-anlyon-scopes: []
      x-anlyon-idempotency: unsupported
      x-anlyon-response-envelope: scim
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ScimUser' } }, application/scim+json: { schema: { $ref: '#/components/schemas/ScimUser' } } } }
      responses: { '200': { $ref: '#/components/responses/ScimResource' }, '400': { $ref: '#/components/responses/ScimError' }, '401': { $ref: '#/components/responses/ScimError' }, '404': { $ref: '#/components/responses/ScimError' }, '409': { $ref: '#/components/responses/ScimError' } }
    patch:
      tags: [SCIM]
      summary: Update a provisioned user
      description: PatchOp on `active`, `userName` and `externalId`. Profile attributes are accepted and not stored. Deactivation behaves as in PUT.
      operationId: patchScimUser
      security: [{ ScimBearer: [] }]
      x-anlyon-audience: identity-provider
      x-anlyon-scopes: []
      x-anlyon-idempotency: unsupported
      x-anlyon-response-envelope: scim
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ScimPatchRequest' } }, application/scim+json: { schema: { $ref: '#/components/schemas/ScimPatchRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/ScimResource' }, '400': { $ref: '#/components/responses/ScimError' }, '401': { $ref: '#/components/responses/ScimError' }, '404': { $ref: '#/components/responses/ScimError' }, '409': { $ref: '#/components/responses/ScimError' } }
    delete:
      tags: [SCIM]
      summary: Deprovision a user
      description: Ends access as deactivation does and forgets the SCIM record. The account is kept; it may belong to other workspaces.
      operationId: deleteScimUser
      security: [{ ScimBearer: [] }]
      x-anlyon-audience: identity-provider
      x-anlyon-scopes: []
      x-anlyon-idempotency: unsupported
      x-anlyon-response-envelope: scim
      responses: { '204': { description: User deprovisioned. }, '400': { $ref: '#/components/responses/ScimError' }, '401': { $ref: '#/components/responses/ScimError' }, '404': { $ref: '#/components/responses/ScimError' } }

  /api/v2/scim/Groups:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    get:
      tags: [SCIM]
      summary: List or find groups
      description: One `eq` filter on `displayName`, `externalId` or `id`, paging, and `excludedAttributes=members`.
      operationId: listScimGroups
      security: [{ ScimBearer: [] }]
      x-anlyon-audience: identity-provider
      x-anlyon-scopes: []
      x-anlyon-response-envelope: scim
      parameters:
        - { name: filter, in: query, schema: { type: string, maxLength: 500 } }
        - { name: startIndex, in: query, schema: { type: integer, minimum: 1 } }
        - { name: count, in: query, schema: { type: integer, minimum: 0, maximum: 200 } }
        - { name: excludedAttributes, in: query, schema: { type: string, maxLength: 200 } }
      responses: { '200': { $ref: '#/components/responses/ScimList' }, '400': { $ref: '#/components/responses/ScimError' }, '401': { $ref: '#/components/responses/ScimError' } }
    post:
      tags: [SCIM]
      summary: Create a group
      description: A group grants nothing until a role mapping names it. Members must be users already provisioned in this workspace.
      operationId: createScimGroup
      security: [{ ScimBearer: [] }]
      x-anlyon-audience: identity-provider
      x-anlyon-scopes: []
      x-anlyon-idempotency: unsupported
      x-anlyon-response-envelope: scim
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ScimGroup' } }, application/scim+json: { schema: { $ref: '#/components/schemas/ScimGroup' } } } }
      responses: { '201': { $ref: '#/components/responses/ScimResource' }, '400': { $ref: '#/components/responses/ScimError' }, '401': { $ref: '#/components/responses/ScimError' }, '409': { $ref: '#/components/responses/ScimError' } }

  /api/v2/scim/Groups/{id}:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [SCIM]
      summary: Get a group
      operationId: getScimGroup
      security: [{ ScimBearer: [] }]
      x-anlyon-audience: identity-provider
      x-anlyon-scopes: []
      x-anlyon-response-envelope: scim
      parameters:
        - { name: excludedAttributes, in: query, schema: { type: string, maxLength: 200 } }
      responses: { '200': { $ref: '#/components/responses/ScimResource' }, '401': { $ref: '#/components/responses/ScimError' }, '404': { $ref: '#/components/responses/ScimError' } }
    put:
      tags: [SCIM]
      summary: Replace a group
      description: Re-applies the role of everyone who joined, left, or (on a rename) stayed.
      operationId: replaceScimGroup
      security: [{ ScimBearer: [] }]
      x-anlyon-audience: identity-provider
      x-anlyon-scopes: []
      x-anlyon-idempotency: unsupported
      x-anlyon-response-envelope: scim
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ScimGroup' } }, application/scim+json: { schema: { $ref: '#/components/schemas/ScimGroup' } } } }
      responses: { '200': { $ref: '#/components/responses/ScimResource' }, '400': { $ref: '#/components/responses/ScimError' }, '401': { $ref: '#/components/responses/ScimError' }, '404': { $ref: '#/components/responses/ScimError' }, '409': { $ref: '#/components/responses/ScimError' } }
    patch:
      tags: [SCIM]
      summary: Update a group
      description: PatchOp on `members` (add, remove by filter or value list, replace), `displayName` and `externalId`.
      operationId: patchScimGroup
      security: [{ ScimBearer: [] }]
      x-anlyon-audience: identity-provider
      x-anlyon-scopes: []
      x-anlyon-idempotency: unsupported
      x-anlyon-response-envelope: scim
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ScimPatchRequest' } }, application/scim+json: { schema: { $ref: '#/components/schemas/ScimPatchRequest' } } } }
      responses: { '204': { description: Group updated. }, '400': { $ref: '#/components/responses/ScimError' }, '401': { $ref: '#/components/responses/ScimError' }, '404': { $ref: '#/components/responses/ScimError' }, '409': { $ref: '#/components/responses/ScimError' } }
    delete:
      tags: [SCIM]
      summary: Delete a group
      description: Re-applies the role of its former members.
      operationId: deleteScimGroup
      security: [{ ScimBearer: [] }]
      x-anlyon-audience: identity-provider
      x-anlyon-scopes: []
      x-anlyon-idempotency: unsupported
      x-anlyon-response-envelope: scim
      responses: { '204': { description: Group deleted. }, '401': { $ref: '#/components/responses/ScimError' }, '404': { $ref: '#/components/responses/ScimError' } }

  /api/v2/environment:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [Environments]
      summary: Get this key's environment
      description: The environment this API key is bound to, including whether it is currently halted.
      operationId: getOwnEnvironment
      x-anlyon-audience: public
      x-anlyon-scopes: []
      responses:
        '200': { $ref: '#/components/responses/Environment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v2/edition:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [Edition]
      summary: Get this server's edition and licence state
      description: >-
        The edition this server runs (cloud, community, team or enterprise). For a signed-in admin
        of any workspace on a Team or Enterprise install, also the licence: its tier, the seats
        it covers against the people using the install, and its expiry. Seats are soft: going over
        blocks nothing. Everyone else, and every cloud or community server, gets `license: null`.
      operationId: getEdition
      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-scopes: []
      responses:
        '200': { $ref: '#/components/responses/Edition' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v2/setup:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [Instance]
      summary: Whether this install is waiting for its first owner
      description: >-
        Self-hosted only. Answers `pending: true` while the install has no owner and setup has never
        completed. Once the first owner exists every setup endpoint answers 404, for good. Absent on
        Anlyon's hosted service.
      operationId: getSetupState
      security: []
      x-anlyon-audience: dashboard
      x-anlyon-scopes: []
      responses:
        '200': { $ref: '#/components/responses/SetupState' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/setup/verify:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [Instance]
      summary: Check a setup token
      description: >-
        Self-hosted only, while setup is pending. Says whether a setup token is this install's, so
        the console can say so before asking for the owner's details. The token is the one the
        installer printed (ANLYON_SETUP_TOKEN) or the one the server logged at boot.
      operationId: verifySetupToken
      security: []
      x-anlyon-audience: dashboard
      x-anlyon-idempotency: unsupported
      x-anlyon-scopes: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SetupTokenRequest' } } } }
      responses:
        '200': { $ref: '#/components/responses/SetupTokenCheck' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/setup/owner:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [Instance]
      summary: Create the first owner
      description: >-
        Self-hosted only, once. With the setup token, creates the install's first account (it can
        sign in with this email and password at once), its workspace, and its instance admin role,
        then closes setup for good. A wrong token answers 403; a finished setup answers 404.
      operationId: createSetupOwner
      security: []
      x-anlyon-audience: dashboard
      x-anlyon-idempotency: unsupported
      x-anlyon-scopes: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SetupOwnerRequest' } } } }
      responses:
        '201': { $ref: '#/components/responses/SetupOwnerCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/instance/status:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [Instance]
      summary: Get this install's status
      description: >-
        Self-hosted only; instance admins. The edition, when setup completed, whether a root key is
        in use and which master keys come from it, whether an admin has confirmed it is backed up,
        and whether telemetry is on. The root key itself is never returned.
      operationId: getInstanceStatus
      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-scopes: []
      responses:
        '200': { $ref: '#/components/responses/InstanceStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v2/instance/root-key/backup-confirmation:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [Instance]
      summary: Confirm the root key is backed up
      description: >-
        Self-hosted only; instance admins. Records that an admin has a copy of ANLYON_ROOT_KEY
        somewhere other than this server. Audited.
      operationId: confirmRootKeyBackup
      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-idempotency: unsupported
      x-anlyon-scopes: []
      responses:
        '200': { $ref: '#/components/responses/InstanceStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v2/instance/settings:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [Instance]
      summary: List instance settings
      description: >-
        Self-hosted only; instance admins. Every setting with where its value comes from: the
        environment (read-only), the database, or the default. A secret is never returned, only
        whether it is set and when it was last changed.
      operationId: listInstanceSettings
      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-scopes: []
      responses:
        '200': { $ref: '#/components/responses/InstanceSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [Instance]
      summary: Change instance settings
      description: >-
        Self-hosted only; instance admins. Saves the given settings in one transaction with their
        audit record; `null` or an empty string clears one. A setting the environment sets cannot be
        changed here (409). Takes effect without a restart.
      operationId: updateInstanceSettings
      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-idempotency: unsupported
      x-anlyon-scopes: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InstanceSettingsUpdateRequest' } } } }
      responses:
        '200': { $ref: '#/components/responses/InstanceSettingsUpdated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v2/instance/settings/email/test:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [Instance]
      summary: Send a test email
      description: Self-hosted only; instance admins. Sends one message with the email settings in force.
      operationId: sendInstanceTestEmail
      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-idempotency: unsupported
      x-anlyon-scopes: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InstanceTestEmailRequest' } } } }
      responses:
        '200': { $ref: '#/components/responses/InstanceCheck' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v2/instance/settings/storage/test:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [Instance]
      summary: Test file storage
      description: Self-hosted only; instance admins. Writes, reads back and deletes one small object with the storage settings in force.
      operationId: testInstanceStorage
      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-idempotency: unsupported
      x-anlyon-scopes: []
      responses:
        '200': { $ref: '#/components/responses/InstanceCheck' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v2/instance/license/preview:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [Instance]
      summary: Verify a licence key without saving it
      description: Self-hosted only; instance admins. Verified offline against the public key built into this release; nothing is sent anywhere.
      operationId: previewInstanceLicense
      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-idempotency: unsupported
      x-anlyon-scopes: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InstanceLicensePreviewRequest' } } } }
      responses:
        '200': { $ref: '#/components/responses/InstanceLicensePreview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v2/instance/telemetry/preview:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [Instance]
      summary: Show the next telemetry report
      description: >-
        Self-hosted only; instance admins. Exactly the anonymous document the next daily report
        would send: a random instance id, the version, the edition and counts. Nothing else is sent.
      operationId: previewInstanceTelemetry
      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-scopes: []
      responses:
        '200': { $ref: '#/components/responses/InstanceTelemetryPreview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v2/instance/admins:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [Instance]
      summary: List instance admins
      description: Self-hosted only; instance admins. The people who may change this install's settings.
      operationId: listInstanceAdmins
      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-scopes: []
      responses:
        '200': { $ref: '#/components/responses/InstanceAdminList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Instance]
      summary: Grant instance admin
      description: Self-hosted only; instance admins. Makes the account with this email an instance admin. Audited.
      operationId: grantInstanceAdmin
      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-idempotency: unsupported
      x-anlyon-scopes: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InstanceAdminGrantRequest' } } } }
      responses:
        '201': { $ref: '#/components/responses/InstanceAdminGranted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v2/instance/admins/{userId}:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - name: userId
        in: path
        required: true
        schema: { type: string, maxLength: 100 }
    delete:
      tags: [Instance]
      summary: Revoke instance admin
      description: Self-hosted only; instance admins. The last instance admin cannot be revoked (409). Audited.
      operationId: revokeInstanceAdmin
      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-idempotency: unsupported
      x-anlyon-scopes: []
      responses:
        '200': { $ref: '#/components/responses/InstanceAdminRevoked' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v2/environment/halt:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [Environments]
      summary: Halt this key's environment
      description: >-
        The kill switch. The agent stops acting and nothing leaves the environment: action
        calls, hosted function runs and an agent's event publishes are refused, and approved
        calls do not run. Approvals can still be decided and reads still answer. Applies to the environment this key is
        bound to -- a staging key cannot halt production. A key needs the `environments:halt` scope.
        A console session or OAuth token may call it too, for the session's environment, with the
        admin or member role there (approver and viewer cannot halt).
      operationId: haltOwnEnvironment
      x-anlyon-audience: public
      x-anlyon-idempotency: unsupported
      x-anlyon-scopes: [environments:halt]
      requestBody: { required: false, content: { application/json: { schema: { $ref: '#/components/schemas/HaltEnvironmentRequest' } } } }
      responses:
        '200': { $ref: '#/components/responses/Environment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v2/environment/resume:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [Environments]
      summary: Resume this key's environment
      description: >-
        Release the deferred work and let the agent act again. A key needs `environments:halt`; a
        console session needs the admin role or higher.
      operationId: resumeOwnEnvironment
      x-anlyon-audience: public
      x-anlyon-idempotency: unsupported
      x-anlyon-scopes: [environments:halt]
      responses:
        '200': { $ref: '#/components/responses/Environment' }
        '202': { $ref: '#/components/responses/SignOffRequired' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v2/audit/events:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    get:
      tags: [Audit]
      summary: List audit records
      description: >-
        Stored audit records for the key's own environment, newest first, in the v1 export shape
        (`anlyon.audit.v1`). Enterprise edition and Team plan; answers 404 where audit streaming is
        not included. Needs `audit:read`, which no key receives by default. Deduplicate on `id`.
      operationId: listAuditEvents
      x-anlyon-audience: public
      x-anlyon-scopes: [audit:read]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: environmentId, in: query, description: Ignored for an environment-scoped key, which only ever sees its own environment., schema: { type: string, format: uuid } }
        - { name: type, in: query, description: 'Comma-separated event types or prefixes, for example `approval.*,policy.updated`.', schema: { type: string, maxLength: 1000 } }
        - { name: category, in: query, schema: { $ref: '#/components/schemas/AuditCategory' } }
        - { name: action, in: query, description: A governed action's name or id. Matches records that name it., schema: { type: string, maxLength: 200 } }
        - { name: endUserId, in: query, description: Records of acts for this end user (or its erased~ hash)., schema: { type: string, maxLength: 160 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: before, in: query, description: The `sequence` of the last record on the previous page., schema: { type: integer, minimum: 1 } }
      responses: { '200': { $ref: '#/components/responses/AuditEventList' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '429': { $ref: '#/components/responses/RateLimitExceeded' } }

  /api/v2/audit/export:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    get:
      tags: [Audit]
      summary: Export audit records as evidence
      description: >-
        Every stored audit record in a range of at most 366 days, oldest first, as one JSON document
        (`anlyon.audit.export.v1`) or CSV, streamed as an attachment. Filter by environment, event
        type, category or governed action. Taking an export is itself recorded
        (`audit.export.created`) before any record is sent. Records older than the hot window are
        read back from the audit archive, checked against their checksums, and included in the same
        order; 503 `AUDIT_ARCHIVE_UNAVAILABLE` when the range holds archived records this server
        cannot reach, and the stream stops with `AUDIT_ARCHIVE_INTEGRITY` rather than leave out a
        record whose archived copy fails its check. Enterprise edition and Team plan. Needs
        `audit:read`.
      operationId: exportAuditEvents
      x-anlyon-audience: public
      x-anlyon-scopes: [audit:read]
      x-anlyon-response-envelope: raw-export
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: format, in: query, schema: { type: string, enum: [json, csv], default: json } }
        - { name: environmentId, in: query, schema: { type: string, format: uuid } }
        - { name: type, in: query, schema: { type: string, maxLength: 1000 } }
        - { name: category, in: query, schema: { $ref: '#/components/schemas/AuditCategory' } }
        - { name: action, in: query, schema: { type: string, maxLength: 200 } }
        - { name: endUserId, in: query, schema: { type: string, maxLength: 160 } }
      responses: { '200': { $ref: '#/components/responses/AuditExport' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '429': { $ref: '#/components/responses/RateLimitExceeded' }, '503': { $ref: '#/components/responses/ServiceUnavailable' } }

  /api/v2/audit/schema:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    get:
      tags: [Audit]
      summary: Get the audit event JSON Schema
      description: The JSON Schema of one v1 audit event and the event types by category, for validating a SIEM parser. Enterprise edition and Team plan. Needs `audit:read`.
      operationId: getAuditSchema
      x-anlyon-audience: public
      x-anlyon-scopes: [audit:read]
      responses: { '200': { $ref: '#/components/responses/AuditSchema' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '429': { $ref: '#/components/responses/RateLimitExceeded' } }

  /api/v2/workspaces/{workspaceId}/audit/settings:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/WorkspaceId' }]
    get:
      tags: [Audit]
      summary: Get audit retention
      description: How long the workspace keeps stored audit records (its own window, or null for the plan's retention, the default), the plan's retention and any downgrade grace, how many days records stay in the console's list before they move to the archive, and whether sinks may reach private network addresses. Workspace admin. Enterprise edition and Team plan.
      operationId: getAuditSettings
      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-scopes: []
      responses: { '200': { $ref: '#/components/responses/AuditSettings' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
    put:
      tags: [Audit]
      summary: Set audit retention
      description: >-
        Keep stored audit records for 30 to 3650 days, or null to keep them for the plan's retention
        (6 months on Starter and Pro, 12 on Team, the contract's on Enterprise); a longer window is
        held to the plan's. Records past it are deleted by an hourly sweep. Copies already delivered to a sink are not
        affected. `allowPrivateDestinations` lets sinks reach private network addresses on a
        self-hosted deployment; turning it on is refused on cloud, where the SSRF rules always apply,
        and on a self-hosted install whose instance admins set `network.private_destinations` to
        `off`. Metadata and link-local addresses stay refused everywhere. The change is itself recorded.
        Workspace admin.
      operationId: updateAuditSettings
      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-scopes: []
      x-anlyon-idempotency: unsupported
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateAuditSettingsRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/AuditSettings' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }

  /api/v2/workspaces/{workspaceId}/audit/sinks:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/WorkspaceId' }]
    get:
      tags: [Audit]
      summary: List audit sinks
      description: Each sink with its delivery state and open dead letters. Credentials are never returned. Workspace admin. Enterprise edition.
      operationId: listAuditSinks
      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-scopes: []
      responses: { '200': { $ref: '#/components/responses/AuditSinkList' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
    post:
      tags: [Audit]
      summary: Create an audit sink
      description: >-
        Stream the workspace's audit records to a signed HTTPS webhook, an S3-compatible bucket
        (gzip NDJSON objects by date), Datadog Logs or Splunk HEC. Delivery is at least once:
        deduplicate on the event `id`. A webhook sink's signing secret is generated and returned in
        this response only. Credentials are encrypted at rest. At most 10 sinks per workspace.
        Workspace admin.
      operationId: createAuditSink
      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-scopes: []
      x-anlyon-idempotency: unsupported
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateAuditSinkRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/AuditSinkWithSecret' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }

  /api/v2/workspaces/{workspaceId}/audit/sinks/{sinkId}:
    parameters:
      - { $ref: '#/components/parameters/RequestId' }
      - { $ref: '#/components/parameters/WorkspaceId' }
      - { name: sinkId, in: path, required: true, description: Public sink id (asink_...)., schema: { type: string, maxLength: 64 } }
    get:
      tags: [Audit]
      summary: Get an audit sink
      operationId: getAuditSink
      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-scopes: []
      responses: { '200': { $ref: '#/components/responses/AuditSink' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
    patch:
      tags: [Audit]
      summary: Update an audit sink
      description: >-
        Rename, enable or disable, change filters, configuration or credentials, or rotate a webhook
        sink's signing secret (returned once). A changed destination or credential is tried at
        once rather than after the current backoff. Workspace admin.
      operationId: updateAuditSink
      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-scopes: []
      x-anlyon-idempotency: unsupported
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateAuditSinkRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/AuditSinkWithSecret' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
    delete:
      tags: [Audit]
      summary: Delete an audit sink
      description: Stops delivery and removes the sink and its dead letters. The stored records stay. Workspace admin.
      operationId: deleteAuditSink
      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-scopes: []
      x-anlyon-idempotency: unsupported
      responses: { '200': { $ref: '#/components/responses/AuditSinkDeleted' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }

  /api/v2/workspaces/{workspaceId}/audit/sinks/{sinkId}/test:
    parameters:
      - { $ref: '#/components/parameters/RequestId' }
      - { $ref: '#/components/parameters/WorkspaceId' }
      - { name: sinkId, in: path, required: true, schema: { type: string, maxLength: 64 } }
    post:
      tags: [Audit]
      summary: Send a test event
      description: Sends one `audit.test` event marked `test` to the sink now and reports what the destination answered. Not stored and not part of the stream. Workspace admin.
      operationId: testAuditSink
      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-scopes: []
      x-anlyon-idempotency: unsupported
      responses: { '200': { $ref: '#/components/responses/AuditSendResult' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }

  /api/v2/workspaces/{workspaceId}/audit/sinks/{sinkId}/dead-letters:
    parameters:
      - { $ref: '#/components/parameters/RequestId' }
      - { $ref: '#/components/parameters/WorkspaceId' }
      - { name: sinkId, in: path, required: true, schema: { type: string, maxLength: 64 } }
    get:
      tags: [Audit]
      summary: List a sink's dead letters
      description: Batches the sink refused through every retry (about five hours), newest first, up to 100. Workspace admin.
      operationId: listAuditDeadLetters
      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-scopes: []
      responses: { '200': { $ref: '#/components/responses/AuditDeadLetterList' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }

  /api/v2/workspaces/{workspaceId}/audit/sinks/{sinkId}/dead-letters/{deadLetterId}/redeliver:
    parameters:
      - { $ref: '#/components/parameters/RequestId' }
      - { $ref: '#/components/parameters/WorkspaceId' }
      - { name: sinkId, in: path, required: true, schema: { type: string, maxLength: 64 } }
      - { name: deadLetterId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Audit]
      summary: Redeliver a dead letter
      description: Sends the dead letter's records again now, with their original ids. Marked redelivered on success. Records removed by retention are no longer sent. Workspace admin.
      operationId: redeliverAuditDeadLetter
      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-scopes: []
      x-anlyon-idempotency: unsupported
      responses: { '200': { $ref: '#/components/responses/AuditRedeliveryResult' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }

  /api/v2/workspaces/{workspaceId}/audit/events:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/WorkspaceId' }]
    get:
      tags: [Audit]
      summary: List audit records (console)
      description: Every environment's records and the workspace-level ones, newest first. Workspace admin. Enterprise edition.
      operationId: listWorkspaceAuditEvents
      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-scopes: []
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: environmentId, in: query, schema: { type: string, format: uuid } }
        - { name: type, in: query, schema: { type: string, maxLength: 1000 } }
        - { name: category, in: query, schema: { $ref: '#/components/schemas/AuditCategory' } }
        - { name: action, in: query, schema: { type: string, maxLength: 200 } }
        - { name: endUserId, in: query, schema: { type: string, maxLength: 160 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: before, in: query, schema: { type: integer, minimum: 1 } }
      responses: { '200': { $ref: '#/components/responses/AuditEventList' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }

  /api/v2/workspaces/{workspaceId}/audit/export:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/WorkspaceId' }]
    get:
      tags: [Audit]
      summary: Export audit records as evidence (console)
      description: The evidence export for a console session, across every environment unless filtered, archived records included (503 `AUDIT_ARCHIVE_UNAVAILABLE` when they cannot be read). Workspace admin. Enterprise edition.
      operationId: exportWorkspaceAuditEvents
      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-scopes: []
      x-anlyon-response-envelope: raw-export
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: format, in: query, schema: { type: string, enum: [json, csv], default: json } }
        - { name: environmentId, in: query, schema: { type: string, format: uuid } }
        - { name: type, in: query, schema: { type: string, maxLength: 1000 } }
        - { name: category, in: query, schema: { $ref: '#/components/schemas/AuditCategory' } }
        - { name: action, in: query, schema: { type: string, maxLength: 200 } }
        - { name: endUserId, in: query, schema: { type: string, maxLength: 160 } }
      responses: { '200': { $ref: '#/components/responses/AuditExport' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '503': { $ref: '#/components/responses/ServiceUnavailable' } }

  /api/v2/sign-offs:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    get:
      tags: [Sign-offs]
      summary: List sign-off requests
      description: >-
        The sign-off requests this credential made, newest first. A change an agent asks for that
        loosens a guardrail (raising a limit, removing a budget, adding an action, a looser approval
        policy) is not applied: it waits here until a workspace admin approves or rejects it in the
        console or from the link emailed to them. A console session lists the workspace's requests.
        Nothing on this route decides a request.
      operationId: listSignOffs
      x-anlyon-audience: public
      x-anlyon-scopes: []
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, applied, rejected, expired, cancelled, failed] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200': { $ref: '#/components/responses/SignOffRequestList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/sign-offs/{signOffId}:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - { name: signOffId, in: path, required: true, description: Sign-off request id (sor_...)., schema: { type: string, pattern: '^sor_[A-Za-z0-9_-]{1,64}$' } }
    get:
      tags: [Sign-offs]
      summary: Get a sign-off request
      description: >-
        Poll a request the credential made until its `status` is no longer `pending`, waiting
        `pollAfterSeconds` between reads. `applied` means a workspace admin approved it and the change
        took effect, with the result in `result`. `rejected`, `expired`, `cancelled` and `failed` mean
        nothing changed. A request expires 24 hours after it was made.
      operationId: getSignOff
      x-anlyon-audience: public
      x-anlyon-scopes: []
      responses:
        '200': { $ref: '#/components/responses/SignOffRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/sign-offs/{signOffId}/cancel:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - { name: signOffId, in: path, required: true, description: Sign-off request id (sor_...)., schema: { type: string, pattern: '^sor_[A-Za-z0-9_-]{1,64}$' } }
    post:
      tags: [Sign-offs]
      summary: Cancel a sign-off request
      description: >-
        Withdraw a pending request. The credential that made it cancels it; a console session rejects
        it instead. Nothing changes.
      operationId: cancelSignOff
      x-anlyon-audience: public
      x-anlyon-scopes: []
      x-anlyon-idempotency: unsupported
      responses:
        '200': { $ref: '#/components/responses/SignOffRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/workspaces/{workspaceId}/sign-offs:
    parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/WorkspaceId' }]
    get:
      tags: [Sign-offs]
      summary: List the workspace's sign-off requests
      description: Every sign-off request in the workspace, newest first, for the console. Any member can read them.
      operationId: listWorkspaceSignOffs
      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-scopes: []
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, applied, rejected, expired, cancelled, failed] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses: { '200': { $ref: '#/components/responses/SignOffRequestList' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }

  /api/v2/workspaces/{workspaceId}/sign-offs/{signOffId}:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/WorkspaceId'
      - { name: signOffId, in: path, required: true, description: Sign-off request id (sor_...)., schema: { type: string, pattern: '^sor_[A-Za-z0-9_-]{1,64}$' } }
    get:
      tags: [Sign-offs]
      summary: Get one of the workspace's sign-off requests
      description: One sign-off request with its diff, for the console.
      operationId: getWorkspaceSignOff
      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-scopes: []
      responses: { '200': { $ref: '#/components/responses/SignOffRequest' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }

  /api/v2/workspaces/{workspaceId}/sign-offs/{signOffId}/approve:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/WorkspaceId'
      - { name: signOffId, in: path, required: true, description: Sign-off request id (sor_...)., schema: { type: string, pattern: '^sor_[A-Za-z0-9_-]{1,64}$' } }
    post:
      tags: [Sign-offs]
      summary: Approve a sign-off request
      description: >-
        Apply the change. Needs a workspace admin signed in to the console: no API key, CLI login or MCP
        session can approve a request, whatever its scopes. The change is checked again against the
        state now; if what it applies to changed since it was asked for, the request ends `failed`
        with `SIGN_OFF_STALE` and nothing is applied.
      operationId: approveSignOff
      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-scopes: []
      x-anlyon-idempotency: unsupported
      requestBody: { required: false, content: { application/json: { schema: { $ref: '#/components/schemas/DecideSignOffRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/SignOffRequest' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }

  /api/v2/workspaces/{workspaceId}/sign-offs/{signOffId}/reject:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/WorkspaceId'
      - { name: signOffId, in: path, required: true, description: Sign-off request id (sor_...)., schema: { type: string, pattern: '^sor_[A-Za-z0-9_-]{1,64}$' } }
    post:
      tags: [Sign-offs]
      summary: Reject a sign-off request
      description: Leave everything as it is. Needs a workspace admin signed in to the console.
      operationId: rejectSignOff
      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-scopes: []
      x-anlyon-idempotency: unsupported
      requestBody: { required: false, content: { application/json: { schema: { $ref: '#/components/schemas/DecideSignOffRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/SignOffRequest' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }

  /api/v2/sign-off-links/{token}:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - { name: token, in: path, required: true, description: The signed token from the email., schema: { type: string, maxLength: 1024 } }
    get:
      tags: [Sign-offs]
      summary: Open an emailed sign-off link
      description: >-
        The page a workspace admin opens from the sign-off email: the change, its diff, and buttons to
        approve or reject. Opening it decides nothing, so a mail scanner that follows the link changes
        nothing. Each link names one request and one admin, and stops working when the request expires.
      operationId: openSignOffLink
      security: []
      x-anlyon-audience: public-link
      x-anlyon-response-envelope: html-page
      x-anlyon-scopes: []
      responses:
        '200': { description: The page showing the change, or how it ended., content: { text/html: { schema: { type: string } } } }
        '404': { description: The link is not valid or has expired. A page saying so., content: { text/html: { schema: { type: string } } } }
    post:
      tags: [Sign-offs]
      summary: Decide from an emailed sign-off link
      description: >-
        The form on the link's page. The admin the link was sent to must still be a workspace admin.
        Approving applies the change; rejecting leaves everything as it is.
        The form posts `decision` (`approve` or `reject`) and an optional `note` of up to 1000
        characters, form-encoded.
      operationId: decideSignOffLink
      security: []
      x-anlyon-audience: public-link
      x-anlyon-response-envelope: html-page
      x-anlyon-scopes: []
      x-anlyon-idempotency: unsupported
      responses:
        '200': { description: The decision, and how the request ended., content: { text/html: { schema: { type: string } } } }
        '400': { description: Neither approve nor reject was chosen. A page saying so., content: { text/html: { schema: { type: string } } } }
        '403': { description: The person is no longer a workspace admin. A page saying so., content: { text/html: { schema: { type: string } } } }
        '404': { description: The link is not valid or has expired. A page saying so., content: { text/html: { schema: { type: string } } } }
        '409': { description: The request was already decided, expired or withdrawn. A page saying how it ended., content: { text/html: { schema: { type: string } } } }

  /api/v2/public/sandbox/echo:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [Actions]
      summary: Echo a request (first-run sandbox)
      description: >-
        Unauthenticated and stateless. Answers with the method, Authorization
        header, content type and body it received. It is the destination of the
        dashboard's first-run tour, so a new workspace can define and approve a
        real action without an API or credential of its own. Called through an
        action, the echoed Authorization value is a vault secret, which Anlyon
        replaces with `[REDACTED]` before the invocation is stored or returned.
        Bodies over 16 KB are refused. Rate limited by IP, except a request
        whose `Authorization: Bearer` token was minted by
        `POST /api/v2/sandbox/token`, which is counted against the workspace the
        token was issued to (the tour's calls all come from Anlyon's own egress
        IP). A token that does not verify is limited by IP.
      operationId: echoSandboxRequest
      security: []
      x-anlyon-audience: public-link
      x-anlyon-scopes: []
      x-anlyon-idempotency: unsupported
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
            example: { orderId: ord_1042, amount: 4900 }
      responses:
        '200': { $ref: '#/components/responses/SandboxEcho' }
        '413': { $ref: '#/components/responses/SandboxPayloadTooLarge' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/sandbox/token:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [Actions]
      summary: Mint a sandbox token (first-run tour)
      description: >-
        Returns a fresh throwaway token signed for the calling workspace, for the
        first-run tour to store in the vault and send to
        `POST /api/v2/public/sandbox/echo`. The token authorizes nothing; it only
        lets the sandbox rate limit the tour's calls per workspace rather than by
        Anlyon's egress IP. Nothing is stored.
      operationId: mintSandboxToken
      security: [{ SessionAuth: [] }]
      x-anlyon-audience: dashboard
      x-anlyon-scopes: []
      x-anlyon-idempotency: unsupported
      responses:
        '200': { $ref: '#/components/responses/SandboxToken' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/dlq:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [DLQ]
      summary: List failed messages
      description: Lists failed messages in the calling credential's environment.
      operationId: listDLQMessages
      x-anlyon-audience: public
      x-anlyon-scopes: [dlq:read]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { $ref: '#/components/responses/DLQMessageList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }
    delete:
      tags: [DLQ]
      summary: Permanently clear the DLQ
      description: >-
        Permanently delete failed messages in the calling credential's
        environment, up to 1000 per call; `remaining` reports what is left.
        Another environment's failures are untouched. This cannot be undone.
      operationId: clearDLQ
      x-anlyon-audience: public
      x-anlyon-scopes: [dlq:write]
      x-anlyon-idempotency: unsupported
      responses:
        '200': { $ref: '#/components/responses/DLQClearResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/dlq/stats:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [DLQ]
      summary: Get DLQ statistics
      description: Counts failed messages in the calling credential's environment.
      operationId: getDLQStats
      x-anlyon-audience: public
      x-anlyon-scopes: [dlq:read]
      responses:
        '200': { $ref: '#/components/responses/DLQStats' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/dlq/retry-all:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [DLQ]
      summary: Retry failed messages
      description: >-
        Queue each failed message in the calling credential's environment
        independently, up to 1000 per call, and report how many succeeded;
        individual retry failures do not abort the batch and `remaining` reports
        what is left.
      operationId: retryAllDLQMessages
      x-anlyon-audience: public
      x-anlyon-scopes: [dlq:write]
      x-anlyon-idempotency: unsupported
      responses:
        '200': { $ref: '#/components/responses/DLQRetryAllResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/dlq/{messageId}:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - name: messageId
        in: path
        required: true
        schema: { type: string, pattern: '^msg_' }
    get:
      tags: [DLQ]
      summary: Get a failed message
      operationId: getDLQMessage
      x-anlyon-audience: public
      x-anlyon-scopes: [dlq:read]
      responses:
        '200': { $ref: '#/components/responses/DLQMessage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }
    delete:
      tags: [DLQ]
      summary: Permanently delete a failed message
      operationId: deleteDLQMessage
      x-anlyon-audience: public
      x-anlyon-scopes: [dlq:write]
      x-anlyon-idempotency: unsupported
      responses:
        '200': { $ref: '#/components/responses/MessageResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

  /api/v2/dlq/{messageId}/retry:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - name: messageId
        in: path
        required: true
        schema: { type: string, pattern: '^msg_' }
    post:
      tags: [DLQ]
      summary: Retry a failed message
      description: >-
        Reset attempts and failure state, then place the message back on the
        delivery stream it was published to, with the environment and queue it
        was published under. Only the calling credential's
        environment is visible.
      operationId: retryDLQMessage
      x-anlyon-audience: public
      x-anlyon-scopes: [dlq:write]
      x-anlyon-idempotency: unsupported
      responses:
        '200': { $ref: '#/components/responses/DLQRetryResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimitExceeded' }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Anlyon API key
      description: 'Workspace API key sent as `Authorization: Bearer <key>`.'
    SessionAuth:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: Browser session used by dashboard-only operations.
    ScimBearer:
      type: http
      scheme: bearer
      bearerFormat: Anlyon SCIM token
      description: 'The workspace SCIM token (`anlyon_scim_...`) sent as `Authorization: Bearer <token>`. Used only by /api/v2/scim.'
    EndUserSessionAuth:
      type: http
      scheme: bearer
      bearerFormat: Anlyon end-user session token
      description: 'A short-lived end-user session token (`eus_...`) from POST /api/v2/end-users/{endUserId}/sessions, sent as `Authorization: Bearer <token>`. Used only by /api/v2/end-user-session.'

  headers:
    RequestId:
      description: Correlation identifier for support and distributed tracing.
      schema:
        type: string
        example: req_0123456789abcdef0123456789abcdef

  parameters:
    EndUserHeader:
      name: Anlyon-End-User
      in: header
      required: false
      description: >-
        The end user this call acts for: your own id for them, 1 to 128 characters of letters,
        digits and `. _ : @ -`. Accepted only with an API key, which stays on your server; a session
        or an OAuth token that sends it is refused. A key created with `endUserRequired` must send it
        on every action call (`400 END_USER_REQUIRED`). On an /end-users/{endUserId} route it must
        name the same end user as the path.
      schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9._:@-]{1,128}$' }

    EndUserIdPath:
      name: endUserId
      in: path
      required: true
      description: 'Your own id for the end user. 1 to 128 characters of letters, digits and `. _ : @ -`. URL-encode it.'
      schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9._:@-]{1,128}$' }

    IntegrationPath:
      name: integration
      in: path
      required: true
      description: A catalogue integration id, for example `gmail` or `github`.
      schema: { type: string, pattern: '^[a-z][a-z0-9-]{0,63}$' }

    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Optional caller correlation ID. Unsafe or oversized values are replaced.
      schema:
        type: string
        maxLength: 128

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Stable retry key for a mutation. The key is claimed atomically before the
        handler runs, so concurrent retries execute the side effect at most once.
        Replaying the key for the same request (same method, path, workspace and
        JSON body) returns the original response with an `X-Idempotent-Replay: true`
        header. Reusing the key for a different request returns `409` with error code
        `idempotency_key_reuse`. A duplicate arriving while the first is still in
        flight waits and then replays; if the first does not finish in time the
        duplicate gets `409 idempotency_request_in_progress`. Keys are retained for
        24 hours. Only successful (2xx) responses are stored; a failed request frees
        the key so it can be retried.
      schema:
        type: string
        minLength: 1
        maxLength: 255

    IntegrationId:
      name: id
      in: path
      required: true
      description: Integration connection UUID.
      schema: { type: string, format: uuid }

    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      description: Workspace UUID.
      schema: { type: string, format: uuid }

    InvitationId:
      name: invitationId
      in: path
      required: true
      description: Invitation UUID.
      schema: { type: string, format: uuid }

    InvitationToken:
      name: token
      in: path
      required: true
      description: Secret invitation token from the emailed link.
      x-sensitive: true
      schema: { type: string, minLength: 32, maxLength: 32 }

    ApiKeyId:
      name: keyId
      in: path
      required: true
      description: API-key record UUID, not the plaintext credential.
      schema: { type: string, format: uuid }

    EnvironmentId:
      name: environmentId
      in: path
      required: true
      description: Environment UUID.
      schema: { type: string, format: uuid }

    AgentId:
      name: agentId
      in: path
      required: true
      description: Public agent id (agt_xxx).
      schema: { type: string }

    AgentVersionNumber:
      name: version
      in: path
      required: true
      description: Agent version number.
      schema: { type: integer, minimum: 1 }

    RunId:
      name: runId
      in: path
      required: true
      description: Public run id (run_xxx).
      schema: { type: string }

    PolicyId:
      name: policyId
      in: path
      required: true
      description: Public approval-policy id (apol_xxx).
      schema: { type: string }

    UserId:
      name: userId
      in: path
      required: true
      description: Better Auth user identifier.
      schema: { type: string, minLength: 1, maxLength: 100 }

    StartDate:
      name: startDate
      in: query
      description: Start date for filtering (ISO 8601 format)
      schema:
        type: string
        format: date-time
        example: "2024-01-01T00:00:00Z"

    EndDate:
      name: endDate
      in: query
      description: End date for filtering (ISO 8601 format)
      schema:
        type: string
        format: date-time
        example: "2024-12-31T23:59:59Z"

    Page:
      name: page
      in: query
      description: Page number for pagination
      schema:
        type: integer
        minimum: 1
        default: 1

    Limit:
      name: limit
      in: query
      description: Number of items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  schemas:
    SignOffChange:
      type: object
      description: One field of a governance change, which way it goes, and why.
      required: [field, from, to, direction, reason]
      properties:
        field: { type: string, example: amount }
        from: { description: The value before. Never a secret value., nullable: true, example: 500 }
        to: { description: The value after. Never a secret value., nullable: true, example: 5000 }
        direction: { type: string, enum: [tightening, loosening, neutral], example: loosening }
        reason: { type: string, example: Raises the limit. }

    SignOffRequest:
      type: object
      description: >-
        A governance change that loosens a guardrail, asked for by an API key, a CLI login or an MCP
        session, waiting for a workspace admin. Give `signOffUrl` to a person; poll `pollUrl`.
      required: [object, id, status, operation, environmentId, resource, summary, changes, diff, signOffUrl, pollUrl, pollAfterSeconds, requestedBy, createdAt, expiresAt, decidedAt, decidedBy, decisionNote, result, error]
      properties:
        object: { type: string, enum: [sign_off_request] }
        id: { type: string, example: sor_V1StGXR8Z5jdHi6BmyT9q }
        status:
          type: string
          enum: [pending, applied, rejected, expired, cancelled, failed]
          description: >-
            `pending` until a workspace admin decides. `applied`: approved and in effect. `rejected`,
            `expired` (after 24 hours), `cancelled` (withdrawn by the credential) and `failed` (approved
            but could not be applied, see `error`): nothing changed.
          example: pending
        operation:
          type: string
          enum: [policy.create, policy.update, policy.delete, policy_file.apply, impact_limit.update, impact_limit.archive, budget.put, budget.delete, environment.resume, action.create, action.update, action.import, secret.put, secret_store.create, secret_store.update, secret_store_settings.update, oauth_app.put]
          example: impact_limit.update
        environmentId: { type: string, format: uuid }
        resource:
          type: object
          nullable: true
          required: [type, id]
          properties:
            type: { type: string, example: impact_limit }
            id: { type: string, example: lim_01JABCDEF }
            name: { type: string, example: Daily refunds }
        summary: { type: string, example: Raise impact limit "Daily refunds" from 500 to 5000 usd }
        changes: { type: array, items: { $ref: '#/components/schemas/SignOffChange' } }
        diff: { type: string, description: The changes as plain text, for a terminal or a chat., example: "amount (loosens): Raises the limit.\n- 500\n+ 5000" }
        signOffUrl: { type: string, format: uri, description: The console page where a workspace admin approves or rejects it. Give this to a person., example: 'https://console.anlyon.com/sign-offs/sor_V1StGXR8Z5jdHi6BmyT9q' }
        pollUrl: { type: string, example: /api/v2/sign-offs/sor_V1StGXR8Z5jdHi6BmyT9q }
        pollAfterSeconds: { type: integer, example: 5 }
        requestedBy:
          type: object
          required: [type, id]
          properties:
            type: { type: string, enum: [api_key, oauth_client, system] }
            id: { type: string, nullable: true }
            onBehalfOf: { type: string, nullable: true, description: For a CLI login or an MCP session, the person who signed in. }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time, nullable: true }
        decidedBy:
          type: object
          nullable: true
          required: [type, id, via]
          properties:
            type: { type: string, enum: [user] }
            id: { type: string }
            via: { type: string, enum: [console, email_link] }
        decisionNote: { type: string, nullable: true }
        result: { nullable: true, description: 'When `applied`, what the original request would have returned: the limit, budget, policy or action as it now is.' }
        error:
          type: object
          nullable: true
          required: [code, message]
          properties:
            code: { type: string, example: SIGN_OFF_STALE }
            message: { type: string }

    SignOffRequestResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: '#/components/schemas/SignOffRequest' }

    SignOffRequestListResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data: { type: array, items: { $ref: '#/components/schemas/SignOffRequest' } }

    SignOffRequiredResponse:
      type: object
      description: >-
        The change was not applied. It loosens a guardrail and the caller is not a person in the
        console, so it waits for a workspace admin. Give `data.signOffUrl` to a person, then poll
        `data.pollUrl`. An identical request from the same credential returns the same pending request.
      required: [success, signOffRequired, data]
      properties:
        success: { type: boolean, enum: [true] }
        signOffRequired: { type: boolean, enum: [true] }
        data: { $ref: '#/components/schemas/SignOffRequest' }

    DecideSignOffRequest:
      type: object
      additionalProperties: false
      properties:
        note: { type: string, maxLength: 1000, description: Kept with the decision and in the audit record. }

    CreateWorkspaceRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        slug: { type: string, minLength: 3, maxLength: 50, pattern: '^[a-z0-9-]+$' }

    UpdateWorkspaceRequest:
      type: object
      properties: { name: { type: string, minLength: 1, maxLength: 100 } }

    PublicWorkspace:
      type: object
      required: [id, name, slug, plan, subscriptionStatus, trialEndsAt, monthlyMessageQuota, currentMonthMessages, currentMonthBandwidth, usageResetDate, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        plan: { type: string, enum: [free, starter, paygo, enterprise, production, growth] }
        subscriptionStatus: { type: string, nullable: true }
        trialEndsAt: { type: string, format: date-time, nullable: true }
        monthlyMessageQuota: { type: string, nullable: true }
        currentMonthMessages: { type: integer, minimum: 0, nullable: true }
        currentMonthBandwidth: { type: integer, minimum: 0, nullable: true }
        usageResetDate: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    OneTimeWorkspaceCredentials:
      type: object
      required: [apiKey, signingSecret]
      properties:
        apiKey:
          type: object
          nullable: true
          x-sensitive: true
          required: [id, name, key, keyPrefix]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            key: { type: string, pattern: '^anlyon_live_', x-sensitive: true }
            keyPrefix: { type: string }
        signingSecret:
          type: object
          nullable: true
          x-sensitive: true
          required: [id, secretKey, secretPrefix, version]
          properties:
            id: { type: string, format: uuid }
            secretKey: { type: string, x-sensitive: true }
            secretPrefix: { type: string }
            version: { type: integer, minimum: 1 }

    WorkspaceCreatedResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          allOf:
            - $ref: '#/components/schemas/PublicWorkspace'
            - type: object
              required: [credentials]
              properties: { credentials: { $ref: '#/components/schemas/OneTimeWorkspaceCredentials' } }

    WorkspaceResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: '#/components/schemas/PublicWorkspace' }

    WorkspaceDetailResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [workspace, role]
          properties:
            workspace: { $ref: '#/components/schemas/PublicWorkspace' }
            role: { $ref: '#/components/schemas/WorkspaceRole' }

    WorkspaceMembershipListResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: array
          items:
            type: object
            required: [workspace, role, joinedAt]
            properties:
              workspace: { $ref: '#/components/schemas/PublicWorkspace' }
              role: { $ref: '#/components/schemas/WorkspaceRole' }
              joinedAt: { type: string, format: date-time }

    ApiKeyScope:
      type: string
      enum: [integrations:read, integrations:write, logs:read, dlq:read, dlq:write, billing:read, notifications:read, feedback:write, analytics:read, events:read, events:write, secrets:read, secrets:write, actions:read, actions:write, actions:invoke, approvals:read, approvals:write, approvals:decide, budgets:read, budgets:write, runs:read, runs:write, actions:govern, actions:resolve, environments:halt, messages:ingest, policies:read, policies:write, impact-limits:read, impact-limits:write, notifications:write, notifications:manage, secret-stores:read, secret-stores:write, audit:read, end-users:read, end-users:write, end-users:approvals]

    CreateApiKeyRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        expiresAt: { type: string, format: date-time, description: Must be in the future. }
        scopes: { type: array, minItems: 1, items: { $ref: '#/components/schemas/ApiKeyScope' } }
        environmentId: { type: string, format: uuid, description: Environment the key belongs to. Defaults to the workspace default environment. }
        endUserRequired: { type: boolean, default: false, description: 'The key acts only for end users: every action call must send `Anlyon-End-User` (`400 END_USER_REQUIRED` otherwise), it never uses a workspace connection, and its reads are limited to that end user''s records. Set at creation; it cannot be changed.' }

    Environment:
      type: object
      required: [id, name, slug, isDefault, isProtected, halted, haltedAt, haltedReason, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [development, staging, production] }
        name: { type: string }
        slug: { type: string }
        isDefault: { type: boolean, description: The environment new keys and resources default to. }
        isProtected: { type: boolean, description: Production protection for destructive and promotion actions. }
        halted: { type: boolean, description: 'Kill switch: while true the agent cannot act and nothing leaves the environment. Action calls, hosted function runs and event publishes from an agent key are refused, and approved calls do not run. Approvals can still be decided, and reads still answer.' }
        haltedAt: { type: string, format: date-time, nullable: true }
        haltedReason: { type: string, nullable: true }
        allowedRedirectUrls: { type: array, items: { type: string }, description: 'Where an end user''s connect link may send them back to: each an origin plus a path prefix, matched exactly.' }
        defaultRedirectUrl: { type: string, nullable: true, description: 'The redirect a connect link uses when none is given, including the links in a 409. One of allowedRedirectUrls.' }
        connectConfirmation: { type: string, enum: [required, 'off'], description: '`required`: an end user''s finished OAuth consent waits for your server to confirm it (the account-takeover defence). `off` only on an unprotected development environment.' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateEnvironmentRequest:
      type: object
      required: [name, slug]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        kind: { type: string, enum: [development, staging, production], default: development }
        slug: { type: string, minLength: 2, maxLength: 40, pattern: '^[a-z0-9][a-z0-9-]*[a-z0-9]$' }
        isProtected: { type: boolean }

    UpdateEnvironmentRequest:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        kind: { type: string, enum: [development, staging, production] }
        isDefault: { type: boolean, enum: [true], description: Transfer the workspace default to this environment. }
        confirmProtected: { type: boolean, description: Explicit confirmation when removing protection or reclassifying a protected environment. }
        isProtected: { type: boolean }
        allowedRedirectUrls: { type: array, maxItems: 20, items: { type: string, maxLength: 2048 }, description: 'Replaces the list. Each is `https://host/path` (http only for localhost), with no query, fragment or user info; stored as origin plus path.' }
        defaultRedirectUrl: { type: string, nullable: true, maxLength: 2048, description: Must fall under one of allowedRedirectUrls. null clears it. }
        connectConfirmation: { type: string, enum: [required, 'off'], description: '`off` is refused unless the environment is development and unprotected. Changes are audited.' }

    HaltEnvironmentRequest:
      type: object
      properties:
        reason: { type: string, maxLength: 500, description: Why the environment is being halted  recorded for the audit trail. }

    EnvironmentListResponse:
      type: object
      required: [success, data]
      properties: { success: { type: boolean, enum: [true] }, data: { type: array, items: { $ref: '#/components/schemas/Environment' } } }

    EnvironmentResponse:
      type: object
      required: [success, data]
      properties: { success: { type: boolean, enum: [true] }, data: { $ref: '#/components/schemas/Environment' } }

    AgentVersion:
      type: object
      required: [id, version, config, createdAt]
      properties:
        id: { type: string, description: Public agent-version id (agv_xxx). }
        version: { type: integer, description: 'Monotonic per agent, starting at 1. Immutable once created.' }
        config: { type: object, additionalProperties: true, description: 'Version bindings  tools, memory, sessions, approvals, budgets, evaluators, trace sampling, metadata.' }
        createdAt: { type: string, format: date-time }

    Agent:
      type: object
      required: [id, environmentId, name, description, currentVersion, archived, createdAt, updatedAt]
      properties:
        id: { type: string, description: Public agent id (agt_xxx). }
        environmentId: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        currentVersion: { type: integer, nullable: true, description: 'The published version number, or null.' }
        archived: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateAgentRequest:
      type: object
      required: [name, environmentId]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 500 }
        environmentId: { type: string, format: uuid, description: Environment the agent belongs to. }
        config: { type: object, additionalProperties: true, description: Configuration for the initial (v1) version. }

    CreateAgentVersionRequest:
      type: object
      required: [config]
      properties:
        config: { type: object, additionalProperties: true }
        publish: { type: boolean, description: Set this new version as the agent's current version. }

    PromoteAgentRequest:
      type: object
      required: [targetEnvironmentId]
      properties:
        targetEnvironmentId: { type: string, format: uuid, description: Environment to promote the agent's published config into. }
        confirmProtected: { type: boolean, description: 'Must be true when the target environment is protected; otherwise the promotion is rejected with 409.' }

    UpdateAgentRequest:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 500 }
        currentVersion: { type: integer, minimum: 1, description: Point the agent at an existing immutable version. }
        archived: { type: boolean }

    AgentWithVersion:
      type: object
      required: [agent, version]
      properties:
        agent: { $ref: '#/components/schemas/Agent' }
        version: { $ref: '#/components/schemas/AgentVersion' }

    AgentListResponse:
      type: object
      required: [success, data]
      properties: { success: { type: boolean, enum: [true] }, data: { type: array, items: { $ref: '#/components/schemas/Agent' } } }

    AgentResponse:
      type: object
      required: [success, data]
      properties: { success: { type: boolean, enum: [true] }, data: { $ref: '#/components/schemas/Agent' } }

    AgentCreatedResponse:
      type: object
      required: [success, data]
      properties: { success: { type: boolean, enum: [true] }, data: { $ref: '#/components/schemas/AgentWithVersion' } }

    AgentVersionListResponse:
      type: object
      required: [success, data]
      properties: { success: { type: boolean, enum: [true] }, data: { type: array, items: { $ref: '#/components/schemas/AgentVersion' } } }

    AgentVersionResponse:
      type: object
      required: [success, data]
      properties: { success: { type: boolean, enum: [true] }, data: { $ref: '#/components/schemas/AgentVersion' } }

    ApprovalPolicyMatch:
      type: object
      required: [kind, actionName, agentId, userId, tags, minAmount, conditions, condition]
      properties:
        kind: { type: string, enum: [any, action, custom] }
        actionName: { type: string, nullable: true }
        agentId: { type: string, nullable: true }
        userId: { type: string, nullable: true }
        tags: { type: array, items: { type: string }, nullable: true }
        minAmount: { type: number, nullable: true }
        conditions: { type: object, additionalProperties: true, nullable: true }
        condition: { type: string, nullable: true, description: "A CEL expression (https://cel.dev) that must also hold, over input, agent.id, user.id, tags, action.name and kind. Checked against the target action's input schema when saved. An evaluation error (for example a missing field) requires approval rather than skipping the policy; guard optional fields with has()." }

    ApprovalPolicy:
      type: object
      required: [id, environmentId, name, priority, enabled, scope, needsScopeReview, match, effect, requiredApprovals, decidedBy, version, scopeReviewedAt, createdAt, updatedAt]
      properties:
        id: { type: string, description: Public policy id (apol_xxx). }
        environmentId: { type: string, format: uuid, description: The environment the policy governs. Policies never span environments. }
        name: { type: string }
        priority: { type: integer, description: 'Lower runs first. Ties are broken by creation time, then by id, so the order is always deterministic.' }
        enabled: { type: boolean }
        scope:
          type: string
          enum: [specific_action, all_actions, custom_requests, all_requests]
          description: What the policy applies to, derived from `match`. Never inferred from the name.
        needsScopeReview:
          type: boolean
          description: True on a broad policy nobody has confirmed the scope of. Every policy created before explicit targeting is in this state, because the old form sent no action selector. Preserved as it was, and flagged.
        match: { $ref: '#/components/schemas/ApprovalPolicyMatch' }
        effect: { type: string, enum: [require_approval, auto_approve, auto_deny] }
        requiredApprovals: { type: integer, description: Distinct approvers needed (N-of-M). }
        decidedBy: { type: string, enum: [team, end_user], description: 'Who decides an approval this policy requires. `team`: the console, Slack or a key with approvals:decide. `end_user`: the end user a call was made for, in your app (one decision, whatever requiredApprovals says). A call with no end user is always decided by the team.' }
        version: { type: integer, description: Bumps on each edit; recorded on approvals this policy governs. }
        scopeReviewedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        managedBy:
          type: object
          nullable: true
          description: Set when a policy file owns this policy. Console and API edits of it are refused; change the file.
          required: [file, key]
          properties:
            file: { type: string }
            key: { type: string }

    CreateApprovalPolicyRequest:
      type: object
      required: [environmentId, name, matchKind]
      properties:
        changeNote: { type: string, maxLength: 1000 }
        environmentId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 80 }
        priority: { type: integer, minimum: 0, maximum: 10000 }
        enabled: { type: boolean }
        matchKind:
          type: string
          enum: [any, action, custom]
          description: 'Required. `action` with a `matchActionName` targets one action; `action` alone targets every action; `custom` targets custom approval requests; `any` targets every request.'
        matchActionName: { type: string, minLength: 1, maxLength: 200, description: 'Requires matchKind `action`, and an action of this name must exist in the policy environment.' }
        matchAgentId: { type: string, maxLength: 60 }
        matchUserId: { type: string, maxLength: 200 }
        matchTags: { type: array, maxItems: 50, items: { type: string, maxLength: 60 } }
        minAmount: { type: number, minimum: 0 }
        conditions: { type: object, additionalProperties: true }
        condition: { type: string, minLength: 1, maxLength: 2000, description: "A CEL expression (https://cel.dev) that must also hold, over input, agent.id, user.id, tags, action.name and kind. Checked against the target action's input schema when saved. An evaluation error (for example a missing field) requires approval rather than skipping the policy; guard optional fields with has()." }
        effect: { type: string, enum: [require_approval, auto_approve, auto_deny] }
        requiredApprovals: { type: integer, minimum: 1, maximum: 20 }
        decidedBy: { type: string, enum: [team, end_user], default: team, description: 'Who decides: the team, or the end user a call was made for.' }
        acknowledgeBroadScope: { type: boolean, description: 'Required to create an `auto_deny` that applies to every action or every request.' }

    CreateEnvironmentApprovalPolicyRequest:
      type: object
      additionalProperties: false
      description: Same as the console request, without `environmentId`. The environment is the credential's; a body that names one is rejected.
      required: [name, matchKind]
      properties:
        changeNote: { type: string, maxLength: 1000 }
        name: { type: string, minLength: 1, maxLength: 80 }
        priority: { type: integer, minimum: 0, maximum: 10000 }
        enabled: { type: boolean }
        matchKind: { type: string, enum: [any, action, custom] }
        matchActionName: { type: string, minLength: 1, maxLength: 200 }
        matchAgentId: { type: string, maxLength: 60 }
        matchUserId: { type: string, maxLength: 200 }
        matchTags: { type: array, maxItems: 50, items: { type: string, maxLength: 60 } }
        minAmount: { type: number, minimum: 0 }
        conditions: { type: object, additionalProperties: true }
        condition: { type: string, minLength: 1, maxLength: 2000, description: "A CEL expression (https://cel.dev) that must also hold, over input, agent.id, user.id, tags, action.name and kind. Checked against the target action's input schema when saved. An evaluation error (for example a missing field) requires approval rather than skipping the policy; guard optional fields with has()." }
        effect: { type: string, enum: [require_approval, auto_approve, auto_deny] }
        requiredApprovals: { type: integer, minimum: 1, maximum: 20 }
        decidedBy: { type: string, enum: [team, end_user], description: 'Who decides: the team, or the end user a call was made for.' }
        acknowledgeBroadScope: { type: boolean }

    UpdateApprovalPolicyRequest:
      type: object
      minProperties: 1
      description: 'Omitted means unchanged. An explicit `null` clears a nullable matcher. The result must stay consistent: an action name needs matchKind `action`.'
      properties:
        changeNote: { type: string, maxLength: 1000 }
        name: { type: string, minLength: 1, maxLength: 80 }
        priority: { type: integer, minimum: 0, maximum: 10000 }
        enabled: { type: boolean }
        matchKind: { type: string, enum: [any, action, custom] }
        matchActionName: { type: string, nullable: true, minLength: 1, maxLength: 200 }
        matchAgentId: { type: string, nullable: true, maxLength: 60 }
        matchUserId: { type: string, nullable: true, maxLength: 200 }
        matchTags: { type: array, nullable: true, maxItems: 50, items: { type: string, maxLength: 60 } }
        minAmount: { type: number, nullable: true, minimum: 0 }
        conditions: { type: object, nullable: true, additionalProperties: true }
        condition: { type: string, minLength: 1, maxLength: 2000, nullable: true, description: "A CEL expression (https://cel.dev) that must also hold, over input, agent.id, user.id, tags, action.name and kind. Checked against the target action's input schema when saved. An evaluation error (for example a missing field) requires approval rather than skipping the policy; guard optional fields with has()." }
        effect: { type: string, enum: [require_approval, auto_approve, auto_deny] }
        requiredApprovals: { type: integer, minimum: 1, maximum: 20 }
        decidedBy: { type: string, enum: [team, end_user], description: 'Who decides: the team, or the end user a call was made for.' }
        acknowledgeBroadScope: { type: boolean }

    UpdateEnvironmentApprovalPolicyRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Same semantics as the console update. `environmentId` is not accepted.
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        priority: { type: integer, minimum: 0, maximum: 10000 }
        enabled: { type: boolean }
        matchKind: { type: string, enum: [any, action, custom] }
        matchActionName: { type: string, nullable: true, minLength: 1, maxLength: 200 }
        matchAgentId: { type: string, nullable: true, maxLength: 60 }
        matchUserId: { type: string, nullable: true, maxLength: 200 }
        matchTags: { type: array, nullable: true, maxItems: 50, items: { type: string, maxLength: 60 } }
        minAmount: { type: number, nullable: true, minimum: 0 }
        conditions: { type: object, nullable: true, additionalProperties: true }
        condition: { type: string, minLength: 1, maxLength: 2000, nullable: true, description: "A CEL expression (https://cel.dev) that must also hold, over input, agent.id, user.id, tags, action.name and kind. Checked against the target action's input schema when saved. An evaluation error (for example a missing field) requires approval rather than skipping the policy; guard optional fields with has()." }
        effect: { type: string, enum: [require_approval, auto_approve, auto_deny] }
        requiredApprovals: { type: integer, minimum: 1, maximum: 20 }
        decidedBy: { type: string, enum: [team, end_user], description: 'Who decides: the team, or the end user a call was made for.' }
        acknowledgeBroadScope: { type: boolean }

    CredentialIdentity:
      type: object
      description: The caller's own credential. Never contains a secret, a hash, another key or an account detail.
      required: [credentialType, apiKeyId, workspaceId, environmentId, scopes, expiresAt, role]
      properties:
        credentialType: { type: string, enum: [api_key, oauth, session] }
        apiKeyId: { type: string, nullable: true, description: Only an API key has one. Null for OAuth and sessions; none is invented. }
        workspaceId: { type: string, format: uuid }
        environmentId: { type: string, format: uuid }
        scopes:
          type: array
          nullable: true
          items: { type: string }
          description: Effective granted scopes, sorted. Null for a session, whose authority comes from the user's workspace role. Holding a scope does not prove a call will succeed; policies, budgets, environment state and quotas still apply.
        expiresAt: { type: string, format: date-time, nullable: true }
        role:
          type: string
          nullable: true
          enum: [owner, admin, member, approver, viewer, null]
          description: For a session or OAuth token, the person's role in this environment (a per-environment grant can set it); the credential can do no more than the role allows. Null for an API key, whose scopes are its authority.

    CredentialIdentityResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: '#/components/schemas/CredentialIdentity' }

    ApprovalPolicyListResponse:
      type: object
      required: [success, data]
      properties: { success: { type: boolean, enum: [true] }, data: { type: array, items: { $ref: '#/components/schemas/ApprovalPolicy' } } }

    ApprovalPolicyResponse:
      type: object
      required: [success, data]
      properties: { success: { type: boolean, enum: [true] }, data: { $ref: '#/components/schemas/ApprovalPolicy' } }

    SpanType:
      type: string
      enum: [model_call, context_assembly, session_read, session_write, memory_recall, memory_write, tool_call, action_call, approval_wait, approval_decision, workflow_step, queue_delivery, event_delivery, custom]

    Span:
      type: object
      required: [id, parentId, name, type, status, startedAt]
      properties:
        id: { type: string, description: Public span id (span_xxx). }
        parentId: { type: string, nullable: true, description: 'Parent span id, or null for a root span.' }
        name: { type: string }
        type: { $ref: '#/components/schemas/SpanType' }
        status: { type: string, enum: [running, succeeded, failed] }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time, nullable: true }
        durationMs: { type: integer, nullable: true }
        model: { type: string, nullable: true }
        provider: { type: string, nullable: true }
        tokens: { type: object, additionalProperties: { type: number }, nullable: true }
        cost: { type: number, nullable: true }
        input: { nullable: true }
        output: { nullable: true }
        error: { type: object, additionalProperties: true, nullable: true }
        attributes: { type: object, additionalProperties: true, nullable: true, description: 'OTel-style attributes, including correlation refs (e.g. messageId).' }

    SpanNode:
      allOf:
        - $ref: '#/components/schemas/Span'
        - type: object
          required: [children]
          properties:
            children: { type: array, items: { $ref: '#/components/schemas/SpanNode' } }

    TraceExport:
      type: object
      required: [resourceSpans]
      properties:
        resourceSpans:
          type: array
          description: OpenTelemetry Protocol JSON resource spans for one Anlyon run.
          items: { type: object, additionalProperties: true }

    TraceExportResponse:
      type: object
      required: [success, data]
      properties: { success: { type: boolean, enum: [true] }, data: { $ref: '#/components/schemas/TraceExport' } }

    ImportOtlpTraceRequest:
      type: object
      required: [resourceSpans]
      properties:
        resourceSpans:
          type: array
          minItems: 1
          maxItems: 1
          description: One OTLP resource trace; at most 500 spans total are accepted.
          items: { $ref: '#/components/schemas/OtlpResourceSpans' }

    OtlpResourceSpans:
      type: object
      required: [scopeSpans]
      properties:
        resource:
          type: object
          properties: { attributes: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/OtlpAttribute' } } }
        scopeSpans:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            required: [spans]
            properties: { spans: { type: array, maxItems: 500, items: { $ref: '#/components/schemas/OtlpSpan' } } }

    OtlpSpan:
      type: object
      required: [spanId, name, startTimeUnixNano]
      properties:
        traceId: { type: string, maxLength: 128 }
        spanId: { type: string, minLength: 1, maxLength: 128 }
        parentSpanId: { type: string, minLength: 1, maxLength: 128 }
        name: { type: string, minLength: 1, maxLength: 200 }
        startTimeUnixNano: { type: string, pattern: '^[0-9]+$', maxLength: 30, example: '1760000000000000000' }
        endTimeUnixNano: { type: string, pattern: '^[0-9]+$', maxLength: 30, example: '1760000001000000000' }
        status: { type: object, properties: { code: { type: integer, minimum: 0, maximum: 2 } } }
        attributes: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/OtlpAttribute' } }

    OtlpAttribute:
      type: object
      required: [key]
      properties:
        key: { type: string, minLength: 1, maxLength: 256 }
        value: { type: object, additionalProperties: true }

    Run:
      type: object
      required: [id, environmentId, name, status, startedAt]
      properties:
        id: { type: string, description: Public run id (run_xxx). }
        agentId: { type: string, nullable: true }
        agentVersion: { type: string, nullable: true }
        environmentId: { type: string, format: uuid }
        name: { type: string, nullable: true }
        status: { type: string, enum: [running, succeeded, failed, cancelled] }
        userId: { type: string, nullable: true }
        application: { type: string, nullable: true }
        input: { nullable: true }
        output: { nullable: true }
        error: { type: object, additionalProperties: true, nullable: true }
        tokens: { type: integer, nullable: true }
        cost: { type: number, nullable: true }
        tags: { type: array, items: { type: string }, nullable: true }
        metadata: { type: object, additionalProperties: true, nullable: true }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time, nullable: true }
        durationMs: { type: integer, nullable: true }

    RunWithSpans:
      allOf:
        - $ref: '#/components/schemas/Run'
        - type: object
          required: [spans]
          properties:
            spans: { type: array, items: { $ref: '#/components/schemas/SpanNode' } }

    StartRunRequest:
      type: object
      properties:
        name: { type: string, maxLength: 200 }
        agentId: { type: string, maxLength: 60 }
        agentVersion: { type: string, maxLength: 60 }
        userId: { type: string, maxLength: 200 }
        application: { type: string, maxLength: 200 }
        input: {}
        tags: { type: array, maxItems: 50, items: { type: string, maxLength: 60 } }
        metadata: { type: object, additionalProperties: true }

    EndRunRequest:
      type: object
      minProperties: 1
      properties:
        status: { type: string, enum: [running, succeeded, failed, cancelled] }
        output: {}
        error: { type: object, additionalProperties: true }
        tokens: { type: integer, minimum: 0 }
        cost: { type: number, minimum: 0 }
        metadata: { type: object, additionalProperties: true }

    IngestSpansRequest:
      type: object
      required: [spans]
      properties:
        spans:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            required: [name, startedAt]
            properties:
              id: { type: string, maxLength: 80, description: 'Provide to make ingestion idempotent  resending the same id updates the span in place.' }
              parentId: { type: string, maxLength: 80 }
              name: { type: string, minLength: 1, maxLength: 200 }
              type: { $ref: '#/components/schemas/SpanType' }
              status: { type: string, enum: [running, succeeded, failed] }
              startedAt: { type: string, format: date-time }
              endedAt: { type: string, format: date-time }
              model: { type: string, maxLength: 120 }
              provider: { type: string, maxLength: 120 }
              tokens: { type: object, additionalProperties: { type: number }, description: 'Token counts, e.g. {input, output, total}. Rolled up to the run automatically: `total` wins when present, otherwise the values sum. Explicit run totals set at end-of-run override the rollup.' }
              cost: { type: number, minimum: 0, description: 'Cost in USD as reported by the provider or gateway. Summed to the run total automatically.' }
              input: {}
              output: {}
              error: { type: object, additionalProperties: true }
              attributes: { type: object, additionalProperties: true }

    RunResponse:
      type: object
      required: [success, data]
      properties: { success: { type: boolean, enum: [true] }, data: { $ref: '#/components/schemas/Run' } }

    RunWithSpansResponse:
      type: object
      required: [success, data]
      properties: { success: { type: boolean, enum: [true] }, data: { $ref: '#/components/schemas/RunWithSpans' } }

    RunListResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data: { type: array, items: { $ref: '#/components/schemas/Run' } }
        pagination: { $ref: '#/components/schemas/OffsetPagination' }

    IngestSpansResultResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data: { type: object, required: [ingested], properties: { ingested: { type: integer } } }

    RunFeedback:
      type: object
      required: [id, runId, spanId, source, label, rating, comment, createdAt]
      properties:
        id: { type: string, description: Public feedback id (fbk_xxx). }
        runId: { type: string }
        spanId: { type: string, nullable: true, description: 'The span this targets, or null for the whole run.' }
        source: { type: string, enum: [user, model, code], description: Explicit human feedback vs an implicit signal. }
        label: { type: string, nullable: true }
        rating: { type: number, nullable: true }
        comment: { type: string, nullable: true }
        metadata: { type: object, additionalProperties: true, nullable: true }
        createdAt: { type: string, format: date-time }

    AddFeedbackRequest:
      type: object
      properties:
        spanId: { type: string, maxLength: 80 }
        source: { type: string, enum: [user, model, code] }
        label: { type: string, maxLength: 80 }
        rating: { type: number }
        comment: { type: string, maxLength: 4000 }
        metadata: { type: object, additionalProperties: true }

    RunFeedbackResponse:
      type: object
      required: [success, data]
      properties: { success: { type: boolean, enum: [true] }, data: { $ref: '#/components/schemas/RunFeedback' } }

    RunFeedbackListResponse:
      type: object
      required: [success, data]
      properties: { success: { type: boolean, enum: [true] }, data: { type: array, items: { $ref: '#/components/schemas/RunFeedback' } } }

    PublicApiKey:
      type: object
      required: [id, workspaceId, environmentId, name, keyPrefix, version, isActive, lastUsedAt, createdAt, expiresAt, scopes, endUserRequired]
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        environmentId: { type: string, format: uuid, nullable: true, description: The environment this key belongs to and can reach. }
        name: { type: string }
        keyPrefix: { type: string }
        version: { type: integer, minimum: 1 }
        isActive: { type: boolean }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, nullable: true }
        scopes: { type: array, items: { $ref: '#/components/schemas/ApiKeyScope' } }
        endUserRequired: { type: boolean, description: Every action call must name an end user; the key never uses a workspace connection. }

    ApiKeyResponse:
      type: object
      required: [success, data]
      properties: { success: { type: boolean, enum: [true] }, data: { $ref: '#/components/schemas/PublicApiKey' } }

    ApiKeyListResponse:
      type: object
      required: [success, data]
      properties: { success: { type: boolean, enum: [true] }, data: { type: array, items: { $ref: '#/components/schemas/PublicApiKey' } } }

    ApiKeyCreatedResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [apiKey, key]
          properties:
            apiKey: { $ref: '#/components/schemas/PublicApiKey' }
            key: { type: string, pattern: '^anlyon_live_', x-sensitive: true }

    ApiKeyRegeneratedResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [apiKey, key, rollbackExpiresAt, message]
          properties:
            apiKey: { $ref: '#/components/schemas/PublicApiKey' }
            key: { type: string, pattern: '^anlyon_live_', x-sensitive: true }
            rollbackExpiresAt: { type: string, format: date-time }
            message: { type: string }

    ApiKeyRolledBackResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [apiKey, message]
          properties: { apiKey: { $ref: '#/components/schemas/PublicApiKey' }, message: { type: string } }

    ApiKeyHistoryEntry:
      type: object
      required: [id, version, keyPrefix, rotatedAt, rollbackExpiresAt, canRollback, rotatedBy]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        keyPrefix: { type: string }
        rotatedAt: { type: string, format: date-time }
        rollbackExpiresAt: { type: string, format: date-time }
        canRollback: { type: boolean }
        rotatedBy: { type: string, nullable: true }

    ApiKeyHistoryResponse:
      type: object
      required: [success, data]
      properties: { success: { type: boolean, enum: [true] }, data: { type: array, items: { $ref: '#/components/schemas/ApiKeyHistoryEntry' } } }

    DeliverySecret:
      type: object
      required: [id, workspaceId, secretPrefix, version, isActive, createdAt, createdBy, lastUsedAt]
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        secretPrefix: { type: string }
        version: { type: integer, minimum: 1 }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string, nullable: true }
        lastUsedAt: { type: string, format: date-time, nullable: true }

    DeliverySecretInfoResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data: { allOf: [{ $ref: '#/components/schemas/DeliverySecret' }], nullable: true }

    DeliverySecretCreatedResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [secret, secretKey]
          properties:
            secret: { $ref: '#/components/schemas/DeliverySecret' }
            secretKey: { type: string, x-sensitive: true }

    AddWorkspaceMemberRequest:
      type: object
      required: [userId]
      properties:
        userId: { type: string, minLength: 1, maxLength: 320, description: Platform user ID or existing account email. }
        role: { type: string, enum: [admin, member, approver, viewer], default: member, description: 'See WorkspaceRole. `owner` answers 400 `OWNER_ROLE_RETIRED`.' }

    UpdateWorkspaceMemberRequest:
      type: object
      required: [role]
      properties: { role: { $ref: '#/components/schemas/AssignableWorkspaceRole' } }

    TransferWorkspaceOwnershipRequest:
      type: object
      required: [newOwnerId]
      properties: { newOwnerId: { type: string, minLength: 1, maxLength: 100, description: The member who receives emergency access and becomes an admin. } }

    SetEmergencyAccessRequest:
      type: object
      required: [enabled]
      additionalProperties: false
      properties: { enabled: { type: boolean } }

    WorkspaceMember:
      type: object
      required: [id, workspaceId, userId, role, emergencyAccess, invitedBy, invitedAt, joinedAt, createdAt, user]
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        userId: { type: string }
        role: { $ref: '#/components/schemas/WorkspaceRole' }
        emergencyAccess:
          type: boolean
          description: >-
            An admin who keeps password and two-factor sign-in when single sign-on is required, and whom SCIM cannot
            deactivate, delete or re-role. One or two per workspace; whoever created it by default.
        invitedBy: { type: string, nullable: true }
        invitedAt: { type: string, format: date-time, nullable: true }
        joinedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        user:
          type: object
          required: [name, email]
          properties: { name: { type: string }, email: { type: string, format: email } }
        environmentRoles:
          type: array
          description: In the member list only. The member's per-environment grants; empty when this edition has no per-environment permissions.
          items: { $ref: '#/components/schemas/EnvironmentRoleGrant' }

    WorkspaceRole:
      type: string
      enum: [owner, admin, member, approver, viewer]
      description: >-
        admin holds everything, including billing, members and deleting the workspace or an environment.
        `owner` is no longer returned: it was merged into admin on 2026-10-24 and stays in the enum so clients
        that switch on it keep working; owners became admins with emergency access (see
        WorkspaceMember.emergencyAccess). member works day to day (actions, connections, limits, approvals) but
        does not change policies, keys, members, environments or notification settings. approver reads everything
        and decides approvals. viewer only reads. admin and member can halt an environment; only an admin resumes
        it. Nobody decides an approval that their own credential requested (an app acting for them,
        or an API key they created): a second approver or a separate approver key must.

    AssignableWorkspaceRole:
      type: string
      enum: [admin, member, approver, viewer]
      description: A role an admin can give. `owner` answers 400 `OWNER_ROLE_RETIRED`.

    EnvironmentRole:
      type: string
      enum: [admin, member, approver, viewer]
      description: A role a per-environment grant can set. An admin with emergency access keeps the admin role in every environment.

    EnvironmentRoleGrant:
      type: object
      description: A member's role in one environment, overriding their workspace role there.
      required: [environmentId, role, grantedBy, createdAt, updatedAt]
      properties:
        environmentId: { type: string, format: uuid }
        role: { $ref: '#/components/schemas/EnvironmentRole' }
        grantedBy: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    EnvironmentRoleGrantResponse:
      type: object
      required: [success, data]
      properties: { success: { type: boolean, enum: [true] }, data: { $ref: '#/components/schemas/EnvironmentRoleGrant' } }

    EnvironmentRoleGrantListResponse:
      type: object
      required: [success, data]
      properties: { success: { type: boolean, enum: [true] }, data: { type: array, items: { $ref: '#/components/schemas/EnvironmentRoleGrant' } } }

    SetEnvironmentRoleRequest:
      type: object
      required: [role]
      properties: { role: { $ref: '#/components/schemas/EnvironmentRole' } }

    RemovedResult:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data: { type: object, required: [removed], properties: { removed: { type: boolean, enum: [true] } } }

    WorkspacePermission:
      type: string
      description: '`ownership.transfer` is no longer granted to anyone; it stays in the enum for clients that switch on it.'
      enum: [workspace.read, workspace.update, workspace.delete, members.manage, ownership.transfer, billing.manage, keys.manage, environments.manage, environments.delete, notifications.manage, assistant.manage, governance.sign_off, agents.manage, identity.manage, audit.manage, secret-stores.manage, environments.halt, environments.resume, policies.manage, actions.manage, actions.invoke, actions.resolve, connections.manage, oauth-apps.manage, limits.manage, integrations.manage, approvals.request, approvals.decide, resources.write]

    WorkspacePermissions:
      type: object
      description: The signed-in member's role and what it allows. For hiding controls; the server still checks every request.
      required: [role, emergencyAccess, permissions, environmentRolesEnabled, environments]
      properties:
        role: { $ref: '#/components/schemas/WorkspaceRole' }
        emergencyAccess: { type: boolean, description: 'Whether the caller is an admin with emergency access, who alone can give or remove it and change whether single sign-on is required.' }
        permissions: { type: array, items: { $ref: '#/components/schemas/WorkspacePermission' } }
        environmentRolesEnabled: { type: boolean, description: Whether this edition has per-environment grants. }
        environments:
          type: array
          items:
            type: object
            required: [environmentId, role, granted, permissions]
            properties:
              environmentId: { type: string, format: uuid }
              role: { $ref: '#/components/schemas/WorkspaceRole' }
              granted: { type: boolean, description: True when a per-environment grant set this role. }
              permissions: { type: array, items: { $ref: '#/components/schemas/WorkspacePermission' } }

    WorkspacePermissionsResponse:
      type: object
      required: [success, data]
      properties: { success: { type: boolean, enum: [true] }, data: { $ref: '#/components/schemas/WorkspacePermissions' } }

    WorkspaceDefaults:
      type: object
      description: Workspace-wide defaults. They apply to every environment.
      required: [actingFor, endUserDecider, approvalWindowHours, effective, recommended, setup, updatedAt]
      properties:
        actingFor: { type: string, enum: [team, users, both], nullable: true, description: Who the agent acts for. Null until answered. }
        endUserDecider: { type: string, enum: [team, end_user], nullable: true, description: 'Who decides a call made for a user when no policy says. Null means the recommendation, the team.' }
        approvalWindowHours: { type: integer, minimum: 1, maximum: 168, nullable: true, description: How long a request waits before it expires. Null uses the instance default. }
        effective:
          type: object
          description: The answers in force, after recommendations fill the nulls.
          required: [endUserDecider, approvalWindowHours]
          properties:
            endUserDecider: { type: string, enum: [team, end_user] }
            approvalWindowHours: { type: integer, minimum: 1, maximum: 168 }
        recommended:
          type: object
          required: [actingFor, endUserDecider, approvalWindowHours]
          properties:
            actingFor: { type: string, enum: [team, users, both] }
            endUserDecider: { type: string, enum: [team, end_user] }
            approvalWindowHours: { type: integer, minimum: 1, maximum: 168 }
        setup:
          type: object
          required: [status, at]
          properties:
            status: { type: string, enum: [completed, skipped], nullable: true, description: Null until setup is finished or skipped. }
            at: { type: string, format: date-time, nullable: true }
        updatedAt: { type: string, format: date-time, nullable: true }

    UpdateWorkspaceDefaultsRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        actingFor: { type: string, enum: [team, users, both], nullable: true }
        endUserDecider: { type: string, enum: [team, end_user], nullable: true }
        approvalWindowHours: { type: integer, minimum: 1, maximum: 168, nullable: true }
        setupStatus: { type: string, enum: [completed, skipped] }
        source:
          type: string
          enum: [setup_journey, defaults_page, home_prompt]
          description: Where in the console the change was made, for the `workspace.defaults_updated` audit record. Not a change on its own; send it with at least one answer.

    WorkspaceDefaultsResponse:
      type: object
      required: [success, data]
      properties: { success: { type: boolean, enum: [true] }, data: { $ref: '#/components/schemas/WorkspaceDefaults' } }

    WorkspaceMemberResponse:
      type: object
      required: [success, data]
      properties: { success: { type: boolean, enum: [true] }, data: { $ref: '#/components/schemas/WorkspaceMember' } }

    WorkspaceMemberListResponse:
      type: object
      required: [success, data]
      properties: { success: { type: boolean, enum: [true] }, data: { type: array, items: { $ref: '#/components/schemas/WorkspaceMember' } } }

    TestNotificationWebhookRequest:
      type: object
      required: [webhookUrl]
      properties:
        webhookUrl: { type: string, format: uri }
