    Invitation:
      type: object
      description: >-
        Invitation details without the secret token. `inviteUrl` is the one exception: it appears on
        the create and resend answers only when the server cannot send email, so the inviting admin
        can pass the link on.
      required: [id, email, role, status, invitedBy, workspace, createdAt, expiresAt, acceptedAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/AssignableWorkspaceRole' }
        status: { type: string, enum: [pending, accepted, declined, expired, cancelled] }
        invitedBy:
          allOf: [{ $ref: '#/components/schemas/InvitationInviter' }]
          nullable: true
        workspace: { $ref: '#/components/schemas/InvitationWorkspace' }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        acceptedAt: { type: string, format: date-time, nullable: true }
        inviteUrl:
          type: string
          format: uri
          description: The invitation link, returned only when this server has no email transport. Never stored and never listed.

