[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anlyon"
version = "0.10.0"
description = "Official Python SDK for Anlyon. Your agent invokes a named action. Anlyon holds the credentials, evaluates policy, waits for approval when required, and makes the call."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Anlyon", email = "support@anlyon.com" }]
keywords = ["anlyon", "ai-agents", "agent-actions", "tool-execution", "approvals", "human-in-the-loop", "secrets", "idempotency", "observability", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.14.3",
    "typing-extensions>=4.0;python_version<'3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.16.4",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://anlyon.com"
Documentation = "https://docs.anlyon.com"
Repository = "https://github.com/AnlyonHQ/anlyon"
Issues = "https://github.com/AnlyonHQ/anlyon/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/anlyon"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
